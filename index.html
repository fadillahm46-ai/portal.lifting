    function confirmCancelJob(e) {
        if (e) e.preventDefault();
        if (!pendingCancelWo) return;
        const reason = document.getElementById('cancelReasonInput')?.value.trim();
        if (!reason) {
            return showToast('Mohon isi alasan pembatalan!', 'error');
        }
        const cancelUnit = document.getElementById('cancel_unit')?.value || '';
        const cancelOp = document.getElementById('cancel_operator')?.value || '';
        const cancelRig = document.getElementById('cancel_rigger')?.value || '';
        const cancelRig2 = document.getElementById('cancel_rigger2')?.value || '';

        let jobs = getOrders();
        let idx = jobs.findIndex(j => j.no_wo === pendingCancelWo);
        if (idx !== -1) {
            jobs[idx].status = 'CANCELED';
            if (cancelUnit) jobs[idx].unit = cancelUnit;
            if (cancelOp) jobs[idx].operator = cancelOp;
            if (cancelRig) jobs[idx].rigger = cancelRig;
            if (cancelRig2) jobs[idx].rigger2 = cancelRig2;

            jobs[idx].alasan_telat = (jobs[idx].alasan_telat ? jobs[idx].alasan_telat + ' | ' : '') + 'Batal: ' + reason;
            saveOrders(jobs);
            showToast('Job ' + pendingCancelWo + ' berhasil dibatalkan');
            document.getElementById('cancelPromptModal').classList.add('hidden');
            renderApp(true);
        }
        pendingCancelWo = null;
    }

    async function submitOrder(e) {
        e.preventDefault();
        const btnSubmit = document.getElementById('btnSubmitOrder'); 
        btnSubmit.disabled = true; 
        btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Memproses...';
        
        const user = JSON.parse(localStorage.getItem('lifting_user')); 
        const cat = userOrderFleetMode; 
        const isAdminGL = user.role === 'ADMIN' || user.role === 'GL';
        
        let tgl = document.getElementById('req_tgl')?.value || ''; 
        let jam = document.getElementById('req_jam')?.value || ''; 
        let statusTag = 'SCHEDULED';
        let shiftVal = '-';

        if (tgl) {
            let reqDate = new Date(`${tgl}T00:00:00`); 
            let now = new Date(); 
            now.setHours(0,0,0,0); 
            let diffDays = (reqDate - now) / (1000 * 60 * 60 * 24);
            
            if (cat === 'Big Crane') { 
                if (diffDays < 3) statusTag = 'UNSCHEDULED'; 
            } else if (cat === 'Crane Truck' && jam) { 
                let reqTime = new Date(`${tgl}T${jam}:00`); 
                let diffHours = (reqTime - new Date()) / (1000 * 60 * 60); 
                if (diffHours < 6) statusTag = 'UNSCHEDULED'; 
                
                let h = parseInt(jam.split(':')[0]);
                shiftVal = (h >= 5 && h < 17) ? 'Shift 1' : 'Shift 2';
            }
        }

        let durasiVal = document.getElementById('req_durasi')?.value || ''; 
        let satuan = document.getElementById('req_satuan')?.value || 'JAM';
        
        const baseOrder = {
            no_wo: generateWO(cat), 
            timestamp: new Date().toISOString(), 
            kategori: cat, 
            nrp_pemohon: user.nrp, 
            nama_pemohon: isAdminGL ? document.getElementById('del_nama').value : user.nama_lengkap, 
            perusahaan: isAdminGL ? document.getElementById('del_vendor').value : user.perusahaan, 
            departemen: isAdminGL ? document.getElementById('del_dept').value : user.departemen, 
            section: isAdminGL ? document.getElementById('del_sect').value : user.section,
            no_wa: isAdminGL ? document.getElementById('del_wa').value : user.no_wa,
            tgl_pelaksanaan: tgl, 
            jam_pelaksanaan: jam, 
            shift: shiftVal, 
            durasi_request: `${durasiVal} ${satuan}`,
            lokasi_angkat: document.getElementById('req_lok_asal')?.value || '', 
            lokasi_tujuan: document.getElementById('req_lok_tujuan')?.value || '', 
            deskripsi: document.getElementById('req_deskripsi')?.value || '',
            status: statusTag, 
            foto_evidence: '', 
            gl: '', unit: '', operator: '', rigger: '', rigger2: '', jam_start_aktual: '', jam_end_aktual: '', durasi_aktual: '', final_inspeksi: '', alasan_telat: '', alasan_overtime: ''
        };

        const fotoInput = document.getElementById('req_foto');
        if (fotoInput && fotoInput.files.length > 0) {
            const file = fotoInput.files[0]; 
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = async function() {
                    const canvas = document.createElement('canvas'); 
                    const MAX_WIDTH = 800; 
                    const MAX_HEIGHT = 800; 
                    let width = img.width; 
                    let height = img.height;
                    
                    if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } } 
                    else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
                    
                    canvas.width = width; canvas.height = height; 
                    const ctx = canvas.getContext('2d'); 
                    ctx.drawImage(img, 0, 0, width, height);
                    let compressedBase64 = canvas.toDataURL('image/jpeg', 0.6);

                    if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL.startsWith('http')) {
                        try {
                            let base64Data = compressedBase64.split(',')[1];
                            let response = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fileName: `Bukti_${baseOrder.no_wo}.jpg`, mimeType: 'image/jpeg', data: base64Data }) });
                            let result = await response.json(); 
                            if (result.status === 'success' && result.fileUrl) { baseOrder.foto_evidence = result.fileUrl; } 
                            else { baseOrder.foto_evidence = compressedBase64; }
                        } catch(err) { console.warn("Drive upload error, fallback to local:", err); baseOrder.foto_evidence = compressedBase64; }
                    } else { baseOrder.foto_evidence = compressedBase64; }
                    
                    finishSubmitOrder(baseOrder, user);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        } else { 
            finishSubmitOrder(baseOrder, user); 
        }
    }

    function finishSubmitOrder(newOrder, user) {
        clearOrderDraft();
        const orders = getOrders();
        orders.unshift(newOrder);
        saveOrders(orders);
        
        const homeTab = (user.role === 'ADMIN' || user.role === 'GL') ? 'dashboard' : 'monitoring';
        currentTab = homeTab;
        window.location.hash = homeTab;
        userOrderFleetMode = null;
        renderApp(false);
        showSuccessAnim('check', 'Order Berhasil!', 'Pesanan Anda telah kami terima.');
    }

                    <div><label class="block text-[10px] font-bold text-slate-500 mb-0.5">Durasi (Jam)</label><input type="number" step="0.01" id="edit_durasi_aktual" value="${job.durasi_aktual || ''}" class="w-full border border-slate-300 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-cyan-500"></div>
                </div>
                <div class="grid grid-cols-1 gap-2 mt-2">
                    <div><label class="block text-[10px] font-bold text-green-600 mb-0.5">Final Inspeksi</label><input type="time" id="edit_inspeksi" value="${job.final_inspeksi || ''}" class="w-full border border-green-300 bg-green-50 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-green-500"></div>
                    <div><label class="block text-[10px] font-bold text-red-500 mb-0.5">Alasan Telat</label><textarea id="edit_alasan_telat" class="w-full border border-red-300 bg-red-50 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-red-500 h-10">${job.alasan_telat || ''}</textarea></div>
                    <div><label class="block text-[10px] font-bold text-red-500 mb-0.5">Alasan Overtime</label><textarea id="edit_alasan_overtime" class="w-full border border-red-300 bg-red-50 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-red-500 h-10">${job.alasan_overtime || ''}</textarea></div>
                </div>
            `;
        }

        document.getElementById('editJobContent').innerHTML = `
            <form onsubmit="saveAdminEditJob(event, '${wo}')" class="space-y-2">
                <div class="bg-cyan-50 border border-cyan-100 p-1.5 rounded-sm mb-1 text-center">
                    <p class="text-[10px] font-bold text-cyan-700">${job.no_wo} (${job.kategori})</p>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="block text-[10px] font-bold text-slate-500 mb-0.5">Tgl Pelaksanaan</label><input type="date" id="edit_tgl" value="${job.tgl_pelaksanaan}" class="w-full border border-slate-300 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-cyan-500" required></div>
                    <div><label class="block text-[10px] font-bold text-slate-500 mb-0.5">Jam Req</label><input type="time" id="edit_jam" value="${job.jam_pelaksanaan || ''}" class="w-full border border-slate-300 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-cyan-500" ${job.kategori==='Crane Truck'?'required':''}></div>
                </div>
                ${job.kategori !== 'Big Crane' ? `
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="block text-[10px] font-bold text-slate-500 mb-0.5">Lokasi Asal</label><input type="text" id="edit_lok_asal" value="${job.lokasi_angkat || ''}" oninput="this.value = this.value.toUpperCase()" class="w-full border border-slate-300 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-cyan-500" required></div>
                    <div><label class="block text-[10px] font-bold text-slate-500 mb-0.5">Lokasi Tujuan</label><input type="text" id="edit_lok_tujuan" value="${job.lokasi_tujuan || ''}" oninput="this.value = this.value.toUpperCase()" class="w-full border border-slate-300 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-cyan-500" required></div>
                </div>` : ''}
                <div><label class="block text-[10px] font-bold text-slate-500 mb-0.5">Deskripsi / Beban</label><input type="text" id="edit_deskripsi" value="${job.deskripsi || ''}" class="w-full border border-slate-300 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-cyan-500" required></div>

                <hr class="my-2 border-slate-200">
                <div class="text-[9px] font-bold text-slate-400 tracking-wider mb-1">PENUGASAN (GL)</div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Group Leader *</label>
                        <select id="edit_gl" class="w-full border border-slate-300 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-cyan-500 bg-white" required><option value="">-- Pilih --</option>${glOptions}</select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Unit *</label>
                        <select id="edit_unit" class="w-full border border-slate-300 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-cyan-500 bg-white" required><option value="">-- Pilih --</option>${unitOptions}</select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2 mt-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Operator (Opsional)</label>
                        <select id="edit_op" class="w-full border border-slate-300 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-cyan-500 bg-white"><option value="">-- Pilih --</option>${opOptions}</select>
                    </div>
                    ${riggerHTML}
                </div>
                
                ${aktualHtml}
                
                <div class="flex gap-1.5 mt-3 pt-2 border-t border-slate-200">
                    ${currentUser.role === 'ADMIN' ? `<button type="button" onclick="confirmHapusOrder('${job.no_wo}')" class="bg-red-50 text-red-600 font-bold px-3 py-1.5 rounded-sm text-[11px] transition-colors border-0" title="Hapus Order"><i class="fa-solid fa-trash"></i> Hapus</button>` : ''}
                    <button type="submit" class="flex-1 bg-[#0891b2] hover:bg-cyan-700 text-white font-bold py-1.5 rounded-sm text-[11px] transition-colors shadow-sm">${job.status === 'COMPLETED' ? 'Simpan Revisi' : 'Simpan & Validasi'}</button>
                </div>
            </form>
        `;
        document.getElementById('editJobModal').classList.remove('hidden');
    }

    function saveAdminEditJob(e, wo) {
        e.preventDefault();
        let jobs = getOrders();
        let idx = jobs.findIndex(j => j.no_wo === wo && j.status !== 'CANCELED');
        if(idx === -1) return;

        let prevStatus = jobs[idx].status;
        let prevOp = jobs[idx].operator;

        jobs[idx].tgl_pelaksanaan = document.getElementById('edit_tgl').value;
        jobs[idx].jam_pelaksanaan = document.getElementById('edit_jam').value;
        if(jobs[idx].kategori === 'Crane Truck' && jobs[idx].jam_pelaksanaan) {
            let h = parseInt(jobs[idx].jam_pelaksanaan.split(':')[0]);
            jobs[idx].shift = (h >= 5 && h < 17) ? 'Shift 1' : 'Shift 2';
        }
        
        if (jobs[idx].kategori !== 'Big Crane') {
            jobs[idx].lokasi_angkat = document.getElementById('edit_lok_asal').value;
            jobs[idx].lokasi_tujuan = document.getElementById('edit_lok_tujuan').value;
        }
        jobs[idx].deskripsi = document.getElementById('edit_deskripsi').value;
        
        const selectedGL = document.getElementById('edit_gl').value;
        const selectedUnit = document.getElementById('edit_unit').value;
        const op = document.getElementById('edit_op').value;
        const rig = document.getElementById('edit_rig').value;
        const rig2 = document.getElementById('edit_rig2') ? document.getElementById('edit_rig2').value : '';
        
        jobs[idx].gl = selectedGL;
        jobs[idx].unit = selectedUnit;
        jobs[idx].operator = op;
        jobs[idx].rigger = rig;
        jobs[idx].rigger2 = rig2;

        if (jobs[idx].status === 'COMPLETED') {
            jobs[idx].jam_start_aktual = document.getElementById('edit_start').value;
            jobs[idx].jam_end_aktual = document.getElementById('edit_end').value;
            jobs[idx].durasi_aktual = document.getElementById('edit_durasi_aktual').value;
            jobs[idx].final_inspeksi = document.getElementById('edit_inspeksi').value;
            jobs[idx].alasan_telat = document.getElementById('edit_alasan_telat').value;
            jobs[idx].alasan_overtime = document.getElementById('edit_alasan_overtime').value;
        }

        let isValidated = (selectedGL && selectedUnit);

        if (isValidated && (prevStatus === 'SCHEDULED' || prevStatus === 'UNSCHEDULED' || (prevStatus === 'PENDING' && !prevOp))) {
            jobs[idx].status = 'ON PROGRESS';
            showToast('Job divalidasi ke Manpower!');
        } else {
            showToast('Perubahan Disimpan!');
        }

        saveOrders(jobs);
        document.getElementById('editJobModal').classList.add('hidden');
        renderApp(true); 
    }

    function confirmHapusOrder(wo) {
        openCustomConfirm('Hapus Data', `Apakah Anda yakin ingin menghapus order ${wo}?`, async () => {
            let jobs = getOrders().filter(j => j.no_wo !== wo);
            localStorage.setItem('lifting_orders', JSON.stringify(jobs));
            
            if (SUPABASE_KEY && !SUPABASE_KEY.includes('PASTE_KUNCI')) {
                try { await fetch(`${SUPABASE_URL}/rest/v1/orders?no_wo=eq.${wo}`, { method: 'DELETE', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }); } 
                catch(e) { console.warn(e); }
            }
            showToast('Data dihapus!'); 
            document.getElementById('editJobModal').classList.add('hidden'); 
            renderApp(true);
        });
    }

    function getKalenderBcView() {
        return `
        <div class="bg-white rounded-md shadow-sm border border-slate-200 p-3 flex flex-col relative z-10 w-full min-h-[400px]">
            <div class="flex justify-between items-center mb-3 border-b border-slate-100 pb-3">
                <div class="flex items-center gap-2">
                    <h2 class="text-sm font-bold text-slate-800"><i class="fa-solid fa-calendar-days mr-1.5 text-cyan-600"></i>Jadwal Big Crane</h2>
                </div>
                <div class="flex items-center gap-2 bg-cyan-50 border border-cyan-200 px-3 py-1.5 rounded-md shadow-sm">
                    <span class="text-[10px] font-bold text-cyan-700">TOTAL: <span id="bcTotalJobText">0</span> JOB</span>
                </div>
            </div>
            <div id="fullcalendar-container" class="flex-1 w-full bg-white border border-slate-100 rounded-md p-1 min-h-[350px]"></div>
        </div>`;
    }

    function initBcCalendar() {
        const el = document.getElementById('fullcalendar-container');
        if (!el || typeof FullCalendar === 'undefined') return;

        const currentUser = JSON.parse(localStorage.getItem('lifting_user')) || {};
        const isAdminOrGL = currentUser.role === 'ADMIN' || currentUser.role === 'GL';

        // Filter pekerjaan Big Crane berdasarkan role
        // Admin & GL: Semua job yang belum di-action maupun sudah selesai (CANCELED diabaikan)
        // User: Hanya yang masih terjadwal dan in-progress (COMPLETED & CANCELED dihilangkan)
        const jobs = getOrders().filter(j => {
            if (j.kategori !== 'Big Crane' || j.status === 'CANCELED') return false;
            if (isAdminOrGL) {
                return true; // Tampilkan SCHEDULED, UNSCHEDULED, PENDING, ON PROGRESS, COMPLETED
            } else {
                return ['SCHEDULED', 'UNSCHEDULED', 'PENDING', 'ON PROGRESS'].includes(j.status);
            }
        });

        const eventColors = [
            'rgba(14, 165, 233, 0.7)',
            'rgba(30, 64, 175, 0.7)',
            'rgba(16, 185, 129, 0.7)',
            'rgba(234, 179, 8, 0.7)',
            'rgba(249, 115, 22, 0.7)'
        ];

        const events = jobs.map((j, idx) => {
            let startStr = j.tgl_pelaksanaan;
            let endStr = null;
            if (j.durasi_request && j.durasi_request.includes('HARI')) {
                let days = parseInt(j.durasi_request.split(' ')[0]) || 0;
                if (days > 0) {
                    let endDate = new Date(j.tgl_pelaksanaan);
                    endDate.setDate(endDate.getDate() + days);
                    endStr = endDate.getFullYear() + '-' + String(endDate.getMonth() + 1).padStart(2, '0') + '-' + String(endDate.getDate()).padStart(2, '0');
                }
            } else if (j.jam_pelaksanaan) {
                startStr += 'T' + j.jam_pelaksanaan + ':00';
            }

            let color = eventColors[idx % eventColors.length];

            // Tanda status di ujung teks:
            // Schedule / Unscheduled / Pending: ⚪ Abu-abu
            // Progres: 🔵 Biru tua
            // Completed: 🟢 Hijau
            let statusEmoji = '⚪';
            if (j.status === 'COMPLETED') {
                statusEmoji = '🟢';
            } else if (j.status === 'ON PROGRESS') {
                statusEmoji = '🔵';
            } else {
                statusEmoji = '⚪';
            }

            let displayTitle = `${(j.deskripsi || 'TANPA DESKRIPSI').toUpperCase()} ${statusEmoji}`;

            let eventObj = { title: displayTitle, start: startStr, backgroundColor: color, borderColor: color, textColor: '#000000', extendedProps: { wo: j.no_wo, status: j.status, deskripsi: j.deskripsi } };
            if (endStr) { eventObj.end = endStr; eventObj.allDay = true; }
            return eventObj;
        });

        if (el._calendarInstance) { el._calendarInstance.destroy(); }
        const calendar = new FullCalendar.Calendar(el, {
            locale: 'id',
            firstDay: 0,
            initialView: 'dayGridMonth',
            headerToolbar: { left: 'prev,next today', center: 'title', right: '' },
            buttonText: { today: 'Hari Ini' },
            events: events,
            height: 'auto',
            contentHeight: 'auto',
            dayMaxEvents: 5,
            moreLinkText: function(num) { return '+' + num; },
            moreLinkClick: function(arg) {
                if (arg && arg.jsEvent) arg.jsEvent.preventDefault();
                let dateStr = arg ? arg.dateStr : null;
                if (!dateStr && arg && arg.date) {
                    let d = arg.date;
                    dateStr = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                }
                if (dateStr) showDayJobsModal(dateStr);
                return false;
            },
            eventClick: function(info) { info.jsEvent.preventDefault(); },
            dateClick: function(info) { showDayJobsModal(info.dateStr); },
            datesSet: function(info) {
                let currentMonth = info.view.currentStart;
                let yyyy = currentMonth.getFullYear();
                let mm = String(currentMonth.getMonth() + 1).padStart(2, '0');
                let monthPrefix = `${yyyy}-${mm}`;
                let jobCount = jobs.filter(j => j.tgl_pelaksanaan && j.tgl_pelaksanaan.startsWith(monthPrefix)).length;
                let textEl = document.getElementById('bcTotalJobText');
                if (textEl) textEl.innerText = jobCount;

                // Menempatkan legenda status di ujung kanan toolbar kalender
                const toolbar = el.querySelector('.fc-toolbar');
                if (toolbar) {
                    const chunks = toolbar.querySelectorAll('.fc-toolbar-chunk');
                    const rightChunk = chunks.length >= 3 ? chunks[2] : chunks[chunks.length - 1];
                    if (rightChunk) {
                        let legendEl = document.getElementById('bcCalendarLegend');
                        if (!legendEl) {
                            legendEl = document.createElement('div');
                            legendEl.id = 'bcCalendarLegend';
                        }
                        legendEl.className = 'flex items-center gap-1.5 flex-wrap justify-end';
                        if (legendEl.parentElement !== rightChunk) {
                            rightChunk.appendChild(legendEl);
                        }
                        if (isAdminOrGL) {
                            legendEl.innerHTML = `
                                <span class="inline-flex items-center gap-1 text-[8px] sm:text-[9px] font-bold text-slate-700 bg-slate-100 border border-slate-200 px-1.5 py-0.5 rounded shadow-2xs" title="Scheduled / Unscheduled">
                                    <span>⚪</span> SCH/UNSC
                                </span>
                                <span class="inline-flex items-center gap-1 text-[8px] sm:text-[9px] font-bold text-blue-700 bg-blue-50 border border-blue-200 px-1.5 py-0.5 rounded shadow-2xs" title="On Progress">
                                    <span>🔵</span> PROGRES
                                </span>
                                <span class="inline-flex items-center gap-1 text-[8px] sm:text-[9px] font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-1.5 py-0.5 rounded shadow-2xs" title="Completed">
                                    <span>🟢</span> COMPLETED
                                </span>
                            `;
                        } else {
                            legendEl.innerHTML = `
                                <span class="inline-flex items-center gap-1 text-[8px] sm:text-[9px] font-bold text-slate-700 bg-slate-100 border border-slate-200 px-1.5 py-0.5 rounded shadow-2xs" title="Scheduled / Unscheduled">
                                    <span>⚪</span> SCH/UNSC
                                </span>
                                <span class="inline-flex items-center gap-1 text-[8px] sm:text-[9px] font-bold text-blue-700 bg-blue-50 border border-blue-200 px-1.5 py-0.5 rounded shadow-2xs" title="On Progress">
                                    <span>🔵</span> PROGRES
                                </span>
                            `;
                        }
                    }
                }
            }
        });
        calendar.render();
        el._calendarInstance = calendar;
        window.bcCalendarInstance = calendar;
    }

    function showDayJobsModal(dateStr) {
        let clickDate = new Date(dateStr); clickDate.setHours(0,0,0,0);
        const currentUser = JSON.parse(localStorage.getItem('lifting_user')) || {};
        const isAdminOrGL = currentUser.role === 'ADMIN' || currentUser.role === 'GL';

        const jobs = getOrders().filter(j => {
            if (j.kategori !== 'Big Crane' || j.status === 'CANCELED') return false;
            if (!isAdminOrGL && j.status === 'COMPLETED') return false;

            let startDate = new Date(j.tgl_pelaksanaan); startDate.setHours(0,0,0,0);
            let endDate = new Date(j.tgl_pelaksanaan); endDate.setHours(0,0,0,0);
            if (j.durasi_request && j.durasi_request.includes('HARI')) {
                let days = parseInt(j.durasi_request.split(' ')[0]) || 0;
                if (days > 0) { endDate.setDate(endDate.getDate() + days - 1); }
            }
            return clickDate >= startDate && clickDate <= endDate;
        });

        let content = '';
        let dateObj = new Date(dateStr);
        let dateIndo = dateObj.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

        if (jobs.length === 0) {
            content = `<div class="flex flex-col items-center justify-center p-6 text-center"><i class="fa-regular fa-calendar-xmark text-4xl text-slate-300 mb-2"></i><p class="text-slate-500 font-medium text-[11px]">Jadwal Kosong</p><p class="text-slate-400 text-[9px] mt-1">Tidak ada jadwal aktif Big Crane untuk tanggal ini.</p></div>`;
        } else {
            content = jobs.map(job => {
                let statusColor = job.status === 'COMPLETED' ? 'bg-emerald-100 text-emerald-700 border-emerald-200' : (job.status === 'ON PROGRESS' ? 'bg-blue-100 text-blue-700 border-blue-200' : (job.status === 'PENDING' ? 'bg-orange-100 text-orange-700 border-orange-200' : 'bg-slate-100 text-slate-700 border-slate-200'));
                let statusEmoji = job.status === 'COMPLETED' ? '🟢' : (job.status === 'ON PROGRESS' ? '🔵' : '⚪');
                return `<div class="bg-white border border-slate-200 rounded-md p-2.5 mb-2 cursor-pointer hover:border-cyan-400 shadow-sm transition-all" onclick="document.getElementById('dayJobsModal').classList.add('hidden'); viewJobDetail('${job.no_wo}')"><div class="flex justify-between items-center mb-1 border-b border-slate-100 pb-1"><span class="text-[10px] font-bold text-cyan-600 font-mono">${job.no_wo}</span><span class="${statusColor} text-[8px] font-bold px-1.5 py-0.5 border rounded-sm tracking-wide flex items-center gap-1"><span>${statusEmoji}</span>${job.status}</span></div><div class="text-[11px] font-bold text-slate-800 uppercase mt-1 leading-tight">${job.unit ? '['+job.unit+']' : '<span class="text-red-500">[TBA]</span>'} ${job.nama_pemohon}</div><div class="text-[9px] text-slate-500 truncate mt-1 bg-slate-50 p-1 rounded border border-slate-100">${job.deskripsi} ${statusEmoji}</div></div>`;
            }).join('');
        }
        document.getElementById('dayJobsTitle').innerText = dateIndo;
        document.getElementById('dayJobsContent').innerHTML = content;
        document.getElementById('dayJobsModal').classList.remove('hidden');
    }

    // Simpan otomatis draft setiap kali pengguna mengetik atau mengubah nilai input form
    document.addEventListener("input", (e) => {
        if (currentTab === 'order') saveOrderDraft();
    });
    document.addEventListener("change", (e) => {
        if (currentTab === 'order') saveOrderDraft();
    });
    window.addEventListener("beforeunload", () => {
        if (currentTab === 'order') saveOrderDraft();
    });
    window.addEventListener("blur", () => {
        if (currentTab === 'order') saveOrderDraft();
    });

    window.addEventListener('load', () => { 
        fetchFromSupabase().then(() => { 
            const user = JSON.parse(localStorage.getItem('lifting_user'));
            if (user) {
                const draft = getOrderDraft();
                if (draft && draft.fleetMode) {
                    userOrderFleetMode = draft.fleetMode;
                }
                const homeTab = (user.role === 'ADMIN' || user.role === 'GL') ? 'dashboard' : (user.role === 'USER' ? 'order' : 'monitoring');
                if(!window.location.hash) {
                    history.replaceState(null, null, '#' + (userOrderFleetMode ? 'order' : homeTab));
                    currentTab = userOrderFleetMode ? 'order' : homeTab;
                } else {
                    currentTab = window.location.hash.substring(1);
                    if (currentTab === 'order' && draft && draft.fleetMode) {
                        userOrderFleetMode = draft.fleetMode;
                    }
                }
            }
            renderApp(false); 
        }); 
    });

    window.addEventListener('hashchange', () => {
        const user = JSON.parse(localStorage.getItem('lifting_user'));
        if (!user) return;
        const homeTab = (user.role === 'ADMIN' || user.role === 'GL') ? 'dashboard' : (user.role === 'USER' ? 'order' : 'monitoring');
        
        let hash = window.location.hash.substring(1);
        if (!hash) {
            currentTab = homeTab; 
            userOrderFleetMode = null; mpFleetMode = null;
            renderApp(false);
            return;
        }
        if (currentTab !== hash) {
            currentTab = hash;
            userOrderFleetMode = null; mpFleetMode = null;
            renderApp(false);
        }
    });

    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
            if (currentTab === 'order') saveOrderDraft();
        } else if (document.visibilityState === "visible") {
            const user = localStorage.getItem('lifting_user');
            if (user) {
                // JANGAN re-render jika sedang berada di tab order untuk mencegah hilangnya teks/input form
                if (currentTab === 'order') return;
                const isModalOpen = ['editJobModal', 'detailJobModal', 'mpActionModal', 'kendalaModal', 'cancelPromptModal', 'globalConfirmModal', 'resetPwdModal', 'successModal', 'successRegModal', 'profileBiodataModal', 'profileSettingsModal', 'imageViewerModal', 'dayJobsModal'].some(id => {
                    const el = document.getElementById(id); return el && !el.classList.contains('hidden');
                });
                if (isModalOpen) return;
                fetchFromSupabase().then(() => { renderApp(true); });
            }
        }
    });

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').then((registration) => {
                console.log('PWA ServiceWorker terdaftar:', registration);
            }).catch((error) => {
                console.log('PWA ServiceWorker gagal:', error);
            });
        });
    }
</script>
