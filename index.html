        } else {
            let addFormHtml = '';
            if (['gl', 'operator', 'rigger'].includes(currentMasterTab)) {
                addFormHtml = `<form onsubmit="addAccountMasterData(event, '${currentMasterTab}')" class="flex flex-col sm:flex-row gap-1.5 mb-2 bg-slate-50 p-2 rounded-lg border border-slate-100"><input type="text" id="new_master_name" oninput="this.value = this.value.toUpperCase()" placeholder="Nama..." class="flex-1 border border-slate-300 rounded-lg px-2 py-1 text-[10px] focus:outline-none focus:border-cyan-500" required><input type="text" id="new_master_nrp" oninput="this.value = this.value.toUpperCase()" placeholder="NRP..." class="flex-1 border border-slate-300 rounded-lg px-2 py-1 text-[10px] focus:outline-none focus:border-cyan-500" required><div class="relative flex-1"><input type="password" id="new_master_pwd" placeholder="Pwd..." class="w-full border border-slate-300 rounded-lg px-2 py-1 pr-6 text-[10px] focus:outline-none focus:border-cyan-500" required><i id="toggleMasterPwd" class="fa-regular fa-eye absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer pwd-toggle text-[9px]" onclick="togglePassword('new_master_pwd', 'toggleMasterPwd')"></i></div><button type="submit" class="bg-cyan-600 hover:bg-cyan-700 text-white font-semibold px-3 py-1 rounded-lg text-[10px] whitespace-nowrap"><i class="fa-solid fa-plus mr-0.5"></i> Buat</button></form>`;
            } else {
                addFormHtml = `<form onsubmit="addMasterData(event, '${currentMasterTab}')" class="flex gap-1.5 mb-2 bg-slate-50 p-2 rounded-lg border border-slate-100"><input type="text" id="new_master_val" oninput="this.value = this.value.toUpperCase()" placeholder="Data baru..." class="flex-1 border border-slate-300 rounded-lg px-2 py-1 text-[10px] focus:outline-none focus:border-cyan-500" required><button type="submit" class="bg-cyan-600 hover:bg-cyan-700 text-white font-semibold px-3 py-1 rounded-lg text-[10px] whitespace-nowrap"><i class="fa-solid fa-plus mr-0.5"></i> Tambah</button></form>`;
            }
            contentHtml = `${addFormHtml}<div class="overflow-x-auto border border-slate-200 rounded-lg"><table class="w-full text-left"><thead class="bg-slate-50 text-slate-500 text-[9px] border-b"><tr><th class="p-2 uppercase">Nama Data</th><th class="p-2 uppercase text-right">Aksi</th></tr></thead><tbody class="divide-y divide-slate-100 text-[10px]">${(m[currentMasterTab] || []).map((val, idx) => `<tr class="hover:bg-slate-50"><td class="p-2 font-semibold text-slate-700">${val}</td><td class="p-2 text-right"><button onclick="confirmDeleteMasterData('${currentMasterTab}', ${idx})" class="text-red-400 hover:text-red-600 bg-red-50 hover:bg-red-100 p-1 rounded-md"><i class="fa-solid fa-trash-can text-[9px]"></i></button></td></tr>`).join('')}</tbody></table></div>`;
        }

        return `
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-1 mb-2 flex flex-wrap gap-1">${tabs.map(t => `<button onclick="currentMasterTab='${t.id}'; renderApp(false);" class="px-3 py-1 text-[9px] font-semibold rounded-lg transition-colors ${currentMasterTab === t.id ? 'bg-cyan-600 text-white shadow-sm' : 'text-slate-500 hover:bg-slate-100'}">${t.label}</button>`).join('')}</div>
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-3.5 min-h-[50vh]"><h3 class="text-xs font-bold text-slate-800 capitalize mb-2">Kelola Master Data: ${currentMasterTab.replace('_', ' ')}</h3>${contentHtml}</div>`;
    }

    async function saveBranding(e) {
        e.preventDefault();
        if (!SUPABASE_KEY || SUPABASE_KEY.includes('PASTE_KUNCI')) return showToast('API Supabase belum dipasang!', 'error');

        const btn = e.target.querySelector('button[type="submit"]');
        const originalText = btn.innerHTML; btn.innerHTML = "Menyimpan ke Cloud..."; btn.disabled = true;
        
        let newSettings = {
            id: 1, 
            bg_url: document.getElementById('setting_bg').value.trim(), 
            logo_url: document.getElementById('setting_logo').value.trim(),
            icon_ct_url: document.getElementById('setting_icon_ct').value.trim(), 
            icon_bc_url: document.getElementById('setting_icon_bc').value.trim(), 
            icon_lb_url: document.getElementById('setting_icon_lb').value.trim()
        };
        
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/settings?on_conflict=id`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'resolution=merge-duplicates' },
                body: JSON.stringify(newSettings)
            });
            if (!res.ok) throw new Error("Gagal simpan database");

            localStorage.setItem('lifting_settings', JSON.stringify(newSettings));
            showToast('Branding berhasil disimpan ke Cloud untuk semua pengguna!'); 
            renderApp(true);
        } catch(err) {
            showToast('Gagal simpan branding ke cloud!', 'error');
        } finally { 
            btn.innerHTML = originalText; btn.disabled = false; 
        }
    }

    function addMasterData(e, key) { e.preventDefault(); const val = document.getElementById('new_master_val').value.trim(); const m = getMasterData(); if (!m[key]) m[key] = []; if(m[key].includes(val)) return showToast('Data sudah ada!', 'error'); m[key].push(val); saveMasterData(m); showToast('Data berhasil ditambahkan!'); renderApp(true); }
    
    function addAccountMasterData(e, key) { 
        e.preventDefault(); 
        const name = document.getElementById('new_master_name').value.trim(); 
        const nrp = document.getElementById('new_master_nrp').value.trim(); 
        const pwd = document.getElementById('new_master_pwd').value; 
        
        const users = getUsers(); 
        if (users.find(u => u.nrp === nrp)) return showToast('NRP sudah terdaftar!', 'error'); 
        
        const m = getMasterData(); 
        if (!m[key]) m[key] = []; 
        if(m[key].includes(name)) return showToast('Nama sudah ada di master!', 'error'); 
        
        m[key].push(name); 
        saveMasterData(m); 
        
        let role = key === 'gl' ? 'GL' : 'MANPOWER'; 
        let jabatan = key === 'gl' ? 'Group Leader' : (key === 'operator' ? 'Operator' : 'Rigger'); 
        
        users.push({ nrp: nrp, nama_lengkap: name, jabatan: jabatan, perusahaan: 'PPA', departemen: 'OPERATION', section: 'LIFTING', no_wa: '-', password_hash: pwd, role: role, status_akun: 'ACTIVE' }); 
        saveUsers(users); 
        
        showToast(`Akun ${role} dibuat & Master diupdate!`); 
        renderApp(true); 
    }

    function addAccountManual(e) {
        e.preventDefault();
        const nrp = document.getElementById('new_user_nrp').value.trim();
        const name = document.getElementById('new_user_name').value.trim();
        const role = document.getElementById('new_user_role').value;
        const pwd = document.getElementById('new_user_pwd').value;
        
        const users = getUsers();
        if (users.find(u => u.nrp === nrp)) return showToast('NRP sudah terdaftar!', 'error'); 
        
        let jabatan = role === 'GL' ? 'GROUP LEADER' : (role === 'MANPOWER' ? 'OPERATOR' : (role === 'ADMIN' ? 'ADMIN' : 'USER'));
        users.unshift({ nrp: nrp, nama_lengkap: name, jabatan: jabatan, perusahaan: 'PPA', departemen: 'OPERATION', section: 'LIFTING', no_wa: '-', password_hash: pwd, role: role, status_akun: 'ACTIVE' });
        saveUsers(users);
        showToast('Akun Pengguna ditambahkan!');
        renderApp(true);
    }
    
    function confirmDeleteMasterData(key, index) { 
        openCustomConfirm('Hapus Master Data', 'Yakin ingin menghapus item ini dari master data?', () => { 
            const m = getMasterData(); 
            if (!m[key]) m[key] = []; 
            m[key].splice(index, 1); 
            saveMasterData(m); 
            showToast('Item berhasil dihapus!'); 
            renderApp(true); 
        }); 
    }

    function confirmDeleteUser(nrp) {
        const currentUser = JSON.parse(localStorage.getItem('lifting_user'));
        if(currentUser.nrp === nrp) return showToast('Tidak bisa menghapus akun Anda sendiri!', 'error');

        openCustomConfirm('Hapus Pengguna', `Hapus permanen akun dengan NRP: ${nrp}?`, async () => {
            let users = getUsers().filter(u => u.nrp !== nrp);
            localStorage.setItem('lifting_users', JSON.stringify(users)); 
            
            if (SUPABASE_KEY && !SUPABASE_KEY.includes('PASTE_KUNCI')) {
                try { 
                    await fetch(`${SUPABASE_URL}/rest/v1/users?nrp=eq.${nrp}`, { 
                        method: 'DELETE', 
                        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } 
                    }); 
                } catch(e) { console.warn(e); }
            }
            
            showToast('Akun berhasil dihapus!'); 
            renderApp(true);
        });
    }

    function openResetPwd(nrp) { document.getElementById('resetNrpLabel').innerText = nrp; document.getElementById('resetNrpVal').value = nrp; document.getElementById('resetPwdInput').value = ''; document.getElementById('resetPwdModal').classList.remove('hidden'); }
    function processResetPassword(e) { e.preventDefault(); const nrp = document.getElementById('resetNrpVal').value; const newPwd = document.getElementById('resetPwdInput').value; const users = getUsers(); const idx = users.findIndex(u => u.nrp === nrp); if(idx !== -1) { users[idx].password_hash = newPwd; saveUsers(users); showToast(`Password ${nrp} berhasil direset!`); document.getElementById('resetPwdModal').classList.add('hidden'); renderApp(true); } }

    function getProfileView() {
        const user = JSON.parse(localStorage.getItem('lifting_user'));

        return `
        <div class="max-w-md mx-auto mt-4">
            <!-- Profile Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 flex flex-col items-center mb-4 relative z-10">
                <div class="w-16 h-16 bg-cyan-50 text-cyan-600 rounded-full flex items-center justify-center text-3xl mb-3"><i class="fa-solid fa-user-shield"></i></div>
                <h2 class="font-bold text-slate-800 text-base uppercase">${user.nama_lengkap}</h2>
                <p class="text-xs text-slate-500 uppercase tracking-widest mt-1">${user.role} | ${user.departemen}</p>
                <p class="text-[10px] text-slate-400 mt-1">NRP: ${user.nrp} • Perusahaan: ${user.perusahaan}</p>
            </div>

            <!-- Menus -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex flex-col mb-4 relative z-0">
                <button onclick="document.getElementById('profileBiodataModal').classList.remove('hidden')" class="flex items-center justify-between p-4 hover:bg-slate-50 border-b border-slate-50 transition-colors w-full text-left">
                    <div class="flex items-center gap-3"><div class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0"><i class="fa-solid fa-id-card"></i></div><div class="text-left"><p class="text-xs font-bold text-slate-700">Identitas Saya</p><p class="text-[9px] text-slate-400">Informasi detail personal</p></div></div>
                    <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
                </button>
                <button onclick="document.getElementById('profileSettingsModal').classList.remove('hidden')" class="flex items-center justify-between p-4 hover:bg-slate-50 transition-colors w-full text-left">
                    <div class="flex items-center gap-3"><div class="w-9 h-9 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center shrink-0"><i class="fa-solid fa-lock"></i></div><div class="text-left"><p class="text-xs font-bold text-slate-700">Security / Password</p><p class="text-[9px] text-slate-400">Ubah kata sandi Anda</p></div></div>
                    <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
                </button>
            </div>

            <!-- Logout -->
            <button onclick="openCustomConfirm('Keluar Akun', 'Apakah Anda yakin ingin keluar dari sistem?', handleLogout)" class="w-full bg-white rounded-2xl shadow-sm border border-red-100 flex items-center justify-between p-4 hover:bg-red-50 transition-colors relative z-0">
                <div class="flex items-center gap-3"><div class="w-9 h-9 rounded-xl bg-red-50 text-red-500 flex items-center justify-center shrink-0"><i class="fa-solid fa-sign-out-alt"></i></div><p class="text-xs font-bold text-red-600">Logout</p></div>
                <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
            </button>
        </div>`;
    }

    function saveProfile(e) { 
        e.preventDefault(); 
        let user = JSON.parse(localStorage.getItem('lifting_user')); 
        let users = getUsers(); 
        let idx = users.findIndex(u => u.nrp === user.nrp); 
        
        user.nama_lengkap = document.getElementById('profName').value; 
        user.jabatan = document.getElementById('profJabatan').value; 
        user.perusahaan = document.getElementById('profPerusahaan').value; 
        user.departemen = document.getElementById('profDepartemen').value; 
        user.section = document.getElementById('profSection').value; 
        user.no_wa = document.getElementById('profWa').value; 
        
        if (idx !== -1) {
            users[idx] = user; 
            saveUsers(users); 
            localStorage.setItem('lifting_user', JSON.stringify(user)); 
            
            document.getElementById('profileBiodataModal').classList.add('hidden');
            showToast('Profil berhasil diperbarui!'); 
            renderApp(true); 
        }
    }
    
    function savePassword(e) { 
        e.preventDefault(); 
        let pwd1 = document.getElementById('profPwd1').value; 
        let pwd2 = document.getElementById('profPwd2').value; 
        if (pwd1 !== pwd2) return showToast('Password tidak cocok!', 'error'); 
        
        let user = JSON.parse(localStorage.getItem('lifting_user')); 
        let users = getUsers(); 
        let idx = users.findIndex(u => u.nrp === user.nrp); 
        
        if (idx !== -1) {
            users[idx].password_hash = pwd1; 
            saveUsers(users); 
            user.password_hash = pwd1;
            localStorage.setItem('lifting_user', JSON.stringify(user)); 
            
            document.getElementById('profPwd1').value = ''; 
            document.getElementById('profPwd2').value = ''; 
            document.getElementById('profileSettingsModal').classList.add('hidden');
            showToast('Password berhasil diubah!'); 
        } else {
            showToast('Gagal mereset, user tidak ditemukan', 'error');
        }
    }

    window.addEventListener('load', () => { 
        fetchFromSupabase().then(() => { 
            renderApp(false); 
        }); 
    });
    
    document.addEventListener("visibilitychange", () => { 
        if (document.visibilityState === "visible") { 
            const user = localStorage.getItem('lifting_user'); 
            if (user) { 
                fetchFromSupabase().then(() => { 
                    if (canRenderApp()) {
                        renderApp(true); 
                    }
                }); 
            } 
        } 
    });
</script>
