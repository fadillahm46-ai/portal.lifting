    function generateWO(kategori) {
        const date = new Date();
        const yyyy = date.getFullYear(); const mm = String(date.getMonth() + 1).padStart(2, '0'); const dd = String(date.getDate()).padStart(2, '0');
        let prefix = kategori === 'Big Crane' ? 'BC-' : (kategori === 'Lowboy' ? 'LB-' : 'CT-');
        const datePrefix = `${prefix}${yyyy}${mm}${dd}-`;
        
        let maxNumber = 0;
        getOrders().forEach(job => {
            if (job.no_wo && job.no_wo.startsWith(datePrefix)) {
                const parts = job.no_wo.split('-');
                if (parts.length >= 3) {
                    const num = parseInt(parts[2].split('-P')[0], 10);
                    if (!isNaN(num) && num > maxNumber) maxNumber = num;
                }
            }
        });
        return `${datePrefix}${maxNumber + 1}`;
    }

    function showSuccessAnim(type, title, msg) {
        const m = document.getElementById('successModal');
        const icon = document.getElementById('successIcon');
        document.getElementById('successTitle').innerText = title;

        if (type === 'check') {
            icon.className = "w-16 h-16 rounded-full flex items-center justify-center text-3xl mb-3 text-white bg-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.5)]";
            icon.innerHTML = '<i class="fa-solid fa-check"></i>';
        } else if (type === 'thumb') {
            icon.className = "w-16 h-16 rounded-full flex items-center justify-center text-3xl mb-3 text-white bg-blue-500 shadow-[0_0_15px_rgba(59,130,246,0.5)]";
            icon.innerHTML = '<i class="fa-solid fa-thumbs-up"></i>';

        m.classList.remove('hidden');

    }

    function renderApp(isSilentSync = false) {
        const app = document.getElementById('app');
        const user = JSON.parse(localStorage.getItem('lifting_user'));
        const settings = getSettings();

        if (!user) { app.innerHTML = getAuthView(); return; }
        const isMobile = window.innerWidth < 768;

        const mainContentEl = document.getElementById('mainTabContentArea');
        const mobileNavEl = document.getElementById('mobileNavWrapper');

        /* ========================================================

           JANGAN pernah hancurkan navbar, header, atau modal.
           Hanya perbarui konten tabel/dashboard di mainTabContentArea
           ======================================================== */
        if (isSilentSync && mainContentEl && (!isMobile || mobileNavEl)) {
            if (currentTab === 'order' || isAnyModalOpen()) {
                window._pendingReRender = true;
                return;
            }

            // Pertahankan posisi scroll pengguna secara presisi (kontainer utama & tabel monitoring)
            const scrolls = saveAllScrollPositions();

            let tabContentHtml = '';
            if (currentTab === 'dashboard') {
                tabContentHtml = (user.role === 'MANPOWER' ? getMpDashboardView() : ((user.role === 'ADMIN' || user.role === 'GL') ? getDashboardView() : ''));
            } else if (currentTab === 'monitoring') {

            } else if (currentTab === 'master' && user.role === 'ADMIN') {
                tabContentHtml = getMasterDataView();
            } else if (currentTab === 'profile') {
                tabContentHtml = getProfileView();
            }

            mainContentEl.innerHTML = tabContentHtml;
            restoreAllScrollPositions(scrolls);
            requestAnimationFrame(() => restoreAllScrollPositions(scrolls));

            setTimeout(() => {
                mainContentEl.querySelectorAll('.chart-bar').forEach(bar => {
                    const w = bar.getAttribute('data-width');

                { id: 'profile', label: 'Profil', icon: 'fa-solid fa-user' }
            ];
        } else if (user.role === 'USER') {
            tabs = [
                { id: 'monitoring', label: 'Data', icon: 'fa-solid fa-list-check' },
                { id: 'order', label: 'Order', icon: 'fa-solid fa-plus' },
                { id: 'profile', label: 'Profil', icon: 'fa-solid fa-user' }
            ];
        } else {
            // MANPOWER (MP): 4 Menu berurutan (Dashboard, Tugas Aktif, P2H Tools, Profil)
            tabs = [
                { id: 'dashboard', label: 'Dashboard', icon: 'fa-solid fa-chart-pie' },
                { id: 'monitoring', label: 'Tugas Aktif', icon: 'fa-solid fa-hard-hat' },
                { id: 'p2h', label: 'P2H Tools', icon: 'fa-solid fa-screwdriver-wrench' },
                { id: 'profile', label: 'Profil', icon: 'fa-solid fa-user' }
            ];
        }

        let activeIdx = tabs.findIndex(t => t.id === currentTab);
        if (activeIdx === -1) activeIdx = 0;
        const count = tabs.length;
        const tabWidthPct = 100 / count;

        if (typeof window._lastNavIndex !== 'number') {
            window._lastNavIndex = activeIdx;
        }

        const isUserClick = (window._isUserTabSwitch === true);
        const initialTranslateX = isUserClick ? window._lastNavIndex * 100 : activeIdx * 100;

        let tabsHtml = tabs.map((tab, idx) => {
            const isActive = idx === activeIdx;
            return `
            <button type="button" onclick="switchTab('${tab.id}')" class="curved-nav-item flex-1 focus:outline-none" style="width: ${tabWidthPct}%;">
                <div class="flex flex-col items-center justify-center transition-all duration-300 ${isActive ? 'opacity-0 scale-75 -translate-y-2' : 'opacity-100 scale-100 translate-y-0'}">
                    <i class="${tab.icon} text-lg mb-1 text-slate-400"></i>
                    <span class="text-[9px] font-semibold text-slate-500 leading-none">${tab.label}</span>
                </div>
                ${isActive ? `
                <span class="absolute bottom-1.5 text-[9px] font-bold text-cyan-600 tracking-tight leading-none ${isUserClick ? 'animate-water-drop' : ''}">
                    ${tab.label}
                </span>` : ''}
            </button>`;
        }).join('');

        const activeTab = tabs[activeIdx] || tabs[0];

        return `
        <div id="mobileNavWrapper" class="curved-nav-wrapper md:hidden pb-safe">
            <!-- Cekungan Gelombang Air Meluncur Halus (Tanpa Garis Luar) -->
            <div id="mobileCurvedCradle" class="curved-notch-cradle" style="width: ${tabWidthPct}%; transform: translateX(${initialTranslateX}%); ${!isUserClick ? 'transition: none;' : ''}">
                <!-- Notch Dip SVG Menyatu Alami dengan Body #f8fafc -->
                <svg class="water-notch-svg" viewBox="0 0 84 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 0 0 C 14 0 19 14 27 20 C 33 24 51 24 57 20 C 65 14 70 0 84 0 L 84 24 L 0 24 Z" fill="#f8fafc" />
                </svg>

                <!-- Riak Gelombang Air Konsentris -->
                <div id="waterRippleWave" class="water-ripple-wave ${isUserClick ? 'ripple-active' : ''}"></div>

                <!-- Tetesan Air Aktif Mengambang dengan Pantulan Cahaya 3D -->
                <div id="mobileActiveBubble" class="curved-active-bubble">
                    <i class="${activeTab.icon} text-xl ${isUserClick ? 'animate-water-drop' : ''}"></i>
                </div>
            </div>

            <!-- Baris Tombol Menu Navigasi -->
            <div class="relative flex justify-around items-center w-full h-[60px] z-40">
                ${tabsHtml}
            </div>
        </div>`;
    }

    function updateMobileBubblePosition() {
        const cradle = document.getElementById('mobileCurvedCradle');
        const bubble = document.getElementById('mobileActiveBubble');
        const ripple = document.getElementById('waterRippleWave');
        if (!cradle || !bubble) return;

        const user = JSON.parse(localStorage.getItem('lifting_user'));
        if (!user) return;

        let tabs = [];
        if (user.role === 'ADMIN' || user.role === 'GL') {
            tabs = ['dashboard', 'monitoring', 'order', 'jadwal', 'profile'];
        } else if (user.role === 'USER') {
            tabs = ['monitoring', 'order', 'profile'];
        } else {
            // MANPOWER (MP): Menghitung posisi 4 tab (Dashboard, Monitoring/Tugas, P2H, Profile)
            tabs = ['dashboard', 'monitoring', 'p2h', 'profile'];
        }

        let newIdx = tabs.indexOf(currentTab);
        if (newIdx === -1) newIdx = 0;
        const count = tabs.length;
        const tabWidthPct = 100 / count;

        const isUserClick = (window._isUserTabSwitch === true);
        const prevIdx = (typeof window._lastNavIndex === 'number') ? window._lastNavIndex : newIdx;

        cradle.style.width = tabWidthPct + '%';

        // Jika order baru masuk atau sinkronisasi background: JANGAN gerakkan animasi
        if (!isUserClick) {
            cradle.style.transition = 'none';
            cradle.style.transform = `translateX(${newIdx * 100}%)`;
            bubble.classList.remove('bubble-moving-right', 'bubble-moving-left');
            if (ripple) ripple.classList.remove('ripple-active');
            window._lastNavIndex = newIdx;
            return;
        }

        // Jika pengguna sendiri yang mengetuk menu: jalankan fisika aliran cairan (Directional Lean)
        cradle.style.transition = 'transform 0.48s cubic-bezier(0.34, 1.35, 0.52, 1)';
        cradle.style.transform = `translateX(${newIdx * 100}%)`;

        bubble.classList.remove('bubble-moving-right', 'bubble-moving-left');
        void bubble.offsetWidth; // Force reflow agar animasi fluida berjalan sempurna

        if (newIdx > prevIdx) {
            bubble.classList.add('bubble-moving-right');
        } else if (newIdx < prevIdx) {
            bubble.classList.add('bubble-moving-left');
        }

        // Pemicu riak gelombang air
        if (ripple) {
            ripple.classList.remove('ripple-active');
            void ripple.offsetWidth;
            ripple.classList.add('ripple-active');
        }

        // Getar halus haptik menyerupai tetesan air
        if (newIdx !== prevIdx && "vibrate" in navigator) {
            try { navigator.vibrate(15); } catch(e) {}
        }

        window._lastNavIndex = newIdx;
        window._isUserTabSwitch = false; // Reset status setelah perpindahan selesai
    }

    function handleLogin(e) {
        e.preventDefault();
        requestNotificationAccess();
        const nrp = document.getElementById('loginNrp').value.trim().toUpperCase(); const pwd = document.getElementById('loginPwd').value;
        const users = getUsers(); const user = users.find(u => (u.nrp || '').toUpperCase() === nrp && u.password_hash === pwd && u.status_akun === 'ACTIVE');
        const errorMsg = document.getElementById('loginErrorMsg');
        
        if (user) {
            localStorage.setItem('lifting_user', JSON.stringify(user));
            // Bersihkan draf umum legacy jika pernah ada
            localStorage.removeItem('lifting_order_draft');
            const homeTab = (user.role === 'ADMIN' || user.role === 'GL') ? 'dashboard' : (user.role === 'USER' ? 'order' : 'dashboard');
            currentTab = homeTab;
            window.location.hash = homeTab;
            
            // Muat armada dari draf khusus milik NRP ini jika ada
            const userDraftKey = `lifting_order_draft_${user.nrp.toUpperCase()}`;
            try {
                const savedDraft = JSON.parse(localStorage.getItem(userDraftKey));
                userOrderFleetMode = (savedDraft && savedDraft.fleetMode) ? savedDraft.fleetMode : null;
            } catch(err) {
                userOrderFleetMode = null;
            }
            mpFleetMode = null; 
            renderApp(false);
        } else {
            errorMsg.innerHTML = '<i class="fa-solid fa-circle-exclamation mr-1"></i>NRP atau Password salah!'; errorMsg.classList.remove('hidden');
        }
    }

    function handleLogout() { 
        userOrderFleetMode = null;
        mpFleetMode = null;
        localStorage.removeItem('lifting_user'); 
        window.location.hash = ''; 
        renderApp(false); 
    }

    function handleSignup(e) {
        e.preventDefault();
        const users = getUsers(); const nrp = document.getElementById('regNrp').value.trim().toUpperCase();
        if (users.find(u => (u.nrp || '').toUpperCase() === nrp)) return showToast('NRP terdaftar!', 'error');

        const perusahaanVal = resolveMasterValue('regPerusahaan', 'regPerusahaanOther', 'perusahaan');
        const deptVal = resolveMasterValue('regDepartemen', 'regDepartemenOther', 'departemen');
        const sectionVal = resolveMasterValue('regSection', 'regSectionOther', 'section');

        if (!perusahaanVal || !deptVal || !sectionVal) {
            return showToast('Mohon lengkapi data Perusahaan, Departemen, dan Section!', 'error');
        }

        const newUser = {
            nrp: nrp, 
            nama_lengkap: document.getElementById('regName').value.trim().toUpperCase(), 
            jabatan: document.getElementById('regJabatan').value.trim().toUpperCase(),
            perusahaan: perusahaanVal, 
            departemen: deptVal,
            section: sectionVal, 
            no_wa: document.getElementById('regWa').value,
            password_hash: document.getElementById('regPwd').value, 
            role: 'USER', 
            status_akun: 'ACTIVE'
        };
        users.push(newUser); saveUsers(users); 
        
        document.getElementById('successRegMsg').innerText = "Silakan masuk dengan akun Anda.";
        const m = document.getElementById('successRegModal');
        m.classList.remove('hidden');
        
        setTimeout(() => {
            m.classList.add('hidden');
            toggleAuthMode('authForm');
            document.getElementById('loginNrp').value = nrp;
            document.getElementById('loginPwd').value = '';
        }, 1500);
    }

    function checkForgotNrp(e) {
        e.preventDefault();
        const nrp = document.getElementById('forgotNrp').value.trim().toUpperCase();
        const users = getUsers();
        const user = users.find(u => (u.nrp || '').toUpperCase() === nrp);
        if(user) {
            document.getElementById('step1Forgot').classList.add('hidden');
            document.getElementById('step2Forgot').classList.remove('hidden');
            document.getElementById('forgotTargetNrp').value = nrp;
        } else {
            showToast('NRP tidak ditemukan!', 'error');
        }
    }

    function submitNewPassword(e) {
        e.preventDefault();
        const nrp = document.getElementById('forgotTargetNrp').value;
        const p1 = document.getElementById('forgotPwd1').value;
        const p2 = document.getElementById('forgotPwd2').value;
        if(p1 !== p2) return showToast('Password tidak cocok!', 'error');

        let users = getUsers();
        let idx = users.findIndex(u => (u.nrp || '').toUpperCase() === nrp);
        if(idx !== -1) {
            users[idx].password_hash = p1;
            saveUsers(users); 
            
            if (SUPABASE_KEY && !SUPABASE_KEY.includes('PASTE_KUNCI')) {

       ======================================================== */
    const FONT_LEVELS = ['original', 'sedang', 'besar', 'sangat-besar'];
    let tempSelectedFontSizeLevel = 0;

    function getAppFontSizeLevel() {
        const saved = localStorage.getItem('lifting_font_size') || 'original';
        if (saved === 'sedang' || saved === '1') return 1;
        if (saved === 'besar' || saved === 'medium' || saved === '2') return 2;
        if (saved === 'sangat-besar' || saved === 'large' || saved === '3') return 3;
        return 0; // 'original', 'small', '0'
    }

    function applyAppFontSizeLevel(level) {
        level = parseInt(level, 10);
        if (isNaN(level) || level < 0) level = 0;
        if (level > 3) level = 3;

        const root = document.documentElement;
        root.classList.remove('font-size-original', 'font-size-small', 'font-size-sedang', 'font-size-besar', 'font-size-medium', 'font-size-sangat-besar', 'font-size-large');

        const levelKey = FONT_LEVELS[level];
        root.classList.add('font-size-' + levelKey);
        localStorage.setItem('lifting_font_size', levelKey);
    }

    function handleFontSizeSlider(val) {
        tempSelectedFontSizeLevel = parseInt(val, 10);
        updateFontSizeUI(tempSelectedFontSizeLevel, true);
    }

    function setAppFontSizeLevel(val) {
        tempSelectedFontSizeLevel = parseInt(val, 10);
        updateFontSizeUI(tempSelectedFontSizeLevel, true);
    }

    // Kompatibilitas fungsi pemanggilan lama
    function applyAppFontSize(size) {
        if (size === 'sedang' || size === '1') applyAppFontSizeLevel(1);
        else if (size === 'besar' || size === 'medium' || size === '2') applyAppFontSizeLevel(2);
        else if (size === 'sangat-besar' || size === 'large' || size === '3') applyAppFontSizeLevel(3);
        else applyAppFontSizeLevel(0);
    }

    function updateFontSizeUI(level, isDirty = false) {
        level = parseInt(level, 10);
        if (isNaN(level) || level < 0) level = 0;
        if (level > 3) level = 3;

        const range = document.getElementById('fontSizeRange');
        const thumb = document.getElementById('fontSizeThumb');
        const preview = document.getElementById('fontSizePreviewText');
        const btnSave = document.getElementById('btnSaveFontSize');

        if (range) range.value = level;
        if (thumb) {
            const pct = (level / 3) * 100;
            thumb.style.left = `${pct}%`;
        }

        if (preview) {
            if (level === 1) {
                preview.style.fontSize = '13.5px';
                preview.innerText = "Contoh Teks: Ukuran Sedang (+12%). Teks sedikit lebih nyaman dibaca.";
            } else if (level === 2) {
                preview.style.fontSize = '15px';
                preview.innerText = "Contoh Teks: Ukuran Besar (+25%). Teks lebih besar dan proporsional.";
            } else if (level === 3) {
                preview.style.fontSize = '18px';
                preview.innerText = "Contoh Teks: Ukuran Sangat Besar (+50%). Teks jauh lebih jelas dan besar.";
            } else {
                preview.style.fontSize = '12px';
                preview.innerText = "Contoh Teks: Ukuran Original Kecil (100%). Standar antarmuka sistem.";
            }
        }

        // Highlight label step yang aktif
        for (let i = 0; i <= 3; i++) {
            const lbl = document.getElementById('fontStepLbl' + i);
            if (lbl) {
                if (i === level) {
                    lbl.className = "cursor-pointer text-center font-bold text-blue-600 leading-tight";
                } else {
                    lbl.className = "cursor-pointer text-center font-medium text-slate-500 hover:text-blue-600 leading-tight";
                }
            }
        }

        // Indikator tombol simpan: aktif jika ada perubahan dari yang tersimpan
        if (btnSave) {
            const currentSaved = getAppFontSizeLevel();
            if (level !== currentSaved) {
                btnSave.className = "w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-md text-xs transition-colors shadow-md flex items-center justify-center gap-1.5 animate-pulse cursor-pointer";
                btnSave.innerHTML = '<i class="fa-solid fa-check"></i> Simpan Perubahan Ukuran';
            } else {
                btnSave.className = "w-full bg-slate-100 text-slate-500 font-bold py-2 rounded-md text-xs transition-colors border border-slate-200 flex items-center justify-center gap-1.5 cursor-default";
                btnSave.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600"></i> Ukuran Teks Aktif (Tersimpan)';
            }
        }
    }

    async function saveProfile(e) { 
        e.preventDefault(); 
        let user = JSON.parse(localStorage.getItem('lifting_user')); 
        let users = getUsers(); 
        let idx = users.findIndex(u => (u.nrp || '').toUpperCase() === (user.nrp || '').toUpperCase()); 
        
        // Nama akun Manpower dikunci dan tidak diubah mandiri agar selalu cocok dengan data master
        if ((user.role || '').toUpperCase() !== 'MANPOWER') {
            user.nama_lengkap = document.getElementById('profName').value.trim().toUpperCase(); 
        }
        user.jabatan = document.getElementById('profJabatan').value.trim().toUpperCase(); 
        user.perusahaan = resolveMasterValue('profPerusahaan', 'profPerusahaanOther', 'perusahaan') || user.perusahaan; 
        user.departemen = resolveMasterValue('profDepartemen', 'profDepartemenOther', 'departemen') || user.departemen; 
        user.section = resolveMasterValue('profSection', 'profSectionOther', 'section') || user.section; 
        user.no_wa = document.getElementById('profWa').value.trim(); 
        
        if(idx !== -1) {
            users[idx] = user; 
            saveUsers(users); 
            localStorage.setItem('lifting_user', JSON.stringify(user)); 
            
            if (SUPABASE_KEY && !SUPABASE_KEY.includes('PASTE_KUNCI')) {
                try {
                    if (supabaseClient) {
                        await supabaseClient.from('users').update({
                            nama_lengkap: user.nama_lengkap,
                            jabatan: user.jabatan,
                            perusahaan: user.perusahaan,
                            departemen: user.departemen,
                            section: user.section,
                            no_wa: user.no_wa
                        }).eq('nrp', user.nrp);
                    } else {
                        await fetch(`${SUPABASE_URL}/rest/v1/users?nrp=eq.${user.nrp}`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
                            body: JSON.stringify({
                                nama_lengkap: user.nama_lengkap,
                                jabatan: user.jabatan,
                                perusahaan: user.perusahaan,
                                departemen: user.departemen,
                                section: user.section,
                                no_wa: user.no_wa
                            })
                        });
                    }
                } catch(err) { console.warn(err); }
            }

            showToast('Profil berhasil diperbarui!'); 
            document.getElementById('profileBiodataModal').classList.add('hidden');
            renderApp(true); 
        }
    }
    
    async function savePassword(e) { 
        e.preventDefault(); 
        let pwd1 = document.getElementById('profPwd1').value; 
        let pwd2 = document.getElementById('profPwd2').value; 
        if (pwd1 !== pwd2) return showToast('Password tidak cocok!', 'error'); 
        
        let user = JSON.parse(localStorage.getItem('lifting_user')); 
        let users = getUsers(); 
        let idx = users.findIndex(u => (u.nrp || '').toUpperCase() === (user.nrp || '').toUpperCase()); 
        
        if (idx !== -1) {
            users[idx].password_hash = pwd1; 
            saveUsers(users); 
            user.password_hash = pwd1;
            localStorage.setItem('lifting_user', JSON.stringify(user)); 
            
            if (SUPABASE_KEY && !SUPABASE_KEY.includes('PASTE_KUNCI')) {
                try {
                    if (supabaseClient) {
                        await supabaseClient.from('users').update({ password_hash: pwd1 }).eq('nrp', user.nrp);
                    } else {
                        await fetch(`${SUPABASE_URL}/rest/v1/users?nrp=eq.${user.nrp}`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
                            body: JSON.stringify({ password_hash: pwd1 })
                        });
                    }
                } catch(err) { console.warn(err); }
            }
            
            document.getElementById('profPwd1').value = ''; 
            document.getElementById('profPwd2').value = ''; 
            showToast('Password berhasil diubah!'); 
            document.getElementById('profileSettingsModal').classList.add('hidden');
        } else {
            showToast('Gagal mereset, user tidak ditemukan', 'error');
        }
    }

    function addMasterDataItem(e, key) {
        e.preventDefault();
        const input = document.getElementById('newMasterItemInput');
        const val = input.value.trim().toUpperCase();
        if (!val) return;
        const m = getMasterData();
        if (!m[key]) m[key] = [];
        if (!m[key].includes(val)) {
            m[key].push(val);
            saveMasterData(m);
            showToast('Item berhasil ditambahkan');
            renderApp(true);
        } else {
            showToast('Item sudah ada!', 'error');
        }
    }

    async function addCompanyMasterItem(e) {
        e.preventDefault();
        const input = document.getElementById('newMasterItemInput');
        const colorInput = document.getElementById('newCompanyColorInput');
        const val = input.value.trim().toUpperCase();
        const color = colorInput ? colorInput.value : 'biru';
        if (!val) return;
        const m = getMasterData();
        if (!m.perusahaan) m.perusahaan = [];
        if (!m.perusahaan.includes(val)) {
            m.perusahaan.push(val);
        }
        if (!m.perusahaan_colors) m.perusahaan_colors = {};
        m.perusahaan_colors[val] = color;
        m.perusahaan_colors[normalizeName(val)] = color;
        saveMasterData(m);

        // Sinkronkan langsung ke tabel company_status di Supabase via setCompanyWoColor
        await setCompanyWoColor(val, color);
    }

    async function deleteMasterDataItem(key, idx) {
        const m = getMasterData();
        if (m[key] && m[key][idx] !== undefined) {
            const removedItem = m[key][idx];
            m[key].splice(idx, 1);
            if (key === 'perusahaan') {
                if (m.perusahaan_colors) {
                    delete m.perusahaan_colors[removedItem];
                    delete m.perusahaan_colors[normalizeName(removedItem)];
                }
                if (window.companyColorMap) {
                    delete window.companyColorMap[removedItem];
                    delete window.companyColorMap[normalizeName(removedItem)];
                }
                // Hapus langsung dari tabel company_status di Supabase
                if (SUPABASE_KEY && !SUPABASE_KEY.includes('PASTE_KUNCI')) {
                    try {
                        if (supabaseClient) {
                            await supabaseClient.from('company_status').delete().ilike('nama_perusahaan', removedItem);
                        } else {
                            await fetch(`${SUPABASE_URL}/rest/v1/company_status?nama_perusahaan=ilike.${encodeURIComponent(removedItem)}`, {
                                method: 'DELETE',
                                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                            });
                        }
                    } catch(err) {
                        console.warn("Gagal hapus company_status dari Supabase:", err);
                    }
                }
            }
            saveMasterData(m);
            showToast('Item dihapus');
            renderApp(true);
        }
    }

    function openResetPasswordModal(nrp) {
        document.getElementById('resetNrpLabel').innerText = nrp;
        document.getElementById('resetNrpVal').value = nrp;
        document.getElementById('resetPwdInput').value = '';
        document.getElementById('resetPwdModal').classList.remove('hidden');
    }

    async function processResetPassword(e) {
        e.preventDefault();
        const nrp = document.getElementById('resetNrpVal').value;
        const newPwd = document.getElementById('resetPwdInput').value;
        let users = getUsers();
        let idx = users.findIndex(u => u.nrp === nrp);
        if (idx !== -1) {
            users[idx].password_hash = newPwd;
            saveUsers(users);

            if (SUPABASE_KEY && !SUPABASE_KEY.includes('PASTE_KUNCI')) {
                try {
                    if (supabaseClient) {
                        await supabaseClient.from('users').update({ password_hash: newPwd }).eq('nrp', nrp);
                    } else {
                        await fetch(`${SUPABASE_URL}/rest/v1/users?nrp=eq.${encodeURIComponent(nrp)}`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
                            body: JSON.stringify({ password_hash: newPwd })
                        });
                    }
                } catch(e) {}
            }

            showToast('Password untuk ' + nrp + ' berhasil direset');
            document.getElementById('resetPwdModal').classList.add('hidden');
            renderApp(true);
        }
    }

    async function toggleUserStatus(nrp) {
        let users = getUsers();

        if (idx !== -1) {
            users[idx].status_akun = users[idx].status_akun === 'ACTIVE' ? 'INACTIVE' : 'ACTIVE';
            saveUsers(users);

            if (SUPABASE_KEY && !SUPABASE_KEY.includes('PASTE_KUNCI')) {
                try {

                    } else {
                        await fetch(`${SUPABASE_URL}/rest/v1/users?nrp=eq.${encodeURIComponent(nrp)}`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
                            body: JSON.stringify({ status_akun: users[idx].status_akun })

    async function handleCreateUserByAdmin(e) {
        e.preventDefault();
        const nrp = document.getElementById('newAccNrp').value.trim().toUpperCase();
        let users = getUsers();
        if (users.some(u => (u.nrp || '').toUpperCase() === nrp)) {
            return showToast('NRP sudah terdaftar!', 'error');
        }

        const finalPerusahaan = resolveMasterValue('newAccPerusahaan', 'newAccPerusahaanOther', 'perusahaan') || 'PPA';
        const finalDept = resolveMasterValue('newAccDept', 'newAccDeptOther', 'departemen') || 'OPERATION';
        const finalSection = resolveMasterValue('newAccSection', 'newAccSectionOther', 'section') || 'LIFTING';

        const newUser = {
            nrp: nrp,
            nama_lengkap: document.getElementById('newAccName').value.trim().toUpperCase(),
            jabatan: document.getElementById('newAccJabatan').value.trim().toUpperCase(),
            perusahaan: finalPerusahaan,
            departemen: finalDept,
            section: finalSection,
            no_wa: document.getElementById('newAccWa').value.trim(),
            password_hash: document.getElementById('newAccPwd').value.trim() || '123456',
            role: document.getElementById('newAccRole').value,
            status_akun: 'ACTIVE'
        };

        users.push(newUser);
        saveUsers(users);

        if (SUPABASE_KEY && !SUPABASE_KEY.includes('PASTE_KUNCI')) {
            try {
                if (supabaseClient) {
                    await supabaseClient.from('users').upsert(newUser, { onConflict: 'nrp' });
                } else {
                    await fetch(`${SUPABASE_URL}/rest/v1/users?on_conflict=nrp`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'resolution=merge-duplicates' },
                        body: JSON.stringify(newUser)
                    });
                }
            } catch(e) {}
        }

        showToast(`Akun ${newUser.nama_lengkap} (${newUser.jabatan}) berhasil ditambahkan!`, 'success');
        document.getElementById('createUserModal').classList.add('hidden');
        renderApp(true);
    }

    function getDashboardView() {
        let jobs = getOrders();
        
        const defaultWeek = getWeekRangeSundayToSaturday();
        let tglMulai = document.getElementById('dash_tgl_mulai') ? document.getElementById('dash_tgl_mulai').value : defaultWeek.start;
        let tglSelesai = document.getElementById('dash_tgl_selesai') ? document.getElementById('dash_tgl_selesai').value : defaultWeek.end;
        
        let dashShift = document.getElementById('dash_shift') ? document.getElementById('dash_shift').value : 'ALL';
        let dashUnit = document.getElementById('dash_unit') ? document.getElementById('dash_unit').value : 'ALL';

        let filteredJobs = jobs.filter(j => {
            const opDate = getJobOperationalDate(j);
            return opDate >= tglMulai && opDate <= tglSelesai;
        });
        if (dashShift !== 'ALL') filteredJobs = filteredJobs.filter(j => getJobOperationalShift(j) === dashShift);
        if (dashUnit !== 'ALL') filteredJobs = filteredJobs.filter(j => j.kategori === dashUnit);

        let cntOrder = filteredJobs.length;
        let cntProg = filteredJobs.filter(j => j.status === 'ON PROGRESS').length;
        let cntPend = filteredJobs.filter(j => j.status === 'PENDING').length; 
        let cntDone = filteredJobs.filter(j => j.status === 'COMPLETED').length;
        let cntCancel = filteredJobs.filter(j => j.status === 'CANCELED').length;

        let cntCT = filteredJobs.filter(j => j.kategori === 'Crane Truck').length; 
        let cntBC = filteredJobs.filter(j => j.kategori === 'Big Crane').length;

                <!-- CANCELED: Ukuran 1 kolom (sama dengan ON PROGRESS, PENDING, COMPLETED) -->

                    <div class="text-[11px] sm:text-xs font-black text-red-600 uppercase tracking-widest mb-1 relative z-10">CANCELED</div>

                    <i class="fa-solid fa-xmark absolute -bottom-3 -right-2 text-6xl text-red-500 opacity-10"></i>
                </div>
            </div>

            <!-- Kartu Data Perusahaan & Dept Plant Sejajar & Simetris (Teks Jauh Lebih Besar & Kontras) -->
            <div class="bg-white border border-slate-200 rounded-xl p-4 sm:p-5 shadow-sm">
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                    <!-- Kolom 1: Donut Chart -->
                    <div class="lg:col-span-4 xl:col-span-3 flex flex-col items-center justify-start">
                        <h3 class="text-sm sm:text-base font-black text-slate-800 mb-3 w-full text-left">Data Perusahaan</h3>
                        <div class="relative h-52 w-52 sm:h-60 sm:w-60 flex items-center justify-center my-auto">
                            <canvas id="companyDonutChart"></canvas>
                        </div>
                    </div>
                    
                    <!-- Kolom 2 & 3: Rincian Perusahaan & Dept Plant Sejajar (50% / 50%) -->
                    <div class="lg:col-span-8 xl:col-span-9 grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
                        <!-- Rincian Perusahaan -->
                        <div class="flex flex-col justify-start">
                            <div class="grid grid-cols-12 text-[11px] sm:text-xs font-black text-slate-500 uppercase border-b-2 border-slate-200 pb-2 mb-2 select-none tracking-wider">
                                <span class="col-span-4 text-left">PERUSAHAAN</span>
                                <span class="col-span-2 text-center">PERSENTASE</span>
                                <span class="col-span-3 text-right">TOTAL JAM</span>
                                <span class="col-span-3 text-right">TOTAL ORDER</span>
                            </div>
                            <div class="flex flex-col gap-1 hide-scrollbar overflow-y-auto max-h-80" id="legendCompanyContainer"></div>
                        </div>
                        
                        <!-- Rincian Dept Plant Bergaris Pemisah Sejajar -->
                        <div class="md:border-l-2 border-slate-100 md:pl-6 flex flex-col justify-start">
                            <div class="grid grid-cols-12 text-[11px] sm:text-xs font-black text-slate-500 uppercase border-b-2 border-slate-200 pb-2 mb-2 select-none tracking-wider">
                                <span class="col-span-4 text-left text-blue-600 font-black">DEPT PLANT</span>
                                <span class="col-span-2 text-center">PERSENTASE</span>
                                <span class="col-span-3 text-right">TOTAL JAM</span>
                                <span class="col-span-3 text-right">TOTAL ORDER</span>
                            </div>
                            <div class="flex flex-col gap-1 hide-scrollbar overflow-y-auto max-h-80">
                                ${(() => {
                                    let plantStats = {};
                                    filteredJobs.forEach(j => {
                                        if((j.departemen || '').toUpperCase() === 'PLANT') {
                                            let sec = j.section || 'N/A';
                                            if(!plantStats[sec]) plantStats[sec] = { count: 0, hours: 0 };
                                            plantStats[sec].count++;
                                            if(j.status === 'COMPLETED' && j.durasi_aktual) plantStats[sec].hours += parseFloat(j.durasi_aktual);
                                        }
                                    });
                                    let plantArray = Object.entries(plantStats).sort((a,b) => b[1].count - a[1].count);
                                    if(plantArray.length === 0) return '<div class="text-xs sm:text-[13px] text-slate-400 italic py-3">Tidak ada order dari Dept Plant hari ini.</div>';
                                    let totalPlantJobs = plantArray.reduce((sum, item) => sum + item[1].count, 0) || 1;
                                    return plantArray.map(item => {
                                        let pct = Math.round((item[1].count / totalPlantJobs) * 100);
                                        return `
                                        <div class="grid grid-cols-12 text-xs sm:text-[13px] items-center py-1.5 border-b border-slate-100 hover:bg-slate-50/90 transition-colors">
                                            <div class="col-span-4 font-black text-slate-800 truncate pr-1" title="${item[0]}">${item[0]}</div>
                                            <div class="col-span-2 text-slate-600 text-center font-extrabold">${pct}%</div>
                                            <div class="col-span-3 text-slate-800 font-black text-right pr-1">${item[1].hours.toFixed(1)}J</div>
                                            <div class="col-span-3 text-slate-800 font-black text-right">${item[1].count} Job</div>
                                        </div>`;
                                    }).join('');
                                })()}
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Baris 2 Grafik Berdampingan 50% / 50% -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-3.5">
                <div class="bg-white border border-slate-200 rounded-xl p-4 sm:p-5 shadow-sm flex flex-col">
                    <h3 class="text-sm sm:text-base font-black text-slate-800 mb-3">Weekly Trend Order (vs Minggu Lalu)</h3>
                    <div class="relative h-60 w-full"><canvas id="lineChart"></canvas></div>
                </div>
                <div class="bg-white border border-slate-200 rounded-xl p-4 sm:p-5 shadow-sm flex flex-col">
                    <h3 class="text-sm sm:text-base font-black text-slate-800 mb-3 uppercase">DEPARTEMENT ORDER</h3>
                    <div class="relative h-60 w-full"><canvas id="deptOrderChart"></canvas></div>
                </div>
            </div>

            <!-- Baris Distribusi Unit & Scheduled vs Unscheduled -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-3.5">
                <div class="bg-white border border-slate-200 rounded-xl p-4 sm:p-5 shadow-sm flex flex-col sm:flex-row items-center justify-center gap-6">
                    <div class="w-full sm:w-auto">
                        <h3 class="text-sm sm:text-base font-black text-slate-800 mb-3 text-center sm:text-left uppercase">Distribusi & Total Unit</h3>
                        ${totalUnits > 1 ? `
                        <div class="w-28 h-28 sm:w-32 sm:h-32 rounded-full shadow-inner mx-auto sm:mx-0" style="${pieStyle}"></div>
                    </div>
                    <div class="w-full sm:w-auto flex-1 space-y-2.5 text-xs sm:text-sm font-semibold text-slate-600">
                        <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                            <div class="flex items-center gap-2">
                                <div class="w-3.5 h-3.5 rounded-sm bg-[#0d9488]"></div>
                                <span class="font-bold text-slate-700">Crane Truck</span>
                            </div>
                            <span class="text-slate-800 font-black">${pctCT}% <span class="text-slate-400 font-medium">(${cntCT} Order)</span></span>
                        </div>
                        <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                            <div class="flex items-center gap-2">
                                <div class="w-3.5 h-3.5 rounded-sm bg-[#4ade80]"></div>
                                <span class="font-bold text-slate-700">Big Crane</span>
                            </div>
                            <span class="text-slate-800 font-black">${pctBC}% <span class="text-slate-400 font-medium">(${cntBC} Order)</span></span>
                        </div>
                        <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                            <div class="flex items-center gap-2">
                                <div class="w-3.5 h-3.5 rounded-sm bg-[#a7f3d0]"></div>
                                <span class="font-bold text-slate-700">Lowboy</span>
                            </div>
                            <span class="text-slate-800 font-black">${pctLB}% <span class="text-slate-400 font-medium">(${cntLB} Order)</span></span>
                        </div>
                    </div>
                    ` : `<div class="text-xs text-slate-400 italic my-auto mx-auto">Data kosong</div></div>`}
                </div>
                
                <div class="bg-white border border-slate-200 rounded-xl p-4 sm:p-5 shadow-sm flex flex-col">
                    <h3 class="text-sm sm:text-base font-black text-slate-800 mb-3 uppercase">Scheduled vs Unscheduled</h3>
                    <div class="relative h-48 w-full"><canvas id="schedChart"></canvas></div>
                </div>
            </div>

            <!-- Baris Performa Rigger Full Width -->
            <div class="bg-white border border-slate-200 rounded-xl p-4 sm:p-5 shadow-sm flex flex-col w-full">
                <h3 class="text-sm sm:text-base font-black text-slate-800 mb-3 uppercase">Performa Rigger (Total Jam Kerja)</h3>
                <!-- Kontainer disetel ke h-80 sm:h-96 (320px–384px) agar grafik tegak proporsional dan tidak gepeng -->
                <div class="relative h-80 sm:h-96 w-full"><canvas id="riggerChart"></canvas></div>
            </div>
            
        </div>`;
    }

    function initDashboardCharts() {
        if(!document.getElementById('lineChart') || !document.getElementById('deptOrderChart') || typeof Chart === 'undefined') return;
        
        let allJobs = getOrders();
        const defaultWeek = getWeekRangeSundayToSaturday();
        let dashTglMulai = document.getElementById('dash_tgl_mulai')?.value || defaultWeek.start;
        let dashTglSelesai = document.getElementById('dash_tgl_selesai')?.value || defaultWeek.end;
        let dashShift = document.getElementById('dash_shift')?.value || 'ALL';
        let dashUnit = document.getElementById('dash_unit')?.value || 'ALL';

        if (dashShift !== 'ALL') allJobs = allJobs.filter(j => getJobOperationalShift(j) === dashShift);
        if (dashUnit !== 'ALL') allJobs = allJobs.filter(j => j.kategori === dashUnit);

        let filteredJobsRange = allJobs.filter(j => {
            const opDate = getJobOperationalDate(j);
            return opDate >= dashTglMulai && opDate <= dashTglSelesai;
        });

        const pad = n => String(n).padStart(2, '0');
        const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

        let refDate = new Date(dashTglMulai + 'T00:00:00');
        let mtdStartStr = refDate.getFullYear() + '-' + pad(refDate.getMonth()+1) + '-01';
        let mtdJobs = allJobs.filter(j => {
            const opDate = getJobOperationalDate(j);
            return opDate >= mtdStartStr && opDate <= dashTglSelesai;
        });
        
        let sundayThisWeek = new Date(refDate); 
        sundayThisWeek.setDate(refDate.getDate() - refDate.getDay());
        let lastWeekSun = new Date(sundayThisWeek); lastWeekSun.setDate(lastWeekSun.getDate() - 7);
        let lastWeekSat = new Date(sundayThisWeek); lastWeekSat.setDate(lastWeekSat.getDate() - 1);
        
        let lwStartStr = fmt(lastWeekSun);
        let lwEndStr = fmt(lastWeekSat);
        let lwJobs = allJobs.filter(j => {
            const opDate = getJobOperationalDate(j);
            return opDate >= lwStartStr && opDate <= lwEndStr;
        });

        function calcDeptCats(jobArray) {
            let ppaPlant=0, ppaNonPlant=0, nonPpa=0;
            jobArray.forEach(j => {
                let p = (j.perusahaan||'').toUpperCase(); let d = (j.departemen||'').toUpperCase();
                if(p.includes('PPA')) { if(d === 'PLANT') ppaPlant++; else ppaNonPlant++; } 
                else { nonPpa++; }
            });
            let total = ppaPlant + ppaNonPlant + nonPpa;
            if(total === 0) return [0,0,0];
            return [ (ppaPlant/total*100).toFixed(1), (ppaNonPlant/total*100).toFixed(1), (nonPpa/total*100).toFixed(1) ];
        }

        let mtdData = calcDeptCats(mtdJobs);
        let lwData = calcDeptCats(lwJobs);

        if(window.dashDeptChart) window.dashDeptChart.destroy();
        const ctxDept = document.getElementById('deptOrderChart').getContext('2d');
        window.dashDeptChart = new Chart(ctxDept, {
            type: 'bar',
            data: {
                labels: ['MTD', 'Last Week'],
                datasets: [
                    { label: 'Plant PPA', data: [mtdData[0], lwData[0]], backgroundColor: '#3b82f6', borderRadius: 4 }, 
                    { label: 'Non Plant PPA', data: [mtdData[1], lwData[1]], backgroundColor: '#93c5fd', borderRadius: 4 },
                    { label: 'Non PPA', data: [mtdData[2], lwData[2]], backgroundColor: '#fb923c', borderRadius: 4 }
                ]
            },
            options: {
                animation: false,
                indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom', labels: { font: { size: 12, weight: 'bold', family: "'Inter', sans-serif" }, usePointStyle: true, boxWidth: 10 } }, tooltip: { callbacks: { label: function(context) { return context.dataset.label + ': ' + context.parsed.x + '%'; } } } },
                scales: { x: { stacked: true, max: 100, ticks: { font: { size: 11, weight: 'bold' }, callback: function(value){return value+"%"} }, grid: { color: '#f1f5f9' } }, y: { stacked: true, ticks: { font: { size: 12, weight: 'bold' } }, grid: { display: false } } }
            }
        });

        let dataThisWeek = []; let dataLastWeek = []; let labels = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        for(let i=0; i<7; i++) {
            let dThis = new Date(sundayThisWeek); dThis.setDate(dThis.getDate() + i); let strThis = dThis.getFullYear() + '-' + String(dThis.getMonth()+1).padStart(2,'0') + '-' + String(dThis.getDate()).padStart(2,'0');
            let dLast = new Date(sundayThisWeek); dLast.setDate(dLast.getDate() - 7 + i); let strLast = dLast.getFullYear() + '-' + String(dLast.getMonth()+1).padStart(2,'0') + '-' + String(dLast.getDate()).padStart(2,'0');
            dataThisWeek.push(allJobs.filter(j => getJobOperationalDate(j) === strThis).length); dataLastWeek.push(allJobs.filter(j => getJobOperationalDate(j) === strLast).length);
        }

        if(window.dashLineChart) window.dashLineChart.destroy();
        const ctxLine = document.getElementById('lineChart').getContext('2d');
        window.dashLineChart = new Chart(ctxLine, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    { label: 'Minggu Ini', data: dataThisWeek, borderColor: '#0891b2', backgroundColor: 'rgba(8, 145, 178, 0.1)', tension: 0.4, fill: true, borderWidth: 2.5, pointBackgroundColor: '#fff', pointBorderColor: '#0891b2', pointBorderWidth: 2.5, pointRadius: 4 },
                    { label: 'Minggu Lalu', data: dataLastWeek, borderColor: '#94a3b8', borderDash: [5, 5], tension: 0.4, fill: false, borderWidth: 2, pointRadius: 0 }
                ]
            },
            options: {
                animation: false,
                responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
                plugins: { legend: { labels: { font: { size: 12, weight: 'bold', family: "'Inter', sans-serif" }, usePointStyle: true, boxWidth: 10 } } },
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 11, weight: 'bold' } }, grid: { color: '#f1f5f9' } }, x: { ticks: { font: { size: 11, weight: 'bold' } }, grid: { display: false } } }
            }
        });
        
        if(document.getElementById('schedChart')) {
            let schedCount = 0; let unschedCount = 0;
            filteredJobsRange.forEach(j => {
                let isUnscheduled = false;
                let reqDate = new Date(j.tgl_pelaksanaan + 'T00:00:00'); let createDate = new Date(j.timestamp); createDate.setHours(0,0,0,0);
                if (j.kategori === 'Big Crane') { if ((reqDate - createDate) / 86400000 < 3) isUnscheduled = true; } else {
                    if (j.jam_pelaksanaan) { let reqTime = new Date(j.tgl_pelaksanaan + 'T' + j.jam_pelaksanaan + ':00'); let createTime = new Date(j.timestamp); if ((reqTime - createTime) / 3600000 < 6) isUnscheduled = true; } 
                    else { if ((reqDate - createDate) / 86400000 < 1) isUnscheduled = true; }
                }
                if (j.status === 'UNSCHEDULED') isUnscheduled = true; else if (j.status === 'SCHEDULED') isUnscheduled = false;
                if (isUnscheduled) unschedCount++; else schedCount++;
            });

            if(window.dashSchedChart) window.dashSchedChart.destroy();
            const ctxSched = document.getElementById('schedChart').getContext('2d');
            window.dashSchedChart = new Chart(ctxSched, {
                type: 'bar',
                data: { labels: ['SCH', 'UNSCH'], datasets: [{ data: [schedCount, unschedCount], backgroundColor: ['#10b981', '#f43f5e'], borderRadius: 4 }] },
                options: { animation: false, indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 11, weight: 'bold' } }, grid: { color: '#f1f5f9' } }, y: { ticks: { font: { size: 12, weight: 'black' } }, grid: { display: false } } } }
            });
        }

        if(document.getElementById('riggerChart')) {
            let riggerStats = {};
            filteredJobsRange.forEach(j => {
                if (j.status !== 'COMPLETED' || !j.durasi_aktual) return;
                let hrs = parseFloat(j.durasi_aktual);
                [j.rigger, j.rigger2].forEach(r => {
                    if (!r || r === '-' || r === 'N/A') return;
                    if (!riggerStats[r]) riggerStats[r] = { total: 0, CT: 0, BC: 0, LB: 0 };
                    riggerStats[r].total += hrs;
                    if (j.kategori === 'Crane Truck') riggerStats[r].CT += hrs; else if (j.kategori === 'Big Crane') riggerStats[r].BC += hrs; else if (j.kategori === 'Lowboy') riggerStats[r].LB += hrs;
                });
            });

            let sortedRiggers = Object.entries(riggerStats).sort((a, b) => b[1].total - a[1].total);
            let rLabels = sortedRiggers.map(r => r[0]); let rDataCT = sortedRiggers.map(r => r[1].CT); let rDataBC = sortedRiggers.map(r => r[1].BC); let rDataLB = sortedRiggers.map(r => r[1].LB);

            // Sistem 20 Baris Skala Dinamis:
            // Nilai jam tertinggi dibagi 20 interval.
            // Contoh: Jika max 60 jam, step = 60 / 20 = 3 (skala: 0, 3, 6, ..., 60)
            // Jika max <= 20 jam, step = 1 (skala: 0, 1, 2, ..., 20)
            let maxRiggerTotal = (sortedRiggers.length > 0 && sortedRiggers[0][1].total) ? sortedRiggers[0][1].total : 0;
            let step = Math.max(1, Math.ceil(maxRiggerTotal / 20));
            let targetMaxY = step * 20;

            if(window.dashRiggerChart) window.dashRiggerChart.destroy();
            const ctxRigger = document.getElementById('riggerChart').getContext('2d');
            window.dashRiggerChart = new Chart(ctxRigger, {
                type: 'bar',
                data: { labels: rLabels, datasets: [{ label: 'Crane Truck', data: rDataCT, backgroundColor: '#0d9488' }, { label: 'Big Crane', data: rDataBC, backgroundColor: '#4ade80' }, { label: 'Lowboy', data: rDataLB, backgroundColor: '#a7f3d0' }] },
                options: { 
                    animation: false, 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    plugins: { 
                        legend: { 
                            position: 'bottom', 
                            labels: { 
                                font: { size: 12, weight: 'bold', family: "'Inter', sans-serif" }, 
                                usePointStyle: true, 
                                boxWidth: 10 
                            } 
                        } 
                    }, 
                    scales: { 
                        x: { 
                            stacked: true, 
                            ticks: { font: { size: 11, weight: 'bold' } }, 
                            grid: { display: false } 
                        }, 
                        y: { 
                            stacked: true, 
                            beginAtZero: true,
                            min: 0,
                            max: targetMaxY,
                            afterBuildTicks: function(axis) {
                                const ticks = [];
                                // Membentuk tepat 20 baris/interval dari 0 hingga targetMaxY
                                for (let val = 0; val <= targetMaxY; val += step) {
                                    ticks.push({ value: val, label: String(val) });
                                }
                                axis.ticks = ticks;
                            },
                            ticks: { 
                                autoSkip: false, // Menjamin seluruh 20 baris tampil presisi tanpa ada yang terlewati
                                stepSize: step,
                                font: { 
                                    size: 10,
                                    weight: 'bold' 
                                },
                                callback: function(value) {
                                    return value;
                                }
                            }, 
                            grid: { color: '#f1f5f9' } 
                        } 
                    } 
                }
            });
        }

        if(document.getElementById('companyDonutChart')) {
            let companyStats = {};
            filteredJobsRange.forEach(j => { 
                let p = (j.perusahaan || 'N/A').toUpperCase(); 
                if(!companyStats[p]) companyStats[p] = { count: 0, hours: 0 };
                companyStats[p].count += 1;
                if (j.status === 'COMPLETED' && j.durasi_aktual) companyStats[p].hours += parseFloat(j.durasi_aktual);
            });
            
            let cLabels = []; 
            let cDataCount = []; 
            let cBgColors = [];
            const cColors = { 'PPA': '#3b82f6', 'BIB': '#111827', 'UT': '#eab308', 'KME': '#f97316' };
            const fallbackColors = ['#10b981', '#8b5cf6', '#ec4899', '#06b6d4', '#0284c7'];
            
            let companyArray = Object.entries(companyStats).sort((a,b) => b[1].count - a[1].count); 
            let totalCompanyJobs = companyArray.reduce((sum, item) => sum + item[1].count, 0) || 1;

            // Pisahkan 6 perusahaan teratas dan sisanya menjadi entitas "Lainnya"
            let top6Companies = companyArray.slice(0, 6);
            let remainingCompanies = companyArray.slice(6);
            let finalCompanyList = [...top6Companies];

            if (remainingCompanies.length > 0) {
                let otherCount = remainingCompanies.reduce((sum, item) => sum + item[1].count, 0);
                let otherHours = remainingCompanies.reduce((sum, item) => sum + item[1].hours, 0);
                finalCompanyList.push(['Lainnya', { count: otherCount, hours: otherHours, isOther: true }]);
            }

            let idxColor = 0;
            let companyLegendHtml = '';

            finalCompanyList.forEach((item) => {
                let cName = item[0]; 
                let cObj = item[1]; 
                let pct = Math.round((cObj.count / totalCompanyJobs) * 100); 
                let color = cObj.isOther ? '#94a3b8' : (cColors[cName] || fallbackColors[idxColor % fallbackColors.length]);
                
                cLabels.push(cName); 
                cDataCount.push(cObj.count); 
                cBgColors.push(color);
                
                if (!cColors[cName] && !cObj.isOther) idxColor++;

                companyLegendHtml += `
                    <div class="grid grid-cols-12 text-xs sm:text-[13px] items-center py-1.5 border-b border-slate-100 hover:bg-slate-50/90 transition-colors">
                        <div class="col-span-4 flex items-center gap-2 truncate pr-1">
                            <div class="w-3.5 h-3.5 rounded-sm shrink-0" style="background-color: ${color}"></div>
                            <span class="font-black ${cObj.isOther ? 'text-slate-500 italic' : 'text-slate-800'} truncate" title="${cName}">${cName}</span>
                        </div>

    function downloadCSVBlob() {
        const currentUser = JSON.parse(localStorage.getItem('lifting_user'));
        let jobs = getOrders();

        if (currentUser && (currentUser.role === 'ADMIN' || currentUser.role === 'GL')) {
            const tglMulai = document.getElementById('filter_tgl_mulai') ? document.getElementById('filter_tgl_mulai').value : '';
            const tglSelesai = document.getElementById('filter_tgl_selesai') ? document.getElementById('filter_tgl_selesai').value : '';
            const filterShift = document.getElementById('filter_shift') ? document.getElementById('filter_shift').value : 'ALL';
            const filterKategori = document.getElementById('filter_admin_kategori') ? document.getElementById('filter_admin_kategori').value : 'ALL';

            // Filter tanggal mengacu pada Jadwal Pekerjaan / Planning (tgl_pelaksanaan)
            if (tglMulai && tglSelesai) {
                jobs = jobs.filter(j => {
                    const schedDate = getOrderScheduleDate(j);
                    return schedDate >= tglMulai && schedDate <= tglSelesai;
                });
            } else if (tglMulai) {
                jobs = jobs.filter(j => getOrderScheduleDate(j) >= tglMulai);
            } else if (tglSelesai) {
                jobs = jobs.filter(j => getOrderScheduleDate(j) <= tglSelesai);
            }

            if (filterShift !== 'ALL') {
                jobs = jobs.filter(j => getJobOperationalShift(j) === filterShift);
            }
            if (filterKategori !== 'ALL') {
                jobs = jobs.filter(j => j.kategori === filterKategori);
            }

            if (orderSearchQuery) {
                const q = orderSearchQuery.toLowerCase();
                jobs = jobs.filter(j => {
                    return (
                        (j.no_wo && j.no_wo.toLowerCase().includes(q)) ||
                        (j.nama_pemohon && j.nama_pemohon.toLowerCase().includes(q)) ||
                        (j.nrp_pemohon && j.nrp_pemohon.toLowerCase().includes(q)) ||
                        (j.perusahaan && j.perusahaan.toLowerCase().includes(q)) ||
                        (j.departemen && j.departemen.toLowerCase().includes(q)) ||
                        (j.section && j.section.toLowerCase().includes(q)) ||
                        (j.kategori && j.kategori.toLowerCase().includes(q)) ||
                        (j.unit && j.unit.toLowerCase().includes(q)) ||
                        (j.gl && j.gl.toLowerCase().includes(q)) ||
                        (j.operator && j.operator.toLowerCase().includes(q)) ||
                        (j.rigger && j.rigger.toLowerCase().includes(q)) ||
                        (j.rigger2 && j.rigger2.toLowerCase().includes(q)) ||
                        (j.lokasi_angkat && j.lokasi_angkat.toLowerCase().includes(q)) ||
                        (j.lokasi_tujuan && j.lokasi_tujuan.toLowerCase().includes(q)) ||
                        (j.deskripsi && j.deskripsi.toLowerCase().includes(q)) ||
                        (j.status && j.status.toLowerCase().includes(q))
                    );
                });
            }

            // Urutkan data sesuai kolom dan arah sort aktif di tabel jika ada
            if (sortColumn && sortDirection) {
                jobs.sort((a, b) => {
                    let valA = (a[sortColumn] || '').toString().toLowerCase(); 
                    let valB = (b[sortColumn] || '').toString().toLowerCase();
                    let comparison = valA.localeCompare(valB, undefined, {numeric: true});
                    if (comparison < 0) return sortDirection === 'asc' ? -1 : 1; 
                    if (comparison > 0) return sortDirection === 'asc' ? 1 : -1; 
                    return 0;
                });
            } else {
                jobs.sort((a, b) => new Date(b.timestamp || 0) - new Date(a.timestamp || 0));
            }
        }

        if (typeof XLSX !== 'undefined') {
            const excelData = jobs.map((j, index) => ({
                "No": index + 1,
                "No WO": j.no_wo || '',
                "Timestamp": formatLocalTimestamp(j.timestamp),
                "Kategori": j.kategori || '',
                "NRP Pemohon": j.nrp_pemohon || '',
                "Nama Pemohon": j.nama_pemohon || '',
                "Perusahaan": j.perusahaan || '',
                "Departemen": j.departemen || '',
                "Section": j.section || '',
                "No WA": j.no_wa || '',
                "Tgl Pelaksanaan": j.tgl_pelaksanaan || '',
                "Jam Pelaksanaan": j.jam_pelaksanaan || '',
                "Shift": j.shift || '',
                "Durasi Request": j.durasi_request || '',
                "Lokasi Asal": j.lokasi_angkat || '',
                "Lokasi Tujuan": j.lokasi_tujuan || '',
                "Deskripsi": j.deskripsi || '',
                "Status": j.status || '',
                "GL": j.gl || '',
                "Unit": j.unit || '',
                "Operator": j.operator || '',
                "Rigger 1": j.rigger || '',
                "Rigger 2": j.rigger2 || '',
                "Jam Start Aktual": j.jam_start_aktual || '',
                "Jam End Aktual": j.jam_end_aktual || '',
                "Durasi Aktual": j.durasi_aktual || '',
                "Final Inspeksi": j.final_inspeksi || '',
                "Kendala Lapangan": cleanKendalaText((j.alasan_telat || '') + ' ' + (j.alasan_overtime || ''))
            }));

            const ws = XLSX.utils.json_to_sheet(excelData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Data Orders");
            XLSX.writeFile(wb, `Data_Order_Lifting_${getShiftDateString()}.xlsx`);
            showToast("Data Excel berhasil diekspor!", "success");
        } else {
            showToast("Library SheetJS belum siap", "error");
        }
    }

            const link = document.createElement('a');

        document.getElementById('targetUnitName').value = unitName;

    function toggleUnitReasonField() {
        const status = document.getElementById('unitStatusSelect')?.value;
        const wrapper = document.getElementById('unitReasonWrapper');
        if (wrapper) {
            if (status === 'INACTIVE') {
                wrapper.classList.remove('hidden');
            } else {
                wrapper.classList.add('hidden');
            }

    async function submitUnitStatusChange(e) {
        e.preventDefault();
        const unitName = document.getElementById('targetUnitName').value;
        const status = document.getElementById('unitStatusSelect').value;
        const reason = document.getElementById('unitStatusReason').value.trim();

        if (status === 'INACTIVE' && !reason) {
            return showToast('Mohon isi keterangan alasan non-aktif!', 'error');
        }

        const submitBtn = e.target.querySelector('button[type="submit"]');
        const originalBtnHtml = submitBtn ? submitBtn.innerHTML : '';
        if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Menyimpan...';
        }

        try {
            const success = await saveUnitStatus(unitName, status, reason);
            if (success) {
                showToast(`Status unit ${unitName} berhasil tersimpan di Supabase!`, 'success');
            } else {
                showToast(`Gagal memperbarui ke Supabase. Periksa koneksi jaringan.`, 'error');
            }
        } catch(err) {
            console.error("Gagal simpan status unit:", err);
            showToast(`Gagal menyimpan ke Supabase: ${err.message || 'Error'}`, 'error');
        } finally {
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnHtml;
            }
            document.getElementById('unitStatusModal').classList.add('hidden');
            renderApp(true);
        }
    }

    function submitManpowerAction(e) {
        e.preventDefault();
        if (!currentActionWo) return;
        let job = getOrders().find(j => j.no_wo === currentActionWo);
        if (!job) return;

        let unitVal = document.getElementById('mp_unit')?.value || job.unit || '';
        let startTime = document.getElementById('mp_start_time').value;
        let endTime = document.getElementById('mp_end_time').value;
        let finalInsp = document.getElementById('mp_final_insp')?.value || '';
        let operatorVal = document.getElementById('mp_operator')?.value || '';
        let riggerVal = document.getElementById('mp_rigger')?.value || '';
        let rigger2Val = document.getElementById('mp_rigger2')?.value || '';
        let pendingReason = document.getElementById('mp_pending_reason')?.value.trim() || '';

        // Hitung durasi kerja aktual
        let [h1, m1] = startTime.split(':').map(Number);
        let [h2, m2] = endTime.split(':').map(Number);
        let actualMin = (h2 * 60 + m2) - (h1 * 60 + m1);
        if (actualMin < 0) actualMin += 1440; // Lintas tengah malam

        // Evaluasi toleransi waktu keterlambatan datang (> 15 menit)
        let telatMinutes = 0;
        if (job.jam_pelaksanaan && startTime) {
            let [th, tm] = job.jam_pelaksanaan.split(':').map(Number);
            let targetMin = th * 60 + tm;
            let startMin = h1 * 60 + m1;
            let diff = startMin - targetMin;
            if (diff < -720) diff += 1440;
            if (diff > 720) diff -= 1440;
            if (diff > 15) telatMinutes = diff;
        }

        // Evaluasi toleransi durasi pekerjaan overtime (> 15 menit)
        let overMinutes = 0;
        if (job.durasi_request) {
            let reqMin = 0;
            if (job.durasi_request.includes('HARI')) {
                let days = parseFloat(job.durasi_request) || 0;
                reqMin = days * 24 * 60;
            } else {
                let hours = parseFloat(job.durasi_request) || 0;
                reqMin = hours * 60;
            }
            if (reqMin > 0 && (actualMin - reqMin) > 15) {
                overMinutes = actualMin - reqMin;
            }
        }

        pendingActionData = {
            wo: currentActionWo,
            status: currentActionStatus,
            unit: unitVal,
            startTime: startTime,
            endTime: endTime,
            finalInsp: finalInsp,
            operator: operatorVal,
            rigger: riggerVal,
            rigger2: rigger2Val,
            pendingReason: pendingReason,
            actualMinutes: actualMin,
            telatMinutes: telatMinutes,
            overMinutes: overMinutes
        };

        // Jika terdapat toleransi waktu yang terlanggar, buka modal kendala
        if (telatMinutes > 0 || overMinutes > 0) {
            showKendalaModal(telatMinutes, overMinutes);
        } else {
            finalizeJobAction('', '');
        }
    }

        if (telatMin > 0) {

            telatHtml = `

    function submitKendalaAction(e) {
        e.preventDefault();
        const telatEl = document.getElementById('kendala_telat_text');
        const overEl = document.getElementById('kendala_over_text');

        let telatReason = telatEl ? telatEl.value.trim() : '';
        let overReason = overEl ? overEl.value.trim() : '';

        if (pendingActionData.telatMinutes > 0 && !telatReason) {
            return showToast('Mohon isi alasan telat datang!', 'error');
        }
        if (pendingActionData.overMinutes > 0 && !overReason) {
            return showToast('Mohon isi alasan over job!', 'error');
        }

        document.getElementById('kendalaModal').classList.add('hidden');
        finalizeJobAction(telatReason, overReason);
    }

    function finalizeJobAction(telatReason, overReason) {
        if (!pendingActionData) return;
        let jobs = getOrders();
        let idx = jobs.findIndex(j => j.no_wo === pendingActionData.wo);
        if (idx === -1) return;

        const durasiHours = (pendingActionData.actualMinutes / 60).toFixed(2);

        if (pendingActionData.unit) jobs[idx].unit = pendingActionData.unit;
        jobs[idx].jam_start_aktual = pendingActionData.startTime;
        jobs[idx].jam_end_aktual = pendingActionData.endTime;
        jobs[idx].durasi_aktual = durasiHours;
        jobs[idx].final_inspeksi = pendingActionData.finalInsp;
        jobs[idx].operator = pendingActionData.operator || jobs[idx].operator;
        jobs[idx].rigger = pendingActionData.rigger || jobs[idx].rigger;
        if (pendingActionData.rigger2) jobs[idx].rigger2 = pendingActionData.rigger2;

        if (telatReason) {
            const formattedTelat = formatDurationHM(pendingActionData.telatMinutes);
            jobs[idx].alasan_telat = `Telat (+${formattedTelat}): ${telatReason}`;
        }
        if (overReason) {
            const formattedOver = formatDurationHM(pendingActionData.overMinutes);
            jobs[idx].alasan_overtime = `Over (+${formattedOver}): ${overReason}`;
        }

        if (pendingActionData.status === 'PENDING') {
            // Mekanisme PENDING:
            // 1. Job saat ini diubah statusnya menjadi COMPLETED (pekerjaan shift ini resmi ditutup)
            jobs[idx].status = 'COMPLETED';
            if (pendingActionData.pendingReason) {
                jobs[idx].alasan_telat = (jobs[idx].alasan_telat ? jobs[idx].alasan_telat + ' | ' : '') + 'Dipending: ' + pendingActionData.pendingReason;
            }

            // Simpan salinan objek job lama sebelum array di-unshift agar indeks tidak bergeser
            const completedOldJob = { ...jobs[idx] };
            const originalWo = completedOldJob.no_wo;

            // 2. Tentukan nomor WO lanjutan dengan suffix -L1, -L2, dst.
            let baseWo = originalWo;
            let nextL = 1;
            const matchL = baseWo.match(/^(.*?)-L(\d+)$/i);
            if (matchL) {
                baseWo = matchL[1];
                nextL = parseInt(matchL[2], 10) + 1;
            }
            const newWo = `${baseWo}-L${nextL}`;

            // 3. Buat job lanjutan berstatus PENDING dengan GL kosong, unit, operator, dan rigger sebelumnya tetap terisi
            const rolloverJob = {
                ...completedOldJob,
                no_wo: newWo,
                timestamp: new Date().toISOString(),
                status: 'PENDING',
                gl: '', // GL dikosongkan agar diminta validasi ulang ke GL
                unit: pendingActionData.unit || completedOldJob.unit,
                operator: pendingActionData.operator || completedOldJob.operator,
                rigger: pendingActionData.rigger || completedOldJob.rigger,
                rigger2: pendingActionData.rigger2 || completedOldJob.rigger2 || '',
                jam_start_aktual: '',
                jam_end_aktual: '',
                durasi_aktual: '',
                final_inspeksi: '',
                alasan_telat: pendingActionData.pendingReason ? `Lanjutan pending dari ${originalWo}: ${pendingActionData.pendingReason}` : `Lanjutan pending dari ${originalWo}`,
                alasan_overtime: ''
            };

            // Masukkan tiket lanjutan ke daftar order lokal
            jobs.unshift(rolloverJob);
            saveOrders(jobs);

            // Kirim status COMPLETED job lama ke Supabase
            syncSingleOrderToSupabase(completedOldJob);
            // Kirim tiket lanjutan baru berstatus PENDING ke Supabase
            syncSingleOrderToSupabase(rolloverJob);

            showToast(`Job ${originalWo} selesai. Dibuat tiket lanjutan ${newWo} (Status: PENDING) untuk validasi GL.`);
        } else {
            jobs[idx].status = pendingActionData.status;
            saveOrders(jobs);

            // Sinkronkan status COMPLETED langsung ke Supabase
            syncSingleOrderToSupabase(jobs[idx]);

            showToast('Pekerjaan berhasil diselesaikan!');
        }

        // Otomatis salin laporan progres Manpower ke clipboard
        copyJobToWA(pendingActionData.wo, false);

        document.getElementById('mpActionModal').classList.add('hidden');
        pendingActionData = null;
        renderApp(true);
    }

    function confirmCancelJob(e) {
        if (e) e.preventDefault();
        if (!pendingCancelWo) return;
        const reason = document.getElementById('cancelReasonInput')?.value.trim();
        if (!reason) {
            return showToast('Mohon isi alasan pembatalan!', 'error');
        }
        const cancelUnit = document.getElementById('cancel_unit')?.value || '';
        const cancelOp = document.getElementById('cancel_operator')?.value || '';
        const cancelRig = document.getElementById('cancel_rigger')?.value || '';
        const cancelRig2 = document.getElementById('cancel_rigger2')?.value || '';

        let jobs = getOrders();
        let idx = jobs.findIndex(j => j.no_wo === pendingCancelWo);
        if (idx !== -1) {
            jobs[idx].status = 'CANCELED';
            if (cancelUnit) jobs[idx].unit = cancelUnit;
            if (cancelOp) jobs[idx].operator = cancelOp;
            if (cancelRig) jobs[idx].rigger = cancelRig;
            if (cancelRig2) jobs[idx].rigger2 = cancelRig2;

            jobs[idx].alasan_telat = (jobs[idx].alasan_telat ? jobs[idx].alasan_telat + ' | ' : '') + 'Batal: ' + reason;
            saveOrders(jobs);

            // Sinkronkan pembatalan job langsung ke Supabase
            syncSingleOrderToSupabase(jobs[idx]);

            showToast('Job ' + pendingCancelWo + ' berhasil dibatalkan');
            document.getElementById('cancelPromptModal').classList.add('hidden');
            renderApp(true);
        }
        pendingCancelWo = null;
    }
