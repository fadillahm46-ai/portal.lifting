    async function fetchFromSupabase(isManual = false) {
        if (!SUPABASE_KEY || SUPABASE_KEY.includes('PASTE_KUNCI')) return;
        try {
            const [resOrders, resSettings, resUsers, resMaster] = await Promise.all([
                fetch(`${SUPABASE_URL}/rest/v1/orders?select=*&order=timestamp.desc`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }),
                fetch(`${SUPABASE_URL}/rest/v1/settings?id=eq.1`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }),
                fetch(`${SUPABASE_URL}/rest/v1/users?select=*`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }),
                fetch(`${SUPABASE_URL}/rest/v1/master_data?id=eq.1`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } })
            ]);

            if (resOrders.ok) { const data = await resOrders.json(); if(Array.isArray(data)) localStorage.setItem('lifting_orders', JSON.stringify(data)); }
            if (resSettings.ok) { const data = await resSettings.json(); if(data && data.length > 0) localStorage.setItem('lifting_settings', JSON.stringify(data[0])); }
            if (resUsers.ok) { const data = await resUsers.json(); if(Array.isArray(data) && data.length > 0) localStorage.setItem('lifting_users', JSON.stringify(data)); }
            if (resMaster.ok) { const data = await resMaster.json(); if(data && data.length > 0) localStorage.setItem('lifting_master_data', JSON.stringify(data[0])); }
            
            if(isManual) { showToast("Data berhasil ditarik!", "success"); renderApp(false); }
        } catch(e) { console.warn("Gagal mengambil data:", e); }
    }

    function copyText(text, label) {
        const el = document.createElement('textarea');

        try { document.execCommand('copy'); showToast(label + ' disalin!'); } catch (err) { showToast('Gagal menyalin', 'error'); }
        document.body.removeChild(el);
    }

    // SMART COPY KE WA
    function copyJobToWA(wo) {
        let job = getOrders().find(j => j.no_wo === wo);
        if(!job) return;
        
        let currentUser = JSON.parse(localStorage.getItem('lifting_user'));
        let waText = '';
        
        // Emoticon cerdas berdasarkan status

        else if (job.status === 'PENDING') statusEmoji += ' ⏸️';
        else if (job.status === 'CANCELED') statusEmoji += ' ❌';
        
        // Format Pesanan (User / Detail Utuh)
        let userFormat = `*DETAIL PEKERJAAN LIFTING*\n*NO WO:* ${job.no_wo}\n*Order Unit:* ${job.kategori} ${job.unit ? '('+job.unit+')' : ''}\n*Status:* ${statusEmoji}\n*Pemohon:* ${job.nama_pemohon}\n*Perusahaan:* ${job.perusahaan}\n*Departemen:* ${job.departemen}\n*Section:* ${job.section}\n*Kontak WA:* ${job.no_wa}\n*Tanggal:* ${job.tgl_pelaksanaan} ${job.jam_pelaksanaan ? '| Jam: '+job.jam_pelaksanaan : ''}\n*Lokasi:* ${job.lokasi_angkat || '-'} ➔ ${job.lokasi_tujuan || '-'}\n*Deskripsi:* ${job.deskripsi}`;

        // Format Pelaporan (Manpower)
        let mpFormat = `*PELAPORAN PROGRES JOB LIFTING*\n*Status:* ${statusEmoji}\n\n*Nama Job:* ${job.deskripsi}\n*Jam Start:* ${job.jam_start_aktual || '-'}\n*Jam Finish:* ${job.jam_end_aktual || '-'}\n*No. Unit:* ${job.unit || '-'}\n*Nama Operator:* ${job.operator || '-'}\n*Nama Rigger:* ${job.rigger || '-'}${job.rigger2 ? ', ' + job.rigger2 : ''}\n\n*Final Inspeksi:* ${job.final_inspeksi || '-'}\n*Kendala:* ${job.alasan_telat ? 'Telat: ' + job.alasan_telat + ' ' : ''}${job.alasan_overtime ? 'Over: ' + job.alasan_overtime : ''}${(!job.alasan_telat && !job.alasan_overtime) ? '-' : ''}`;

        // Cek Role siapa yang menyalin
        if (currentUser && currentUser.role === 'USER') {
            waText = userFormat; // User selalu dapat format detail
        } else {
            if (job.status === 'SCHEDULED' || job.status === 'UNSCHEDULED') {
                waText = userFormat;
            } else {
                waText = mpFormat; // MP/GL dapat laporan eksekusi
            }
        }
        
        copyText(waText, 'Job WA');
    }

    function generateWO(kategori) {
        const date = new Date();
        const yyyy = date.getFullYear(); const mm = String(date.getMonth() + 1).padStart(2, '0'); const dd = String(date.getDate()).padStart(2, '0');
        let prefix = kategori === 'Big Crane' ? 'BC-' : (kategori === 'Lowboy' ? 'LB-' : 'CT-');
        const datePrefix = `${prefix}${yyyy}${mm}${dd}-`;
        
        let maxNumber = 0;
        getOrders().forEach(job => {
            if (job.no_wo && job.no_wo.startsWith(datePrefix)) {
                const parts = job.no_wo.split('-');
                if (parts.length >= 3) {
                    const num = parseInt(parts[2].split('-L')[0], 10);
                    if (!isNaN(num) && num > maxNumber) maxNumber = num;
                }
            }
        });
        return `${datePrefix}${maxNumber + 1}`;
    }

                            <label class="block text-[10px] font-bold text-slate-500 mb-1">Password</label>
                            <div class="relative">
                                <input type="password" id="regPwd" class="w-full border border-slate-300 rounded-lg px-2.5 py-1.5 pr-8 text-xs focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500" required>
                                <i id="toggleRegPwd" class="fa-regular fa-eye absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer pwd-toggle text-[10px]" onclick="togglePassword('regPwd', 'toggleRegPwd')"></i>

            <!-- 3. FORGOT PASSWORD FORM -->
            <div id="forgotPwdForm" class="bg-white w-full max-w-[320px] overflow-hidden rounded-2xl shadow-2xl hidden z-10 border border-slate-100">
                <div class="p-4 text-center relative border-b border-slate-200" style="${bgStyle}">
                    ${overlay}
                    <h2 class="text-sm font-bold text-white relative z-10 drop-shadow-md">Reset Password</h2>
                </div>

                            <button type="submit" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-2 rounded-lg text-xs transition-colors mt-2 shadow-md">Cek NRP</button>

                    <div id="step2Forgot" class="hidden">

                                <label class="block text-[11px] font-bold text-slate-500 mb-1.5">Password Baru</label>

                                    <input type="password" id="forgotPwd1" class="w-full border border-slate-300 rounded-lg px-3 py-2 pr-8 text-xs focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500" placeholder="Password Baru..." required>

                                <label class="block text-[11px] font-bold text-slate-500 mb-1.5">Konfirmasi Password Baru</label>

                                    <i id="toggleFPwd2" class="fa-regular fa-eye absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer pwd-toggle text-[10px]" onclick="togglePassword('forgotPwd2', 'toggleFPwd2')"></i>

                    <div class="mt-5 text-center text-[10px] text-slate-500">

                    <div class="w-16 h-16 rounded-full flex items-center justify-center text-3xl mb-3 text-white bg-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.5)]">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <h2 class="text-sm font-bold text-slate-800 mb-1">Berhasil!</h2>
                    <p class="text-[10px] text-slate-500" id="successRegMsg">Silakan masuk dengan akun Anda.</p>

    function toggleAuthMode(targetId) { 
        document.getElementById('authForm').classList.add('hidden'); 
        document.getElementById('signupForm').classList.add('hidden'); 
        document.getElementById('forgotPwdForm').classList.add('hidden'); 
        
        document.getElementById(targetId).classList.remove('hidden'); 

        if(targetId === 'forgotPwdForm') {
            document.getElementById('step1Forgot').classList.remove('hidden');
            document.getElementById('step2Forgot').classList.add('hidden');
            document.getElementById('forgotNrp').value = '';
        }
    }

    function handleLogin(e) {
        e.preventDefault();
        const nrp = document.getElementById('loginNrp').value.trim().toUpperCase(); const pwd = document.getElementById('loginPwd').value;
        const users = getUsers(); const user = users.find(u => (u.nrp || '').toUpperCase() === nrp && u.password_hash === pwd && u.status_akun === 'ACTIVE');
        const errorMsg = document.getElementById('loginErrorMsg');
        
        if (user) {
            localStorage.setItem('lifting_user', JSON.stringify(user));
            const homeTab = (user.role === 'ADMIN' || user.role === 'GL') ? 'dashboard' : (user.role === 'USER' ? 'order' : 'monitoring');
            currentTab = homeTab;
            window.location.hash = homeTab;
            userOrderFleetMode = null; mpFleetMode = null; renderApp(false);
        } else {
            errorMsg.innerHTML = '<i class="fa-solid fa-circle-exclamation mr-1"></i>NRP atau Password salah!'; errorMsg.classList.remove('hidden');
        }
    }

    function handleLogout() { 
        localStorage.removeItem('lifting_user'); 
        window.location.hash = ''; 
        renderApp(false); 
    }

    function handleSignup(e) {
        e.preventDefault();
        const users = getUsers(); const nrp = document.getElementById('regNrp').value.trim().toUpperCase();
        if (users.find(u => (u.nrp || '').toUpperCase() === nrp)) return showToast('NRP terdaftar!', 'error');

        const newUser = {
            nrp: nrp, 
            nama_lengkap: document.getElementById('regName').value.trim().toUpperCase(), 
            jabatan: document.getElementById('regJabatan').value.trim().toUpperCase(),
            perusahaan: document.getElementById('regPerusahaan').value, 
            departemen: document.getElementById('regDepartemen').value,
            section: document.getElementById('regSection').value, 
            no_wa: document.getElementById('regWa').value,
            password_hash: document.getElementById('regPwd').value, 
            role: 'USER', 
            status_akun: 'ACTIVE'
        };
        users.push(newUser); saveUsers(users); 
        
        document.getElementById('successRegMsg').innerText = "Silakan masuk dengan akun Anda.";
        const m = document.getElementById('successRegModal');
        m.classList.remove('hidden');
        
        setTimeout(() => {
            m.classList.add('hidden');
            toggleAuthMode('authForm');
            document.getElementById('loginNrp').value = nrp;
            document.getElementById('loginPwd').value = '';
        }, 1500);
    }

    function checkForgotNrp(e) {
        e.preventDefault();
        const nrp = document.getElementById('forgotNrp').value.trim().toUpperCase();
        const users = getUsers();
        const user = users.find(u => (u.nrp || '').toUpperCase() === nrp);
        if(user) {
            document.getElementById('step1Forgot').classList.add('hidden');
            document.getElementById('step2Forgot').classList.remove('hidden');
            document.getElementById('forgotTargetNrp').value = nrp;
        } else {
            showToast('NRP tidak ditemukan!', 'error');
        }
    }

    function submitNewPassword(e) {
        e.preventDefault();
        const nrp = document.getElementById('forgotTargetNrp').value;
        const p1 = document.getElementById('forgotPwd1').value;
        const p2 = document.getElementById('forgotPwd2').value;
        if(p1 !== p2) return showToast('Password tidak cocok!', 'error');

        let users = getUsers();
        let idx = users.findIndex(u => (u.nrp || '').toUpperCase() === nrp);
        if(idx !== -1) {
            users[idx].password_hash = p1;
            saveUsers(users); 
            
            // PATCH Eksklusif ke Supabase untuk keamanan Data Single User
            if (SUPABASE_KEY && !SUPABASE_KEY.includes('PASTE_KUNCI')) {
                fetch(`${SUPABASE_URL}/rest/v1/users?nrp=eq.${nrp}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
                    body: JSON.stringify({ password_hash: p1 })
                }).catch(err => console.warn(err));
            }

            document.getElementById('successRegMsg').innerText = "Password berhasil direset.";
            const m = document.getElementById('successRegModal');
            m.classList.remove('hidden');
            setTimeout(() => { m.classList.add('hidden'); toggleAuthMode('authForm'); document.getElementById('loginNrp').value = nrp; }, 1500);
        }
    }

    function openCustomConfirm(title, message, onConfirm) {
        document.getElementById('confirmTitle').innerText = title; document.getElementById('confirmMessage').innerText = message;
        document.getElementById('confirmButtons').innerHTML = `
            <button class="flex-1 bg-slate-100 text-slate-600 font-bold py-2 text-[10px] hover:bg-slate-200 transition-colors border-t border-slate-200" id="btnConfirmCancel">Batal</button>
            <button class="flex-1 bg-red-500 text-white font-bold py-2 text-[10px] hover:bg-red-600 transition-colors border-t border-red-500" id="btnConfirmOk">Ya, Lanjutkan</button>
        `;
        document.getElementById('globalConfirmModal').classList.remove('hidden');
        document.getElementById('btnConfirmCancel').onclick = () => { document.getElementById('globalConfirmModal').classList.add('hidden'); };
        document.getElementById('btnConfirmOk').onclick = () => { document.getElementById('globalConfirmModal').classList.add('hidden'); onConfirm(); };
    }

    function getDashboardView() {
        let jobs = getOrders();
        
        let today = getLocalDateString();
        let tglMulai = document.getElementById('dash_tgl_mulai') ? document.getElementById('dash_tgl_mulai').value : today;
        let tglSelesai = document.getElementById('dash_tgl_selesai') ? document.getElementById('dash_tgl_selesai').value : today;
        
        let dashShift = document.getElementById('dash_shift') ? document.getElementById('dash_shift').value : 'ALL';
        let dashUnit = document.getElementById('dash_unit') ? document.getElementById('dash_unit').value : 'ALL';

        let filteredJobs = jobs.filter(j => j.tgl_pelaksanaan >= tglMulai && j.tgl_pelaksanaan <= tglSelesai);
        if (dashShift !== 'ALL') filteredJobs = filteredJobs.filter(j => j.shift === dashShift);
        if (dashUnit !== 'ALL') filteredJobs = filteredJobs.filter(j => j.kategori === dashUnit);

        let cntOrder = filteredJobs.length;
        let cntProg = filteredJobs.filter(j => j.status === 'ON PROGRESS').length;
        let cntPend = filteredJobs.filter(j => j.status === 'PENDING').length; 
        let cntDone = filteredJobs.filter(j => j.status === 'COMPLETED').length;
        let cntCancel = filteredJobs.filter(j => j.status === 'CANCELED').length;

        let cntCT = filteredJobs.filter(j => j.kategori === 'Crane Truck').length; let cntBC = filteredJobs.filter(j => j.kategori === 'Big Crane').length; let cntLB = filteredJobs.filter(j => j.kategori === 'Lowboy').length;
        let totalUnits = cntCT + cntBC + cntLB || 1; 

        let pctCT = Math.round((cntCT / totalUnits) * 100) || 0; let pctBC = Math.round((cntBC / totalUnits) * 100) || 0; let pctLB = Math.round((cntLB / totalUnits) * 100) || 0;
        let degCT = (pctCT / 100) * 360; let degBC = degCT + ((pctBC / 100) * 360);
        let pieStyle = `background: conic-gradient(#0891b2 0deg ${degCT}deg, #6366f1 ${degCT}deg ${degBC}deg, #94a3b8 ${degBC}deg 360deg);`;

        function getTopData(field) { 
            let counts = {}; 
            filteredJobs.forEach(j => { 
                let val = j[field];
                if(val && val !== '-' && val !== 'N/A') counts[val] = (counts[val] || 0) + 1; 
            }); 
            return Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0, 5); 
        }
        
        let topDept = getTopData('departemen'); let topSection = getTopData('section');

        function renderBarList(data, colorClass) {
            if(data.length === 0) return `<div class="text-[9px] text-slate-400 italic mt-2">Data kosong</div>`;
            let maxVal = Math.max(...data.map(d=>d[1])) || 1;
            return data.map(d => `
                <div class="mb-1.5 mt-2">
                    <div class="flex justify-between text-[9px] mb-0.5"><span class="font-semibold text-slate-700 truncate mr-2">${d[0]}</span><span class="font-bold text-slate-500">${d[1]}</span></div>
                    <div class="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden"><div class="${colorClass} h-1.5 rounded-full chart-bar w-0" data-width="${(d[1]/maxVal)*100}%"></div></div>
                </div>
            `).join('');
        }

        return `
        <div class="max-w-6xl mx-auto space-y-3 relative z-10">
            <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-2">
                <h2 class="text-sm font-bold text-slate-800 shrink-0"><i class="fa-solid fa-chart-pie mr-1.5 text-cyan-600"></i>Dashboard Analytics</h2>
                
                <div class="flex items-center text-[10px] w-full lg:w-auto bg-white border border-slate-200 rounded-md p-1 shadow-sm flex-wrap gap-y-1 relative z-20">
                    <div class="flex items-center shrink-0 pr-1">
                        <i class="fa-regular fa-calendar mx-1 text-slate-400"></i>
                        <input type="date" id="dash_tgl_mulai" class="bg-transparent px-1 py-0.5 text-slate-700 focus:outline-none" value="${tglMulai}" onchange="renderApp(true)">
                        <span class="text-slate-400 mx-0.5">-</span>
                        <input type="date" id="dash_tgl_selesai" class="bg-transparent px-1 py-0.5 text-slate-700 focus:outline-none" value="${tglSelesai}" onchange="renderApp(true)">
                    </div>
                    
                    <div class="flex items-center border-l border-slate-200 pl-1">
                        <select id="dash_shift" class="bg-transparent text-slate-700 focus:outline-none cursor-pointer" onchange="renderApp(true)">
                            <option value="ALL" ${dashShift==='ALL'?'selected':''}>All Shift</option>
                            <option value="Shift 1" ${dashShift==='Shift 1'?'selected':''}>Shift 1</option>
                            <option value="Shift 2" ${dashShift==='Shift 2'?'selected':''}>Shift 2</option>
                        </select>
                    </div>
                    
                    <div class="flex items-center border-l border-slate-200 pl-1">
                        <select id="dash_unit" class="bg-transparent text-slate-700 focus:outline-none cursor-pointer" onchange="renderApp(true)">
                            <option value="ALL" ${dashUnit==='ALL'?'selected':''}>Semua Armada</option>
                            <option value="Crane Truck" ${dashUnit==='Crane Truck'?'selected':''}>Crane Truck</option>
                            <option value="Big Crane" ${dashUnit==='Big Crane'?'selected':''}>Big Crane</option>
                            <option value="Lowboy" ${dashUnit==='Lowboy'?'selected':''}>Lowboy</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 relative z-0">
                <div class="bg-white border border-slate-200 rounded-md p-3 text-center shadow-sm flex flex-col justify-center"><div class="text-[9px] font-bold text-slate-400 uppercase tracking-wider mb-1">Order</div><div class="text-xl font-bold text-slate-800">${cntOrder}</div></div>
                <div class="bg-blue-50 border border-blue-200 rounded-md p-3 text-center shadow-sm flex flex-col justify-center"><div class="text-[9px] font-bold text-blue-500 uppercase tracking-wider mb-1">Progres</div><div class="text-xl font-bold text-blue-700">${cntProg}</div></div>
                <div class="bg-orange-50 border border-orange-200 rounded-md p-3 text-center shadow-sm flex flex-col justify-center"><div class="text-[9px] font-bold text-orange-500 uppercase tracking-wider mb-1">Pending</div><div class="text-xl font-bold text-orange-600">${cntPend}</div></div>
                <div class="bg-emerald-50 border border-emerald-200 rounded-md p-3 text-center shadow-sm flex flex-col justify-center"><div class="text-[9px] font-bold text-emerald-500 uppercase tracking-wider mb-1">Selesai</div><div class="text-xl font-bold text-emerald-600">${cntDone}</div></div>
                <div class="bg-red-50 border border-red-200 rounded-md p-3 text-center shadow-sm flex flex-col justify-center col-span-2 sm:col-span-1"><div class="text-[9px] font-bold text-red-500 uppercase tracking-wider mb-1">Batal</div><div class="text-xl font-bold text-red-600">${cntCancel}</div></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div class="bg-white border border-slate-200 rounded-md p-3 shadow-sm flex items-center justify-between"><div class="flex items-center gap-2 text-slate-500"><i class="fa-solid fa-truck-moving text-base"></i><span class="text-[11px] font-bold">Crane Truck</span></div><div class="text-lg font-bold text-slate-800">${cntCT}</div></div>
                <div class="bg-white border border-slate-200 rounded-md p-3 shadow-sm flex items-center justify-between"><div class="flex items-center gap-2 text-slate-500"><i class="fa-solid fa-truck-ramp-box text-base"></i><span class="text-[11px] font-bold">Big Crane</span></div><div class="text-lg font-bold text-slate-800">${cntBC}</div></div>
                <div class="bg-white border border-slate-200 rounded-md p-3 shadow-sm flex items-center justify-between"><div class="flex items-center gap-2 text-slate-500"><i class="fa-solid fa-trailer text-base"></i><span class="text-[11px] font-bold">Lowboy</span></div><div class="text-lg font-bold text-slate-800">${cntLB}</div></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 mt-3">
                <div class="bg-white border border-slate-200 rounded-md p-3 shadow-sm flex flex-col">
                    <h3 class="text-[10px] font-bold text-slate-600 mb-2">Weekly Trend Order (vs Minggu Lalu)</h3>
                    <div class="relative h-48 w-full"><canvas id="lineChart"></canvas></div>
                </div>
                <div class="bg-white border border-slate-200 rounded-md p-3 shadow-sm flex flex-col">
                    <h3 class="text-[10px] font-bold text-slate-600 mb-2 uppercase">Departement order</h3>
                    <div class="relative h-48 w-full"><canvas id="deptOrderChart"></canvas></div>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mt-3">
                <div class="bg-white border border-slate-200 rounded-md p-3 shadow-sm flex flex-col items-center justify-center lg:col-span-1 order-last lg:order-none">
                    <h3 class="text-[10px] font-bold text-slate-600 mb-3 w-full text-left">Distribusi Unit</h3>
                    ${totalUnits > 1 ? `

    function initDashboardCharts() {
        if(!document.getElementById('lineChart') || !document.getElementById('deptOrderChart') || typeof Chart === 'undefined') return;
        
        let allJobs = getOrders();
        
        let dashTglMulai = document.getElementById('dash_tgl_mulai').value || getLocalDateString();
        let dashTglSelesai = document.getElementById('dash_tgl_selesai').value || getLocalDateString();
        let dashShift = document.getElementById('dash_shift').value;
        let dashUnit = document.getElementById('dash_unit').value;

        // Apply Shift & Unit for charts globally
        if (dashShift !== 'ALL') allJobs = allJobs.filter(j => j.shift === dashShift);
        if (dashUnit !== 'ALL') allJobs = allJobs.filter(j => j.kategori === dashUnit);

        let filteredJobsRange = allJobs.filter(j => j.tgl_pelaksanaan >= dashTglMulai && j.tgl_pelaksanaan <= dashTglSelesai);

        // --- DEPARTEMENT ORDER (HORIZONTAL STACKED BAR) ---
        let refDate = new Date(dashTglMulai);
        let mtdStartStr = refDate.getFullYear() + '-' + String(refDate.getMonth()+1).padStart(2,'0') + '-01';
        let mtdJobs = allJobs.filter(j => j.tgl_pelaksanaan >= mtdStartStr && j.tgl_pelaksanaan <= dashTglSelesai);
        
        let sundayThisWeek = new Date(refDate); sundayThisWeek.setDate(refDate.getDate() - refDate.getDay());
        let lastWeekSun = new Date(sundayThisWeek); lastWeekSun.setDate(lastWeekSun.getDate() - 7);
        let lastWeekSat = new Date(sundayThisWeek); lastWeekSat.setDate(lastWeekSat.getDate() - 1);
        
        let lwStartStr = lastWeekSun.getFullYear() + '-' + String(lastWeekSun.getMonth()+1).padStart(2,'0') + '-' + String(lastWeekSun.getDate()).padStart(2,'0');
        let lwEndStr = lastWeekSat.getFullYear() + '-' + String(lastWeekSat.getMonth()+1).padStart(2,'0') + '-' + String(lastWeekSat.getDate()).padStart(2,'0');
        let lwJobs = allJobs.filter(j => j.tgl_pelaksanaan >= lwStartStr && j.tgl_pelaksanaan <= lwEndStr);

        function calcDeptCats(jobArray) {
            let ppaPlant=0, ppaNonPlant=0, nonPpa=0;
            jobArray.forEach(j => {
                let p = (j.perusahaan||'').toUpperCase(); let d = (j.departemen||'').toUpperCase();
                if(p.includes('PPA')) { if(d === 'PLANT') ppaPlant++; else ppaNonPlant++; } 
                else { nonPpa++; }
            });
            let total = ppaPlant + ppaNonPlant + nonPpa;
            if(total === 0) return [0,0,0];
            return [ (ppaPlant/total*100).toFixed(1), (ppaNonPlant/total*100).toFixed(1), (nonPpa/total*100).toFixed(1) ];
        }

        let mtdData = calcDeptCats(mtdJobs);
        let lwData = calcDeptCats(lwJobs);

        if(window.dashDeptChart) window.dashDeptChart.destroy();
        const ctxDept = document.getElementById('deptOrderChart').getContext('2d');
        window.dashDeptChart = new Chart(ctxDept, {
            type: 'bar',
            data: {
                labels: ['MTD', 'Last Week'],
                datasets: [
                    { label: 'Plant PPA', data: [mtdData[0], lwData[0]], backgroundColor: '#3b82f6', borderRadius: 4 }, 
                    { label: 'Non Plant PPA', data: [mtdData[1], lwData[1]], backgroundColor: '#93c5fd', borderRadius: 4 },
                    { label: 'Non PPA', data: [mtdData[2], lwData[2]], backgroundColor: '#fb923c', borderRadius: 4 }
                ]
            },
            options: {
                indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom', labels: { font: { size: 9, family: "'Inter', sans-serif" }, usePointStyle: true, boxWidth: 8 } }, tooltip: { callbacks: { label: function(context) { return context.dataset.label + ': ' + context.parsed.x + '%'; } } } },
                scales: { x: { stacked: true, max: 100, ticks: { font: { size: 9 }, callback: function(value){return value+"%"} }, grid: { color: '#f1f5f9' } }, y: { stacked: true, ticks: { font: { size: 10, weight: 'bold' } }, grid: { display: false } } }
            }
        });

        // --- LINE CHART LOGIC (Minggu -> Sabtu) ---
        let dataThisWeek = [];
        let dataLastWeek = [];
        let labels = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

        for(let i=0; i<7; i++) {
            let dThis = new Date(sundayThisWeek); dThis.setDate(dThis.getDate() + i);
            let dLast = new Date(sundayThisWeek); dLast.setDate(dLast.getDate() - 7 + i);

            let strThis = dThis.getFullYear() + '-' + String(dThis.getMonth()+1).padStart(2,'0') + '-' + String(dThis.getDate()).padStart(2,'0');
            let strLast = dLast.getFullYear() + '-' + String(dLast.getMonth()+1).padStart(2,'0') + '-' + String(dLast.getDate()).padStart(2,'0');

            dataThisWeek.push(allJobs.filter(j => j.tgl_pelaksanaan === strThis).length);
            dataLastWeek.push(allJobs.filter(j => j.tgl_pelaksanaan === strLast).length);
        }

        if(window.dashLineChart) window.dashLineChart.destroy();
        const ctxLine = document.getElementById('lineChart').getContext('2d');
        window.dashLineChart = new Chart(ctxLine, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Minggu Ini',
                        data: dataThisWeek,
                        borderColor: '#0891b2',
                        backgroundColor: 'rgba(8, 145, 178, 0.1)',
                        tension: 0.4,
                        fill: true,
                        borderWidth: 2,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#0891b2',
                        pointBorderWidth: 2
                    },
                    {
                        label: 'Minggu Lalu',
                        data: dataLastWeek,
                        borderColor: '#94a3b8',
                        borderDash: [5, 5],
                        tension: 0.4,
                        fill: false,
                        borderWidth: 2,
                        pointRadius: 0
                    }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: { legend: { labels: { font: { size: 10, family: "'Inter', sans-serif" }, usePointStyle: true, boxWidth: 8 } } },
                scales: { 
                    y: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 9 } }, grid: { color: '#f1f5f9' } },
                    x: { ticks: { font: { size: 9 } }, grid: { display: false } }
                }
            }
        });

        // --- RIGGER VERTICAL STACKED BAR CHART ---
        if(document.getElementById('riggerChart')) {
            let riggerStats = {};
            filteredJobsRange.forEach(j => {
                if (j.status !== 'COMPLETED' || !j.durasi_aktual) return;
                let hrs = parseFloat(j.durasi_aktual);
                [j.rigger, j.rigger2].forEach(r => {
                    if (!r || r === '-' || r === 'N/A') return;
                    if (!riggerStats[r]) riggerStats[r] = { total: 0, CT: 0, BC: 0, LB: 0 };
                    riggerStats[r].total += hrs;
                    if (j.kategori === 'Crane Truck') riggerStats[r].CT += hrs;
                    else if (j.kategori === 'Big Crane') riggerStats[r].BC += hrs;
                    else if (j.kategori === 'Lowboy') riggerStats[r].LB += hrs;
                });
            });

            let sortedRiggers = Object.entries(riggerStats).sort((a, b) => b[1].total - a[1].total);
            let rLabels = sortedRiggers.map(r => r[0]);
            let rDataCT = sortedRiggers.map(r => r[1].CT);
            let rDataBC = sortedRiggers.map(r => r[1].BC);
            let rDataLB = sortedRiggers.map(r => r[1].LB);

            if(window.dashRiggerChart) window.dashRiggerChart.destroy();
            const ctxRigger = document.getElementById('riggerChart').getContext('2d');
            window.dashRiggerChart = new Chart(ctxRigger, {
                type: 'bar',
                data: {
                    labels: rLabels,
                    datasets: [
                        { label: 'Crane Truck', data: rDataCT, backgroundColor: '#ef4444' }, // Merah
                        { label: 'Big Crane', data: rDataBC, backgroundColor: '#f97316' },   // Orange
                        { label: 'Lowboy', data: rDataLB, backgroundColor: '#92400e' }       // Coklat
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { font: { size: 9, family: "'Inter', sans-serif" }, usePointStyle: true, boxWidth: 8 } } },
                    scales: { x: { stacked: true, ticks: { font: { size: 9 } }, grid: { display: false } }, y: { stacked: true, ticks: { font: { size: 9 } }, grid: { color: '#f1f5f9' } } }
                }
            });
        }

        // --- DATA PERUSAHAAN (DONUT CHART & LEGEND) ---
        if(document.getElementById('companyDonutChart')) {
            let companyStats = {};
            filteredJobsRange.forEach(j => { 
                let p = (j.perusahaan || 'N/A').toUpperCase(); 
                if(!companyStats[p]) companyStats[p] = { count: 0, hours: 0 };
                companyStats[p].count += 1;
                if (j.status === 'COMPLETED' && j.durasi_aktual) companyStats[p].hours += parseFloat(j.durasi_aktual);
            });
            
            let cLabels = []; let cDataCount = []; let cBgColors = [];
            const cColors = { 'PPA': '#3b82f6', 'BIB': '#111827', 'UT': '#eab308', 'KME': '#f97316' };
            const fallbackColors = ['#10b981', '#8b5cf6', '#ec4899', '#06b6d4', '#64748b'];
            
            let idxColor = 0;
            let companyArray = Object.entries(companyStats).sort((a,b)=>b[1].count - a[1].count);
            let totalCompanyJobs = companyArray.reduce((sum, item) => sum + item[1].count, 0) || 1;

            let companyLegendHtml = '';
            companyArray.forEach((item) => {
                let cName = item[0]; let cObj = item[1];
                let pct = Math.round((cObj.count / totalCompanyJobs) * 100);
                let color = cColors[cName] || fallbackColors[idxColor % fallbackColors.length];
                
                cLabels.push(cName); cDataCount.push(cObj.count); cBgColors.push(color);
                if(!cColors[cName]) idxColor++;

                companyLegendHtml += `
                <div class="flex items-center justify-between text-[10px] mb-1.5">
                    <div class="flex items-center gap-2 w-1/2 truncate"><div class="w-2.5 h-2.5 rounded-sm shrink-0" style="background-color: ${color}"></div><span class="font-semibold text-slate-700 truncate" title="${cName}">${cName}</span></div>
                    <div class="w-1/4 text-slate-500 text-center">${pct}%</div>
                    <div class="w-1/4 font-semibold text-slate-600 text-right whitespace-nowrap">${cObj.hours.toFixed(1)}J | ${cObj.count}</div>
                </div>`;
            });

            if(!companyLegendHtml) companyLegendHtml = '<div class="text-[9px] text-slate-400 italic">Data kosong</div>';
            document.getElementById('legendCompanyContainer').innerHTML = companyLegendHtml;

            if(window.dashCompanyDonut) window.dashCompanyDonut.destroy();
            const ctxDonut = document.getElementById('companyDonutChart').getContext('2d');
            window.dashCompanyDonut = new Chart(ctxDonut, {
                type: 'doughnut',
                data: { labels: cLabels, datasets: [{ data: cDataCount, backgroundColor: cBgColors, borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, cutout: '65%', plugins: { legend: { display: false } } }
            });
        }
    }

            if (filterKategori !== 'ALL') jobs = jobs.filter(j => j.kategori === filterKategori);

            jobs.sort((a, b) => {
                let valA = (a[sortColumn] || '').toString().toLowerCase(); 
                let valB = (b[sortColumn] || '').toString().toLowerCase();
                let comparison = valA.localeCompare(valB, undefined, {numeric: true});
                if (comparison < 0) return sortDirection === 'asc' ? -1 : 1; 
                if (comparison > 0) return sortDirection === 'asc' ? 1 : -1; 
                return 0;

                   let aNeed = (a.status === 'SCHEDULED' || a.status === 'UNSCHEDULED' || (a.status === 'PENDING' && !a.operator)) ? 1 : 0;

                                    : `<button onclick="openAdminEditJob('${job.no_wo}')" class="bg-blue-50 hover:bg-blue-100 text-blue-600 border border-blue-200 text-[10px] px-2 py-1 rounded-sm shadow-sm w-full md:w-auto flex justify-center items-center gap-1 font-bold" title="Edit Job"><i class="fa-solid fa-pen"></i> <span class="hidden md:inline">Edit</span></button>`;

                                        <div class="text-[8px] md:text-[9px] text-slate-500 truncate max-w-[60px] md:max-w-[90px] leading-tight" title="${job.perusahaan} - ${job.departemen}">${job.departemen}</div>

                                    <td class="px-2 py-1.5 align-top hidden md:table-cell">
                                        <div class="font-bold text-slate-700 text-[10px]">${job.tgl_pelaksanaan}</div>

                                    </td>
                                    <td class="px-2 py-1.5 align-top">
                                        ${job.kategori !== 'Big Crane' ? `<div class="text-[9px] md:text-[10px] text-orange-600 font-semibold flex items-start gap-1 mb-0.5 leading-tight"><i class="fa-solid fa-location-dot mt-0.5"></i> <span>${job.lokasi_angkat || '-'} <i class="fa-solid fa-arrow-right text-[7px] mx-0.5 text-slate-400"></i> ${job.lokasi_tujuan || '-'}</span></div>` : ''}

                                    </td>
                                    <td class="px-2 py-1.5 text-center align-top hidden md:table-cell">
                                        <span class="${statusColor} border text-[9px] px-1.5 py-0.5 rounded-sm font-semibold whitespace-nowrap inline-block">${job.status}</span>
                                    </td>
                                    <td class="px-2 py-1.5 text-[9px] align-top text-slate-600 leading-tight hidden md:table-cell">
                                        <div class="flex flex-col gap-0.5">
                                            <div><span class="text-slate-400">GL:</span> <span class="font-semibold text-slate-800">${job.gl || '-'}</span></div>
                                            <div><span class="text-slate-400">Unit:</span> <span class="font-semibold text-slate-800">${job.unit || '-'}</span></div>
                                            <div><span class="text-slate-400">OP:</span> <span class="font-semibold text-slate-800">${job.operator || '-'}</span></div>
                                            <div><span class="text-slate-400">Rg:</span> <span class="font-semibold text-slate-800">${job.rigger || '-'}${job.rigger2 ? ', ' + job.rigger2 : ''}</span></div>

                                    </td>

                                        ${job.durasi_aktual ? job.durasi_aktual + ' J' : '-'}
                                    </td>
                                    <td class="px-2 py-1.5 align-top hidden md:table-cell">
                                        <div class="flex flex-col">${kendalaHtml}</div>
                                    </td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            </div>`;
            return html;
        }

        jobs = jobs.filter(j => j.nrp_pemohon === currentUser.nrp);
        let filterCat = document.getElementById('filter_kategori') ? document.getElementById('filter_kategori').value : 'ALL';
        if (filterCat !== 'ALL') jobs = jobs.filter(j => j.kategori === filterCat);
        
        let html = `<h2 class="text-sm font-bold text-slate-800 mb-2"><i class="fa-solid fa-list-check mr-1.5 text-cyan-600"></i>Data Order Pekerjaan</h2>`;

        if (jobs.length === 0) {
            html += `<div class="bg-white rounded-md p-6 text-center border border-slate-200 shadow-sm"><i class="fa-solid fa-folder-open text-3xl text-slate-300 mb-2"></i><p class="text-slate-400 text-xs">Belum ada data.</p></div>`;
            return html;
        }

        jobs.forEach(job => {
            let statusColor = job.status === 'COMPLETED' ? 'bg-emerald-50 text-emerald-600 border-emerald-200' :
                              (job.status === 'ON PROGRESS' ? 'bg-blue-50 text-blue-600 border-blue-200' :
                              (job.status === 'PENDING' ? 'bg-orange-50 text-orange-600 border-orange-200' :
                              (job.status === 'CANCELED' ? 'bg-red-50 text-red-600 border-red-200' : 'bg-slate-50 text-slate-600 border-slate-200')));

            html += `
            <div class="bg-white rounded-md p-2.5 mb-2 border border-slate-200 shadow-sm relative text-[11px] cursor-pointer hover:shadow-md transition-shadow relative z-10" onclick="viewJobDetail('${job.no_wo}')">

                <div class="text-[9px] text-cyan-600 font-mono font-bold mb-1 hover:underline">${job.no_wo}</div>
                <div class="flex items-center gap-1.5 mb-1.5">
                    <span class="font-bold text-slate-800 text-xs">${job.kategori}</span>
                    <span class="text-slate-300">|</span>
                    <span class="text-slate-500 text-[10px]">${job.tgl_pelaksanaan} ${job.jam_pelaksanaan || ''}</span>
                </div>

                <div class="bg-slate-50 rounded-sm border border-slate-100 p-1.5 grid grid-cols-3 gap-1.5 mb-1.5 text-[10px]">
                    <div><div class="text-slate-400 text-[9px]">Durasi Req</div><div class="font-bold text-slate-700">${job.durasi_request}</div></div>
                    <div><div class="text-slate-400 text-[9px]">Lokasi</div><div class="font-medium text-slate-600 truncate">${job.lokasi_angkat || '-'} <i class="fa-solid fa-arrow-right text-[8px] text-slate-400 mx-0.5"></i> ${job.lokasi_tujuan || '-'}</div></div>
                    <div><div class="text-slate-400 text-[9px]">Unit</div><div class="font-bold text-cyan-600">${job.unit || 'Belum ada'}</div></div>
                </div>
                
                <div class="text-[10px] text-slate-500 mb-2 pl-1 border-l-2 border-slate-300 truncate">${job.deskripsi}</div>

                <div class="pt-1.5 border-t border-slate-100 flex items-center justify-between">
                    <div class="text-[9px] text-slate-400"><i class="fa-solid fa-user-circle mr-1"></i>${job.nama_pemohon}</div>
                    <div class="text-cyan-600 text-[9px] font-semibold">Klik untuk Detail</div>
                </div>
            </div>`;
        });
        return html;
    }

    function openAdminEditJob(wo) {

        const currentUser = JSON.parse(localStorage.getItem('lifting_user'));
        
        const m = getMasterData();
        let unitOptions = '';
        if (job.kategori === 'Crane Truck') unitOptions = (m.unit_ct || []).map(u => `<option value="${u}" ${job.unit===u?'selected':''}>${u}</option>`).join('');
        else if (job.kategori === 'Big Crane') unitOptions = (m.unit_big_crane || []).map(u => `<option value="${u}" ${job.unit===u?'selected':''}>${u}</option>`).join('');
        else unitOptions = (m.unit_lowboy || []).map(u => `<option value="${u}" ${job.unit===u?'selected':''}>${u}</option>`).join('');

        const glOptions = (m.gl || []).map(g => `<option value="${g}" ${job.gl===g?'selected':''}>${g}</option>`).join('');

        const rigOptions1 = (m.rigger || []).map(r => `<option value="${r}" ${job.rigger===r?'selected':''}>${r}</option>`).join('');

                    <div><label class="block text-[10px] font-bold text-slate-500 mb-0.5">Selesai Aktual</label><input type="time" id="edit_end" value="${job.jam_end_aktual || ''}" class="w-full border border-slate-300 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-cyan-500"></div>
                    <div><label class="block text-[10px] font-bold text-slate-500 mb-0.5">Durasi (Jam)</label><input type="number" step="0.01" id="edit_durasi_aktual" value="${job.durasi_aktual || ''}" class="w-full border border-slate-300 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-cyan-500"></div>
                </div>

                    <div><label class="block text-[10px] font-bold text-red-500 mb-0.5">Alasan Telat</label><textarea id="edit_alasan_telat" class="w-full border border-red-300 bg-red-50 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-red-500 h-10">${job.alasan_telat || ''}</textarea></div>
                    <div><label class="block text-[10px] font-bold text-red-500 mb-0.5">Alasan Overtime</label><textarea id="edit_alasan_overtime" class="w-full border border-red-300 bg-red-50 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-red-500 h-10">${job.alasan_overtime || ''}</textarea></div>

    function saveAdminEditJob(e, wo) {
        e.preventDefault();
        let jobs = getOrders();
        let idx = jobs.findIndex(j => j.no_wo === wo && j.status !== 'CANCELED');
        if(idx === -1) return;

        jobs[idx].tgl_pelaksanaan = document.getElementById('edit_tgl').value;
        jobs[idx].jam_pelaksanaan = document.getElementById('edit_jam').value;
        if(jobs[idx].kategori === 'Crane Truck' && jobs[idx].jam_pelaksanaan) {
            let h = parseInt(jobs[idx].jam_pelaksanaan.split(':')[0]);
            jobs[idx].shift = (h >= 5 && h < 17) ? 'Shift 1' : 'Shift 2';
        }
        
        if (jobs[idx].kategori !== 'Big Crane') {
            jobs[idx].lokasi_angkat = document.getElementById('edit_lok_asal').value;
            jobs[idx].lokasi_tujuan = document.getElementById('edit_lok_tujuan').value;
        }
        jobs[idx].deskripsi = document.getElementById('edit_deskripsi').value;
        
        const selectedGL = document.getElementById('edit_gl').value;
        const selectedUnit = document.getElementById('edit_unit').value;
        const op = document.getElementById('edit_op').value;
        const rig = document.getElementById('edit_rig').value;
        const rig2 = document.getElementById('edit_rig2') ? document.getElementById('edit_rig2').value : '';
        
        jobs[idx].gl = selectedGL;
        jobs[idx].unit = selectedUnit;
        jobs[idx].operator = op;
        jobs[idx].rigger = rig;
        jobs[idx].rigger2 = rig2;

        if (jobs[idx].status === 'COMPLETED') {
            jobs[idx].jam_start_aktual = document.getElementById('edit_start').value;
            jobs[idx].jam_end_aktual = document.getElementById('edit_end').value;
            jobs[idx].durasi_aktual = document.getElementById('edit_durasi_aktual').value;
            jobs[idx].final_inspeksi = document.getElementById('edit_inspeksi').value;
            jobs[idx].alasan_telat = document.getElementById('edit_alasan_telat').value;
            jobs[idx].alasan_overtime = document.getElementById('edit_alasan_overtime').value;
        }

        let isValidated = false;
        if (jobs[idx].kategori === 'Big Crane') {
            isValidated = (selectedGL && selectedUnit && op && rig && rig2);
        } else if (jobs[idx].kategori === 'Lowboy') {
            isValidated = (selectedGL && selectedUnit && op && rig);
        } else {
            isValidated = (selectedGL && selectedUnit);
        }

        if (isValidated && (jobs[idx].status === 'SCHEDULED' || jobs[idx].status === 'UNSCHEDULED' || jobs[idx].status === 'PENDING')) {
            jobs[idx].status = 'ON PROGRESS';
            showToast('Job divalidasi!');
        } else {
            showToast('Perubahan Disimpan!');
        }

        saveOrders(jobs);
        document.getElementById('editJobModal').classList.add('hidden');
        renderApp(true); 
    }

    async function submitOrder(e) {
        e.preventDefault();
        const btnSubmit = document.getElementById('btnSubmitOrder'); 
        btnSubmit.disabled = true; 
        btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Memproses...';
        
        const user = JSON.parse(localStorage.getItem('lifting_user')); 
        const cat = userOrderFleetMode; 
        const isAdminGL = user.role === 'ADMIN' || user.role === 'GL';
        
        let tgl = document.getElementById('req_tgl')?.value || ''; 
        let jam = document.getElementById('req_jam')?.value || ''; 
        let statusTag = 'SCHEDULED';
        let shiftVal = '-';

        if (tgl) {
            let reqDate = new Date(`${tgl}T00:00:00`); 
            let now = new Date(); 
            now.setHours(0,0,0,0); 
            let diffDays = (reqDate - now) / (1000 * 60 * 60 * 24);
            
            if (cat === 'Big Crane') { 
                if (diffDays < 3) statusTag = 'UNSCHEDULED'; 
            } else if (cat === 'Crane Truck' && jam) { 
                let reqTime = new Date(`${tgl}T${jam}:00`); 
                let diffHours = (reqTime - new Date()) / (1000 * 60 * 60); 
                if (diffHours < 6) statusTag = 'UNSCHEDULED'; 
                
                let h = parseInt(jam.split(':')[0]);
                shiftVal = (h >= 5 && h < 17) ? 'Shift 1' : 'Shift 2';
            }
        }

        let durasiVal = document.getElementById('req_durasi')?.value || ''; 
        let satuan = document.getElementById('req_satuan')?.value || 'JAM';
        
        const baseOrder = {
            no_wo: generateWO(cat), 
            timestamp: new Date().toISOString(), 
            kategori: cat, 
            nrp_pemohon: user.nrp, 
            nama_pemohon: isAdminGL ? document.getElementById('del_nama').value : user.nama_lengkap, 
            perusahaan: isAdminGL ? document.getElementById('del_vendor').value : user.perusahaan, 
            departemen: isAdminGL ? document.getElementById('del_dept').value : user.departemen, 
            section: isAdminGL ? (document.getElementById('del_sect')?.value || user.section) : user.section,
            no_wa: isAdminGL ? document.getElementById('del_wa').value : user.no_wa,
            tgl_pelaksanaan: tgl, 
            jam_pelaksanaan: jam, 
            shift: shiftVal, 
            durasi_request: `${durasiVal} ${satuan}`,
            lokasi_angkat: document.getElementById('req_lok_asal')?.value || '', 
            lokasi_tujuan: document.getElementById('req_lok_tujuan')?.value || '', 
            deskripsi: document.getElementById('req_deskripsi')?.value || '',
            status: statusTag, 
            foto_evidence: '', 
            gl: '', unit: '', operator: '', rigger: '', rigger2: '', jam_start_aktual: '', jam_end_aktual: '', durasi_aktual: '', final_inspeksi: '', alasan_telat: '', alasan_overtime: ''
        };

        const fotoInput = document.getElementById('req_foto');
        if (fotoInput && fotoInput.files.length > 0) {
            const file = fotoInput.files[0]; 
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = async function() {
                    const canvas = document.createElement('canvas'); 
                    const MAX_WIDTH = 800; 
                    const MAX_HEIGHT = 800; 
                    let width = img.width; 
                    let height = img.height;
                    
                    if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } } 
                    else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
                    
                    canvas.width = width; canvas.height = height; 
                    const ctx = canvas.getContext('2d'); 
                    ctx.drawImage(img, 0, 0, width, height);
                    let compressedBase64 = canvas.toDataURL('image/jpeg', 0.6);

                    if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL.startsWith('http')) {
                        try {
                            let base64Data = compressedBase64.split(',')[1];
                            let response = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fileName: `Bukti_${baseOrder.no_wo}.jpg`, mimeType: 'image/jpeg', data: base64Data }) });
                            let result = await response.json(); 
                            if (result.status === 'success' && result.fileUrl) { baseOrder.foto_evidence = result.fileUrl; } 
                            else { baseOrder.foto_evidence = compressedBase64; }
                        } catch(err) { console.warn("Drive upload error, fallback to local:", err); baseOrder.foto_evidence = compressedBase64; }
                    } else { baseOrder.foto_evidence = compressedBase64; }
                    
                    finishSubmitOrder(baseOrder, user);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        } else { 
            finishSubmitOrder(baseOrder, user); 
        }
    }

    function processMpAction(e, wo, targetStatus) {
        e.preventDefault(); const job = getOrders().find(j => j.no_wo === wo); if(!job) return;
        const elStart = document.getElementById('mp_start'); const elEnd = document.getElementById('mp_end'); const elOp = document.getElementById('mp_op'); const elRig = document.getElementById('mp_rig'); const elRig2 = document.getElementById('mp_rig2'); const errorBox = document.getElementById('mpFormError');
        let isMissing = false; const markError = (el) => { if(!el) return false; if(!el.value) { el.classList.add('border-red-500', 'bg-red-50', 'text-red-600'); el.classList.remove('border-slate-300'); return true; } else { el.classList.remove('border-red-500', 'bg-red-50', 'text-red-600'); el.classList.add('border-slate-300'); return false; } };
        if (markError(elStart)) isMissing = true; if (markError(elEnd)) isMissing = true; if (markError(elOp)) isMissing = true; if (markError(elRig)) isMissing = true; if (job.kategori === 'Big Crane' && markError(elRig2)) isMissing = true;
        if (isMissing) { errorBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-1"></i> Lengkapi seluruh form waktu dan personal!'; errorBox.classList.remove('hidden'); return; } else { errorBox.classList.add('hidden'); }
        const start = elStart.value; const end = elEnd.value; const op = elOp.value; const rig = elRig.value; const rig2 = elRig2 ? elRig2.value : ''; const inspeksi = document.getElementById('mp_inspeksi').value;
        let dStart = new Date(`2000-01-01T${start}:00`); let dEnd = new Date(`2000-01-01T${end}:00`); if(dEnd < dStart) dEnd = new Date(`2000-01-02T${end}:00`); let actualMins = (dEnd - dStart) / (1000 * 60);
        let reqMins = 0; if(job.durasi_request.includes('JAM')) reqMins = parseFloat(job.durasi_request) * 60; else if(job.durasi_request.includes('HARI')) reqMins = parseFloat(job.durasi_request) * 24 * 60;
        let diffStartMins = 0; if(job.jam_pelaksanaan) { let reqStart = new Date(`2000-01-01T${job.jam_pelaksanaan}:00`); diffStartMins = (dStart - reqStart) / (1000 * 60); }
        let isLate = diffStartMins > 15; let isOvertime = actualMins > (reqMins + 15);
        tempMpData = { wo, start, end, op, rig, rig2, inspeksi, actualMins, isLate, isOvertime, diffStartMins, diffOvertime: actualMins - reqMins, status: targetStatus };
        if(isLate || isOvertime) showKendalaModal(); else saveMpFinal(null, null); 
    }

    function showKendalaModal() {
        document.getElementById('mpActionModal').classList.add('hidden'); let html = `<div class="bg-red-50 border border-red-200 text-red-600 p-1.5 text-[9px] rounded-sm mb-2"><strong>Wajib Diisi:</strong> Jam aktual > toleransi.</div><form onsubmit="submitKendala(event)" class="space-y-2">`;
        if(tempMpData.isLate) html += `<div><label class="block text-[9px] font-bold text-red-600 mb-0.5"><i class="fa-regular fa-clock mr-1"></i>Alasan Telat (${Math.round(tempMpData.diffStartMins)} Menit):</label><textarea id="alasan_telat" class="w-full border border-slate-300 rounded-sm px-1.5 py-1 text-[10px]" required></textarea></div>`;
        if(tempMpData.isOvertime) html += `<div><label class="block text-[9px] font-bold text-red-600 mb-0.5"><i class="fa-solid fa-stopwatch mr-1"></i>Alasan Over (${Math.round(tempMpData.diffOvertime)} Menit):</label><textarea id="alasan_over" class="w-full border border-slate-300 rounded-sm px-1.5 py-1 text-[10px]" required></textarea></div>`;
        html += `<div class="flex gap-1.5 pt-1 mt-1 border-t border-slate-100"><button type="button" onclick="document.getElementById('kendalaModal').classList.add('hidden'); document.getElementById('mpActionModal').classList.remove('hidden');" class="flex-1 bg-slate-100 text-slate-600 font-bold py-1.5 rounded-sm text-[10px]">Cancel</button><button type="submit" class="flex-1 bg-red-500 text-white font-bold py-1.5 rounded-sm text-[10px]">Simpan Kendala</button></div></form>`;
        document.getElementById('kendalaContent').innerHTML = html; document.getElementById('kendalaModal').classList.remove('hidden');
    }

    function submitKendala(e) { e.preventDefault(); let aTelat = tempMpData.isLate ? document.getElementById('alasan_telat').value : null; let aOver = tempMpData.isOvertime ? document.getElementById('alasan_over').value : null; saveMpFinal(aTelat, aOver); document.getElementById('kendalaModal').classList.add('hidden'); }

    function saveMpFinal(alasanTelat, alasanOvertime) {
        let jobs = getOrders(); let idx = jobs.findIndex(j => j.no_wo === tempMpData.wo);
        jobs[idx].operator = tempMpData.op; jobs[idx].rigger = tempMpData.rig; if (tempMpData.rig2) jobs[idx].rigger2 = tempMpData.rig2;
        jobs[idx].jam_start_aktual = tempMpData.start; jobs[idx].jam_end_aktual = tempMpData.end; jobs[idx].final_inspeksi = tempMpData.inspeksi; jobs[idx].durasi_aktual = (tempMpData.actualMins / 60).toFixed(2); jobs[idx].status = tempMpData.status;
        if(alasanTelat) jobs[idx].alasan_telat = alasanTelat; if(alasanOvertime) jobs[idx].alasan_overtime = alasanOvertime;
        
        saveOrders(jobs); 
        document.getElementById('mpActionModal').classList.add('hidden'); 
        renderApp(true);
        
        if (tempMpData.status === 'COMPLETED') { showSuccessAnim('thumb', 'Kerja Bagus!', 'Pekerjaan telah diselesaikan dan laporan siap.'); } else { showToast('Tersimpan!'); }
    }

        document.getElementById('mpActionModal').classList.add('hidden');
    }

    function submitPendingJob() {
        let alasan = document.getElementById('pendingReasonInput').value.trim();
        if(!alasan) return showToast('Alasan wajib diisi!', 'error');
        
        let jobs = getOrders(); let idx = jobs.findIndex(j => j.no_wo === activePendingWo);
        if(idx !== -1) {
            jobs[idx].status = 'PENDING';
            jobs[idx].alasan_telat = "PENDING: " + alasan;
            
            const elOp = document.getElementById('mp_op');
            if(elOp && elOp.value) jobs[idx].operator = elOp.value;
            const elRig = document.getElementById('mp_rig');
            if(elRig && elRig.value) jobs[idx].rigger = elRig.value;
            const elRig2 = document.getElementById('mp_rig2');

            saveOrders(jobs);
            showToast('Job dipending!');
            document.getElementById('pendingPromptModal').classList.add('hidden');
            renderApp(true);
        }
    }

    async function saveBranding(e) {
        e.preventDefault();
        if (!SUPABASE_KEY || SUPABASE_KEY.includes('PASTE_KUNCI')) return showToast('Error: API Supabase belum dipasang!', 'error');

        const btn = e.target.querySelector('button[type="submit"]');
        const originalText = btn.innerHTML; btn.innerHTML = "Menyimpan ke Cloud..."; btn.disabled = true;
        
        let newSettings = {
            id: 1, 
            bg_url: document.getElementById('setting_bg').value.trim(), 
            logo_url: document.getElementById('setting_logo').value.trim(),
            icon_ct_url: document.getElementById('setting_icon_ct').value.trim(), 
            icon_bc_url: document.getElementById('setting_icon_bc').value.trim(), 
            icon_lb_url: document.getElementById('setting_icon_lb').value.trim()
        };
        
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/settings?on_conflict=id`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'resolution=merge-duplicates' },
                body: JSON.stringify(newSettings)
            });
            if (!res.ok) throw new Error("Gagal simpan database");

            localStorage.setItem('lifting_settings', JSON.stringify(newSettings));
            showToast('Branding berhasil disimpan ke Cloud untuk semua pengguna!'); 
            renderApp(true);
        } catch(err) {
            showToast('Gagal simpan branding ke cloud!', 'error');
        } finally { 
            btn.innerHTML = originalText; btn.disabled = false; 
        }
    }

    function addMasterData(e, key) { 
        e.preventDefault(); 
        const val = document.getElementById('new_master_val').value.trim(); 
        const m = getMasterData(); 
        if (!m[key]) m[key] = []; 
        if(m[key].includes(val)) return showToast('Data sudah ada!', 'error'); 
        m[key].push(val); 
        saveMasterData(m); 
        showToast('Ditambahkan!'); 
        renderApp(true); 
    }
    
    function addAccountMasterData(e, key) { 
        e.preventDefault(); 
        const name = document.getElementById('new_master_name').value.trim(); 
        const nrp = document.getElementById('new_master_nrp').value.trim().toUpperCase(); 
        const pwd = document.getElementById('new_master_pwd').value; 
        
        const users = getUsers(); 
        if (users.find(u => (u.nrp || '').toUpperCase() === nrp)) return showToast('NRP terdaftar!', 'error'); 
        
        const m = getMasterData(); 
        if (!m[key]) m[key] = []; 
        if(m[key].includes(name)) return showToast('Nama sudah ada!', 'error'); 
        
        m[key].push(name); 
        saveMasterData(m); 
        
        let role = key === 'gl' ? 'GL' : 'MANPOWER'; 
        let jabatan = key === 'gl' ? 'Group Leader' : (key === 'operator' ? 'Operator' : 'Rigger'); 
        
        users.unshift({ nrp: nrp, nama_lengkap: name, jabatan: jabatan, perusahaan: 'PPA', departemen: 'OPERATION', section: 'LIFTING', no_wa: '-', password_hash: pwd, role: role, status_akun: 'ACTIVE' }); 
        saveUsers(users); 
        
        showToast(`Akun dibuat & Master diupdate!`); 
        renderApp(true); 
    }

    function addAccountManual(e) {
        e.preventDefault();
        const nrp = document.getElementById('new_user_nrp').value.trim().toUpperCase();
        const name = document.getElementById('new_user_name').value.trim().toUpperCase();
        const role = document.getElementById('new_user_role').value;
        const pwd = document.getElementById('new_user_pwd').value;
        
        const users = getUsers();
        if (users.find(u => (u.nrp || '').toUpperCase() === nrp)) return showToast('NRP terdaftar!', 'error');
        
        let jabatan = role === 'GL' ? 'GROUP LEADER' : (role === 'MANPOWER' ? 'OPERATOR' : (role === 'ADMIN' ? 'ADMIN' : 'USER'));
        users.unshift({ nrp: nrp, nama_lengkap: name, jabatan: jabatan, perusahaan: 'PPA', departemen: 'OPERATION', section: 'LIFTING', no_wa: '-', password_hash: pwd, role: role, status_akun: 'ACTIVE' });
        saveUsers(users);
        showToast('Akun Pengguna ditambahkan!');
        renderApp(true);
    }
    
    function confirmDeleteMasterData(key, index) { 
        openCustomConfirm('Hapus Master Data', 'Yakin ingin menghapus item ini dari data master?', () => { 
            const m = getMasterData(); 
            if (!m[key]) m[key] = []; 
            m[key].splice(index, 1); 
            saveMasterData(m); 
            showToast('Dihapus!'); 
            renderApp(true); 
        }); 
    }

    function confirmDeleteUser(nrp) {
        const currentUser = JSON.parse(localStorage.getItem('lifting_user'));
        if((currentUser.nrp || '').toUpperCase() === nrp) return showToast('Tidak bisa menghapus akun Anda sendiri!', 'error');

        openCustomConfirm('Hapus Pengguna', `Hapus permanen akun dengan NRP: ${nrp}?`, async () => {
            let users = getUsers().filter(u => (u.nrp || '').toUpperCase() !== nrp);
            localStorage.setItem('lifting_users', JSON.stringify(users)); 
            
            if (SUPABASE_KEY && !SUPABASE_KEY.includes('PASTE_KUNCI')) {
                try { 
                    await fetch(`${SUPABASE_URL}/rest/v1/users?nrp=eq.${nrp}`, { 
                        method: 'DELETE', 
                        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } 
                    }); 
                } catch(e) { console.warn(e); }
            }
            
            showToast('Akun berhasil dihapus!'); 
            renderApp(true);
        });
    }

    function openResetPwd(nrp) { document.getElementById('resetNrpLabel').innerText = nrp; document.getElementById('resetNrpVal').value = nrp; document.getElementById('resetPwdInput').value = ''; document.getElementById('resetPwdModal').classList.remove('hidden'); }
    
    function processResetPassword(e) { 
        e.preventDefault(); 
        const nrp = document.getElementById('resetNrpVal').value; 
        const newPwd = document.getElementById('resetPwdInput').value; 
        const users = getUsers(); 
        const idx = users.findIndex(u => (u.nrp || '').toUpperCase() === nrp); 
        
        if(idx !== -1) { 
            users[idx].password_hash = newPwd; 
            saveUsers(users); 
            
            if (SUPABASE_KEY && !SUPABASE_KEY.includes('PASTE_KUNCI')) {
                fetch(`${SUPABASE_URL}/rest/v1/users?nrp=eq.${nrp}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
                    body: JSON.stringify({ password_hash: newPwd })
                }).catch(err => console.warn(err));
            }

            showToast(`Password direset!`); 
            document.getElementById('resetPwdModal').classList.add('hidden'); 
            renderApp(true); 
        } 
    }

        const m = getMasterData();

        return `

                <h2 class="font-bold text-slate-800 text-base">${user.nama_lengkap}</h2>

    function saveProfile(e) { 
        e.preventDefault(); 
        let user = JSON.parse(localStorage.getItem('lifting_user')); 
        let users = getUsers(); 
        let idx = users.findIndex(u => (u.nrp || '').toUpperCase() === (user.nrp || '').toUpperCase()); 
        
        user.nama_lengkap = document.getElementById('profName').value; 
        user.jabatan = document.getElementById('profJabatan').value; 
        user.perusahaan = document.getElementById('profPerusahaan').value; 
        user.departemen = document.getElementById('profDepartemen').value; 
        user.section = document.getElementById('profSection').value; 
        user.no_wa = document.getElementById('profWa').value; 
        
        if(idx !== -1) {
            users[idx] = user; 
            saveUsers(users); 
            localStorage.setItem('lifting_user', JSON.stringify(user)); 
            
            if (SUPABASE_KEY && !SUPABASE_KEY.includes('PASTE_KUNCI')) {
                fetch(`${SUPABASE_URL}/rest/v1/users?nrp=eq.${user.nrp}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
                    body: JSON.stringify({
                        nama_lengkap: user.nama_lengkap,
                        jabatan: user.jabatan,
                        perusahaan: user.perusahaan,
                        departemen: user.departemen,
                        section: user.section,
                        no_wa: user.no_wa
                    })
                }).catch(err => console.warn(err));
            }

            document.getElementById('profileBiodataModal').classList.add('hidden');
            showToast('Profil diupdate!'); 
            renderApp(true); 
        }
    }
    
    function savePassword(e) { 
        e.preventDefault(); 
        let pwd1 = document.getElementById('profPwd1').value; 
        let pwd2 = document.getElementById('profPwd2').value; 
        if (pwd1 !== pwd2) return showToast('Password tidak cocok!', 'error'); 
        
        let user = JSON.parse(localStorage.getItem('lifting_user')); 
        let users = getUsers(); 
        let idx = users.findIndex(u => (u.nrp || '').toUpperCase() === (user.nrp || '').toUpperCase()); 
        
        if (idx !== -1) {
            users[idx].password_hash = pwd1; 
            saveUsers(users); 
            user.password_hash = pwd1;
            localStorage.setItem('lifting_user', JSON.stringify(user)); 
            
            if (SUPABASE_KEY && !SUPABASE_KEY.includes('PASTE_KUNCI')) {
                fetch(`${SUPABASE_URL}/rest/v1/users?nrp=eq.${user.nrp}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
                    body: JSON.stringify({ password_hash: pwd1 })
                }).catch(err => console.warn(err));
            }
            
            document.getElementById('profPwd1').value = ''; 
            document.getElementById('profPwd2').value = ''; 
            document.getElementById('profileSettingsModal').classList.add('hidden');
            showToast('Password berhasil diubah!'); 
        } else {
            showToast('Gagal mereset, user tidak ditemukan', 'error');
        }
    }

    // ================= MOBILE PWA NAVIGATION (HARDWARE BACK BUTTON) =================
    window.addEventListener('load', () => { 
        fetchFromSupabase().then(() => { 
            const user = JSON.parse(localStorage.getItem('lifting_user'));
            if (user) {
                const homeTab = (user.role === 'ADMIN' || user.role === 'GL') ? 'dashboard' : (user.role === 'USER' ? 'order' : 'monitoring');
                if(!window.location.hash) {
                    history.replaceState(null, null, '#' + homeTab);
                    currentTab = homeTab;
                } else {
                    currentTab = window.location.hash.substring(1);
                }
            }
            renderApp(false); 
        }); 
    });

    window.addEventListener('hashchange', () => {
        const user = JSON.parse(localStorage.getItem('lifting_user'));
        if (!user) return;
        const homeTab = (user.role === 'ADMIN' || user.role === 'GL') ? 'dashboard' : (user.role === 'USER' ? 'order' : 'monitoring');
        
        let hash = window.location.hash.substring(1);
        if (!hash) {
            currentTab = homeTab; 
            userOrderFleetMode = null; mpFleetMode = null;
            renderApp(false);
            return;
        }
        if (currentTab !== hash) {
            currentTab = hash;
            userOrderFleetMode = null; mpFleetMode = null;
            renderApp(false);
        }
    });

    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
            const user = localStorage.getItem('lifting_user');
            if (user) {
                fetchFromSupabase().then(() => { renderApp(true); });
            }
        }
    });
</script>
