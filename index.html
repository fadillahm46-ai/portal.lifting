    async function fetchFromSupabase(isManual = false) {
        if (!SUPABASE_KEY || SUPABASE_KEY.includes('PASTE_KUNCI')) return;
        try {
            const [resOrders, resSettings, resUsers, resMaster] = await Promise.all([
                fetch(`${SUPABASE_URL}/rest/v1/orders?select=*&order=timestamp.desc`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }),
                fetch(`${SUPABASE_URL}/rest/v1/settings?id=eq.1`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }),
                fetch(`${SUPABASE_URL}/rest/v1/users?select=*`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }),
                fetch(`${SUPABASE_URL}/rest/v1/master_data?id=eq.1`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } })
            ]);

            if (resOrders.ok && !isSyncError) { const data = await resOrders.json(); if(Array.isArray(data)) localStorage.setItem('lifting_orders', JSON.stringify(data)); }
            if (resSettings.ok) { const data = await resSettings.json(); if(data && data.length > 0) localStorage.setItem('lifting_settings', JSON.stringify(data[0])); }
            if (resUsers.ok) { const data = await resUsers.json(); if(Array.isArray(data)) localStorage.setItem('lifting_users', JSON.stringify(data)); }
            if (resMaster.ok) { const data = await resMaster.json(); if(data && data.length > 0) localStorage.setItem('lifting_master_data', JSON.stringify(data[0])); }
            
            if(isManual) { showToast("Data berhasil disinkronisasi!", "success"); renderApp(false); }
        } catch(e) { console.warn("Fetch Supabase:", e); }
    }

    async function syncToSupabase(orders) {
        if (!SUPABASE_KEY || SUPABASE_KEY.includes('PASTE_KUNCI')) return;
        try {
            if (!orders || orders.length === 0) return;
            const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?on_conflict=no_wo`, { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'resolution=merge-duplicates' }, 
                body: JSON.stringify(orders) 
            });
            if (!res.ok) {
                isSyncError = true;
                const errText = await res.text();
                console.error("Supabase Sync Error:", errText);
                showToast("Data aman di HP, tapi gagal upload ke Database Cloud (Cek RLS/Unique DB).", "error");
            } else {
                isSyncError = false;
            }
        } catch (e) {
            isSyncError = true;
            console.error("Supabase network error:", e);
        }
    }

    function calcHoursBetween(startStr, endStr) {
        if (!startStr || !endStr) return 0;
        const [h1, m1] = startStr.split(':').map(Number);
        const [h2, m2] = endStr.split(':').map(Number);
        let mins = (h2 * 60 + m2) - (h1 * 60 + m1);
        if (mins < 0) mins += 24 * 60;
        return (mins / 60).toFixed(2);
    }

    function generateWO(kategori) {
        const date = new Date();
        const yyyy = date.getFullYear(); const mm = String(date.getMonth() + 1).padStart(2, '0'); const dd = String(date.getDate()).padStart(2, '0');
        let prefix = kategori === 'Big Crane' ? 'BC-' : (kategori === 'Lowboy' ? 'LB-' : 'CT-');
        const datePrefix = `${prefix}${yyyy}${mm}${dd}-`;
        
        let maxNumber = 0;
        getOrders().forEach(job => {
            if (job.no_wo && job.no_wo.startsWith(datePrefix)) {
                const parts = job.no_wo.split('-');
                if (parts.length >= 3) {
                    const num = parseInt(parts[2].split('-L')[0], 10);
                    if (!isNaN(num) && num > maxNumber) maxNumber = num;
                }
            }
        });
        return `${datePrefix}${maxNumber + 1}`;
    }

                        <div><label class="block text-[9px] font-bold text-slate-500 mb-0.5">No WhatsApp</label><input type="number" id="regWa" class="w-full border border-slate-300 rounded-lg px-2 py-1 text-xs focus:outline-none focus:border-cyan-500" required></div>

                        Sudah punya akun? <span class="text-cyan-600 font-bold cursor-pointer hover:underline" onclick="toggleAuthMode('authForm')">Masuk</span>

                </div>
            </div>

            <!-- 3. FORGOT PASSWORD FORM -->
            <div id="forgotPwdForm" class="bg-white border border-slate-300 shadow-2xl w-full max-w-[280px] overflow-hidden rounded-xl hidden z-10">

                    ${overlay}
                    <h2 class="text-sm font-bold text-white relative z-10 uppercase">Reset Password</h2>
                </div>
                <div class="p-4">
                    <div id="step1Forgot">
                        <form onsubmit="checkForgotNrp(event)" class="space-y-3">
                            <div><label class="block text-[10px] font-bold text-slate-500 mb-1">Masukkan NRP Anda</label><input type="text" id="forgotNrp" oninput="this.value = this.value.toUpperCase()" class="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:border-red-500" required></div>
                            <button type="submit" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-1.5 rounded-lg text-xs transition-colors mt-2">Cek NRP</button>
                        </form>
                    </div>
                    <div id="step2Forgot" class="hidden">
                        <form onsubmit="submitNewPassword(event)" class="space-y-3">
                            <input type="hidden" id="forgotTargetNrp">
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 mb-1">Password Baru</label>
                                <div class="relative">
                                    <input type="password" id="forgotPwd1" class="w-full border border-slate-300 rounded-lg px-2 py-1.5 pr-6 text-xs focus:outline-none focus:border-red-500" required>
                                    <i id="toggleFPwd1" class="fa-regular fa-eye absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer pwd-toggle text-[10px]" onclick="togglePassword('forgotPwd1', 'toggleFPwd1')"></i>

                                    <i id="toggleFPwd2" class="fa-regular fa-eye absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer pwd-toggle text-[10px]" onclick="togglePassword('forgotPwd2', 'toggleFPwd2')"></i>

                    <div class="w-16 h-16 rounded-full flex items-center justify-center text-3xl mb-3 text-white bg-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.5)]">

    function toggleAuthMode(targetId) { 
        document.getElementById('authForm').classList.add('hidden'); 
        document.getElementById('signupForm').classList.add('hidden'); 
        document.getElementById('forgotPwdForm').classList.add('hidden'); 
        
        document.getElementById(targetId).classList.remove('hidden'); 

        if(targetId === 'forgotPwdForm') {
            document.getElementById('step1Forgot').classList.remove('hidden');
            document.getElementById('step2Forgot').classList.add('hidden');
            document.getElementById('forgotNrp').value = '';
        }
    }

    function handleLogin(e) {
        e.preventDefault();
        const nrp = document.getElementById('loginNrp').value.trim().toUpperCase(); const pwd = document.getElementById('loginPwd').value;
        const users = getUsers(); const user = users.find(u => u.nrp === nrp && u.password_hash === pwd && u.status_akun === 'ACTIVE');
        const errorMsg = document.getElementById('loginErrorMsg');
        
        if (user) {
            localStorage.setItem('lifting_user', JSON.stringify(user));
            currentTab = (user.role === 'ADMIN' || user.role === 'GL') ? 'dashboard' : 'monitoring';
            userOrderFleetMode = null; mpFleetMode = null; renderApp(false);
        } else {
            errorMsg.innerHTML = '<i class="fa-solid fa-circle-exclamation mr-1"></i>NRP atau Password salah!'; errorMsg.classList.remove('hidden');
        }
    }

    function handleLogout() { localStorage.removeItem('lifting_user'); renderApp(false); }

    function handleSignup(e) {
        e.preventDefault();
        const users = getUsers(); const nrp = document.getElementById('regNrp').value.trim().toUpperCase();
        if (users.find(u => u.nrp === nrp)) return showToast('NRP sudah terdaftar!', 'error');

        const newUser = {
            nrp: nrp, 
            nama_lengkap: document.getElementById('regName').value.trim().toUpperCase(), 
            jabatan: document.getElementById('regJabatan').value.trim().toUpperCase(),
            perusahaan: document.getElementById('regPerusahaan').value, 
            departemen: document.getElementById('regDepartemen').value, 
            section: document.getElementById('regSection').value, 
            no_wa: document.getElementById('regWa').value,
            password_hash: document.getElementById('regPwd').value, 
            role: 'USER', 
            status_akun: 'ACTIVE'
        };
        users.push(newUser); saveUsers(users); 
        
        const m = document.getElementById('successRegModal');
        m.classList.remove('hidden');
        
        setTimeout(() => {
            m.classList.add('hidden');
            toggleAuthMode('authForm');
            document.getElementById('loginNrp').value = nrp;
            document.getElementById('loginPwd').value = '';
        }, 1400);
    }

    function checkForgotNrp(e) {
        e.preventDefault();
        const nrp = document.getElementById('forgotNrp').value.trim().toUpperCase();
        const users = getUsers();
        const user = users.find(u => u.nrp === nrp);
        if(user) {
            document.getElementById('step1Forgot').classList.add('hidden');
            document.getElementById('step2Forgot').classList.remove('hidden');
            document.getElementById('forgotTargetNrp').value = nrp;
        } else {
            showToast('NRP tidak ditemukan!', 'error');
        }
    }

    function submitNewPassword(e) {
        e.preventDefault();
        const nrp = document.getElementById('forgotTargetNrp').value;
        const p1 = document.getElementById('forgotPwd1').value;
        const p2 = document.getElementById('forgotPwd2').value;
        if(p1 !== p2) return showToast('Password tidak cocok!', 'error');

        let users = getUsers();
        let idx = users.findIndex(u => u.nrp === nrp);
        if(idx !== -1) {
            users[idx].password_hash = p1;
            saveUsers(users); 
            showToast('Password berhasil direset!');
            
            const m = document.getElementById('successRegModal');
            m.classList.remove('hidden');
            setTimeout(() => { m.classList.add('hidden'); toggleAuthMode('authForm'); document.getElementById('loginNrp').value = nrp; }, 1400);
        }
    }

    function openCustomConfirm(title, message, onConfirm) {
        document.getElementById('confirmTitle').innerText = title; document.getElementById('confirmMessage').innerText = message;
        document.getElementById('confirmButtons').innerHTML = `
            <button class="flex-1 bg-slate-100 text-slate-600 font-bold py-2.5 text-xs hover:bg-slate-200 transition-colors border-t border-slate-200" id="btnConfirmCancel">Batal</button>
            <button class="flex-1 bg-red-500 text-white font-bold py-2.5 text-xs hover:bg-red-600 transition-colors border-t border-red-500" id="btnConfirmOk">Ya, Lanjutkan</button>
        `;
        document.getElementById('globalConfirmModal').classList.remove('hidden');
        document.getElementById('btnConfirmCancel').onclick = () => { document.getElementById('globalConfirmModal').classList.add('hidden'); };
        document.getElementById('btnConfirmOk').onclick = () => { document.getElementById('globalConfirmModal').classList.add('hidden'); onConfirm(); };
    }

    function getDashboardView() {
        let jobs = getOrders();
        
        let today = getLocalDateString(0);
        let tglMulai = document.getElementById('dash_tgl_mulai') ? document.getElementById('dash_tgl_mulai').value : getLocalDateString(-7);
        let tglSelesai = document.getElementById('dash_tgl_selesai') ? document.getElementById('dash_tgl_selesai').value : today;
        
        let dashShift = document.getElementById('dash_shift') ? document.getElementById('dash_shift').value : 'ALL';
        let dashUnit = document.getElementById('dash_unit') ? document.getElementById('dash_unit').value : 'ALL';

        let filteredJobs = jobs.filter(j => j.tgl_pelaksanaan >= tglMulai && j.tgl_pelaksanaan <= tglSelesai);
        if (dashShift !== 'ALL') filteredJobs = filteredJobs.filter(j => j.shift === dashShift);
        if (dashUnit !== 'ALL') filteredJobs = filteredJobs.filter(j => j.kategori === dashUnit);

        let cntOrder = filteredJobs.length;
        let cntProg = filteredJobs.filter(j => j.status === 'ON PROGRESS').length;
        let cntPend = filteredJobs.filter(j => j.status === 'PENDING').length; 
        let cntDone = filteredJobs.filter(j => j.status === 'COMPLETED').length;
        let cntCancel = filteredJobs.filter(j => j.status === 'CANCELED').length;

        let cntCT = filteredJobs.filter(j => j.kategori === 'Crane Truck').length; 
        let cntBC = filteredJobs.filter(j => j.kategori === 'Big Crane').length; 
        let cntLB = filteredJobs.filter(j => j.kategori === 'Lowboy').length;
        let totalUnits = cntCT + cntBC + cntLB || 1; 

        let pctCT = Math.round((cntCT / totalUnits) * 100) || 0; 
        let pctBC = Math.round((cntBC / totalUnits) * 100) || 0; 
        let pctLB = Math.round((cntLB / totalUnits) * 100) || 0;
        let degCT = (pctCT / 100) * 360; 
        let degBC = degCT + ((pctBC / 100) * 360);
        let pieStyle = `background: conic-gradient(#0891b2 0deg ${degCT}deg, #6366f1 ${degCT}deg ${degBC}deg, #94a3b8 ${degBC}deg 360deg);`;

        return `
        <div class="max-w-6xl mx-auto space-y-3 relative z-10">
            <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-2">
                <h2 class="text-sm font-bold text-slate-800 shrink-0"><i class="fa-solid fa-chart-pie mr-1.5 text-cyan-600"></i>Dashboard Analytics</h2>
                
                <div class="flex items-center text-[10px] w-full lg:w-auto bg-white border border-slate-200 rounded-lg p-1.5 shadow-sm flex-wrap gap-y-1 relative z-20">
                    <div class="flex items-center shrink-0 pr-1">
                        <i class="fa-regular fa-calendar mx-1 text-slate-400"></i>
                        <input type="date" id="dash_tgl_mulai" class="bg-transparent px-1 py-0.5 text-slate-700 focus:outline-none" value="${tglMulai}" onchange="renderApp(true)">
                        <span class="text-slate-400 mx-0.5">-</span>
                        <input type="date" id="dash_tgl_selesai" class="bg-transparent px-1 py-0.5 text-slate-700 focus:outline-none" value="${tglSelesai}" onchange="renderApp(true)">
                    </div>
                    
                    <div class="flex items-center border-l border-slate-200 pl-1">
                        <select id="dash_shift" class="bg-transparent text-slate-700 focus:outline-none cursor-pointer" onchange="renderApp(true)">
                            <option value="ALL" ${dashShift==='ALL'?'selected':''}>All Shift</option>
                            <option value="Shift 1" ${dashShift==='Shift 1'?'selected':''}>Shift 1</option>
                            <option value="Shift 2" ${dashShift==='Shift 2'?'selected':''}>Shift 2</option>
                        </select>
                    </div>
                    
                    <div class="flex items-center border-l border-slate-200 pl-1">
                        <select id="dash_unit" class="bg-transparent text-slate-700 focus:outline-none cursor-pointer" onchange="renderApp(true)">
                            <option value="ALL" ${dashUnit==='ALL'?'selected':''}>Semua Armada</option>
                            <option value="Crane Truck" ${dashUnit==='Crane Truck'?'selected':''}>Crane Truck</option>
                            <option value="Big Crane" ${dashUnit==='Big Crane'?'selected':''}>Big Crane</option>
                            <option value="Lowboy" ${dashUnit==='Lowboy'?'selected':''}>Lowboy</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 relative z-0">
                <div class="bg-white border border-slate-200 rounded-xl p-3 text-center shadow-sm flex flex-col justify-center"><div class="text-[9px] font-bold text-slate-400 uppercase tracking-wider mb-1">Order</div><div class="text-xl font-bold text-slate-800">${cntOrder}</div></div>
                <div class="bg-blue-50 border border-blue-200 rounded-xl p-3 text-center shadow-sm flex flex-col justify-center"><div class="text-[9px] font-bold text-blue-500 uppercase tracking-wider mb-1">Progres</div><div class="text-xl font-bold text-blue-700">${cntProg}</div></div>
                <div class="bg-orange-50 border border-orange-200 rounded-xl p-3 text-center shadow-sm flex flex-col justify-center"><div class="text-[9px] font-bold text-orange-500 uppercase tracking-wider mb-1">Pending</div><div class="text-xl font-bold text-orange-600">${cntPend}</div></div>
                <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-center shadow-sm flex flex-col justify-center"><div class="text-[9px] font-bold text-emerald-500 uppercase tracking-wider mb-1">Selesai</div><div class="text-xl font-bold text-emerald-600">${cntDone}</div></div>
                <div class="bg-red-50 border border-red-200 rounded-xl p-3 text-center shadow-sm flex flex-col justify-center col-span-2 sm:col-span-1"><div class="text-[9px] font-bold text-red-500 uppercase tracking-wider mb-1">Batal</div><div class="text-xl font-bold text-red-600">${cntCancel}</div></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div class="bg-white border border-slate-200 rounded-xl p-3 shadow-sm flex items-center justify-between"><div class="flex items-center gap-2 text-slate-600"><i class="fa-solid fa-truck-moving text-base text-cyan-600"></i><span class="text-[11px] font-bold">Crane Truck</span></div><div class="text-lg font-bold text-slate-800">${cntCT}</div></div>
                <div class="bg-white border border-slate-200 rounded-xl p-3 shadow-sm flex items-center justify-between"><div class="flex items-center gap-2 text-slate-600"><i class="fa-solid fa-truck-ramp-box text-base text-indigo-500"></i><span class="text-[11px] font-bold">Big Crane</span></div><div class="text-lg font-bold text-slate-800">${cntBC}</div></div>
                <div class="bg-white border border-slate-200 rounded-xl p-3 shadow-sm flex items-center justify-between"><div class="flex items-center gap-2 text-slate-600"><i class="fa-solid fa-trailer text-base text-slate-500"></i><span class="text-[11px] font-bold">Lowboy</span></div><div class="text-lg font-bold text-slate-800">${cntLB}</div></div>
            </div>

            <!-- CHARTS SECTION -->

    function initDashboardCharts() {
        if(!document.getElementById('lineChart') || !document.getElementById('deptOrderChart') || typeof Chart === 'undefined') return;
        
        let allJobs = getOrders();
        let elMulai = document.getElementById('dash_tgl_mulai');
        let elSelesai = document.getElementById('dash_tgl_selesai');
        let elShift = document.getElementById('dash_shift');
        let elUnit = document.getElementById('dash_unit');

        let dashTglMulai = (elMulai && elMulai.value) ? elMulai.value : getLocalDateString(-7);
        let dashTglSelesai = (elSelesai && elSelesai.value) ? elSelesai.value : getLocalDateString(0);
        let dashShift = elShift ? elShift.value : 'ALL';
        let dashUnit = elUnit ? elUnit.value : 'ALL';

        if (dashShift !== 'ALL') allJobs = allJobs.filter(j => j.shift === dashShift);
        if (dashUnit !== 'ALL') allJobs = allJobs.filter(j => j.kategori === dashUnit);

        let filteredJobsRange = allJobs.filter(j => j.tgl_pelaksanaan >= dashTglMulai && j.tgl_pelaksanaan <= dashTglSelesai);

        // Departement Order (Stacked Bar)
        let refDate = new Date(dashTglMulai);
        let mtdStartStr = refDate.getFullYear() + '-' + String(refDate.getMonth()+1).padStart(2,'0') + '-01';
        let mtdJobs = allJobs.filter(j => j.tgl_pelaksanaan >= mtdStartStr && j.tgl_pelaksanaan <= dashTglSelesai);
        
        let sundayThisWeek = new Date(refDate); sundayThisWeek.setDate(refDate.getDate() - refDate.getDay());
        let lastWeekSun = new Date(sundayThisWeek); lastWeekSun.setDate(lastWeekSun.getDate() - 7);
        let lastWeekSat = new Date(sundayThisWeek); lastWeekSat.setDate(lastWeekSat.getDate() - 1);
        
        let lwStartStr = lastWeekSun.getFullYear() + '-' + String(lastWeekSun.getMonth()+1).padStart(2,'0') + '-' + String(lastWeekSun.getDate()).padStart(2,'0');
        let lwEndStr = lastWeekSat.getFullYear() + '-' + String(lastWeekSat.getMonth()+1).padStart(2,'0') + '-' + String(lastWeekSat.getDate()).padStart(2,'0');
        let lwJobs = allJobs.filter(j => j.tgl_pelaksanaan >= lwStartStr && j.tgl_pelaksanaan <= lwEndStr);

        function calcDeptCats(jobArray) {
            let ppaPlant=0, ppaNonPlant=0, nonPpa=0;
            jobArray.forEach(j => {
                let p = (j.perusahaan||'').toUpperCase(); let d = (j.departemen||'').toUpperCase();
                if(p.includes('PPA')) { if(d === 'PLANT') ppaPlant++; else ppaNonPlant++; } 
                else { nonPpa++; }
            });
            let total = ppaPlant + ppaNonPlant + nonPpa;
            if(total === 0) return [0,0,0];
            return [ (ppaPlant/total*100).toFixed(1), (ppaNonPlant/total*100).toFixed(1), (nonPpa/total*100).toFixed(1) ];
        }

        let mtdData = calcDeptCats(mtdJobs);
        let lwData = calcDeptCats(lwJobs);

        if(window.dashDeptChart) window.dashDeptChart.destroy();
        const ctxDept = document.getElementById('deptOrderChart').getContext('2d');
        window.dashDeptChart = new Chart(ctxDept, {
            type: 'bar',
            data: {
                labels: ['MTD', 'Last Week'],
                datasets: [
                    { label: 'Plant PPA', data: [mtdData[0], lwData[0]], backgroundColor: '#3b82f6', borderRadius: 4 }, 
                    { label: 'Non Plant PPA', data: [mtdData[1], lwData[1]], backgroundColor: '#93c5fd', borderRadius: 4 },
                    { label: 'Non PPA', data: [mtdData[2], lwData[2]], backgroundColor: '#fb923c', borderRadius: 4 }
                ]
            },
            options: {
                indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom', labels: { font: { size: 9, family: "'Inter', sans-serif" }, usePointStyle: true, boxWidth: 8 } }, tooltip: { callbacks: { label: function(context) { return context.dataset.label + ': ' + context.parsed.x + '%'; } } } },
                scales: { x: { stacked: true, max: 100, ticks: { font: { size: 9 }, callback: function(value){return value+"%"} }, grid: { color: '#f1f5f9' } }, y: { stacked: true, ticks: { font: { size: 10, weight: 'bold' } }, grid: { display: false } } }
            }
        });

        // Line Chart (Weekly Comparison)
        let dataThisWeek = [];
        let dataLastWeek = [];
        let labels = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

        for(let i=0; i<7; i++) {
            let dThis = new Date(sundayThisWeek); dThis.setDate(dThis.getDate() + i);
            let dLast = new Date(sundayThisWeek); dLast.setDate(dLast.getDate() - 7 + i);

            let strThis = dThis.getFullYear() + '-' + String(dThis.getMonth()+1).padStart(2,'0') + '-' + String(dThis.getDate()).padStart(2,'0');
            let strLast = dLast.getFullYear() + '-' + String(dLast.getMonth()+1).padStart(2,'0') + '-' + String(dLast.getDate()).padStart(2,'0');

            dataThisWeek.push(allJobs.filter(j => j.tgl_pelaksanaan === strThis).length);
            dataLastWeek.push(allJobs.filter(j => j.tgl_pelaksanaan === strLast).length);
        }

        if(window.dashLineChart) window.dashLineChart.destroy();
        const ctxLine = document.getElementById('lineChart').getContext('2d');
        window.dashLineChart = new Chart(ctxLine, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Minggu Ini',
                        data: dataThisWeek,
                        borderColor: '#0891b2',
                        backgroundColor: 'rgba(8, 145, 178, 0.1)',
                        tension: 0.35,
                        fill: true,
                        borderWidth: 2,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#0891b2',
                        pointBorderWidth: 2
                    },
                    {
                        label: 'Minggu Lalu',
                        data: dataLastWeek,
                        borderColor: '#94a3b8',
                        borderDash: [5, 5],
                        tension: 0.35,
                        fill: false,
                        borderWidth: 2,
                        pointRadius: 0
                    }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: { legend: { labels: { font: { size: 10, family: "'Inter', sans-serif" }, usePointStyle: true, boxWidth: 8 } } },
                scales: { 
                    y: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 9 } }, grid: { color: '#f1f5f9' } },
                    x: { ticks: { font: { size: 9 } }, grid: { display: false } }
                }
            }
        });

        // Rigger Stacked Bar Chart
        if(document.getElementById('riggerChart')) {
            let riggerStats = {};
            filteredJobsRange.forEach(j => {
                if (j.status !== 'COMPLETED' || !j.durasi_aktual) return;
                let hrs = parseFloat(j.durasi_aktual) || 0;
                [j.rigger, j.rigger2].forEach(r => {
                    if (!r || r === '-' || r === 'N/A') return;
                    if (!riggerStats[r]) riggerStats[r] = { total: 0, CT: 0, BC: 0, LB: 0 };
                    riggerStats[r].total += hrs;
                    if (j.kategori === 'Crane Truck') riggerStats[r].CT += hrs;
                    else if (j.kategori === 'Big Crane') riggerStats[r].BC += hrs;
                    else if (j.kategori === 'Lowboy') riggerStats[r].LB += hrs;
                });
            });

            let sortedRiggers = Object.entries(riggerStats).sort((a, b) => b[1].total - a[1].total);
            let rLabels = sortedRiggers.map(r => r[0]);
            let rDataCT = sortedRiggers.map(r => r[1].CT);
            let rDataBC = sortedRiggers.map(r => r[1].BC);
            let rDataLB = sortedRiggers.map(r => r[1].LB);

            if(window.dashRiggerChart) window.dashRiggerChart.destroy();
            const ctxRigger = document.getElementById('riggerChart').getContext('2d');
            window.dashRiggerChart = new Chart(ctxRigger, {
                type: 'bar',
                data: {
                    labels: rLabels.length > 0 ? rLabels : ['Belum Ada Data Selesai'],
                    datasets: [
                        { label: 'Crane Truck', data: rDataCT.length > 0 ? rDataCT : [0], backgroundColor: '#ef4444', borderRadius: 4 },
                        { label: 'Big Crane', data: rDataBC.length > 0 ? rDataBC : [0], backgroundColor: '#f97316', borderRadius: 4 }, 
                        { label: 'Lowboy', data: rDataLB.length > 0 ? rDataLB : [0], backgroundColor: '#92400e', borderRadius: 4 } 
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { font: { size: 9, family: "'Inter', sans-serif" }, usePointStyle: true, boxWidth: 8 } } },
                    scales: { x: { stacked: true, ticks: { font: { size: 9 } }, grid: { display: false } }, y: { stacked: true, ticks: { font: { size: 9 } }, grid: { color: '#f1f5f9' } } }
                }
            });
        }

        if(document.getElementById('companyDonutChart')) {
            let companyStats = {};
            filteredJobsRange.forEach(j => { 
                let p = (j.perusahaan || 'N/A').toUpperCase(); 
                if(!companyStats[p]) companyStats[p] = { count: 0, hours: 0 };
                companyStats[p].count += 1;
                if (j.status === 'COMPLETED' && j.durasi_aktual) companyStats[p].hours += parseFloat(j.durasi_aktual);
            });
            
            let cLabels = []; let cDataCount = []; let cBgColors = [];
            const cColors = { 'PPA': '#3b82f6', 'BIB': '#111827', 'PT. BIB': '#111827', 'SUBKON A': '#eab308', 'SUBKON B': '#f97316' };
            const fallbackColors = ['#10b981', '#8b5cf6', '#ec4899', '#06b6d4', '#64748b'];
            
            let idxColor = 0;
            let companyArray = Object.entries(companyStats).sort((a,b)=>b[1].count - a[1].count);
            let totalCompanyJobs = companyArray.reduce((sum, item) => sum + item[1].count, 0) || 1;

            let companyLegendHtml = '';
            companyArray.forEach((item) => {
                let cName = item[0]; let cObj = item[1];
                let pct = Math.round((cObj.count / totalCompanyJobs) * 100);
                let color = cColors[cName] || fallbackColors[idxColor % fallbackColors.length];
                
                cLabels.push(cName); cDataCount.push(cObj.count); cBgColors.push(color);
                if(!cColors[cName]) idxColor++;

                companyLegendHtml += `
                <div class="flex items-center justify-between text-[10px] mb-1.5">
                    <div class="flex items-center gap-2 w-1/2 truncate"><div class="w-2.5 h-2.5 rounded-sm shrink-0" style="background-color: ${color}"></div><span class="font-semibold text-slate-700 truncate" title="${cName}">${cName}</span></div>
                    <div class="w-1/4 text-slate-500 text-center">${pct}%</div>
                    <div class="w-1/4 font-semibold text-slate-600 text-right whitespace-nowrap">${cObj.hours.toFixed(1)}J | ${cObj.count}</div>
                </div>`;
            });

            if(!companyLegendHtml) companyLegendHtml = '<div class="text-[9px] text-slate-400 italic">Data kosong</div>';
            document.getElementById('legendCompanyContainer').innerHTML = companyLegendHtml;

            if(window.dashCompanyDonut) window.dashCompanyDonut.destroy();
            const ctxDonut = document.getElementById('companyDonutChart').getContext('2d');
            window.dashCompanyDonut = new Chart(ctxDonut, {
                type: 'doughnut',
                data: { labels: cLabels.length > 0 ? cLabels : ['Kosong'], datasets: [{ data: cDataCount.length > 0 ? cDataCount : [1], backgroundColor: cBgColors.length > 0 ? cBgColors : ['#e2e8f0'], borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, cutout: '65%', plugins: { legend: { display: false } } }
            });
        }
    }

    function getMonitoringView() {
        let currentUser = JSON.parse(localStorage.getItem('lifting_user'));
        let jobs = getOrders();
        
        if (currentUser.role === 'ADMIN' || currentUser.role === 'GL') {
            let tglMulai = document.getElementById('filter_tgl_mulai') ? document.getElementById('filter_tgl_mulai').value : '';
            let tglSelesai = document.getElementById('filter_tgl_selesai') ? document.getElementById('filter_tgl_selesai').value : '';
            let filterShift = document.getElementById('filter_shift') ? document.getElementById('filter_shift').value : 'ALL';
            let filterKategori = document.getElementById('filter_admin_kategori') ? document.getElementById('filter_admin_kategori').value : 'ALL';

            if (tglMulai && tglSelesai) jobs = jobs.filter(j => j.tgl_pelaksanaan >= tglMulai && j.tgl_pelaksanaan <= tglSelesai);
            if (filterShift !== 'ALL') jobs = jobs.filter(j => j.shift === filterShift);
            if (filterKategori !== 'ALL') jobs = jobs.filter(j => j.kategori === filterKategori);

            jobs.sort((a, b) => {
                let valA = (a[sortColumn] || '').toString().toLowerCase(); 
                let valB = (b[sortColumn] || '').toString().toLowerCase();
                let comparison = valA.localeCompare(valB, undefined, {numeric: true});
                if (comparison < 0) return sortDirection === 'asc' ? -1 : 1; 
                if (comparison > 0) return sortDirection === 'asc' ? 1 : -1; 
                return 0;
            });

            if (sortColumn === 'status' || sortColumn === 'timestamp') {
               jobs.sort((a,b) => {
                   let aNeed = (a.status === 'SCHEDULED' || a.status === 'UNSCHEDULED' || (a.status === 'PENDING' && !a.operator)) ? 1 : 0;
                   let bNeed = (b.status === 'SCHEDULED' || b.status === 'UNSCHEDULED' || (b.status === 'PENDING' && !b.operator)) ? 1 : 0;
                   return bNeed - aNeed;
               });
            }

            let pendingCount = jobs.filter(j => j.status === 'SCHEDULED' || j.status === 'UNSCHEDULED' || (j.status === 'PENDING' && (!j.operator || !j.rigger))).length;

            return `
            <div class="bg-white rounded-xl shadow-sm border border-slate-200">

                        <div class="flex items-center gap-1.5 shrink-0">
                            <div class="bg-red-50 text-red-600 border border-red-200 px-2 py-0.5 rounded-md font-semibold text-[10px]" title="Butuh Validasi/Penugasan">Validasi: ${pendingCount}</div>
                            <button onclick="downloadCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded-md transition-colors flex items-center gap-1 shadow-sm text-[10px]"><i class="fa-solid fa-file-excel"></i> Export CSV</button>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 text-[10px] w-full sm:w-auto overflow-x-auto hide-scrollbar pb-0.5 sm:pb-0">
                        <input type="date" id="filter_tgl_mulai" class="border border-slate-300 rounded-md px-2 py-1 text-slate-700 focus:outline-none focus:border-cyan-500 shrink-0" value="${tglMulai}" onchange="renderApp(true)">
                        <span class="text-slate-400 shrink-0">-</span>
                        <input type="date" id="filter_tgl_selesai" class="border border-slate-300 rounded-md px-2 py-1 text-slate-700 focus:outline-none focus:border-cyan-500 shrink-0" value="${tglSelesai}" onchange="renderApp(true)">
                        <select id="filter_shift" class="border border-slate-300 rounded-md px-2 py-1 text-slate-700 focus:outline-none focus:border-cyan-500 shrink-0 ml-1 bg-white cursor-pointer" onchange="renderApp(true)">
                            <option value="ALL" ${filterShift === 'ALL' ? 'selected' : ''}>Semua Shift</option>
                            <option value="Shift 1" ${filterShift === 'Shift 1' ? 'selected' : ''}>Shift 1</option>
                            <option value="Shift 2" ${filterShift === 'Shift 2' ? 'selected' : ''}>Shift 2</option>
                        </select>
                        <select id="filter_admin_kategori" class="border border-slate-300 rounded-md px-2 py-1 text-slate-700 focus:outline-none focus:border-cyan-500 shrink-0 ml-1 bg-white cursor-pointer" onchange="renderApp(true)">
                            <option value="ALL" ${filterKategori === 'ALL' ? 'selected' : ''}>Semua Armada</option>

                                <th class="px-2 py-2 font-semibold w-24 hidden md:table-cell cursor-pointer hover:bg-slate-200 select-none transition-colors" onclick="handleSort('tgl_pelaksanaan')">Jadwal ${getSortIcon('tgl_pelaksanaan')}</th>

                                    <td class="px-2 py-2 align-top">
                                        ${job.kategori !== 'Big Crane' ? `<div class="text-[9px] md:text-[10px] text-orange-600 font-semibold flex items-start gap-1 mb-0.5 leading-tight"><i class="fa-solid fa-location-dot mt-0.5 shrink-0"></i> <span>${job.lokasi_angkat || '-'} <i class="fa-solid fa-arrow-right text-[7px] mx-0.5 text-slate-400"></i> ${job.lokasi_tujuan || '-'}</span></div>` : ''}

    function getManpowerWorkflow() {
        const user = JSON.parse(localStorage.getItem('lifting_user'));

        let myJobs = allJobs.filter(j => {
            const isAssigned = (j.operator === user.nama_lengkap) || (j.rigger === user.nama_lengkap) || (j.rigger2 === user.nama_lengkap);
            return isAssigned || (j.status === 'ON PROGRESS' && !j.operator);
        });

        let countProg = myJobs.filter(j => j.status === 'ON PROGRESS' || j.status === 'SCHEDULED' || j.status === 'UNSCHEDULED').length;
        let countPend = myJobs.filter(j => j.status === 'PENDING').length;
        let countComp = myJobs.filter(j => j.status === 'COMPLETED').length;

        let displayJobs = myJobs.filter(j => {
            if (currentMpPanel === 'ON PROGRESS') return j.status === 'ON PROGRESS' || j.status === 'SCHEDULED' || j.status === 'UNSCHEDULED';
            if (currentMpPanel === 'PENDING') return j.status === 'PENDING';
            if (currentMpPanel === 'COMPLETED') return j.status === 'COMPLETED';
            return true;

        return `

            <!-- Header Kartu Petugas -->

                        <h2 class="font-bold text-xs uppercase">${user.nama_lengkap}</h2>

            </div>

            <!-- Tab Filter Status Pekerjaan -->
            <div class="flex bg-white rounded-xl p-1 border border-slate-200 shadow-sm gap-1">
                <button onclick="currentMpPanel='ON PROGRESS'; renderApp(false);" class="flex-1 py-1.5 text-center rounded-lg font-bold text-[10px] transition-all flex items-center justify-center gap-1.5 ${currentMpPanel==='ON PROGRESS' ? 'bg-cyan-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-50'}">
                    <span>Berjalan</span>
                    <span class="px-1.5 py-0.2 rounded-full text-[8px] ${currentMpPanel==='ON PROGRESS' ? 'bg-white/20 text-white' : 'bg-slate-200 text-slate-700'}">${countProg}</span>
                </button>
                <button onclick="currentMpPanel='PENDING'; renderApp(false);" class="flex-1 py-1.5 text-center rounded-lg font-bold text-[10px] transition-all flex items-center justify-center gap-1.5 ${currentMpPanel==='PENDING' ? 'bg-orange-500 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-50'}">
                    <span>Pending</span>
                    <span class="px-1.5 py-0.2 rounded-full text-[8px] ${currentMpPanel==='PENDING' ? 'bg-white/20 text-white' : 'bg-slate-200 text-slate-700'}">${countPend}</span>
                </button>
                <button onclick="currentMpPanel='COMPLETED'; renderApp(false);" class="flex-1 py-1.5 text-center rounded-lg font-bold text-[10px] transition-all flex items-center justify-center gap-1.5 ${currentMpPanel==='COMPLETED' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-50'}">
                    <span>Selesai</span>
                    <span class="px-1.5 py-0.2 rounded-full text-[8px] ${currentMpPanel==='COMPLETED' ? 'bg-white/20 text-white' : 'bg-slate-200 text-slate-700'}">${countComp}</span>
                </button>
            </div>

            <!-- List Tugas -->
            <div class="space-y-2.5">
                ${displayJobs.length === 0 ? `
                    <div class="bg-white rounded-xl p-8 text-center border border-slate-200 shadow-sm">
                        <i class="fa-solid fa-clipboard-check text-4xl text-slate-300 mb-2"></i>
                        <p class="text-slate-500 font-medium text-xs">Tidak ada tugas pada tab ${currentMpPanel}.</p>
                        <p class="text-[9px] text-slate-400 mt-0.5">Tugas baru dari Dispatcher/GL akan muncul otomatis disini.</p>
                    </div>
                ` : displayJobs.map(job => {
                    const isStarted = !!job.jam_start_aktual;
                    const isDone = job.status === 'COMPLETED';

                    return `
                    <div class="bg-white rounded-xl p-3.5 border border-slate-200 shadow-sm relative">
                        <div class="flex items-center justify-between mb-2">
                            <span class="font-mono font-bold text-cyan-700 text-[11px]">${job.no_wo}</span>
                            <span class="text-[8px] font-bold px-2 py-0.5 rounded-full ${job.status==='COMPLETED'?'bg-emerald-100 text-emerald-700':(job.status==='PENDING'?'bg-orange-100 text-orange-700':'bg-blue-100 text-blue-700')}">${job.status}</span>
                        </div>

                        <div class="flex items-center justify-between text-[11px] font-semibold text-slate-800 mb-1.5">

                            <div class="flex justify-between text-slate-600"><span class="text-slate-400">Pemohon:</span><span class="font-semibold">${job.nama_pemohon} (${job.perusahaan})</span></div>
                            <div class="flex justify-between text-slate-600"><span class="text-slate-400">Lokasi:</span><span class="font-medium">${job.lokasi_angkat || '-'} ➔ ${job.lokasi_tujuan || '-'}</span></div>
                            <div class="text-slate-700 font-medium pt-0.5 border-t border-slate-200/60 line-clamp-2"><span class="text-slate-400">Pekerjaan:</span> ${job.deskripsi}</div>
                        </div>

                        <!-- Panel Waktu Lapangan -->
                        <div class="grid grid-cols-2 gap-2 text-[10px] bg-cyan-50/40 p-2 rounded-lg border border-cyan-100/60 mb-3">
                            <div><span class="text-slate-400 block text-[9px]">Mulai Aktual:</span><strong class="text-cyan-800">${job.jam_start_aktual || '--:--'}</strong></div>
                            <div><span class="text-slate-400 block text-[9px]">Selesai Aktual:</span><strong class="text-cyan-800">${job.jam_end_aktual || '--:--'} ${job.durasi_aktual ? '('+job.durasi_aktual+' Jam)' : ''}</strong></div>
                        </div>

                        <!-- Tombol Aksi Lapangan -->
                        <div class="flex flex-wrap gap-1.5 pt-1 border-t border-slate-100">
                            ${!isDone ? `
                                ${!isStarted ? `
                                    <button onclick="startJobManpower('${job.no_wo}')" class="flex-1 bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-2 px-3 rounded-lg text-xs transition-colors flex items-center justify-center gap-1.5 shadow-sm">
                                        <i class="fa-solid fa-play"></i> Mulai Kerja
                                    </button>
                                ` : `
                                    <button onclick="openCompleteJobModal('${job.no_wo}')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-3 rounded-lg text-xs transition-colors flex items-center justify-center gap-1.5 shadow-sm">
                                        <i class="fa-solid fa-flag-checkered"></i> Selesai
                                    </button>
                                    <button onclick="openPendingJobModal('${job.no_wo}')" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-3 rounded-lg text-xs transition-colors flex items-center justify-center gap-1.5 shadow-sm">
                                        <i class="fa-solid fa-pause"></i> Pending
                                    </button>
                                `}
                            ` : `
                                <div class="w-full text-center py-1.5 text-emerald-700 font-bold text-[10px] bg-emerald-50 rounded-lg border border-emerald-200">
                                    <i class="fa-solid fa-circle-check mr-1"></i> Pekerjaan Selesai | Inspeksi: ${job.final_inspeksi || '-'}
                                </div>
                            `}
                            <button onclick="copyJobToWA('${job.no_wo}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-1.5 px-3 rounded-lg text-[10px] flex items-center gap-1">
                                <i class="fa-brands fa-whatsapp text-emerald-600"></i> Salin WA
                            </button>
                            <button onclick="viewJobDetail('${job.no_wo}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-1.5 px-3 rounded-lg text-[10px] flex items-center gap-1">
                                <i class="fa-solid fa-circle-info text-cyan-600"></i> Detail
                            </button>
                        </div>
                    </div>`;
                }).join('')}
            </div>
        </div>`;
    }

    function startJobManpower(wo) {
        const d = new Date();
        const nowHHmm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        openCustomConfirm('Mulai Pekerjaan', `Mulai pekerjaan NO WO ${wo} sekarang (Jam ${nowHHmm})?`, () => {
            let orders = getOrders();
            let idx = orders.findIndex(j => j.no_wo === wo);
            if (idx !== -1) {
                orders[idx].jam_start_aktual = nowHHmm;
                orders[idx].status = 'ON PROGRESS';
                saveOrders(orders);
                showSuccessAnim('check', 'Job Dimulai!', `Jam mulai tercatat: ${nowHHmm}`);
                renderApp(true);
            }
        });
    }

    function openCompleteJobModal(wo) {
        let job = getOrders().find(j => j.no_wo === wo);
        if (!job) return;

        const d = new Date();
        const nowHHmm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        const defaultStart = job.jam_start_aktual || nowHHmm;

        document.getElementById('mpActionContent').innerHTML = `
            <form onsubmit="saveCompleteJobManpower(event, '${wo}')" class="space-y-3">
                <div class="bg-cyan-50 border border-cyan-100 rounded-lg p-2.5 text-center">
                    <p class="font-mono font-bold text-cyan-800 text-[11px]">${job.no_wo}</p>
                    <p class="text-[10px] text-slate-600 mt-0.5">${job.deskripsi}</p>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 mb-1">Jam Start Aktual *</label>
                        <input type="time" id="mp_act_start" value="${defaultStart}" class="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:border-cyan-500" required>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 mb-1">Jam Selesai Aktual *</label>
                        <input type="time" id="mp_act_end" value="${nowHHmm}" class="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:border-cyan-500" required>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-emerald-700 mb-1">Waktu Final Inspeksi *</label>
                    <input type="time" id="mp_act_insp" value="${nowHHmm}" class="w-full border border-emerald-300 bg-emerald-50/50 rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:border-emerald-500" required>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-600 mb-1">Kendala Waktu / Catatan (Opsional)</label>
                    <textarea id="mp_act_kendala" class="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-[10px] focus:outline-none focus:border-cyan-500 h-14" placeholder="Misal: Kendala cuaca, antrian area muat...">${job.alasan_telat || ''}</textarea>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-lg text-xs transition-colors shadow-sm">
                    <i class="fa-solid fa-check-circle mr-1"></i> Simpan & Selesaikan Pekerjaan
                </button>
            </form>

    function saveCompleteJobManpower(e, wo) {
        e.preventDefault();
        const start = document.getElementById('mp_act_start').value;
        const end = document.getElementById('mp_act_end').value;
        const insp = document.getElementById('mp_act_insp').value;
        const kendala = document.getElementById('mp_act_kendala').value.trim();

        let orders = getOrders();
        let idx = orders.findIndex(j => j.no_wo === wo);
        if (idx === -1) return;

        const durasi = calcHoursBetween(start, end);
        orders[idx].jam_start_aktual = start;
        orders[idx].jam_end_aktual = end;
        orders[idx].durasi_aktual = durasi;
        orders[idx].final_inspeksi = insp;
        if (kendala) orders[idx].alasan_telat = kendala;
        orders[idx].status = 'COMPLETED';

        saveOrders(orders);
        document.getElementById('mpActionModal').classList.add('hidden');
        showSuccessAnim('thumb', 'Pekerjaan Selesai!', `Tercatat durasi kerja: ${durasi} Jam`);
        renderApp(true);
    }

    function submitPendingJob() {
        if (!activePendingWo) return;
        const reason = document.getElementById('pendingReasonInput').value.trim();

            showToast('Silakan isi alasan pending!', 'error');

        let orders = getOrders();

            orders[idx].alasan_telat = (orders[idx].alasan_telat ? orders[idx].alasan_telat + '; ' : '') + 'Pending: ' + reason;
            saveOrders(orders);
            showToast('Pekerjaan diubah status menjadi PENDING!');

            renderApp(true);

    function downloadCSV() {
        let jobs = getOrders();
        if (!jobs || jobs.length === 0) {
            showToast('Tidak ada data order untuk diekspor!', 'error');
            return;
        }

        let tglMulai = document.getElementById('filter_tgl_mulai') ? document.getElementById('filter_tgl_mulai').value : '';
        let tglSelesai = document.getElementById('filter_tgl_selesai') ? document.getElementById('filter_tgl_selesai').value : '';
        let filterShift = document.getElementById('filter_shift') ? document.getElementById('filter_shift').value : 'ALL';
        let filterKategori = document.getElementById('filter_admin_kategori') ? document.getElementById('filter_admin_kategori').value : 'ALL';

        if (tglMulai && tglSelesai) jobs = jobs.filter(j => j.tgl_pelaksanaan >= tglMulai && j.tgl_pelaksanaan <= tglSelesai);
        if (filterShift !== 'ALL') jobs = jobs.filter(j => j.shift === filterShift);
        if (filterKategori !== 'ALL') jobs = jobs.filter(j => j.kategori === filterKategori);

        const headers = [
            'No WO', 'Timestamp', 'Status', 'Kategori', 'Unit', 'Shift', 'Tgl Pelaksanaan', 
            'Jam Pelaksanaan', 'Durasi Request', 'Nama Pemohon', 'Perusahaan', 'Departemen', 
            'Section', 'No WA', 'Lokasi Angkat', 'Lokasi Tujuan', 'Deskripsi', 'GL', 
            'Operator', 'Rigger 1', 'Rigger 2', 'Jam Mulai Aktual', 'Jam Selesai Aktual', 
            'Durasi Aktual (Jam)', 'Final Inspeksi', 'Alasan Telat', 'Alasan Overtime'
        ];

        const escapeCsv = (val) => {
            if (val === null || val === undefined) return '""';
            let str = String(val).replace(/"/g, '""');
            return `"${str}"`;
        };

        let csvContent = '\uFEFF' + headers.map(escapeCsv).join(',') + '\r\n';

        jobs.forEach(j => {
            const row = [
                j.no_wo || '', j.timestamp || '', j.status || '', j.kategori || '', j.unit || '',
                j.shift || '', j.tgl_pelaksanaan || '', j.jam_pelaksanaan || '', j.durasi_request || '',
                j.nama_pemohon || '', j.perusahaan || '', j.departemen || '', j.section || '', j.no_wa || '',
                j.lokasi_angkat || '', j.lokasi_tujuan || '', j.deskripsi || '', j.gl || '', j.operator || '',
                j.rigger || '', j.rigger2 || '', j.jam_start_aktual || '', j.jam_end_aktual || '',
                j.durasi_aktual || '', j.final_inspeksi || '', j.alasan_telat || '', j.alasan_overtime || ''
            ];
            csvContent += row.map(escapeCsv).join(',') + '\r\n';
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', `Lifting_Orders_${getLocalDateString(0)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showToast('Data berhasil diekspor ke format CSV!');
    }

    function saveAdminEditJob(e, wo) {
        e.preventDefault();
        let jobs = getOrders();
        let idx = jobs.findIndex(j => j.no_wo === wo && j.status !== 'CANCELED');
        if(idx === -1) return;

        jobs[idx].tgl_pelaksanaan = document.getElementById('edit_tgl').value;
        jobs[idx].jam_pelaksanaan = document.getElementById('edit_jam').value;
        if(jobs[idx].kategori === 'Crane Truck' && jobs[idx].jam_pelaksanaan) {
            let h = parseInt(jobs[idx].jam_pelaksanaan.split(':')[0]);
            jobs[idx].shift = (h >= 5 && h < 17) ? 'Shift 1' : 'Shift 2';
        }
        
        if (jobs[idx].kategori !== 'Big Crane') {
            jobs[idx].lokasi_angkat = document.getElementById('edit_lok_asal').value;
            jobs[idx].lokasi_tujuan = document.getElementById('edit_lok_tujuan').value;
        }
        jobs[idx].deskripsi = document.getElementById('edit_deskripsi').value;
        
        const selectedGL = document.getElementById('edit_gl').value;
        const selectedUnit = document.getElementById('edit_unit').value;
        const op = document.getElementById('edit_op').value;
        const rig = document.getElementById('edit_rig').value;
        const rig2 = document.getElementById('edit_rig2') ? document.getElementById('edit_rig2').value : '';
        
        jobs[idx].gl = selectedGL;
        jobs[idx].unit = selectedUnit;
        jobs[idx].operator = op;
        jobs[idx].rigger = rig;
        jobs[idx].rigger2 = rig2;

        if (jobs[idx].status === 'COMPLETED') {
            jobs[idx].jam_start_aktual = document.getElementById('edit_start').value;
            jobs[idx].jam_end_aktual = document.getElementById('edit_end').value;
            jobs[idx].durasi_aktual = document.getElementById('edit_durasi_aktual').value;
            jobs[idx].final_inspeksi = document.getElementById('edit_inspeksi').value;
            jobs[idx].alasan_telat = document.getElementById('edit_alasan_telat').value;
            jobs[idx].alasan_overtime = document.getElementById('edit_alasan_overtime').value;
        }

        let isValidated = false;
        if (jobs[idx].kategori === 'Big Crane') {
            isValidated = (selectedGL && selectedUnit && op && rig && rig2);
        } else if (jobs[idx].kategori === 'Lowboy') {
            isValidated = (selectedGL && selectedUnit && op && rig);
        } else {
            isValidated = (selectedGL && selectedUnit);
        }

        if (isValidated && (jobs[idx].status === 'SCHEDULED' || jobs[idx].status === 'UNSCHEDULED' || jobs[idx].status === 'PENDING')) {
            jobs[idx].status = 'ON PROGRESS';
            showToast('Job berhasil divalidasi & dialihkan ke ON PROGRESS!');
        } else {
            showToast('Perubahan Disimpan!');
        }

        saveOrders(jobs);
        document.getElementById('editJobModal').classList.add('hidden');
        renderApp(true); 
    }

    async function submitOrder(e) {
        e.preventDefault();
        const btnSubmit = document.getElementById('btnSubmitOrder'); 
        btnSubmit.disabled = true; 
        btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Memproses Order...';
        
        const user = JSON.parse(localStorage.getItem('lifting_user')); 
        const cat = userOrderFleetMode; 
        const isAdminGL = user.role === 'ADMIN' || user.role === 'GL';
        
        let tgl = document.getElementById('req_tgl')?.value || ''; 
        let jam = document.getElementById('req_jam')?.value || ''; 
        let statusTag = 'SCHEDULED';
        let shiftVal = '-';

        if (tgl) {
            let reqDate = new Date(`${tgl}T00:00:00`); 
            let now = new Date(); 
            now.setHours(0,0,0,0); 
            let diffDays = (reqDate - now) / (1000 * 60 * 60 * 24);
            
            if (cat === 'Big Crane') { 
                if (diffDays < 3) statusTag = 'UNSCHEDULED'; 
            } else if (cat === 'Crane Truck' && jam) { 
                let reqTime = new Date(`${tgl}T${jam}:00`); 
                let diffHours = (reqTime - new Date()) / (1000 * 60 * 60); 
                if (diffHours < 6) statusTag = 'UNSCHEDULED'; 
                
                let h = parseInt(jam.split(':')[0]);
                shiftVal = (h >= 5 && h < 17) ? 'Shift 1' : 'Shift 2';
            }
        }

        let durasiVal = document.getElementById('req_durasi')?.value || ''; 
        let satuan = document.getElementById('req_satuan')?.value || 'JAM';
        
        const baseOrder = {
            no_wo: generateWO(cat), 
            timestamp: new Date().toISOString(), 
            kategori: cat, 
            nrp_pemohon: user.nrp, 
            nama_pemohon: isAdminGL ? document.getElementById('del_nama').value : user.nama_lengkap, 
            perusahaan: isAdminGL ? document.getElementById('del_vendor').value : user.perusahaan, 
            departemen: isAdminGL ? document.getElementById('del_dept').value : user.departemen, 
            section: isAdminGL ? (document.getElementById('del_sect')?.value || user.section) : user.section,
            no_wa: isAdminGL ? document.getElementById('del_wa').value : user.no_wa,
            tgl_pelaksanaan: tgl, 
            jam_pelaksanaan: jam, 
            shift: shiftVal, 
            durasi_request: `${durasiVal} ${satuan}`,
            lokasi_angkat: document.getElementById('req_lok_asal')?.value || '', 
            lokasi_tujuan: document.getElementById('req_lok_tujuan')?.value || '', 
            deskripsi: document.getElementById('req_deskripsi')?.value || '',
            status: statusTag, 
            foto_evidence: '', 
            gl: '', unit: '', operator: '', rigger: '', rigger2: '', jam_start_aktual: '', jam_end_aktual: '', durasi_aktual: '', final_inspeksi: '', alasan_telat: '', alasan_overtime: ''
        };

        const fotoInput = document.getElementById('req_foto');
        if (fotoInput && fotoInput.files.length > 0) {
            const file = fotoInput.files[0]; 
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = async function() {
                    const canvas = document.createElement('canvas'); 
                    const MAX_WIDTH = 800; 
                    const MAX_HEIGHT = 800; 
                    let width = img.width; 
                    let height = img.height;
                    
                    if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } } 
                    else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
                    
                    canvas.width = width; canvas.height = height; 
                    const ctx = canvas.getContext('2d'); 
                    ctx.drawImage(img, 0, 0, width, height);
                    let compressedBase64 = canvas.toDataURL('image/jpeg', 0.6);

                    if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL.startsWith('http')) {
                        try {
                            let base64Data = compressedBase64.split(',')[1];
                            let response = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fileName: `Bukti_${baseOrder.no_wo}.jpg`, mimeType: 'image/jpeg', data: base64Data }) });
                            let result = await response.json(); 
                            if (result.status === 'success' && result.fileUrl) { baseOrder.foto_evidence = result.fileUrl; } 
                            else { baseOrder.foto_evidence = compressedBase64; }
                        } catch(err) { console.warn("Drive upload error, fallback:", err); baseOrder.foto_evidence = compressedBase64; }
                    } else { baseOrder.foto_evidence = compressedBase64; }
                    
                    finishSubmitOrder(baseOrder, user);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        } else { 
            finishSubmitOrder(baseOrder, user); 
        }
    }

                    <div><label class="block text-[9px] font-bold text-slate-500 mb-0.5">Foto Big Crane</label><input type="url" id="setting_icon_bc" value="${settings.icon_bc_url || ''}" placeholder="https://..." class="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-[10px] focus:outline-none focus:border-cyan-500"></div>
                    <div><label class="block text-[9px] font-bold text-slate-500 mb-0.5">Foto Lowboy</label><input type="url" id="setting_icon_lb" value="${settings.icon_lb_url || ''}" placeholder="https://..." class="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-[10px] focus:outline-none focus:border-cyan-500"></div>

        } else if (currentMasterTab === 'users') {
            let addUserFormHtml = `
            <form onsubmit="addAccountManual(event)" class="flex flex-col sm:flex-row gap-1.5 bg-slate-50 p-2.5 rounded-lg border border-slate-100 shadow-sm mt-2">
                <input type="text" id="new_user_nrp" oninput="this.value = this.value.toUpperCase()" placeholder="NRP..." class="flex-1 border border-slate-300 rounded-lg px-2 py-1.5 text-[10px] focus:outline-none focus:border-cyan-500" required>
                <input type="text" id="new_user_name" oninput="this.value = this.value.toUpperCase()" placeholder="Nama Lengkap..." class="flex-1 border border-slate-300 rounded-lg px-2 py-1.5 text-[10px] focus:outline-none focus:border-cyan-500" required>
                <select id="new_user_role" class="w-full sm:w-28 border border-slate-300 rounded-lg px-2 py-1.5 text-[10px] focus:outline-none focus:border-cyan-500 bg-white cursor-pointer" required>
                    <option value="" disabled selected>-- Role --</option>
                    <option value="USER">USER</option>
                    <option value="MANPOWER">MANPOWER</option>
                    <option value="GL">GL</option>
                    <option value="ADMIN">ADMIN</option>
                </select>
                <div class="relative flex-1">
                    <input type="password" id="new_user_pwd" placeholder="Password..." class="w-full border border-slate-300 rounded-lg px-2 py-1.5 pr-6 text-[10px] focus:outline-none focus:border-cyan-500" required>
                    <i id="toggleUserPwd" class="fa-regular fa-eye absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer pwd-toggle text-[9px]" onclick="togglePassword('new_user_pwd', 'toggleUserPwd')"></i>

                <button type="submit" class="bg-cyan-600 hover:bg-cyan-700 text-white font-bold px-3 py-1.5 rounded-lg text-[10px] whitespace-nowrap shadow-sm"><i class="fa-solid fa-plus mr-1"></i> Tambah</button>
            </form>`;

            contentHtml = `

                    <i class="fa-solid fa-search absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-[11px]"></i>
                    <input type="text" id="userSearchInput" value="${userSearchQuery}" oninput="userSearchQuery=this.value; renderUserTableOnly();" placeholder="Cari NRP / Nama..." class="w-full border border-slate-300 rounded-lg pl-7 pr-2 py-1.5 text-[10px] focus:outline-none focus:border-cyan-500 shadow-sm">
                </div>
                <select id="userRoleFilterInput" onchange="userRoleFilter=this.value; renderUserTableOnly();" class="w-full sm:w-32 border border-slate-300 rounded-lg px-2 py-1.5 text-[10px] focus:outline-none focus:border-cyan-500 bg-white shadow-sm cursor-pointer">

                    <option value="MANPOWER" ${userRoleFilter==='MANPOWER'?'selected':''}>MANPOWER</option>
                    <option value="GL" ${userRoleFilter==='GL'?'selected':''}>GL</option>
                    <option value="ADMIN" ${userRoleFilter==='ADMIN'?'selected':''}>ADMIN</option>
                </select>
            </div>

                        <tr>
                            <th class="p-2 uppercase cursor-pointer hover:bg-slate-100 transition-colors" onclick="handleUserSort('nrp')">NRP <span id="iconSortNrp">${getUserSortIcon('nrp')}</span></th>
                            <th class="p-2 uppercase cursor-pointer hover:bg-slate-100 transition-colors" onclick="handleUserSort('nama_lengkap')">Nama Lengkap <span id="iconSortNama">${getUserSortIcon('nama_lengkap')}</span></th>

                            <th class="p-2 uppercase text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody" class="divide-y divide-slate-100 text-[10px]">
