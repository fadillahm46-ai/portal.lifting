    /* Helper Kompresi Gambar Berbasis Canvas */
    function compressImageFile(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    try {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 720;
                        const MAX_HEIGHT = 720;
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    } catch(e) {
                        resolve(event.target.result);
                    }
                };
                img.onerror = () => reject(new Error("Gagal memproses file foto"));
                img.src = event.target.result;
            };
            reader.onerror = () => reject(new Error("Gagal membaca file foto"));
            reader.readAsDataURL(file);
        });
    }

    async function submitOrder(e) {
        e.preventDefault();
        const user = JSON.parse(localStorage.getItem('lifting_user')) || {}; 
        const cat = userOrderFleetMode; 
        const isAdminGL = user.role === 'ADMIN' || user.role === 'GL';
        const fotoInput = document.getElementById('req_foto');

        const btnSubmit = document.getElementById('btnSubmitOrder'); 
        if (btnSubmit) {
            btnSubmit.disabled = true; 
            btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Sedang di proses...';
        }
        showToast('Sedang di proses...', 'success');
        
        try {
            let tgl = document.getElementById('req_tgl')?.value || ''; 
            let jam = document.getElementById('req_jam')?.value || ''; 
            let statusTag = 'SCHEDULED';
            let shiftVal = '-';

            if (tgl) {
                let reqDate = new Date(`${tgl}T00:00:00`); 
                let now = new Date(); 
                now.setHours(0,0,0,0); 
                let diffDays = (reqDate - now) / (1000 * 60 * 60 * 24);
                
                if (cat === 'Big Crane') { 
                    if (diffDays < 3) statusTag = 'UNSCHEDULED'; 
                } else if (cat === 'Crane Truck' && jam) { 
                    let reqTime = new Date(`${tgl}T${jam}:00`); 
                    let diffHours = (reqTime - new Date()) / (1000 * 60 * 60); 
                    if (diffHours < 6) statusTag = 'UNSCHEDULED'; 
                    
                    let h = parseInt(jam.split(':')[0]);
                    shiftVal = (h >= 5 && h < 17) ? 'Shift 1' : 'Shift 2';
                }
            }

            let durasiVal = document.getElementById('req_durasi')?.value || ''; 
            let satuan = document.getElementById('req_satuan')?.value || (cat === 'Big Crane' ? 'HARI' : 'JAM');
            
            const valDelNama = isAdminGL ? (document.getElementById('del_nama')?.value || user.nama_lengkap) : (user.nama_lengkap || user.nrp);
            const valDelVendor = isAdminGL ? resolveMasterValue('del_vendor', 'del_vendor_other', 'perusahaan') : (user.perusahaan || 'PPA');
            const valDelDept = isAdminGL ? resolveMasterValue('del_dept', 'del_dept_other', 'departemen') : (user.departemen || 'PLANT');
            const valDelSect = isAdminGL ? resolveMasterValue('del_sect', 'del_sect_other', 'section') : (user.section || 'SE');
            const valDelWa = isAdminGL ? (document.getElementById('del_wa')?.value || user.no_wa) : (user.no_wa || '-');

            const baseOrder = {
                no_wo: generateWO(cat), 
                timestamp: new Date().toISOString(), 
                kategori: cat, 
                nrp_pemohon: user.nrp, 
                nama_pemohon: valDelNama, 
                perusahaan: valDelVendor, 
                departemen: valDelDept, 
                section: valDelSect,
                no_wa: valDelWa,
                tgl_pelaksanaan: tgl, 
                jam_pelaksanaan: jam, 
                shift: shiftVal, 
                durasi_request: `${durasiVal} ${satuan}`.trim(),
                lokasi_angkat: document.getElementById('req_lok_asal')?.value || '', 
                lokasi_tujuan: document.getElementById('req_lok_tujuan')?.value || '', 
                deskripsi: document.getElementById('req_deskripsi')?.value || '',
                status: statusTag, 
                gl: '', unit: '', operator: '', rigger: '', rigger2: '', jam_start_aktual: '', jam_end_aktual: '', durasi_aktual: '', final_inspeksi: '', alasan_telat: '', alasan_overtime: '',
                has_foto: false,
                foto_url: ''
            };

            // Penanganan Lampiran Foto Terikat Kuat (Strict Binding & Await Safety)
            if (fotoInput && fotoInput.files && fotoInput.files.length > 0) {
                baseOrder.has_foto = true;
                if (btnSubmit) btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Sedang di proses...';

                try {
                    const compressedBase64 = await compressImageFile(fotoInput.files[0]);
                    const base64Data = compressedBase64.split(',')[1];

                    // 1. Simpan preview instan ke cache lokal khusus No WO ini
                    setPhotoCache(baseOrder.no_wo, compressedBase64);

                    // 2. Unggah ke Google Drive via Google Apps Script dengan batas tunggu 5 detik
                    if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL.startsWith('http')) {
                        const uploadPromise = fetch(GOOGLE_SCRIPT_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({
                                no_wo: baseOrder.no_wo,
                                fileName: `FOTO_${baseOrder.no_wo}.jpg`,
                                mimeType: 'image/jpeg',
                                base64Data: base64Data
                            })
                        }).then(r => r.json());

                        const timeoutPromise = new Promise(resolve => setTimeout(() => resolve({ timeout: true }), 5000));
                        const res = await Promise.race([uploadPromise, timeoutPromise]);

                        if (res && res.url) {
                            baseOrder.foto_url = res.url;
                            setPhotoCache(baseOrder.no_wo, res.url);
                        }
                    }
                } catch (err) {
                    console.warn("Upload foto berjalan di background:", err);
                }
            } else {
                baseOrder.has_foto = false;
                baseOrder.foto_url = '';
            }

            if (fotoInput) fotoInput.value = '';

            // Pengiriman 1 Tahap Langsung ke Supabase (Direct-to-Cloud)
            if (btnSubmit) btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Mengirim ke database server...';

            let serverSuccess = false;
            let serverErrorDetail = '';

            try {
                const clean = sanitizeOrderForSupabase(baseOrder);
                if (supabaseClient) {
                    const { data, error } = await supabaseClient
                        .from('orders')
                        .upsert(clean, { onConflict: 'no_wo' })
                        .select();
                    if (!error && Array.isArray(data) && data.length > 0) {
                        serverSuccess = true;
                    } else if (error) {
                        serverErrorDetail = error.message || 'Gagal insert order ke Supabase';
                    }
                } else {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?on_conflict=no_wo`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Prefer': 'resolution=merge-duplicates,return=representation'
                        },
                        body: JSON.stringify(clean)
                    });
                    if (res.ok) {
                        serverSuccess = true;
                    } else {
                        const errBody = await res.json().catch(() => ({}));
                        serverErrorDetail = errBody.message || `Status HTTP ${res.status}`;
                    }
                }
            } catch(netErr) {
                serverSuccess = false;
                serverErrorDetail = netErr.message || 'Jaringan internet terputus';
            }

            // Jika server gagal merespons, batalkan dan JANGAN hapus formulir
            if (!serverSuccess) {
                showToast(`Gagal mengirim order: ${serverErrorDetail}. Silakan coba kirim ulang saat sinyal stabil.`, 'error');
                if (btnSubmit) {
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Submit Order';
                }
                return;
            }

            // Sukses di server: bersihkan draft, update cache, dan alihkan ke monitoring
            await finishSubmitOrder(baseOrder, user);

        } catch (err) {
            console.error("Gagal memproses submit order:", err);
            showToast('Terjadi kesalahan: ' + (err.message || 'Gagal membuat order'), 'error');
            if (btnSubmit) {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Submit Order';
            }
        }
    }

    async function finishSubmitOrder(newOrder, user) {
        clearOrderDraft();
        let orders = getOrders();
        orders = orders.filter(o => o.no_wo !== newOrder.no_wo);
        orders.unshift(newOrder);
        saveOrders(orders);
        
        currentTab = 'monitoring';
        window.location.hash = 'monitoring';
        userOrderFleetMode = null;
        renderApp(false);
        showSuccessAnim('check', 'Order Berhasil!', 'Pesanan Anda telah diterima di server database.');
    }

    /* ========================================================
       SISTEM SMART PHOTO CACHE (LOAD INSTAN & ISOLASI WO)
       ======================================================== */
    function getPhotoCache() {
        try {
            return JSON.parse(localStorage.getItem('lifting_photo_cache')) || {};
        } catch(e) { return {}; }
    }

    function setPhotoCache(no_wo, url) {
        if (!no_wo || !url) return;
        try {
            let cache = getPhotoCache();
            const keys = Object.keys(cache);
            if (keys.length > 50) {
                delete cache[keys[0]]; // Hapus item terlama jika cache melebihi 50 item
            }
            cache[String(no_wo).trim()] = url;
            localStorage.setItem('lifting_photo_cache', JSON.stringify(cache));
        } catch(e) {}
    }

    function renderPhotoHtml(url, no_wo, container, badge) {
        if (badge) {
            badge.innerText = 'Tersedia';
            badge.className = 'text-[8px] text-emerald-600 font-bold';
        }
        const isBase64 = url.startsWith('data:image');
        container.innerHTML = `
            <div class="flex flex-col items-center gap-1.5 w-full">
                <img src="${url}" alt="Foto ${no_wo}" class="max-h-48 max-w-full rounded border border-slate-200 object-contain shadow-xs cursor-zoom-in hover:opacity-95 transition-opacity" onclick="openImageViewer('${url}')">
                <div class="flex gap-2">
                    <button type="button" onclick="openImageViewer('${url}')" class="text-[9px] text-cyan-600 hover:text-cyan-800 font-semibold underline flex items-center gap-1">
                        <i class="fa-solid fa-magnifying-glass-plus"></i> Perbesar
                    </button>
                    ${!isBase64 ? `
                    <span class="text-slate-300">|</span>
                    <a href="${url}" target="_blank" rel="noopener noreferrer" class="text-[9px] text-blue-600 hover:text-blue-800 font-semibold underline flex items-center gap-1">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i> Buka Foto Asli
                    </a>` : ''}
                </div>
            </div>
        `;
    }

    async function fetchOrderPhotoFromDrive(no_wo) {
        const container = document.getElementById('detailPhotoContainer');
        const badge = document.getElementById('photoStatusBadge');
        if (!container) return;

        const targetWo = String(no_wo || '').trim();
        const baseLookupWo = targetWo.replace(/-L\d+$/i, '');

        // 1. CEK CACHE LOKAL: Hanya gunakan jika persis milik No WO ini
        const cache = getPhotoCache();
        const cachedPhoto = cache[targetWo] || (targetWo.includes('-L') ? cache[baseLookupWo] : null);
        if (cachedPhoto) {
            renderPhotoHtml(cachedPhoto, targetWo, container, badge);
            return;
        }

        if (!GOOGLE_SCRIPT_URL || !GOOGLE_SCRIPT_URL.startsWith('http')) {
            if (badge) { badge.innerText = 'Tidak Dikonfigurasi'; badge.className = 'text-[8px] text-slate-400 font-medium'; }
            container.innerHTML = `<span class="text-[9px] text-slate-400 italic">URL Google Apps Script belum dikonfigurasi.</span>`;
            return;
        }

        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 6000);
            
            let res = await fetch(`${GOOGLE_SCRIPT_URL}?no_wo=${encodeURIComponent(targetWo)}`, {
                signal: controller.signal
            });
            clearTimeout(timeoutId);

            if (!res.ok) throw new Error('HTTP ' + res.status);
            let data = await res.json();

            // Jika tiket turunan (-L) dan belum ada foto baru, periksa tiket induknya
            if ((!data || !data.found) && baseLookupWo !== targetWo) {
                try {
                    const resBase = await fetch(`${GOOGLE_SCRIPT_URL}?no_wo=${encodeURIComponent(baseLookupWo)}`);
                    if (resBase.ok) {
                        const dataBase = await resBase.json();
                        if (dataBase && dataBase.found) {
                            data = dataBase;
                        }
                    }
                } catch(e) {}
            }

            // Validasi Ketat: Pastikan respons yang dikembalikan server cocok dengan No WO yang diminta
            if (data && data.found && data.url && (data.no_wo === targetWo || data.no_wo === baseLookupWo)) {
                setPhotoCache(targetWo, data.url);
                renderPhotoHtml(data.url, targetWo, container, badge);
            } else {
                if (badge) {
                    badge.innerText = 'Tidak Ada';
                    badge.className = 'text-[8px] text-slate-400 font-medium';
                }
                container.innerHTML = `
                    <span class="text-[9px] text-slate-400 italic">
                        <i class="fa-regular fa-image mr-1"></i> Tidak ada lampiran foto untuk order ini.
                    </span>
                `;
            }
        } catch (err) {
            console.warn("Gagal cek foto Drive:", err);
            if (badge) {
                badge.innerText = 'Gagal Muat';
                badge.className = 'text-[8px] text-amber-600 font-medium';
            }
            container.innerHTML = `
                <div class="flex flex-col items-center gap-1 py-1">
                    <span class="text-[9px] text-slate-500">
                        Foto tidak dapat dimuat (Waktu tunggu habis atau server sibuk).
                    </span>
                    <button type="button" onclick="fetchOrderPhotoFromDrive('${targetWo}')" class="text-[9px] text-cyan-600 hover:underline font-bold mt-1 flex items-center gap-1">
                        <i class="fa-solid fa-rotate-right"></i> Coba Muat Ulang
                    </button>
                </div>
            `;
        }
    }

                    <button type="submit" class="flex-1 bg-[#0891b2] hover:bg-cyan-700 text-white font-bold py-1.5 rounded-sm text-[11px] transition-colors shadow-sm">${job.status === 'COMPLETED' ? 'Simpan Revisi' : 'Simpan & Validasi'}</button>
                </div>

        `;
        document.getElementById('editJobModal').classList.remove('hidden');

    async function saveAdminEditJob(e, wo) {
        e.preventDefault();
        let jobs = getOrders();
        // Hapus filter status !== 'CANCELED' agar indeks job canceled tetap ditemukan
        let idx = jobs.findIndex(j => j.no_wo === wo);
        if(idx === -1) return;

        const selectedGL = document.getElementById('edit_gl').value;
        const selectedUnit = document.getElementById('edit_unit').value;

        // Validasi: Cegah penugasan jika unit sedang Non-Aktif / OFF
        const unitSt = getUnitStatus(selectedUnit);
        if (selectedUnit && unitSt.status === 'INACTIVE') {
            return showToast(`Unit ${selectedUnit} berstatus Non-Aktif (${unitSt.reason || 'OFF'}). Aktifkan terlebih dahulu unit ini melalui kartu unit!`, 'error');
        }

        let prevStatus = jobs[idx].status;
        let prevOp = jobs[idx].operator;

        jobs[idx].tgl_pelaksanaan = document.getElementById('edit_tgl').value;
        jobs[idx].jam_pelaksanaan = document.getElementById('edit_jam').value;
        if(jobs[idx].kategori === 'Crane Truck' && jobs[idx].jam_pelaksanaan) {
            let h = parseInt(jobs[idx].jam_pelaksanaan.split(':')[0]);
            jobs[idx].shift = (h >= 5 && h < 17) ? 'Shift 1' : 'Shift 2';
        }
        
        if (jobs[idx].kategori !== 'Big Crane') {
            jobs[idx].lokasi_angkat = document.getElementById('edit_lok_asal').value;
            jobs[idx].lokasi_tujuan = document.getElementById('edit_lok_tujuan').value;
        } else {
            jobs[idx].lokasi_angkat = document.getElementById('edit_lok_asal') ? document.getElementById('edit_lok_asal').value : '';
            jobs[idx].lokasi_tujuan = '';
        }
        jobs[idx].deskripsi = document.getElementById('edit_deskripsi').value;
        
        const op = document.getElementById('edit_op').value;
        const rig = document.getElementById('edit_rig').value;
        const rig2 = document.getElementById('edit_rig2') ? document.getElementById('edit_rig2').value : '';
        
        jobs[idx].gl = selectedGL;
        jobs[idx].unit = selectedUnit;
        jobs[idx].operator = op;
        jobs[idx].rigger = rig;
        jobs[idx].rigger2 = rig2;

        // Simpan perubahan warna WO ke tabel company_status Supabase
        const chosenWoColor = document.getElementById('edit_wo_color')?.value;
        if (chosenWoColor && jobs[idx].perusahaan) {
            jobs[idx].warna_wo = chosenWoColor;
            await setCompanyWoColor(jobs[idx].perusahaan, chosenWoColor);
        }

        if (jobs[idx].status === 'COMPLETED') {
            jobs[idx].jam_start_aktual = document.getElementById('edit_start').value;
            jobs[idx].jam_end_aktual = document.getElementById('edit_end').value;
            jobs[idx].durasi_aktual = document.getElementById('edit_durasi_aktual').value;
            jobs[idx].final_inspeksi = document.getElementById('edit_inspeksi').value;
            jobs[idx].alasan_telat = document.getElementById('edit_alasan_telat').value;
            jobs[idx].alasan_overtime = document.getElementById('edit_alasan_overtime').value;
        }

        let isValidated = (selectedGL && selectedUnit);

        if (isValidated && (prevStatus === 'SCHEDULED' || prevStatus === 'UNSCHEDULED' || prevStatus === 'PENDING')) {
            jobs[idx].status = 'ON PROGRESS';
            showToast('Job divalidasi ke Manpower!');
        } else {
            showToast('Perubahan Disimpan!');
        }

        saveOrders(jobs);

        // Validasi Admin/GL langsung kirim pembaruan ke tabel orders Supabase
        if (SUPABASE_KEY && !SUPABASE_KEY.includes('PASTE_KUNCI')) {
            try {
                const cleanRow = sanitizeOrderForSupabase(jobs[idx]);
                if (supabaseClient) {
                    await supabaseClient.from('orders').update(cleanRow).eq('no_wo', wo);
                } else {
                    await fetch(`${SUPABASE_URL}/rest/v1/orders?no_wo=eq.${encodeURIComponent(wo)}`, {
                        method: 'PATCH',
                        headers: {
                            'Content-Type': 'application/json',
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        },
                        body: JSON.stringify(cleanRow)
                    });
                }
            } catch(e) {}
        }

        document.getElementById('editJobModal').classList.add('hidden');
        renderApp(true); 
    }

    function confirmHapusOrder(wo) {
        openCustomConfirm('Hapus Data', `Apakah Anda yakin ingin menghapus order ${wo}?`, async () => {
            let jobs = getOrders().filter(j => j.no_wo !== wo);
            saveOrders(jobs);
            
            if (SUPABASE_KEY && !SUPABASE_KEY.includes('PASTE_KUNCI')) {
                try {
                    if (supabaseClient) {
                        await supabaseClient.from('orders').delete().eq('no_wo', wo);
                    } else {
                        await fetch(`${SUPABASE_URL}/rest/v1/orders?no_wo=eq.${encodeURIComponent(wo)}`, {
                            method: 'DELETE',
                            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                        });
                    }
                } catch(e) { console.warn(e); }
            }
            showToast('Data dihapus!'); 
            document.getElementById('editJobModal').classList.add('hidden'); 
            renderApp(true);
        });
    }

    function initBcCalendar() {
        const el = document.getElementById('fullcalendar-container');
        if (!el || typeof FullCalendar === 'undefined') return;

        const currentUser = JSON.parse(localStorage.getItem('lifting_user')) || {};
        const isAdminOrGL = currentUser.role === 'ADMIN' || currentUser.role === 'GL';

        // Filter pekerjaan Big Crane berdasarkan role
        // Admin & GL: Semua job yang belum di-action maupun sudah selesai (CANCELED diabaikan)
        // User: Hanya yang masih terjadwal dan in-progress (COMPLETED & CANCELED dihilangkan)
        const jobs = getOrders().filter(j => {
            if (j.kategori !== 'Big Crane' || j.status === 'CANCELED') return false;
            if (isAdminOrGL) {
                return true; // Tampilkan SCHEDULED, UNSCHEDULED, PENDING, ON PROGRESS, COMPLETED
            } else {
                return ['SCHEDULED', 'UNSCHEDULED', 'PENDING', 'ON PROGRESS'].includes(j.status);
            }
        });

        const eventColors = [
            'rgba(14, 165, 233, 0.7)',
            'rgba(30, 64, 175, 0.7)',
            'rgba(16, 185, 129, 0.7)',
            'rgba(234, 179, 8, 0.7)',
            'rgba(249, 115, 22, 0.7)'
        ];

        const events = jobs.map((j, idx) => {
            let startStr = j.tgl_pelaksanaan;
            let endStr = null;
            if (j.durasi_request && j.durasi_request.includes('HARI')) {
                let days = parseInt(j.durasi_request.split(' ')[0]) || 0;
                if (days > 0) {
                    let endDate = new Date(j.tgl_pelaksanaan);
                    endDate.setDate(endDate.getDate() + days);
                    endStr = endDate.getFullYear() + '-' + String(endDate.getMonth() + 1).padStart(2, '0') + '-' + String(endDate.getDate()).padStart(2, '0');
                }
            } else if (j.jam_pelaksanaan) {
                startStr += 'T' + j.jam_pelaksanaan + ':00';
            }

            let color = eventColors[idx % eventColors.length];

            // Tanda status di ujung teks:
            // Schedule / Unscheduled / Pending: ⚪ Abu-abu
            // Progres: 🔵 Biru tua
            // Completed: 🟢 Hijau
            let statusEmoji = '⚪';
            if (j.status === 'COMPLETED') {
                statusEmoji = '🟢';
            } else if (j.status === 'ON PROGRESS') {
                statusEmoji = '🔵';
            } else {
                statusEmoji = '⚪';
            }

            let displayTitle = `${(j.deskripsi || 'TANPA DESKRIPSI').toUpperCase()} ${statusEmoji}`;

            let eventObj = { title: displayTitle, start: startStr, backgroundColor: color, borderColor: color, textColor: '#000000', extendedProps: { wo: j.no_wo, status: j.status, deskripsi: j.deskripsi } };
            if (endStr) { eventObj.end = endStr; eventObj.allDay = true; }
            return eventObj;
        });

        if (el._calendarInstance) { el._calendarInstance.destroy(); }
        const calendar = new FullCalendar.Calendar(el, {
            locale: 'id',
            firstDay: 0,
            initialView: 'dayGridMonth',
            headerToolbar: { left: 'prev,next today', center: 'title', right: '' },
            buttonText: { today: 'Hari Ini' },
            events: events,
            height: 'auto',
            contentHeight: 'auto',
            dayMaxEvents: 5,
            moreLinkText: function(num) { return '+' + num; },
            moreLinkClick: function(arg) {
                if (arg && arg.jsEvent) arg.jsEvent.preventDefault();
                let dateStr = arg ? arg.dateStr : null;
                if (!dateStr && arg && arg.date) {
                    let d = arg.date;
                    dateStr = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                }
                if (dateStr) showDayJobsModal(dateStr);
                return false;
            },
            eventClick: function(info) { info.jsEvent.preventDefault(); },
            dateClick: function(info) { showDayJobsModal(info.dateStr); },
            datesSet: function(info) {
                let currentMonth = info.view.currentStart;
                let yyyy = currentMonth.getFullYear();
                let mm = String(currentMonth.getMonth() + 1).padStart(2, '0');
                let monthPrefix = `${yyyy}-${mm}`;
                let jobCount = jobs.filter(j => j.tgl_pelaksanaan && j.tgl_pelaksanaan.startsWith(monthPrefix)).length;
                let textEl = document.getElementById('bcTotalJobText');
                if (textEl) textEl.innerText = jobCount;

                // Menempatkan legenda status di ujung kanan toolbar kalender
                const toolbar = el.querySelector('.fc-toolbar');
                if (toolbar) {
                    const chunks = toolbar.querySelectorAll('.fc-toolbar-chunk');
                    const rightChunk = chunks.length >= 3 ? chunks[2] : chunks[chunks.length - 1];
                    if (rightChunk) {
                        let legendEl = document.getElementById('bcCalendarLegend');
                        if (!legendEl) {
                            legendEl = document.createElement('div');
                            legendEl.id = 'bcCalendarLegend';
                        }
                        legendEl.className = 'flex items-center gap-1.5 flex-wrap justify-end';
                        if (legendEl.parentElement !== rightChunk) {
                            rightChunk.appendChild(legendEl);
                        }
                        if (isAdminOrGL) {
                            legendEl.innerHTML = `
                                <span class="inline-flex items-center gap-1 text-[8px] sm:text-[9px] font-bold text-slate-700 bg-slate-100 border border-slate-200 px-1.5 py-0.5 rounded shadow-2xs" title="Scheduled / Unscheduled">
                                    <span>⚪</span> SCH/UNSC
                                </span>
                                <span class="inline-flex items-center gap-1 text-[8px] sm:text-[9px] font-bold text-blue-700 bg-blue-50 border border-blue-200 px-1.5 py-0.5 rounded shadow-2xs" title="On Progress">
                                    <span>🔵</span> PROGRES
                                </span>
                                <span class="inline-flex items-center gap-1 text-[8px] sm:text-[9px] font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-1.5 py-0.5 rounded shadow-2xs" title="Completed">
                                    <span>🟢</span> COMPLETED
                                </span>
                            `;
                        } else {
                            legendEl.innerHTML = `
                                <span class="inline-flex items-center gap-1 text-[8px] sm:text-[9px] font-bold text-slate-700 bg-slate-100 border border-slate-200 px-1.5 py-0.5 rounded shadow-2xs" title="Scheduled / Unscheduled">
                                    <span>⚪</span> SCH/UNSC
                                </span>
                                <span class="inline-flex items-center gap-1 text-[8px] sm:text-[9px] font-bold text-blue-700 bg-blue-50 border border-blue-200 px-1.5 py-0.5 rounded shadow-2xs" title="On Progress">
                                    <span>🔵</span> PROGRES
                                </span>
                            `;
                        }
                    }
                }
            }
        });
        calendar.render();
        el._calendarInstance = calendar;
        window.bcCalendarInstance = calendar;
    }

    function showDayJobsModal(dateStr) {
        let clickDate = new Date(dateStr); clickDate.setHours(0,0,0,0);
        const currentUser = JSON.parse(localStorage.getItem('lifting_user')) || {};
        const isAdminOrGL = currentUser.role === 'ADMIN' || currentUser.role === 'GL';

        const jobs = getOrders().filter(j => {
            if (j.kategori !== 'Big Crane' || j.status === 'CANCELED') return false;
            if (!isAdminOrGL && j.status === 'COMPLETED') return false;

            let startDate = new Date(j.tgl_pelaksanaan); startDate.setHours(0,0,0,0);
            let endDate = new Date(j.tgl_pelaksanaan); endDate.setHours(0,0,0,0);
            if (j.durasi_request && j.durasi_request.includes('HARI')) {
                let days = parseInt(j.durasi_request.split(' ')[0]) || 0;
                if (days > 0) { endDate.setDate(endDate.getDate() + days - 1); }
            }
            return clickDate >= startDate && clickDate <= endDate;
        });

        let content = '';
        let dateObj = new Date(dateStr);
        let dateIndo = dateObj.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

        if (jobs.length === 0) {
            content = `<div class="flex flex-col items-center justify-center p-6 text-center"><i class="fa-regular fa-calendar-xmark text-4xl text-slate-300 mb-2"></i><p class="text-slate-500 font-medium text-[11px]">Jadwal Kosong</p><p class="text-slate-400 text-[9px] mt-1">Tidak ada jadwal aktif Big Crane untuk tanggal ini.</p></div>`;
        } else {
            content = jobs.map(job => {
                let statusColor = job.status === 'COMPLETED' ? 'bg-emerald-100 text-emerald-700 border-emerald-200' : (job.status === 'ON PROGRESS' ? 'bg-blue-100 text-blue-700 border-blue-200' : (job.status === 'PENDING' ? 'bg-orange-100 text-orange-700 border-orange-200' : 'bg-slate-100 text-slate-700 border-slate-200'));
                let statusEmoji = job.status === 'COMPLETED' ? '🟢' : (job.status === 'ON PROGRESS' ? '🔵' : '⚪');
                return `<div class="bg-white border border-slate-200 rounded-md p-2.5 mb-2 cursor-pointer hover:border-cyan-400 shadow-sm transition-all" onclick="document.getElementById('dayJobsModal').classList.add('hidden'); viewJobDetail('${job.no_wo}')"><div class="flex justify-between items-center mb-1 border-b border-slate-100 pb-1"><span class="text-[10px] font-mono ${getWoColorClass(job, 'text-cyan-600 font-bold')}">${job.no_wo}</span><span class="${statusColor} text-[8px] font-bold px-1.5 py-0.5 border rounded-sm tracking-wide flex items-center gap-1"><span>${statusEmoji}</span>${job.status}</span></div><div class="text-[11px] font-bold text-slate-800 uppercase mt-1 leading-tight">${job.unit ? '['+job.unit+']' : '<span class="text-red-500">[TBA]</span>'} ${job.nama_pemohon}</div><div class="text-[9px] text-slate-600 line-clamp-2 mt-1 bg-slate-50 p-1.5 rounded border border-slate-100 leading-tight" title="${job.deskripsi || ''}">${job.deskripsi} ${statusEmoji}</div></div>`;
            }).join('');
        }
        document.getElementById('dayJobsTitle').innerText = dateIndo;
        document.getElementById('dayJobsContent').innerHTML = content;
        document.getElementById('dayJobsModal').classList.remove('hidden');
    }

    // Simpan otomatis draft setiap kali pengguna mengetik atau mengubah nilai input form
    document.addEventListener("input", (e) => {
        if (currentTab === 'order') saveOrderDraft();
    });
    document.addEventListener("change", (e) => {
        if (currentTab === 'order') saveOrderDraft();
    });
    window.addEventListener("beforeunload", () => {
        if (currentTab === 'order') saveOrderDraft();
    });
    window.addEventListener("blur", () => {
        if (currentTab === 'order') saveOrderDraft();
    });

    window.addEventListener('load', () => { 
        if (window.innerWidth >= 768) hideSplashScreen();
        fetchFromSupabase().catch(e => console.warn(e)).finally(() => { 
            const user = JSON.parse(localStorage.getItem('lifting_user'));
            if (user) {
                const draft = getOrderDraft();
                if (draft && draft.fleetMode) {
                    userOrderFleetMode = draft.fleetMode;
                }
                const homeTab = (user.role === 'ADMIN' || user.role === 'GL') ? 'dashboard' : (user.role === 'USER' ? 'order' : 'dashboard');
                if(!window.location.hash) {
                    history.replaceState(null, null, '#' + (userOrderFleetMode ? 'order' : homeTab));
                    currentTab = userOrderFleetMode ? 'order' : homeTab;
                } else {
                    currentTab = window.location.hash.substring(1);
                    if (currentTab === 'order' && draft && draft.fleetMode) {
                        userOrderFleetMode = draft.fleetMode;
                    }
                }
            }
            renderApp(false); 
            checkAppVersionUpdate();
            if (window.innerWidth >= 768) hideSplashScreen();
        }); 
    });

    window.addEventListener('hashchange', () => {
        const user = JSON.parse(localStorage.getItem('lifting_user'));
        if (!user) return;
        const homeTab = (user.role === 'ADMIN' || user.role === 'GL') ? 'dashboard' : (user.role === 'USER' ? 'order' : 'dashboard');
        
        let hash = window.location.hash.substring(1);
        if (!hash) {
            currentTab = homeTab; 
            userOrderFleetMode = null; mpFleetMode = null;
            renderApp(false);
            return;
        }
        if (currentTab !== hash) {
            currentTab = hash;
            userOrderFleetMode = null; mpFleetMode = null;
            renderApp(false);
        }
    });

    /* ========================================================
       SISTEM AUTO-RESUME, RECONNECT & FOCUS SYNC (HP & DESKTOP)
       Mencegah keharusan membersihkan / swipe-up aplikasi di HP
       ======================================================== */
    let isSyncingOnResume = false;
    async function handleAppResume() {
        if (isSyncingOnResume) return;
        isSyncingOnResume = true;
        try {
            const user = JSON.parse(localStorage.getItem('lifting_user'));
            if (user) {
                // 1. Pulihkan koneksi Realtime WebSocket hanya jika belum aktif / terputus
                if (!realtimeChannel || realtimeChannel.state === 'closed' || realtimeChannel.state === 'errored') {
                    initSupabaseRealtime();
                }
                
                // 2. Tarik langsung data order & status terbaru dari database Supabase
                await fetchFromSupabase(false);
                
                // 3. Perbarui badge indikator notifikasi & periksa pembaruan versi
                updateNotificationBadge();
                checkAppVersionUpdate();
            }
        } catch (err) {
            console.warn("Auto-resume sync error:", err);
        } finally {
            setTimeout(() => { isSyncingOnResume = false; }, 1200);
        }
    }

    // Deteksi saat layar HP menyala atau aplikasi kembali dibuka dari latar belakang
    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
            if (currentTab === 'order') saveOrderDraft();
        } else if (document.visibilityState === "visible") {
            handleAppResume();
        }
    });

    // Deteksi fokus peramban mobile (iOS Safari & Android Chrome saat tab kembali aktif)
    window.addEventListener("focus", handleAppResume);
    window.addEventListener("pageshow", handleAppResume);

    // Heartbeat sync otomatis setiap 18 detik jika layar sedang aktif terbuka
    setInterval(() => {
        if (document.visibilityState === "visible" && !isAnyModalOpen() && currentTab !== 'order') {
            if (Date.now() - lastFetchTimestamp > 18000) {
                fetchFromSupabase(false);
            }
        }
    }, 15000);

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').then((registration) => {
                console.log('PWA ServiceWorker terdaftar:', registration);
            }).catch((error) => {
                console.log('PWA ServiceWorker gagal:', error);
            });
        });
    }

    // Blokir Pull-to-Refresh di Mobile & Shortcut Refresh di Desktop
    window.addEventListener('keydown', function(e) {
        if (e.key === 'F5' || e.keyCode === 116) {
            e.preventDefault();
            showToast('Aplikasi sudah realtime otomatis.', 'success');
            return false;
        }
        if ((e.ctrlKey || e.metaKey) && (e.key === 'r' || e.key === 'R' || e.keyCode === 82)) {
            e.preventDefault();
            showToast('Aplikasi sudah realtime otomatis.', 'success');
            return false;
        }
    });

    let mobileTouchStartY = 0;
    window.addEventListener('touchstart', function(e) {
        if (e.touches.length === 1) {
            mobileTouchStartY = e.touches[0].clientY;
        }
    }, { passive: true });

    window.addEventListener('touchmove', function(e) {
        if (e.touches.length !== 1) return;
        const touchCurrentY = e.touches[0].clientY;
        const diffY = touchCurrentY - mobileTouchStartY;

        // Cari elemen scrollable yang sedang disentuh jari user
        let targetEl = e.target;
        let scrollableEl = null;
        while (targetEl && targetEl !== document.body && targetEl !== document.documentElement) {
            const style = window.getComputedStyle(targetEl);
            if ((style.overflowY === 'auto' || style.overflowY === 'scroll') && targetEl.scrollHeight > targetEl.clientHeight) {
                scrollableEl = targetEl;
                break;
            }
            targetEl = targetEl.parentElement;
        }

        const currentScrollTop = scrollableEl ? scrollableEl.scrollTop : (window.pageYOffset || document.documentElement.scrollTop || 0);

        // Jika user sedang berada di tengah halaman (scrollTop > 0), JANGAN PERNAH cegah sentuhan (biarkan scroll ke atas lancar)
        if (currentScrollTop > 0) {
            return;
        }

        // Hanya cegah gesture reload jika posisi sudah benar-benar mentok di paling atas (scrollTop <= 0) dan ditarik ke bawah
        if (currentScrollTop <= 0 && diffY > 0) {
            if (e.cancelable) {
                e.preventDefault();
            }
        }
    }, { passive: false });
</script>
