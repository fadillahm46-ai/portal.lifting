    async function fetchFromSupabase(isManual = false) {
        if (!SUPABASE_KEY || SUPABASE_KEY.includes('PASTE_KUNCI')) return;
        try {
            const [resOrders, resSettings, resMaster, resUsers] = await Promise.all([
                fetch(`${SUPABASE_URL}/rest/v1/orders?select=*&order=timestamp.desc`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }),
                fetch(`${SUPABASE_URL}/rest/v1/settings?id=eq.1`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }),
                fetch(`${SUPABASE_URL}/rest/v1/master_data?id=eq.1`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }),
                fetch(`${SUPABASE_URL}/rest/v1/users?select=*`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } })
            ]);

            if (resOrders.ok) {
                const data = await resOrders.json();
                if(Array.isArray(data)) localStorage.setItem('lifting_orders', JSON.stringify(data));
            }
            if (resSettings.ok) {
                const sData = await resSettings.json();
                if(sData && sData.length > 0) localStorage.setItem('lifting_settings', JSON.stringify(sData[0]));
            }
            if (resMaster.ok) {
                const mData = await resMaster.json();
                if (mData && mData.length > 0 && Object.keys(mData[0]).length > 1) {
                    let cleanMaster = {...mData[0]}; delete cleanMaster.id;
                    localStorage.setItem('lifting_master_data', JSON.stringify(cleanMaster));
                }
            }
            if (resUsers.ok) {
                const uData = await resUsers.json();
                if(uData && uData.length > 0) localStorage.setItem('lifting_users', JSON.stringify(uData));
            }
            if(isManual) { showToast("Data berhasil ditarik!", "success"); renderApp(false); }
        } catch(e) { console.warn("Gagal mengambil data:", e); }
    }

    async function syncToSupabase(orders) {
        if (!SUPABASE_KEY || SUPABASE_KEY.includes('PASTE_KUNCI')) return;
        try {
            if (!orders || orders.length === 0) return;
            const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?on_conflict=no_wo`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'resolution=merge-duplicates' },
                body: JSON.stringify(orders)
            });
            if (!res.ok) {
                const errDetail = await res.text();
                showToast("Gagal sync ke cloud: " + errDetail, "error");
            }
        } catch (e) { console.error("Koneksi gagal:", e); }
    }

    async function syncMasterDataToSupabase(m) {
        if (!SUPABASE_KEY || SUPABASE_KEY.includes('PASTE_KUNCI')) return;
        try {
            let payload = { id: 1, ...m };
            await fetch(`${SUPABASE_URL}/rest/v1/master_data?on_conflict=id`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'resolution=merge-duplicates' },
                body: JSON.stringify(payload)
            });
        } catch(e) { console.error(e); }
    }

    async function syncUsersToSupabase(users) {

    function copyText(text, label) {
        const el = document.createElement('textarea');
        el.value = text; el.setAttribute('readonly', ''); el.style.position = 'absolute'; el.style.left = '-9999px';
        document.body.appendChild(el); el.select();
        try { document.execCommand('copy'); showToast(label + ' disalin!'); } catch (err) { showToast('Gagal menyalin', 'error'); }
        document.body.removeChild(el);
    }

        }

    function generateWO(kategori) {
        const date = new Date();
        const yyyy = date.getFullYear(); const mm = String(date.getMonth() + 1).padStart(2, '0'); const dd = String(date.getDate()).padStart(2, '0');
        let prefix = kategori === 'Big Crane' ? 'BC-' : (kategori === 'Lowboy' ? 'LB-' : 'CT-');
        const datePrefix = `${prefix}${yyyy}${mm}${dd}-`;
        
        let maxNumber = 0;
        getOrders().forEach(job => {
            if (job.no_wo && job.no_wo.startsWith(datePrefix)) {
                const parts = job.no_wo.split('-');
                if (parts.length >= 3) {
                    const num = parseInt(parts[2].split('-L')[0], 10);
                    if (!isNaN(num) && num > maxNumber) maxNumber = num;
                }
            }
        });
        return `${datePrefix}${maxNumber + 1}`;
    }

    function toggleAuthMode() { document.getElementById('authForm').classList.toggle('hidden'); document.getElementById('signupForm').classList.toggle('hidden'); }

    function handleLogin(e) {
        e.preventDefault();
        const nrp = document.getElementById('loginNrp').value.trim(); const pwd = document.getElementById('loginPwd').value;
        const users = getUsers(); const user = users.find(u => u.nrp === nrp && u.password_hash === pwd && u.status_akun === 'ACTIVE');
        const errorMsg = document.getElementById('loginErrorMsg');
        
        if (user) {
            localStorage.setItem('lifting_user', JSON.stringify(user));
            currentTab = (user.role === 'ADMIN' || user.role === 'GL') ? 'dashboard' : 'monitoring';
            userOrderFleetMode = null; mpFleetMode = null; renderApp(false);
        } else {
            errorMsg.innerHTML = '<i class="fa-solid fa-circle-exclamation mr-1"></i>NRP atau Password salah!'; errorMsg.classList.remove('hidden');
        }
    }

    function handleLogout() { localStorage.removeItem('lifting_user'); renderApp(false); }

    function handleSignup(e) {
        e.preventDefault();
        const users = getUsers(); const nrp = document.getElementById('regNrp').value.trim();
        if (users.find(u => u.nrp === nrp)) return showToast('NRP terdaftar!', 'error');

        const newUser = {
            nrp: nrp, nama_lengkap: document.getElementById('regName').value, jabatan: document.getElementById('regJabatan').value,
            perusahaan: document.getElementById('regPerusahaan').value, departemen: document.getElementById('regDepartemen').value,
            section: document.getElementById('regSection').value, no_wa: document.getElementById('regWa').value,
            password_hash: document.getElementById('regPwd').value, role: 'USER', status_akun: 'ACTIVE'
        };
        users.push(newUser); saveUsers(users); showToast('Pendaftaran sukses!'); toggleAuthMode();
    }

    // ================= DASHBOARD & CHARTS LOGIC =================
    
    function getDashboardView() {
        let jobs = getOrders();
        
        let today = getLocalDateString();
        let tglMulai = document.getElementById('dash_tgl_mulai') ? document.getElementById('dash_tgl_mulai').value : today;
        let tglSelesai = document.getElementById('dash_tgl_selesai') ? document.getElementById('dash_tgl_selesai').value : today;
        
        let dashShift = document.getElementById('dash_shift') ? document.getElementById('dash_shift').value : 'ALL';
        let dashUnit = document.getElementById('dash_unit') ? document.getElementById('dash_unit').value : 'ALL';

        let filteredJobs = jobs.filter(j => j.tgl_pelaksanaan >= tglMulai && j.tgl_pelaksanaan <= tglSelesai);
        if (dashShift !== 'ALL') filteredJobs = filteredJobs.filter(j => j.shift === dashShift);
        if (dashUnit !== 'ALL') filteredJobs = filteredJobs.filter(j => j.kategori === dashUnit);

        let cntOrder = filteredJobs.length;
        let cntProg = filteredJobs.filter(j => j.status === 'ON PROGRESS').length;
        let cntPend = filteredJobs.filter(j => j.status === 'PENDING').length; 
        let cntDone = filteredJobs.filter(j => j.status === 'COMPLETED').length;

    function initDashboardCharts() {
        if(!document.getElementById('lineChart') || !document.getElementById('barChart') || typeof Chart === 'undefined') return;
        
        let allJobs = getOrders();
        
        let dashTglMulai = document.getElementById('dash_tgl_mulai').value || getLocalDateString();
        let dashTglSelesai = document.getElementById('dash_tgl_selesai').value || getLocalDateString();
        let dashShift = document.getElementById('dash_shift').value;
        let dashUnit = document.getElementById('dash_unit').value;

        if (dashShift !== 'ALL') allJobs = allJobs.filter(j => j.shift === dashShift);
        if (dashUnit !== 'ALL') allJobs = allJobs.filter(j => j.kategori === dashUnit);

        let filteredJobsRange = allJobs.filter(j => j.tgl_pelaksanaan >= dashTglMulai && j.tgl_pelaksanaan <= dashTglSelesai);
        let countS1 = filteredJobsRange.filter(j => j.shift === 'Shift 1').length;
        let countS2 = filteredJobsRange.filter(j => j.shift === 'Shift 2').length;

        if(window.dashBarChart) window.dashBarChart.destroy();
        const ctxBar = document.getElementById('barChart').getContext('2d');
        window.dashBarChart = new Chart(ctxBar, {
            type: 'bar',
            data: {
                labels: ['Shift 1', 'Shift 2'],
                datasets: [{
                    label: 'Jumlah Order',
                    data: [countS1, countS2],
                    backgroundColor: ['#0891b2', '#6366f1'],
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 9 } } }, x: { ticks: { font: { size: 10, weight: 'bold' } } } }
            }
        });

        let refDate = new Date(dashTglMulai);
        let day = refDate.getDay();
        let diff = refDate.getDate() - day + (day === 0 ? -6 : 1); 
        let mondayThisWeek = new Date(refDate.setDate(diff));
        
        let dataThisWeek = [];
        let dataLastWeek = [];
        let labels = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];

        for(let i=0; i<7; i++) {
            let dThis = new Date(mondayThisWeek); dThis.setDate(dThis.getDate() + i);
            let dLast = new Date(mondayThisWeek); dLast.setDate(dLast.getDate() - 7 + i);

            let strThis = dThis.getFullYear() + '-' + String(dThis.getMonth()+1).padStart(2,'0') + '-' + String(dThis.getDate()).padStart(2,'0');
            let strLast = dLast.getFullYear() + '-' + String(dLast.getMonth()+1).padStart(2,'0') + '-' + String(dLast.getDate()).padStart(2,'0');

            dataThisWeek.push(allJobs.filter(j => j.tgl_pelaksanaan === strThis).length);
            dataLastWeek.push(allJobs.filter(j => j.tgl_pelaksanaan === strLast).length);
        }

        if(window.dashLineChart) window.dashLineChart.destroy();
        const ctxLine = document.getElementById('lineChart').getContext('2d');
        window.dashLineChart = new Chart(ctxLine, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Minggu Ini',
                        data: dataThisWeek,
                        borderColor: '#0891b2',
                        backgroundColor: 'rgba(8, 145, 178, 0.1)',
                        tension: 0.4,
                        fill: true,
                        borderWidth: 2,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#0891b2',
                        pointBorderWidth: 2
                    },
                    {
                        label: 'Minggu Lalu',
                        data: dataLastWeek,
                        borderColor: '#94a3b8',
                        borderDash: [5, 5],
                        tension: 0.4,
                        fill: false,
                        borderWidth: 2,
                        pointRadius: 0
                    }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: { legend: { labels: { font: { size: 10, family: "'Inter', sans-serif" }, usePointStyle: true, boxWidth: 8 } } },
                scales: { 
                    y: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 9 } }, grid: { color: '#f1f5f9' } },
                    x: { ticks: { font: { size: 9 } }, grid: { display: false } }
                }
            }
        });
    }

    function getMonitoringView() {
        let currentUser = JSON.parse(localStorage.getItem('lifting_user'));
        let jobs = getOrders();
        
        if (currentUser.role === 'ADMIN' || currentUser.role === 'GL') {
            let tglMulai = document.getElementById('filter_tgl_mulai') ? document.getElementById('filter_tgl_mulai').value : '';
            let tglSelesai = document.getElementById('filter_tgl_selesai') ? document.getElementById('filter_tgl_selesai').value : '';
            let filterShift = document.getElementById('filter_shift') ? document.getElementById('filter_shift').value : 'ALL';

            if (tglMulai && tglSelesai) jobs = jobs.filter(j => j.tgl_pelaksanaan >= tglMulai && j.tgl_pelaksanaan <= tglSelesai);
            if (filterShift !== 'ALL') jobs = jobs.filter(j => j.shift === filterShift);
            if (filterKategori !== 'ALL') jobs = jobs.filter(j => j.kategori === filterKategori);

            jobs.sort((a, b) => {
                if (sortColumn === 'aksi') {
                    let isNeedValA = (a.status === 'SCHEDULED' || a.status === 'UNSCHEDULED' || (a.status === 'PENDING' && (!a.operator || !a.rigger))) ? 1 : 0;
                    let isNeedValB = (b.status === 'SCHEDULED' || b.status === 'UNSCHEDULED' || (b.status === 'PENDING' && (!b.operator || !b.rigger))) ? 1 : 0;
                    let comparison = isNeedValB - isNeedValA; 
                    if (sortDirection === 'asc') comparison = isNeedValA - isNeedValB;
                    if (comparison === 0) {
                        let valA = (a.timestamp || '').toString().toLowerCase(); let valB = (b.timestamp || '').toString().toLowerCase();
                        return valA.localeCompare(valB, undefined, {numeric: true}) * (sortDirection === 'asc' ? 1 : -1);
                    }
                    return comparison;
                }

                let valA = (a[sortColumn] || '').toString().toLowerCase(); 
                let valB = (b[sortColumn] || '').toString().toLowerCase();
                let comparison = valA.localeCompare(valB, undefined, {numeric: true});
                if (comparison < 0) return sortDirection === 'asc' ? -1 : 1; 
                if (comparison > 0) return sortDirection === 'asc' ? 1 : -1; 
                return 0;

                                let isNeedValidation = (job.status === 'SCHEDULED' || job.status === 'UNSCHEDULED' || (job.status === 'PENDING' && (!job.operator || !job.rigger)));
                                
                                let actionBtnClass = '';
                                let actionBtnText = '';
                                let actionBtnIcon = '';

                                if (isNeedValidation) {
                                    actionBtnClass = 'bg-red-50 hover:bg-red-100 text-red-600 border-red-200';
                                    actionBtnText = 'Validasi';
                                    actionBtnIcon = '<i class="fa-solid fa-clipboard-check"></i>';
                                } else {
                                    actionBtnClass = 'bg-blue-50 hover:bg-blue-100 text-blue-600 border-blue-200';
                                    actionBtnText = 'Edit';
                                    actionBtnIcon = '<i class="fa-solid fa-pen"></i>';
                                }

                                let kendalaHtml = '';
                                if(job.final_inspeksi) kendalaHtml += `<div class="text-[9px] bg-green-50 text-green-700 border border-green-200 rounded-sm px-1 py-0.5 mb-0.5 w-full"><i class="fa-solid fa-check-circle mr-0.5"></i>Insp: ${job.final_inspeksi}</div>`;
                                if(job.alasan_telat) kendalaHtml += `<div class="text-[9px] bg-red-50 text-red-600 border border-red-200 rounded-sm px-1 py-0.5 mb-0.5 whitespace-normal leading-tight w-full"><i class="fa-solid fa-circle-exclamation mr-0.5"></i>Telat: ${job.alasan_telat}</div>`;
                                if(job.alasan_overtime) kendalaHtml += `<div class="text-[9px] bg-red-50 text-red-600 border border-red-200 rounded-sm px-1 py-0.5 mb-0.5 whitespace-normal leading-tight w-full"><i class="fa-solid fa-circle-exclamation mr-0.5"></i>Over: ${job.alasan_overtime}</div>`;
                                if(!job.final_inspeksi && !job.alasan_telat && !job.alasan_overtime) kendalaHtml = '<span class="text-slate-400">-</span>';

                                return `
                                <tr class="hover:bg-slate-50 transition-colors">
                                    <td class="px-1 md:px-2 py-1.5 text-center align-top relative z-10">
                                        <div class="flex items-center justify-center">
                                            <button onclick="openAdminEditJob('${job.no_wo}')" class="${actionBtnClass} text-[10px] px-2 py-1 rounded-sm border shadow-sm w-full md:w-auto flex justify-center items-center gap-1" title="${actionBtnText} Job">${actionBtnIcon} <span class="hidden md:inline font-bold">${actionBtnText}</span></button>

                                    </td>

                                        <div class="text-[8px] md:text-[9px] text-slate-500 mb-1 leading-tight">${job.timestamp.split('T')[0]} ${job.timestamp.split('T')[1].substring(0,5)}</div>
                                        <div class="md:hidden"><span class="${statusColor} border text-[7px] px-1 py-0.5 rounded-sm font-bold leading-none whitespace-nowrap inline-block">${job.status}</span></div>
                                    </td>
                                    <td class="px-2 py-1.5 align-top">
                                        <div class="font-semibold text-slate-800 text-[9px] md:text-[10px] uppercase truncate max-w-[60px] md:max-w-[90px] leading-tight" title="${job.nama_pemohon}">${job.nama_pemohon}</div>
                                        <div class="text-[8px] md:text-[9px] text-slate-500 truncate max-w-[60px] md:max-w-[90px] leading-tight" title="${job.perusahaan} - ${job.departemen}">${job.departemen}</div>
                                    </td>
                                    <td class="px-2 py-1.5 align-top hidden md:table-cell">
                                        <div class="font-bold text-slate-700 text-[10px]">${job.tgl_pelaksanaan}</div>
                                        <div class="text-[9px] text-slate-500">${job.shift} | Req: ${job.jam_pelaksanaan || '-'} (${job.durasi_request})</div>
                                    </td>
                                    <td class="px-2 py-1.5 align-top">
                                        ${job.kategori !== 'Big Crane' ? `<div class="text-[9px] md:text-[10px] text-orange-600 font-semibold flex items-start gap-1 mb-0.5 leading-tight"><i class="fa-solid fa-location-dot mt-0.5"></i> <span>${job.lokasi_angkat || '-'} <i class="fa-solid fa-arrow-right text-[7px] mx-0.5 text-slate-400"></i> ${job.lokasi_tujuan || '-'}</span></div>` : ''}
                                        <div class="text-[9px] text-emerald-700 flex items-start gap-1"><i class="fa-solid fa-flag-checkered mt-0.5"></i> <span class="leading-tight truncate max-w-[150px] lg:max-w-none" title="${job.deskripsi}">${job.deskripsi}</span></div>
                                    </td>
                                    <td class="px-2 py-1.5 text-center align-top hidden md:table-cell">
                                        <span class="${statusColor} border text-[9px] px-1.5 py-0.5 rounded-sm font-semibold whitespace-nowrap inline-block">${job.status}</span>
                                    </td>
                                    <td class="px-2 py-1.5 text-[9px] align-top text-slate-600 leading-tight hidden md:table-cell">
                                        <div class="flex flex-col gap-0.5">
                                            <div><span class="text-slate-400">GL:</span> <span class="font-semibold text-slate-800">${job.gl || '-'}</span></div>
                                            <div><span class="text-slate-400">Unit:</span> <span class="font-semibold text-slate-800">${job.unit || '-'}</span></div>
                                            <div><span class="text-slate-400">OP:</span> <span class="font-semibold text-slate-800">${job.operator || '-'}</span></div>
                                            <div><span class="text-slate-400">Rg:</span> <span class="font-semibold text-slate-800">${job.rigger || '-'}${job.rigger2 ? ', ' + job.rigger2 : ''}</span></div>
                                        </div>
                                    </td>
                                    <td class="px-2 py-1.5 text-[9px] align-top text-slate-600 font-mono tracking-tighter hidden md:table-cell whitespace-nowrap">
                                        ${job.jam_start_aktual || '--:--'} s/d ${job.jam_end_aktual || '--:--'}
                                    </td>
                                    <td class="px-2 py-1.5 text-center text-[10px] font-semibold text-slate-800 align-top hidden md:table-cell">
                                        ${job.durasi_aktual ? job.durasi_aktual + ' J' : '-'}
                                    </td>
                                    <td class="px-2 py-1.5 align-top hidden md:table-cell">
                                        <div class="flex flex-col">${kendalaHtml}</div>
                                    </td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            </div>`;
            return html;
        }

        jobs = jobs.filter(j => j.nrp_pemohon === currentUser.nrp);
        let filterCat = document.getElementById('filter_kategori') ? document.getElementById('filter_kategori').value : 'ALL';
        if (filterCat !== 'ALL') jobs = jobs.filter(j => j.kategori === filterCat);
        
        let html = `<h2 class="text-sm font-bold text-slate-800 mb-2"><i class="fa-solid fa-list-check mr-1.5 text-cyan-600"></i>Data Order Pekerjaan</h2>`;

        if (jobs.length === 0) {
            html += `<div class="bg-white rounded-md p-6 text-center border border-slate-200 shadow-sm"><i class="fa-solid fa-folder-open text-3xl text-slate-300 mb-2"></i><p class="text-slate-400 text-xs">Belum ada data.</p></div>`;
            return html;
        }

        jobs.forEach(job => {
            let statusColor = job.status === 'COMPLETED' ? 'bg-emerald-50 text-emerald-600 border-emerald-200' :
                              (job.status === 'ON PROGRESS' ? 'bg-blue-50 text-blue-600 border-blue-200' :
                              (job.status === 'PENDING' ? 'bg-orange-50 text-orange-600 border-orange-200' :
                              (job.status === 'CANCELED' ? 'bg-red-50 text-red-600 border-red-200' : 'bg-slate-50 text-slate-600 border-slate-200')));

            html += `
            <div class="bg-white rounded-md p-2.5 mb-2 border border-slate-200 shadow-sm relative text-[11px] cursor-pointer hover:shadow-md transition-shadow">
                <div class="absolute top-2 right-2 ${statusColor} border px-1.5 py-0.5 rounded-sm text-[8px] font-bold tracking-wider">${job.status}</div>
                
                <div class="text-[9px] text-cyan-600 font-mono font-bold mb-1 hover:underline relative z-20" onclick="viewJobDetail('${job.no_wo}')">${job.no_wo}</div>
                <div class="flex items-center gap-1.5 mb-1.5">
                    <span class="font-bold text-slate-800 text-xs">${job.kategori}</span>
                    <span class="text-slate-300">|</span>
                    <span class="text-slate-500 text-[10px]">${job.tgl_pelaksanaan} ${job.jam_pelaksanaan || ''}</span>
                </div>

                <div class="bg-slate-50 rounded-sm border border-slate-100 p-1.5 grid grid-cols-3 gap-1.5 mb-1.5 text-[10px]">
                    <div><div class="text-slate-400 text-[9px]">Durasi Req</div><div class="font-bold text-slate-700">${job.durasi_request}</div></div>
                    <div><div class="text-slate-400 text-[9px]">Lokasi</div><div class="font-medium text-slate-600 truncate">${job.lokasi_angkat || '-'} <i class="fa-solid fa-arrow-right text-[8px] text-slate-400 mx-0.5"></i> ${job.lokasi_tujuan || '-'}</div></div>
                    <div><div class="text-slate-400 text-[9px]">Unit</div><div class="font-bold text-cyan-600">${job.unit || 'Belum ada'}</div></div>
                </div>
                
                <div class="text-[10px] text-slate-500 mb-2 pl-1 border-l-2 border-slate-300 truncate">${job.deskripsi}</div>

                <div class="pt-1.5 border-t border-slate-100 flex items-center justify-between" onclick="viewJobDetail('${job.no_wo}')">
                    <div class="text-[9px] text-slate-400"><i class="fa-solid fa-user-circle mr-1"></i>${job.nama_pemohon}</div>
                    <div class="text-cyan-600 text-[9px] font-semibold">Klik untuk Detail</div>
                </div>
            </div>`;
        });
        return html;
    }

                fotoHtml = `
                <div class="mb-3">
                    <div class="text-[8px] font-bold text-slate-400 uppercase mb-0.5">LAMPIRAN FOTO</div>

                        <img src="${job.foto_evidence}" class="w-full max-h-48 object-contain rounded-sm shadow-sm" alt="Lampiran Foto">
                    </div>
                </div>`;

                fotoHtml = `
                <div class="mb-3">
                    <div class="text-[8px] font-bold text-slate-400 uppercase mb-0.5">LAMPIRAN FOTO</div>

                <div class="text-[9px] text-cyan-700 flex items-center gap-1"><i class="fa-regular fa-building w-3 text-center"></i> ${job.departemen} | <span class="font-semibold">${job.section || 'N/A'}</span> | ${job.perusahaan}</div>
            </div>
            <div class="grid grid-cols-2 gap-y-2 gap-x-2 text-[10px] mb-3">
                <div><div class="text-[8px] font-bold text-slate-400 uppercase mb-0.5">NO. WO</div><div class="font-mono text-[9px] font-semibold text-slate-700">${job.no_wo}</div></div>
                <div><div class="text-[8px] font-bold text-slate-400 uppercase mb-0.5">STATUS</div><div class="font-bold text-cyan-600 text-[9px]">${job.status}</div></div>
                <div><div class="text-[8px] font-bold text-slate-400 uppercase mb-0.5">GROUP LEADER</div><div class="font-bold text-slate-700">${job.gl || '-'}</div></div>
                <div><div class="text-[8px] font-bold text-slate-400 uppercase mb-0.5">UNIT</div><div class="font-bold text-slate-700">${job.unit || '-'}</div></div>
                <div><div class="text-[8px] font-bold text-slate-400 uppercase mb-0.5">TGL & JAM</div><div class="font-bold text-slate-700">${job.tgl_pelaksanaan} ${job.jam_pelaksanaan||''}</div></div>
                <div><div class="text-[8px] font-bold text-slate-400 uppercase mb-0.5">DURASI REQ</div><div class="font-bold text-slate-700">${job.durasi_request}</div></div>
                <div><div class="text-[8px] font-bold text-slate-400 uppercase mb-0.5">OPERATOR</div><div class="font-bold text-slate-700">${job.operator || '-'}</div></div>
                <div><div class="text-[8px] font-bold text-slate-400 uppercase mb-0.5">RIGGER</div><div class="font-bold text-slate-700">${job.rigger || '-'}${job.rigger2 ? ', ' + job.rigger2 : ''}</div></div>

            ${job.kategori !== 'Big Crane' ? `
            <div class="mb-2">
                <div class="text-[8px] font-bold text-slate-400 uppercase mb-0.5">RUTE / LOKASI</div>
                <div class="bg-slate-50 border border-slate-100 p-1.5 rounded-sm text-[10px] font-semibold text-slate-600">${job.lokasi_angkat||'-'} <i class="fa-solid fa-arrow-right mx-1 text-[8px] text-slate-400"></i> ${job.lokasi_tujuan||'-'}</div>

                <button onclick="document.getElementById('detailJobModal').classList.add('hidden')" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white font-bold py-1.5 rounded-sm text-[10px] shadow-sm">Tutup Detail</button>

        `;

    }

    function openAdminEditJob(wo) {
        const job = getOrders().find(j => j.no_wo === wo && j.status !== 'CANCELED');
        if(!job) return;
        const currentUser = JSON.parse(localStorage.getItem('lifting_user'));
        
        const m = getMasterData();
        let unitOptions = '';
        if (job.kategori === 'Crane Truck') unitOptions = m.unit_ct.map(u => `<option value="${u}" ${job.unit===u?'selected':''}>${u}</option>`).join('');
        else if (job.kategori === 'Big Crane') unitOptions = m.unit_big_crane.map(u => `<option value="${u}" ${job.unit===u?'selected':''}>${u}</option>`).join('');
        else unitOptions = m.unit_lowboy.map(u => `<option value="${u}" ${job.unit===u?'selected':''}>${u}</option>`).join('');

        const glOptions = m.gl.map(g => `<option value="${g}" ${job.gl===g?'selected':''}>${g}</option>`).join('');
        const opOptions = m.operator.map(o => `<option value="${o}" ${job.operator===o?'selected':''}>${o}</option>`).join('');
        const rigOptions1 = m.rigger.map(r => `<option value="${r}" ${job.rigger===r?'selected':''}>${r}</option>`).join('');
        const rigOptions2 = m.rigger.map(r => `<option value="${r}" ${job.rigger2===r?'selected':''}>${r}</option>`).join('');

        let riggerHTML = '';
        if (job.kategori === 'Big Crane') {
            riggerHTML = `
                <div><label class="block text-[10px] font-bold text-slate-500 mb-0.5">Rigger 1 *</label><select id="edit_rig" class="w-full border border-slate-300 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-cyan-500" required><option value="">-- Pilih --</option>${rigOptions1}</select></div>
                <div><label class="block text-[10px] font-bold text-slate-500 mb-0.5">Rigger 2 *</label><select id="edit_rig2" class="w-full border border-slate-300 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-cyan-500" required><option value="">-- Pilih --</option>${rigOptions2}</select></div>
            `;
        } else {
             riggerHTML = `
                <div><label class="block text-[10px] font-bold text-slate-500 mb-0.5">Rigger ${job.kategori === 'Lowboy' ? '*' : '(Opsional)'}</label><select id="edit_rig" class="w-full border border-slate-300 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-cyan-500" ${job.kategori === 'Lowboy' ? 'required' : ''}><option value="">-- Pilih --</option>${rigOptions1}</select></div>
            `;
        }

        let aktualHtml = '';
        if (job.status === 'COMPLETED') {
            aktualHtml = `
                <hr class="my-2 border-slate-200">
                <div class="text-[9px] font-bold text-orange-500 tracking-wider mb-1 uppercase"><i class="fa-solid fa-user-shield mr-1"></i>Revisi Data Lapangan (MP)</div>
                <div class="grid grid-cols-3 gap-2">
                    <div><label class="block text-[10px] font-bold text-slate-500 mb-0.5">Mulai Aktual</label><input type="time" id="edit_start" value="${job.jam_start_aktual || ''}" class="w-full border border-slate-300 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-cyan-500"></div>
                    <div><label class="block text-[10px] font-bold text-slate-500 mb-0.5">Selesai Aktual</label><input type="time" id="edit_end" value="${job.jam_end_aktual || ''}" class="w-full border border-slate-300 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-cyan-500"></div>
                    <div><label class="block text-[10px] font-bold text-slate-500 mb-0.5">Durasi (Jam)</label><input type="number" step="0.01" id="edit_durasi_aktual" value="${job.durasi_aktual || ''}" class="w-full border border-slate-300 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-cyan-500"></div>
                </div>
                <div class="grid grid-cols-1 gap-2 mt-2">
                    <div><label class="block text-[10px] font-bold text-green-600 mb-0.5">Final Inspeksi</label><input type="time" id="edit_inspeksi" value="${job.final_inspeksi || ''}" class="w-full border border-green-300 bg-green-50 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-green-500"></div>
                    <div><label class="block text-[10px] font-bold text-red-500 mb-0.5">Alasan Telat</label><textarea id="edit_alasan_telat" class="w-full border border-red-300 bg-red-50 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-red-500 h-10">${job.alasan_telat || ''}</textarea></div>
                    <div><label class="block text-[10px] font-bold text-red-500 mb-0.5">Alasan Overtime</label><textarea id="edit_alasan_overtime" class="w-full border border-red-300 bg-red-50 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-red-500 h-10">${job.alasan_overtime || ''}</textarea></div>
                </div>
            `;
        }

        document.getElementById('editJobContent').innerHTML = `
            <form onsubmit="saveAdminEditJob(event, '${wo}')" class="space-y-2">
                <div class="bg-cyan-50 border border-cyan-100 p-1.5 rounded-sm mb-1 text-center">
                    <p class="text-[10px] font-bold text-cyan-700">${job.no_wo} (${job.kategori})</p>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="block text-[10px] font-bold text-slate-500 mb-0.5">Tgl Pelaksanaan</label><input type="date" id="edit_tgl" value="${job.tgl_pelaksanaan}" class="w-full border border-slate-300 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-cyan-500" required></div>
                    <div><label class="block text-[10px] font-bold text-slate-500 mb-0.5">Jam Req</label><input type="time" id="edit_jam" value="${job.jam_pelaksanaan || ''}" class="w-full border border-slate-300 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-cyan-500" ${job.kategori==='Crane Truck'?'required':''}></div>
                </div>
                ${job.kategori !== 'Big Crane' ? `
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="block text-[10px] font-bold text-slate-500 mb-0.5">Lokasi Asal</label><input type="text" id="edit_lok_asal" value="${job.lokasi_angkat || ''}" class="w-full border border-slate-300 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-cyan-500" required></div>
                    <div><label class="block text-[10px] font-bold text-slate-500 mb-0.5">Lokasi Tujuan</label><input type="text" id="edit_lok_tujuan" value="${job.lokasi_tujuan || ''}" class="w-full border border-slate-300 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-cyan-500" required></div>
                </div>` : ''}
                <div><label class="block text-[10px] font-bold text-slate-500 mb-0.5">Deskripsi / Beban</label><input type="text" id="edit_deskripsi" value="${job.deskripsi || ''}" class="w-full border border-slate-300 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-cyan-500" required></div>

                <hr class="my-2 border-slate-200">
                <div class="text-[9px] font-bold text-slate-400 tracking-wider mb-1">PENUGASAN (GL)</div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Group Leader *</label>
                        <select id="edit_gl" class="w-full border border-slate-300 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-cyan-500" required><option value="">-- Pilih --</option>${glOptions}</select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Unit *</label>
                        <select id="edit_unit" class="w-full border border-slate-300 rounded-sm px-1.5 py-1 text-xs focus:outline-none focus:border-cyan-500" required><option value="">-- Pilih --</option>${unitOptions}</select>
                    </div>
                </div>

    function saveAdminEditJob(e, wo) {
        e.preventDefault();
        let jobs = getOrders();
        let idx = jobs.findIndex(j => j.no_wo === wo && j.status !== 'CANCELED');
        if(idx === -1) return;

        jobs[idx].tgl_pelaksanaan = document.getElementById('edit_tgl').value;
        jobs[idx].jam_pelaksanaan = document.getElementById('edit_jam').value;
        if(jobs[idx].kategori === 'Crane Truck' && jobs[idx].jam_pelaksanaan) {
            let h = parseInt(jobs[idx].jam_pelaksanaan.split(':')[0]);
            jobs[idx].shift = (h >= 5 && h < 17) ? 'Shift 1' : 'Shift 2';
        }
        
        if (jobs[idx].kategori !== 'Big Crane') {
            jobs[idx].lokasi_angkat = document.getElementById('edit_lok_asal').value;
            jobs[idx].lokasi_tujuan = document.getElementById('edit_lok_tujuan').value;
        }
        jobs[idx].deskripsi = document.getElementById('edit_deskripsi').value;
        
        const selectedGL = document.getElementById('edit_gl').value;
        const selectedUnit = document.getElementById('edit_unit').value;
        const op = document.getElementById('edit_op').value;
        const rig = document.getElementById('edit_rig').value;
        const rig2 = document.getElementById('edit_rig2') ? document.getElementById('edit_rig2').value : '';
        
        jobs[idx].gl = selectedGL;
        jobs[idx].unit = selectedUnit;
        jobs[idx].operator = op;
        jobs[idx].rigger = rig;
        jobs[idx].rigger2 = rig2;

        if (jobs[idx].status === 'COMPLETED') {
            jobs[idx].jam_start_aktual = document.getElementById('edit_start').value;
            jobs[idx].jam_end_aktual = document.getElementById('edit_end').value;
            jobs[idx].durasi_aktual = document.getElementById('edit_durasi_aktual').value;
            jobs[idx].final_inspeksi = document.getElementById('edit_inspeksi').value;
            jobs[idx].alasan_telat = document.getElementById('edit_alasan_telat').value;
            jobs[idx].alasan_overtime = document.getElementById('edit_alasan_overtime').value;
        }

        let isValidated = false;
        if (jobs[idx].kategori === 'Big Crane') {
            isValidated = (selectedGL && selectedUnit && op && rig && rig2);
        } else if (jobs[idx].kategori === 'Lowboy') {
            isValidated = (selectedGL && selectedUnit && op && rig);
        } else {
            isValidated = (selectedGL && selectedUnit);
        }

        if (isValidated && (jobs[idx].status === 'SCHEDULED' || jobs[idx].status === 'UNSCHEDULED' || jobs[idx].status === 'PENDING')) {
            jobs[idx].status = 'ON PROGRESS';
            showToast('Job divalidasi!');
        } else {
            showToast('Perubahan Disimpan!');
        }

        saveOrders(jobs);
        document.getElementById('editJobModal').classList.add('hidden');
        renderApp(true); 
    }

    function confirmHapusOrder(wo) {
        openCustomConfirm('Hapus Data', `Apakah Anda yakin ingin menghapus order ${wo}?`, async () => {
            let jobs = getOrders().filter(j => j.no_wo !== wo);
            localStorage.setItem('lifting_orders', JSON.stringify(jobs));
            
            if (SUPABASE_KEY && !SUPABASE_KEY.includes('PASTE_KUNCI')) {
                try { await fetch(`${SUPABASE_URL}/rest/v1/orders?no_wo=eq.${wo}`, { method: 'DELETE', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }); } 
                catch(e) { console.warn(e); }
            }
            showToast('Data dihapus!'); 
            document.getElementById('editJobModal').classList.add('hidden'); 
            renderApp(true);
        });
    }

    function downloadCSV() {
        const jobs = getOrders();
        if(jobs.length === 0) return showToast("Tidak ada data", "error");
        
        let csvContent = "data:text/csv;charset=utf-8,No WO,Status,Pemohon,Dept,Kategori,Tgl Pelaksanaan,Jam Req,Shift,Durasi Req,Lokasi Angkat,Lokasi Tujuan,Deskripsi,GL,Unit,Operator,Rigger,Jam Start,Jam End,Durasi Aktual,Final Inspeksi,Alasan Telat,Alasan Overtime\n";
        
        jobs.forEach(j => {
            let riggerCombined = j.rigger || '';
            if (j.rigger2) riggerCombined += ' & ' + j.rigger2;
            let row = [
                j.no_wo, j.status, j.nama_pemohon, j.departemen, j.kategori,
                j.tgl_pelaksanaan, j.jam_pelaksanaan||'', j.shift, j.durasi_request,
                `"${(j.lokasi_angkat||'').replace(/"/g, '""')}"`, `"${(j.lokasi_tujuan||'').replace(/"/g, '""')}"`, `"${(j.deskripsi||'').replace(/"/g, '""')}"`,
                j.gl||'', j.unit||'', j.operator||'', `"${riggerCombined}"`,
                j.jam_start_aktual||'', j.jam_end_aktual||'', j.durasi_aktual||'',
                j.final_inspeksi||'', `"${(j.alasan_telat||'').replace(/"/g, '""')}"`, `"${(j.alasan_overtime||'').replace(/"/g, '""')}"`
            ].join(",");
            csvContent += row + "\n";
        });
        const encodedUri = encodeURI(csvContent); const link = document.createElement("a");
        link.setAttribute("href", encodedUri); link.setAttribute("download", `Data_Lifting_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }

    function calculateShift() {
        const jamInput = document.getElementById('jam_pelaksanaan'); if (!jamInput || !jamInput.value) return;

        const h = parseInt(jamInput.value.split(':')[0]); shiftField.value = (h >= 5 && h < 17) ? "Shift 1" : "Shift 2";

    async function submitOrder(e) {
        e.preventDefault();
        const btnSubmit = document.getElementById('btnSubmitOrder'); btnSubmit.disabled = true; btnSubmit.innerText = "Orderan sedang diproses...";
        const user = JSON.parse(localStorage.getItem('lifting_user')); const cat = userOrderFleetMode; const isAdminGL = user.role === 'ADMIN' || user.role === 'GL';
        
        let tgl = document.getElementById('tgl_pelaksanaan')?.value || ''; let jam = document.getElementById('jam_pelaksanaan')?.value || ''; let statusTag = 'SCHEDULED';
        if (tgl) {
            let reqDate = new Date(`${tgl}T00:00:00`); let now = new Date(); now.setHours(0,0,0,0); let diffDays = (reqDate - now) / (1000 * 60 * 60 * 24);
            if (cat === 'Big Crane') { if (diffDays < 3) statusTag = 'UNSCHEDULED'; } 
            else if (cat === 'Crane Truck' && jam) { let reqTime = new Date(`${tgl}T${jam}:00`); let diffHours = (reqTime - new Date()) / (1000 * 60 * 60); if (diffHours < 6) statusTag = 'UNSCHEDULED'; }
        }

        let durasiVal = document.getElementById('durasi_req')?.value || ''; let satuan = document.getElementById('satuan_durasi')?.value || 'JAM';
        const baseOrder = {
            no_wo: generateWO(cat), timestamp: new Date().toISOString(), kategori: cat, nrp_pemohon: user.nrp, 
            nama_pemohon: isAdminGL ? document.getElementById('del_nama').value : user.nama_lengkap, perusahaan: isAdminGL ? document.getElementById('del_vendor').value : user.perusahaan, 
            departemen: isAdminGL ? document.getElementById('del_dept').value : user.departemen, section: user.section || '-', no_wa: isAdminGL ? document.getElementById('del_wa').value : user.no_wa,
            tgl_pelaksanaan: tgl, jam_pelaksanaan: jam, shift: document.getElementById('shift')?.value || '-', durasi_request: `${durasiVal} ${satuan}`,
            lokasi_angkat: document.getElementById('lok_angkat')?.value || '', lokasi_tujuan: document.getElementById('lok_tujuan')?.value || '', deskripsi: document.getElementById('deskripsi')?.value || '',
            status: statusTag, foto_evidence: '', gl: '', unit: '', operator: '', rigger: '', rigger2: '', jam_start_aktual: '', jam_end_aktual: '', durasi_aktual: '', final_inspeksi: '', alasan_telat: '', alasan_overtime: '', alasan_pending: ''
        };

        const fotoInput = document.getElementById('foto_evidence');
        if (fotoInput && fotoInput.files.length > 0) {
            const file = fotoInput.files[0]; const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = async function() {
                    const canvas = document.createElement('canvas'); const MAX_WIDTH = 800; const MAX_HEIGHT = 800; let width = img.width; let height = img.height;
                    if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } } else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
                    canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    let compressedBase64 = canvas.toDataURL('image/jpeg', 0.6);

                    if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL.startsWith('http')) {
                        try {
                            let base64Data = compressedBase64.split(',')[1];
                            let response = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fileName: `Bukti_${baseOrder.no_wo}.jpg`, mimeType: 'image/jpeg', data: base64Data }) });
                            let result = await response.json(); if (result.status === 'success' && result.fileUrl) { baseOrder.foto_evidence = result.fileUrl; } else { baseOrder.foto_evidence = compressedBase64; }
                        } catch(err) { console.warn("Drive upload error, fallback to local:", err); baseOrder.foto_evidence = compressedBase64; }
                    } else { baseOrder.foto_evidence = compressedBase64; }
                    finishSubmitOrder(baseOrder, user);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        } else { finishSubmitOrder(baseOrder, user); }
    }

    function finishSubmitOrder(newOrder, user) {
        const orders = getOrders();
        orders.unshift(newOrder);
        saveOrders(orders);
        
        currentTab = (user.role === 'ADMIN' || user.role === 'GL') ? 'dashboard' : 'monitoring';
        userOrderFleetMode = null;
        renderApp(false);
        showSuccessAnim('check', 'Order Terkirim!', 'Pemesanan alat berat Anda berhasil disubmit.');
    }

        } else {

                addFormHtml = `<form onsubmit="addAccountMasterData(event, '${currentMasterTab}')" class="flex flex-col sm:flex-row gap-1.5 mb-2 bg-slate-50 p-2 rounded-sm border border-slate-100"><input type="text" id="new_master_name" placeholder="Nama..." class="flex-1 border border-slate-300 rounded-sm px-2 py-1 text-[10px] focus:outline-none focus:border-cyan-500" required><input type="text" id="new_master_nrp" placeholder="NRP..." class="flex-1 border border-slate-300 rounded-sm px-2 py-1 text-[10px] focus:outline-none focus:border-cyan-500" required><div class="relative flex-1"><input type="password" id="new_master_pwd" placeholder="Pwd..." class="w-full border border-slate-300 rounded-sm px-2 py-1 pr-6 text-[10px] focus:outline-none focus:border-cyan-500" required><i id="toggleMasterPwd" class="fa-regular fa-eye absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer pwd-toggle text-[9px]" onclick="togglePassword('new_master_pwd', 'toggleMasterPwd')"></i></div><button type="submit" class="bg-cyan-600 hover:bg-cyan-700 text-white font-semibold px-2.5 py-1 rounded-sm text-[10px] whitespace-nowrap"><i class="fa-solid fa-plus"></i></button></form>`;

    }

    async function saveBranding(e) {
        e.preventDefault();
        if (!SUPABASE_KEY || SUPABASE_KEY.includes('PASTE_KUNCI')) return showToast('Error: API Supabase belum dipasang!', 'error');

        const btn = e.target.querySelector('button[type="submit"]');
        const originalText = btn.innerHTML; btn.innerHTML = "Menyimpan ke Cloud..."; btn.disabled = true;
        
        let newSettings = {
            id: 1, bg_url: document.getElementById('setting_bg').value.trim(), logo_url: document.getElementById('setting_logo').value.trim(),
            icon_ct_url: document.getElementById('setting_icon_ct').value.trim(), icon_bc_url: document.getElementById('setting_icon_bc').value.trim(), icon_lb_url: document.getElementById('setting_icon_lb').value.trim()
        };
        
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/settings?on_conflict=id`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'resolution=merge-duplicates' },
                body: JSON.stringify(newSettings)
            });
            if (!res.ok) throw new Error("Gagal simpan database");

            localStorage.setItem('lifting_settings', JSON.stringify(newSettings)); showToast('Branding berhasil disimpan ke Cloud!'); renderApp(true);
        } catch(err) { showToast('Gagal simpan branding ke cloud!', 'error'); } finally { btn.innerHTML = originalText; btn.disabled = false; }
    }

    function addMasterData(e, key) { e.preventDefault(); const val = document.getElementById('new_master_val').value.trim(); const m = getMasterData(); if(m[key].includes(val)) return showToast('Data sudah ada!', 'error'); m[key].push(val); saveMasterData(m); showToast('Ditambahkan!'); renderApp(true); }
    function addAccountMasterData(e, key) { e.preventDefault(); const name = document.getElementById('new_master_name').value.trim(); const nrp = document.getElementById('new_master_nrp').value.trim(); const pwd = document.getElementById('new_master_pwd').value; const users = getUsers(); if (users.find(u => u.nrp === nrp)) return showToast('NRP terdaftar!', 'error'); const m = getMasterData(); if(m[key].includes(name)) return showToast('Nama sudah ada!', 'error'); m[key].push(name); saveMasterData(m); let role = key === 'gl' ? 'GL' : 'MANPOWER'; let jabatan = key === 'gl' ? 'Group Leader' : (key === 'operator' ? 'Operator' : 'Rigger'); users.push({ nrp: nrp, nama_lengkap: name, jabatan: jabatan, perusahaan: 'PPA', departemen: 'Operation', section: 'Lifting', no_wa: '-', password_hash: pwd, role: role, status_akun: 'ACTIVE' }); saveUsers(users); showToast(`Akun dibuat!`); renderApp(true); }
    function confirmDeleteMasterData(key, index) { openCustomConfirm('Hapus Master Data', 'Yakin ingin menghapus item ini dari data master?', () => { const m = getMasterData(); m[key].splice(index, 1); saveMasterData(m); showToast('Dihapus!'); renderApp(true); }); }
    function openResetPwd(nrp) { document.getElementById('resetNrpLabel').innerText = nrp; document.getElementById('resetNrpVal').value = nrp; document.getElementById('resetPwdInput').value = ''; document.getElementById('resetPwdModal').classList.remove('hidden'); }
    function processResetPassword(e) { e.preventDefault(); const nrp = document.getElementById('resetNrpVal').value; const newPwd = document.getElementById('resetPwdInput').value; const users = getUsers(); const idx = users.findIndex(u => u.nrp === nrp); if(idx !== -1) { users[idx].password_hash = newPwd; saveUsers(users); showToast(`Password direset!`); document.getElementById('resetPwdModal').classList.add('hidden'); renderApp(true); } }

    function getProfileView() {
        const user = JSON.parse(localStorage.getItem('lifting_user'));
        return `
        <div class="max-w-[400px] mx-auto bg-white rounded-md shadow-sm border border-slate-200 overflow-hidden mt-2">
            <div class="p-3 border-b border-slate-100 flex items-center justify-between bg-slate-50"><h2 class="text-sm font-bold text-slate-800">Profil Saya</h2><div class="bg-cyan-50 text-cyan-700 text-[9px] font-bold px-2 py-0.5 rounded-sm border border-cyan-100">${user.role}</div></div>
            <div class="p-4">
                <form onsubmit="saveProfile(event)" class="space-y-2 mb-4">
                    <div class="grid grid-cols-2 gap-2"><div><label class="block text-[9px] font-bold text-slate-500 mb-0.5">NRP</label><input type="text" value="${user.nrp}" class="w-full border bg-slate-50 rounded-sm px-2 py-1 text-[10px] text-slate-500 cursor-not-allowed" readonly></div><div><label class="block text-[9px] font-bold text-slate-500 mb-0.5">Nama Lengkap</label><input type="text" id="profName" value="${user.nama_lengkap}" class="w-full border border-slate-300 rounded-sm px-2 py-1 text-[10px] focus:outline-none focus:border-cyan-500" required></div></div>
                    <datalist id="profListPerusahaan">${getMasterData().perusahaan.map(p=>`<option value="${p}">`).join('')}</datalist><datalist id="profListDepartemen">${getMasterData().departemen.map(d=>`<option value="${d}">`).join('')}</datalist><datalist id="profListSection">${getMasterData().section.map(s=>`<option value="${s}">`).join('')}</datalist>
                    <div class="grid grid-cols-2 gap-2"><div><label class="block text-[9px] font-bold text-slate-500 mb-0.5">Jabatan</label><input type="text" id="profJabatan" value="${user.jabatan}" class="w-full border border-slate-300 rounded-sm px-2 py-1 text-[10px] focus:outline-none focus:border-cyan-500" required></div><div><label class="block text-[9px] font-bold text-slate-500 mb-0.5">No WhatsApp</label><input type="number" id="profWa" value="${user.no_wa}" class="w-full border border-slate-300 rounded-sm px-2 py-1 text-[10px] focus:outline-none focus:border-cyan-500" required></div></div>
                    <div class="grid grid-cols-3 gap-2"><div><label class="block text-[9px] font-bold text-slate-500 mb-0.5">Perusahaan</label><input list="profListPerusahaan" id="profPerusahaan" value="${user.perusahaan}" class="w-full border border-slate-300 rounded-sm px-2 py-1 text-[10px] focus:outline-none focus:border-cyan-500" required></div><div><label class="block text-[9px] font-bold text-slate-500 mb-0.5">Departemen</label><input list="profListDepartemen" id="profDepartemen" value="${user.departemen}" class="w-full border border-slate-300 rounded-sm px-2 py-1 text-[10px] focus:outline-none focus:border-cyan-500" required></div><div><label class="block text-[9px] font-bold text-slate-500 mb-0.5">Section</label><input list="profListSection" id="profSection" value="${user.section}" class="w-full border border-slate-300 rounded-sm px-2 py-1 text-[10px] focus:outline-none focus:border-cyan-500" required></div></div>
                    <button type="submit" class="bg-slate-800 hover:bg-slate-900 text-white font-bold px-4 py-1.5 rounded-sm text-[10px] mt-2">Simpan Profil</button>
                </form>
                <hr class="border-slate-100 my-4"><h3 class="text-xs font-bold text-slate-800 mb-2">Ganti Password</h3>
                <form onsubmit="savePassword(event)" class="space-y-2">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <div><label class="block text-[9px] font-bold text-slate-500 mb-0.5">Password Baru</label><div class="relative"><input type="password" id="profPwd1" class="w-full border border-slate-300 rounded-sm px-2 py-1 pr-6 text-[10px] focus:outline-none focus:border-cyan-500" required><i id="toggleProfPwd1" class="fa-regular fa-eye absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer pwd-toggle text-[9px]" onclick="togglePassword('profPwd1', 'toggleProfPwd1')"></i></div></div>
                        <div><label class="block text-[9px] font-bold text-slate-500 mb-0.5">Konfirmasi</label><div class="relative"><input type="password" id="profPwd2" class="w-full border border-slate-300 rounded-sm px-2 py-1 pr-6 text-[10px] focus:outline-none focus:border-cyan-500" required><i id="toggleProfPwd2" class="fa-regular fa-eye absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer pwd-toggle text-[9px]" onclick="togglePassword('profPwd2', 'toggleProfPwd2')"></i></div></div>
                    </div>
                    <button type="submit" class="bg-slate-800 hover:bg-slate-900 text-white font-bold px-4 py-1.5 rounded-sm text-[10px] mt-2">Update Password</button>
                </form>
                <hr class="border-slate-100 my-4">
                <button onclick="openCustomConfirm('Keluar Akun', 'Apakah Anda yakin ingin keluar dari sistem?', handleLogout)" class="w-full bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 font-bold px-4 py-2 rounded-sm text-[11px] flex justify-center items-center gap-2 transition-colors shadow-sm"><i class="fa-solid fa-sign-out-alt"></i> Keluar Akun (Logout)</button>
            </div>
        </div>`;
    }

    function saveProfile(e) { e.preventDefault(); let user = JSON.parse(localStorage.getItem('lifting_user')); let users = getUsers(); let idx = users.findIndex(u => u.nrp === user.nrp); user.nama_lengkap = document.getElementById('profName').value; user.jabatan = document.getElementById('profJabatan').value; user.perusahaan = document.getElementById('profPerusahaan').value; user.departemen = document.getElementById('profDepartemen').value; user.section = document.getElementById('profSection').value; user.no_wa = document.getElementById('profWa').value; users[idx] = user; saveUsers(users); localStorage.setItem('lifting_user', JSON.stringify(user)); showToast('Profil diupdate!'); renderApp(true); }
    function savePassword(e) { e.preventDefault(); let pwd1 = document.getElementById('profPwd1').value; let pwd2 = document.getElementById('profPwd2').value; if (pwd1 !== pwd2) return showToast('Password tidak cocok!', 'error'); let user = JSON.parse(localStorage.getItem('lifting_user')); let users = getUsers(); let idx = users.findIndex(u => u.nrp === user.nrp); users[idx].password_hash = pwd1; saveUsers(users); document.getElementById('profPwd1').value = ''; document.getElementById('profPwd2').value = ''; showToast('Password diubah!'); }

    // Memuat saat pertama kali dibuka
    window.addEventListener('load', () => {
        fetchFromSupabase().then(() => {
            renderApp(false);
        });
    });

    // Auto-sync ekstra saat layar HP kembali dinyalakan
    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
            const user = localStorage.getItem('lifting_user');
            if (user) {
                fetchFromSupabase().then(() => { renderApp(true); });
            }
        }
    });
</script>
