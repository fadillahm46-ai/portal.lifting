        /* ========================================================
           CURVED NOTCH BOTTOM NAVIGATION BAR (KHUSUS MODE HP)
           TRANSISI AIR MENGALIR TANPA GARIS BIRU LUAR
           ======================================================== */
        .curved-nav-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            background-color: #ffffff;
            box-shadow: 0 -3px 20px rgba(0, 0, 0, 0.06), 0 -1px 2px rgba(0, 0, 0, 0.03);
            border-top: none;
            z-index: 40;
            user-select: none;
            overflow: visible;
        }

        /* Dudukan Lekukan Air (Notch Cradle) yang Meluncur Halus */
        .curved-notch-cradle {
            position: absolute;
            top: -1px;
            left: 0;
            height: 26px;
            pointer-events: none;
            transition: transform 0.48s cubic-bezier(0.34, 1.35, 0.52, 1);
            z-index: 41;
            will-change: transform;
        }

        /* SVG Cekungan Gelombang Air (Bersih Tanpa Garis Luar) */
        .water-notch-svg {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 84px;
            height: 24px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.03));
            transition: filter 0.3s ease;
        }

        /* Gelembung Tetesan Air Aktif Mengambang (Floating 3D Liquid Droplet) */
        .curved-active-bubble {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 26%, #22d3ee 0%, #0891b2 55%, #0e7490 100%);
            box-shadow: 
                0 8px 22px rgba(8, 145, 178, 0.45),
                0 2px 6px rgba(8, 145, 178, 0.3),
                inset 0 2.5px 5px rgba(255, 255, 255, 0.7),
                inset 0 -3px 6px rgba(14, 116, 144, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.25rem;
            z-index: 43;
            transition: transform 0.48s cubic-bezier(0.34, 1.35, 0.55, 1);
            will-change: transform;
            pointer-events: none !important;
        }

        /* Pantulan Kilau Air Permukaan (Water Surface Specular Highlight) */
        .curved-active-bubble::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 10px;
            width: 17px;
            height: 8px;
            border-radius: 50%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0) 100%);
            transform: rotate(-25deg);
            pointer-events: none;
        }

        /* Kilau Sekunder Bawah Tetesan Air */
        .curved-active-bubble::after {
            content: '';
            position: absolute;
            bottom: 4px;
            right: 12px;
            width: 8px;
            height: 4px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            pointer-events: none;
        }

        /* Riak Gelombang Air (Concentric Water Ripple) */
        .water-ripple-wave {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid rgba(34, 211, 238, 0.65);
            pointer-events: none;
            opacity: 0;
            z-index: 42;
        }

        .water-ripple-wave.ripple-active {
            animation: waterRippleExpand 0.65s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes waterRippleExpand {
            0% {
                transform: translateX(-50%) scale(0.85);
                opacity: 0.85;
                border-color: rgba(34, 211, 238, 0.85);
            }
            50% {
                opacity: 0.45;
            }
            100% {
                transform: translateX(-50%) scale(1.68);
                opacity: 0;
                border-color: rgba(8, 145, 178, 0);
            }
        }

        /* Deformasi Aliran Cairan ke Kanan (Liquid Flow Stretch Right) */
        .bubble-moving-right {
            animation: liquidFlowRight 0.48s cubic-bezier(0.34, 1.35, 0.55, 1) forwards;
        }
        @keyframes liquidFlowRight {
            0% { transform: translateX(-50%) scale(1) rotate(0deg); }
            30% { transform: translateX(-50%) scale(1.22, 0.82) rotate(8deg) skewX(-10deg); }
            65% { transform: translateX(-50%) scale(0.9, 1.14) rotate(-3deg); }
            85% { transform: translateX(-50%) scale(1.04, 0.96) rotate(1deg); }
            100% { transform: translateX(-50%) scale(1) rotate(0deg); }
        }

        /* Deformasi Aliran Cairan ke Kiri (Liquid Flow Stretch Left) */
        .bubble-moving-left {
            animation: liquidFlowLeft 0.48s cubic-bezier(0.34, 1.35, 0.55, 1) forwards;
        }
        @keyframes liquidFlowLeft {
            0% { transform: translateX(-50%) scale(1) rotate(0deg); }
            30% { transform: translateX(-50%) scale(1.22, 0.82) rotate(-8deg) skewX(10deg); }
            65% { transform: translateX(-50%) scale(0.9, 1.14) rotate(3deg); }
            85% { transform: translateX(-50%) scale(1.04, 0.96) rotate(-1deg); }
            100% { transform: translateX(-50%) scale(1) rotate(0deg); }
        }

        /* Efek Tetesan Air Jatuh (Water Drop Pop In) */
        @keyframes waterDropPop {
            0% { transform: scale(0.5) translateY(-8px); opacity: 0; }
            50% { transform: scale(1.15) translateY(2px); opacity: 1; }
            75% { transform: scale(0.94) translateY(-1px); }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-water-drop {
            animation: waterDropPop 0.42s cubic-bezier(0.34, 1.45, 0.64, 1) forwards;
        }

        .curved-nav-item {

            display: flex;

        /* Tata letak simetris 3 kolom: Kiri (Navigasi), Tengah (Bulan & Tahun), Kanan (Legenda) */

                justify-self: center !important;

            .fc .fc-toolbar-chunk:nth-child(3) {
                display: flex !important;
                align-items: center !important;

                justify-self: end !important;

            }
        }

        /* Penataan responsif untuk layar HP kecil */
        @media (max-width: 640px) {
            .fc .fc-toolbar {
                display: flex !important;
                flex-wrap: wrap !important;
                justify-content: space-between !important;

            /* Baris 1: Judul Bulan & Tahun berada di atas dan tepat di tengah (center) */
            .fc .fc-toolbar-chunk:nth-child(2) {
                order: 1 !important;
                width: 100% !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                text-align: center !important;
                margin: 0 auto 4px auto !important;
            }
            .fc .fc-toolbar-title {
                font-size: 13px !important;
                text-align: center !important;
                width: 100% !important;
            }
            /* Baris 2 Kiri: Tombol navigasi (< > dan Hari Ini) */
            .fc .fc-toolbar-chunk:nth-child(1) {
                order: 2 !important;
                display: flex !important;
                align-items: center !important;
                gap: 3px !important;
            }
            /* Baris 2 Kanan: Keterangan status di bawah berdampingan dengan tombol navigasi */
            .fc .fc-toolbar-chunk:nth-child(3) {
                order: 3 !important;
                display: flex !important;
                align-items: center !important;
                justify-content: flex-end !important;
                gap: 3px !important;
                flex: 1 !important;
            }
            #bcCalendarLegend {
                display: flex !important;
                flex-wrap: wrap !important;
                justify-content: flex-end !important;
                gap: 3px !important;
            }
            #bcCalendarLegend span {
                font-size: 8px !important;
                padding: 2px 4px !important;
            }
        }
    </style>
</head>

<script>
    const SUPABASE_URL = 'https://dtcxhpwownzgxzmurtkr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0Y3hocHdvd256Z3h6bXVydGtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMzkwMDQsImV4cCI6MjEwNDcxNTAwNH0.U8HkMTbP6zAoWcLFs0BNE9seO6Ja8jHDvTi8YVQLQao';

    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx5oDgIH3yJX6zqLNCIQiK0-ZITW5073DAZ1o2qBXLwVk6pqpxgiCZk0YyN0_3-ARvA2Q/exec'; 

    /* ========================================================
       PROTEKSI ANTI-ZOMBIE DATA & CACHE VERSIONING OTOMATIS
       Membersihkan sisa orderan lama yang sudah terhapus di HP orang lain
       ======================================================== */
    const APP_BUILD_VERSION = '2026.09.25-v1';
    (function purgeStaleZombieCache() {
        try {
            const currentVer = localStorage.getItem('lifting_app_version');
            if (currentVer !== APP_BUILD_VERSION) {
                // Hapus cache orderan lama agar tidak membangkitkan data yang telah dihapus
                localStorage.removeItem('lifting_orders');
                localStorage.removeItem('orders');
                localStorage.removeItem('portal_orders');
                localStorage.removeItem('crane_orders_cache');
                localStorage.removeItem('app_orders_backup');
                window.globalOrdersCache = [];
                localStorage.setItem('lifting_app_version', APP_BUILD_VERSION);
                console.log("Anti-zombie cache purge aktif untuk versi:", APP_BUILD_VERSION);
            }
        } catch(e) {}
    })();

    /* ========================================================
       SISTEM DETEKSI PEMBARUAN VERSI OTOMATIS (version.json)
       Hanya muncul jika ada versi baru di server, jika sama kosong
       ======================================================== */
    async function checkAppVersionUpdate() {
        const container = document.getElementById('appUpdateNoticeContainer');
        if (!container) return;
        try {
            const res = await fetch('./version.json?t=' + Date.now(), { cache: 'no-store' });
            if (!res.ok) {
                container.className = "hidden";
                container.innerHTML = '';
                return;
            }
            const data = await res.json();
            const serverVersion = (data && data.version) ? String(data.version).trim() : null;

            // Jika versi di server berbeda dengan versi lokal APP_BUILD_VERSION
            if (serverVersion && serverVersion !== APP_BUILD_VERSION) {
                container.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[10px] font-bold bg-amber-50 text-amber-800 border border-amber-300 shadow-sm animate-pulse mt-1 select-none";
                container.innerHTML = `
                    <i class="fa-solid fa-cloud-arrow-down text-amber-600 text-xs"></i>
                    <span>Tersedia pembaruan (v${serverVersion})</span>
                    <button type="button" onclick="executeForceAppUpdate()" class="ml-1 bg-amber-600 hover:bg-amber-700 text-white text-[9px] px-2 py-0.5 rounded-md font-bold transition-colors shadow-2xs cursor-pointer">
                        Perbarui Sekarang
                    </button>
                `;
            } else {
                // Versi sama: Tetap kosong dan tersembunyi total
                container.className = "hidden";
                container.innerHTML = '';
            }
        } catch (e) {
            container.className = "hidden";
            container.innerHTML = '';
        }
    }

    async function executeForceAppUpdate() {
        showToast("Memperbarui aplikasi ke versi terbaru...", "success");
        try {
            if ('serviceWorker' in navigator) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                for (let reg of registrations) {
                    await reg.unregister();
                }
            }
            if ('caches' in window) {
                const cacheNames = await caches.keys();
                await Promise.all(cacheNames.map(name => caches.delete(name)));
            }
            localStorage.removeItem('lifting_orders');
            localStorage.removeItem('orders');
            localStorage.removeItem('portal_orders');
            localStorage.removeItem('lifting_app_version');
        } catch (e) {
            console.warn("Update cache clear error:", e);
        }
        setTimeout(() => {
            window.location.reload(true);
        }, 300);
    }

    /* ========================================================
       DETEKTOR RESPONSIF GLOBAL & CACHE CLOUD REALTIME
       ======================================================== */
    var forceMobileView = false;

        if (typeof forceMobileView !== 'undefined' && forceMobileView) return true;
        return window.innerWidth < 768;

       ======================================================== */
    function normalizeUnitKey(str) {
        return String(str || '').toUpperCase().replace(/[\s\-_]/g, '').trim();
    }

    function getUnitStatusMap() {
        try {
            const direct = JSON.parse(localStorage.getItem('lifting_unit_status'));
            if (direct && typeof direct === 'object') return direct;
        } catch(e) {}
        const m = getMasterData();
        if (m.unit_status_map && typeof m.unit_status_map === 'object') {
            return m.unit_status_map;
        }
        return {};
    }

    function getUnitStatus(unitName) {
        if (!unitName) return { status: 'ACTIVE', reason: '' };
        const map = getUnitStatusMap();
        if (map[unitName]) return map[unitName];
        
        const norm = normalizeUnitKey(unitName);
        for (const key of Object.keys(map)) {
            if (normalizeUnitKey(key) === norm) {
                return map[key];
            }
        }
        return { status: 'ACTIVE', reason: '' };
    }

    function normalizeName(str) {
        return String(str || '').toUpperCase().replace(/\s+/g, ' ').trim();
    }

    function getCompanyWoColor(jobOrCompany) {
        if (!jobOrCompany) return 'biru';
        const comp = typeof jobOrCompany === 'object' ? (jobOrCompany.perusahaan || '') : String(jobOrCompany);
        if (!comp) return 'biru';
        
        const norm = normalizeName(comp);
        // 1. Prioritaskan warna resmi dari tabel company_status Supabase
        if (window.companyColorMap && window.companyColorMap[norm]) {
            return window.companyColorMap[norm].toLowerCase();
        }
        if (window.companyColorMap && window.companyColorMap[comp]) {
            return window.companyColorMap[comp].toLowerCase();
        }
        // 2. Cek master data lokal
        const m = getMasterData();
        const colors = m.perusahaan_colors || {};
        if (colors[comp]) return colors[comp].toLowerCase();
        if (colors[norm]) return colors[norm].toLowerCase();
        for (const [k, v] of Object.entries(colors)) {
            if (normalizeName(k) === norm) return v.toLowerCase();
        }
        // 3. Fallback jika ada properti warna_wo pada objek job
        if (typeof jobOrCompany === 'object' && jobOrCompany.warna_wo) {
            return String(jobOrCompany.warna_wo).toLowerCase();
        }
        return 'biru';
    }

    async function setCompanyWoColor(companyName, color) {
        if (!companyName) return;
        const norm = normalizeName(companyName);
        const cleanColor = String(color).toLowerCase() === 'merah' ? 'merah' : 'biru';
        const dbColor = cleanColor === 'merah' ? 'RED' : 'BLUE';

        // 1. Simpan di memori lokal seketika agar antarmuka responsif tanpa lag
        if (!window.companyColorMap) window.companyColorMap = {};
        window.companyColorMap[norm] = cleanColor;
        window.companyColorMap[companyName] = cleanColor;

        let m = getMasterData();
        if (!m.perusahaan_colors) m.perusahaan_colors = {};
        m.perusahaan_colors[companyName] = cleanColor;
        m.perusahaan_colors[norm] = cleanColor;
        saveMasterData(m);

        // 2. Simpan langsung ke tabel company_status di Supabase (Multi-Strategy Guarantee)
        if (SUPABASE_KEY && !SUPABASE_KEY.includes('PASTE_KUNCI')) {
            try {
                let rawComps = [];
                try {
                    rawComps = JSON.parse(localStorage.getItem('lifting_raw_comp_status')) || [];
                } catch(e) { rawComps = []; }

                const existingRow = rawComps.find(r => 
                    normalizeName(r.nama_perusahaan || r.name) === norm ||
                    (r.nama_perusahaan && r.nama_perusahaan.toUpperCase() === companyName.toUpperCase())
                );

                let updateSuccess = false;

                if (supabaseClient) {
                    // Strategi 1: Update langsung via Primary Key ID (100% Berhasil tanpa butuh Unique Index)
                    if (existingRow && existingRow.id) {
                        const { data, error } = await supabaseClient
                            .from('company_status')
                            .update({
                                warna_wo: dbColor,
                                updated_at: new Date().toISOString()
                            })
                            .eq('id', existingRow.id)
                            .select();

                        if (!error && Array.isArray(data) && data.length > 0) {
                            updateSuccess = true;
                            existingRow.warna_wo = dbColor;
                            localStorage.setItem('lifting_raw_comp_status', JSON.stringify(rawComps));
                        }
                    }

                    // Strategi 2: Update berdasarkan nama_perusahaan (Case-Insensitive)
                    if (!updateSuccess) {
                        const targetName = existingRow ? (existingRow.nama_perusahaan || companyName) : companyName;
                        const { data, error } = await supabaseClient
                            .from('company_status')
                            .update({
                                warna_wo: dbColor,
                                updated_at: new Date().toISOString()
                            })
                            .ilike('nama_perusahaan', targetName)
                            .select();

                        if (!error && Array.isArray(data) && data.length > 0) {
                            updateSuccess = true;
                        }
                    }

                    // Strategi 3: Upsert jika data baru
                    if (!updateSuccess) {
                        const { data, error } = await supabaseClient
                            .from('company_status')
                            .upsert({
                                nama_perusahaan: companyName,
                                warna_wo: dbColor,
                                updated_at: new Date().toISOString()
                            }, { onConflict: 'nama_perusahaan' })
                            .select();

                        if (!error && Array.isArray(data) && data.length > 0) {
                            updateSuccess = true;
                            rawComps.push(data[0]);
                            localStorage.setItem('lifting_raw_comp_status', JSON.stringify(rawComps));
                        }
                    }
                }

                // Strategi 4: Cadangan REST API PATCH jika SDK terkendala
                if (!updateSuccess) {
                    let patchRes = await fetch(`${SUPABASE_URL}/rest/v1/company_status?nama_perusahaan=ilike.${encodeURIComponent(companyName)}`, {
                        method: 'PATCH',
                        headers: {
                            'Content-Type': 'application/json',
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Prefer': 'return=representation'
                        },
                        body: JSON.stringify({
                            warna_wo: dbColor,
                            updated_at: new Date().toISOString()
                        })
                    });
                    if (patchRes.ok) {
                        const pData = await patchRes.json().catch(() => []);
                        if (Array.isArray(pData) && pData.length > 0) updateSuccess = true;
                    }
                }

                // Strategi 5: Cadangan REST API POST Upsert
                if (!updateSuccess) {
                    let postRes = await fetch(`${SUPABASE_URL}/rest/v1/company_status?on_conflict=nama_perusahaan`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Prefer': 'resolution=merge-duplicates,return=representation'
                        },
                        body: JSON.stringify({
                            nama_perusahaan: companyName,
                            warna_wo: dbColor,
                            updated_at: new Date().toISOString()
                        })
                    });
                    if (postRes.ok) updateSuccess = true;
                }

                console.log(`[Sync Supabase] Warna WO ${companyName} -> ${dbColor} berhasil:`, updateSuccess);
            } catch(err) {
                console.warn("Gagal simpan company_status ke Supabase:", err);
            }
        }

        showToast(`Warna WO untuk perusahaan ${companyName} diatur ke ${cleanColor.toUpperCase()}`, 'success');
        renderApp(true);
    }

    function getUnitWorkload(unitName, ordersList = null) {
        if (!unitName) return { count: 0, hours: 0, isCrowded: false };
        const orders = ordersList || getOrders();
        const activeJobs = orders.filter(j => 
            j.unit === unitName && ['ON PROGRESS', 'PENDING', 'SCHEDULED', 'UNSCHEDULED'].includes(j.status)
        );
        let totalHours = 0;
        activeJobs.forEach(j => {
            if (j.durasi_request) {
                let h = parseFloat(j.durasi_request) || 0;
                if (String(j.durasi_request).toUpperCase().includes('HARI')) h *= 24;
                totalHours += h;
            }
        });
        const count = activeJobs.length;
        const isCrowded = count >= 5 || totalHours > 7;
        return { count, hours: totalHours, isCrowded };
    }

    async function saveUnitStatus(unitName, status, reason) {
        if (!unitName) return false;
        const currentUser = JSON.parse(localStorage.getItem('lifting_user')) || {};
        const isActive = (status === 'ACTIVE');
        const finalReason = isActive ? null : (reason || 'Non-Aktif');
        const updatedBy = currentUser.nama_lengkap || currentUser.nrp || 'SYSTEM';
        const updatedAt = new Date().toISOString();

        // 1. Simpan langsung ke cache lokal agar UI seketika responsif
        let unitStatusMap = getUnitStatusMap();
        unitStatusMap[unitName] = { status, reason: isActive ? '' : (reason || 'Non-Aktif'), updated_at: updatedAt };
        const normName = normalizeUnitKey(unitName);
        unitStatusMap[normName] = unitStatusMap[unitName];
        localStorage.setItem('lifting_unit_status', JSON.stringify(unitStatusMap));

        const m = getMasterData();
        if (!m.unit_status_map) m.unit_status_map = {};
        m.unit_status_map[unitName] = unitStatusMap[unitName];
        m.unit_status_map[normName] = unitStatusMap[unitName];
        localStorage.setItem('lifting_master_data', JSON.stringify(m));

        if (!SUPABASE_KEY || SUPABASE_KEY.includes('PASTE_KUNCI')) return true;

        // 2. Ambil cache baris database asli dari Supabase
        let rawUnits = [];
        try {
            rawUnits = JSON.parse(localStorage.getItem('lifting_raw_unit_status')) || [];
        } catch(e) { rawUnits = []; }
        if (!Array.isArray(rawUnits) || rawUnits.length === 0) {
            if (Array.isArray(window._rawSupabaseUnits)) rawUnits = window._rawSupabaseUnits;
        }

        const normTarget = normalizeUnitKey(unitName);
        const existingRow = rawUnits.find(r => normalizeUnitKey(r.unit_code || r.unit_name || r.nama_unit || r.name) === normTarget);

        // Gunakan unit_code persis sesuai nama kolom Primary Key di tabel Supabase
        const targetUnitCode = existingRow ? (existingRow.unit_code || existingRow.unit_name || unitName) : unitName;

        let saveSuccess = false;

        // METODE 1: Gunakan supabaseClient resmi (100% aman untuk unit dengan tanda kurung seperti 'LB5801 (LOWBOY)')
        if (supabaseClient) {
            try {
                const { data, error } = await supabaseClient
                    .from('unit_status')
                    .upsert({
                        unit_code: targetUnitCode,
                        is_active: isActive,
                        alasan_off: finalReason,
                        updated_by: updatedBy,
                        updated_at: updatedAt
                    }, { onConflict: 'unit_code' })
                    .select();

                if (!error && Array.isArray(data) && data.length > 0) {
                    saveSuccess = true;
                    const idx = rawUnits.findIndex(r => normalizeUnitKey(r.unit_code) === normTarget);
                    if (idx !== -1) rawUnits[idx] = data[0];
                    else rawUnits.push(data[0]);
                    localStorage.setItem('lifting_raw_unit_status', JSON.stringify(rawUnits));
                } else if (error) {
                    console.warn("supabaseClient upsert error:", error);
                }
            } catch (err) {
                console.warn("supabaseClient upsert exception:", err);
            }
        }

        // METODE 2: Fallback REST PATCH dengan pelindung tanda kutip ganda pada parameter unit_code
        if (!saveSuccess) {
            try {
                const quotedCode = encodeURIComponent(`"${targetUnitCode.replace(/"/g, '\\"')}"`);
                let res = await fetch(`${SUPABASE_URL}/rest/v1/unit_status?unit_code=eq.${quotedCode}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify({
                        is_active: isActive,
                        alasan_off: finalReason,
                        updated_by: updatedBy,
                        updated_at: updatedAt
                    })
                });

                if (res.ok) {
                    const data = await res.json().catch(() => []);
                    if (Array.isArray(data) && data.length > 0) {
                        saveSuccess = true;
                        const idx = rawUnits.findIndex(r => normalizeUnitKey(r.unit_code) === normTarget);
                        if (idx !== -1) rawUnits[idx] = data[0];
                        else rawUnits.push(data[0]);
                        localStorage.setItem('lifting_raw_unit_status', JSON.stringify(rawUnits));
                    }
                }
            } catch (err) {
                console.warn("Fallback PATCH error:", err);
            }
        }

        // METODE 3: Fallback REST POST Upsert
        if (!saveSuccess) {
            try {
                let resPost = await fetch(`${SUPABASE_URL}/rest/v1/unit_status?on_conflict=unit_code`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Prefer': 'resolution=merge-duplicates,return=representation'
                    },
                    body: JSON.stringify({
                        unit_code: targetUnitCode,
                        is_active: isActive,
                        alasan_off: finalReason,
                        updated_by: updatedBy,
                        updated_at: updatedAt
                    })
                });

                if (resPost.ok) {
                    saveSuccess = true;
                    const inserted = await resPost.json().catch(() => []);
                    if (Array.isArray(inserted) && inserted.length > 0) {
                        const idx = rawUnits.findIndex(r => normalizeUnitKey(r.unit_code) === normTarget);
                        if (idx !== -1) rawUnits[idx] = inserted[0];
                        else rawUnits.push(inserted[0]);
                        localStorage.setItem('lifting_raw_unit_status', JSON.stringify(rawUnits));
                    }
                }
            } catch(e) {
                console.warn("Fallback POST upsert error:", e);
            }
        }

        // Sinkronkan juga master_data sebagai backup sekunder
        try {
            await syncMasterToSupabase(m);
        } catch(e) {}

        return saveSuccess;
    }

    /* ========================================================
       SISTEM NOTIFIKASI SUARA (WEB AUDIO API) & HEADS-UP BANNER
       ======================================================== */
    function playNotificationSound(type = 'gl') {
        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            const ctx = new AudioCtx();
            if (ctx.state === 'suspended') ctx.resume();
            const now = ctx.currentTime;

            if (type === 'gl') {
                // Suara notifikasi lembut ganda untuk GL & Admin saat ada order baru
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now); // D5
                osc.frequency.setValueAtTime(880, now + 0.15); // A5
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.7);
            } else {
                // Nada ceria berurutan (3 nada) untuk Operator & Rigger saat ditugaskan
                const freqs = [523.25, 659.25, 783.99]; // C5, E5, G5
                freqs.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.12);
                    gain.gain.setValueAtTime(0.35, now + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.35);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + idx * 0.12);
                    osc.stop(now + idx * 0.12 + 0.35);
                });
            }
        } catch (e) {
            console.warn("Audio notifikasi:", e);
        }
    }

    function requestNotificationAccess() {
        if ("Notification" in window && Notification.permission === "default") {
            Notification.requestPermission();
        }
    }

    function triggerAppNotification(title, message, soundType = 'gl', jobData = null) {
        playNotificationSound(soundType);
        showToast(`${title}: ${message}`, soundType === 'gl' ? 'success' : 'success');
        
        // Tampilkan Heads-Up Banner Mengambang Gelap Elegan di Atas Layar
        showInAppFloatingBanner(title, message, jobData);

        // Getar perangkat HP jika didukung
        if ("vibrate" in navigator) {
            try { navigator.vibrate([200, 100, 200]); } catch(e) {}
        }

        // Kirim sinyal ke Service Worker untuk memunculkan floating notification di HP
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({
                type: 'SHOW_NOTIFICATION',
                payload: {
                    title: title,
                    body: message,
                    url: '/'
                }
            });
        }

        // Tampilkan notifikasi sistem level OS / Windows Desktop (Kanan Bawah Layar PC)
        if ("Notification" in window && Notification.permission === "granted") {
            try {
                const notifOptions = {
                    body: message,
                    icon: "https://lh3.googleusercontent.com/d/1hQZopiZU-_bQC9aRmyZndlmEF--k4h5U",
                    badge: "https://lh3.googleusercontent.com/d/1hQZopiZU-_bQC9aRmyZndlmEF--k4h5U",
                    tag: 'portal-lifting-notif-' + Date.now(),
                    renotify: true,
                    requireInteraction: true // Banner tetap melayang di kanan bawah Windows sampai diklik/disilang
                };

                // Di PC Desktop: Panggil Web Notification API langsung agar pasti muncul di kanan bawah Windows
                if (window.innerWidth >= 768) {
                    const desktopNotif = new Notification(title, notifOptions);
                    desktopNotif.onclick = function() {
                        window.focus();
                        if (jobData && jobData.no_wo) {
                            viewJobDetail(jobData.no_wo);
                        }
                        this.close();
                    };
                } else if (navigator.serviceWorker && navigator.serviceWorker.ready) {
                    navigator.serviceWorker.ready.then(reg => {
                        reg.showNotification(title, notifOptions);
                    }).catch(() => {
                        new Notification(title, notifOptions);
                    });
                } else {
                    new Notification(title, notifOptions);
                }
            } catch(e) {
                console.warn("Desktop notification trigger error:", e);
            }
        }
    }

    function updateNotificationBadge() {
        const currentUser = JSON.parse(localStorage.getItem('lifting_user'));
        if (!currentUser) return;

        const role = String(currentUser.role || '').toUpperCase().trim();
        const isGlOrAdmin = ['ADMIN', 'GL', 'GROUP LEADER', 'LEADER'].includes(role);
        const isMP = ['MANPOWER', 'MP', 'OPERATOR', 'RIGGER'].includes(role);
        const myName = normalizeName(currentUser.nama_lengkap);

        const orders = getOrders();
        const opened = getOpenedOrderIds();

        let unread = [];
        if (isGlOrAdmin) {
            unread = orders.filter(j => {
                const isOpened = opened.includes(String(j.no_wo || '').trim());
                const needAction = ['SCHEDULED', 'UNSCHEDULED', 'PENDING'].includes(j.status);
                return !isOpened && needAction;
            });
        } else if (isMP && myName) {
            const todayShiftDate = getShiftDateString();
            unread = orders.filter(j => {
                const isOpened = opened.includes(String(j.no_wo || '').trim());
                const op = normalizeName(j.operator);
                const rg1 = normalizeName(j.rigger);
                const rg2 = normalizeName(j.rigger2);
                const isAssigned = (op === myName || rg1 === myName || rg2 === myName);
                const isActive = ['ON PROGRESS', 'SCHEDULED', 'PENDING'].includes(j.status);
                // Hanya hitung pekerjaan hari ini atau sebelumnya agar tidak membunyikan tugas masa depan
                const opDate = getJobOperationalDate(j);
                const isTodayOrEarlier = !opDate || opDate <= todayShiftDate;
                return !isOpened && isAssigned && isActive && isTodayOrEarlier;
            });
        }

        const count = unread.length;
        const badges = document.querySelectorAll('.notif-badge-indicator');
        badges.forEach(b => {
            if (count > 0) {
                b.innerText = count > 99 ? '99+' : count;
                b.classList.remove('hidden');
            } else {
                b.classList.add('hidden');
            }
        });

        // Sinkronisasi badge angka merah langsung ke ikon aplikasi di layar depan HP (PWA Home Screen)
        if ('setAppBadge' in navigator) {
            if (count > 0) {
                navigator.setAppBadge(count).catch(() => {});
            } else {
                navigator.clearAppBadge().catch(() => {});
            }
        }
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({
                type: 'SET_BADGE',
                count: count
            });
        }

        const listEl = document.getElementById('notifDropdownList');
        if (listEl) {
            if (count === 0) {
                listEl.innerHTML = `<div class="p-4 text-center text-slate-400 italic text-[11px]">Semua orderan sudah dibuka</div>`;
            } else {
                listEl.innerHTML = unread.map(o => `

                        <div class="flex-1 min-w-0">

    function getShiftDateString(ref = new Date()) {
        const d = new Date(ref);
        // Filter tanggal tidak berubah ke tanggal berikutnya jika belum menyentuh jam 05.00 (Shift 2 malam masih berjalan)
        if (d.getHours() < 5) {
            d.setDate(d.getDate() - 1);
        }
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function getWeekRangeSundayToSaturday(ref = new Date()) {
        const d = new Date(ref);
        // Filter mingguan juga mengacu pada cut-off jam 05.00 operasional
        if (d.getHours() < 5) {
            d.setDate(d.getDate() - 1);
        }
        const day = d.getDay(); // 0: Minggu, 1: Senin, ..., 6: Sabtu
        const sun = new Date(d);
        sun.setDate(d.getDate() - day);
        const sat = new Date(sun);
        sat.setDate(sun.getDate() + 6);
        const pad = n => String(n).padStart(2, '0');
        const format = dt => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
        return {
            start: format(sun),
            end: format(sat)
        };
    }

    function buildSelectOptionsWithOther(list = [], currentVal = '', label = 'Pilih') {

        const selectEl = document.getElementById(selectId);

    function registerNewMasterItem(masterKey, val) {
        if (!masterKey || !val) return;
        const clean = String(val).trim().toUpperCase();
        if (!clean || clean === '__OTHER__') return;
        let m = getMasterData();
        if (!m[masterKey]) m[masterKey] = [];
        if (!m[masterKey].includes(clean)) {
            m[masterKey].push(clean);
            if (masterKey === 'perusahaan') {
                if (!m.perusahaan_colors) m.perusahaan_colors = {};
                m.perusahaan_colors[clean] = 'biru';
                m.perusahaan_colors[normalizeName(clean)] = 'biru';
            }
            saveMasterData(m);
        }
    }

    function sanitizeOrderForSupabase(order) {
        const allowedKeys = [
            'no_wo', 'timestamp', 'kategori', 'nrp_pemohon', 'nama_pemohon', 
            'perusahaan', 'departemen', 'section', 'no_wa', 'tgl_pelaksanaan', 
            'jam_pelaksanaan', 'shift', 'durasi_request', 'lokasi_angkat', 
            'lokasi_tujuan', 'deskripsi', 'status', 'gl', 'unit', 'operator', 
            'rigger', 'rigger2', 'jam_start_aktual', 'jam_end_aktual', 
            'durasi_aktual', 'final_inspeksi', 'alasan_telat', 'alasan_overtime'
        ];
        const clean = {};
        allowedKeys.forEach(k => {
            if (order[k] !== undefined) clean[k] = order[k];
        });
        return clean;
    }

    async function syncSingleOrderToSupabase(order) {
        if (!SUPABASE_KEY || SUPABASE_KEY.includes('PASTE_KUNCI')) return;
        try {
            const clean = sanitizeOrderForSupabase(order);
            if (supabaseClient) {
                await supabaseClient.from('orders').upsert(clean, { onConflict: 'no_wo' });
            } else {
                await fetch(`${SUPABASE_URL}/rest/v1/orders?on_conflict=no_wo`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Prefer': 'resolution=merge-duplicates'
                    },
                    body: JSON.stringify(clean)
                });
            }
        } catch(e) {
            console.warn("Gagal simpan single order:", e);
        }
    }

    function formatDurationHM(minutes) {
        minutes = Math.round(minutes);
        if (isNaN(minutes) || minutes <= 0) return '0 Menit';
        const h = Math.floor(minutes / 60);
        const m = minutes % 60;
        if (h > 0 && m > 0) return `${h} Jam ${m} Menit`;
        if (h > 0) return `${h} Jam`;
        return `${m} Menit`;
    }

    // Pembersih string kendala agar tidak terjadi duplikasi "Telat : Telat" atau "Over : Over"
    function cleanKendalaText(text) {
        if (!text) return '';
        let clean = String(text).trim();
        clean = clean.replace(/^Telat\s*:\s*Telat\b/gi, 'Telat');
        clean = clean.replace(/^Over\s*:\s*Over\b/gi, 'Over');
        return clean.trim();
    }

    /* Helper Pembacaan Tanggal Jadwal Planning Lapangan Secara Presisi */
    function getOrderScheduleDate(j) {
        if (!j) return '';
        let raw = String(j.tgl_pelaksanaan || '').trim();
        if (!raw) return '';
        // Format standar ISO YYYY-MM-DD
        if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
        // Format DD/MM/YYYY atau DD-MM-YYYY
        const m = raw.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
        if (m) {
            return `${m[3]}-${String(m[2]).padStart(2, '0')}-${String(m[1]).padStart(2, '0')}`;
        }
        const d = new Date(raw);
        if (!isNaN(d)) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }
        return raw;
    }

    /* Helper Penarikan Data Operator & Rigger Langsung dari Manajemen Akun (users) Berdasarkan Jabatan */
    function getAccountOperators() {
        const users = getUsers();
        const m = getMasterData();
        const fromUsers = users
            .filter(u => {
                if (u.status_akun !== 'ACTIVE') return false;
                const jab = String(u.jabatan || '').toUpperCase().trim();
                // Validasi ketat: Hanya yang memiliki jabatan Operator (bukan rigger)
                const isOp = jab.includes('OPERATOR') || jab.includes('OPT') || jab.includes('OPR');
                const isRigger = jab.includes('RIGGER') || jab.includes('RGG');
                return isOp && !isRigger;
            })
            .map(u => (u.nama_lengkap || '').trim().toUpperCase())
            .filter(Boolean);
        
        // Sertakan fallback dari master data jika ada
        const fromMaster = (Array.isArray(m.operator) ? m.operator : []).map(o => String(o || '').trim().toUpperCase()).filter(Boolean);
        return [...new Set([...fromUsers, ...fromMaster])].sort();
    }

    function getAccountRiggers() {
        const users = getUsers();
        const m = getMasterData();
        const fromUsers = users
            .filter(u => {
                if (u.status_akun !== 'ACTIVE') return false;
                const jab = String(u.jabatan || '').toUpperCase().trim();
                // Validasi ketat: Hanya yang memiliki jabatan Rigger
                const isRigger = jab.includes('RIGGER') || jab.includes('RGG');
                return isRigger;
            })
            .map(u => (u.nama_lengkap || '').trim().toUpperCase())
            .filter(Boolean);
        
        // Sertakan fallback dari master data jika ada
        const fromMaster = (Array.isArray(m.rigger) ? m.rigger : []).map(r => String(r || '').trim().toUpperCase()).filter(Boolean);
        return [...new Set([...fromUsers, ...fromMaster])].sort();
    }

    function getJobOperationalShift(j) {
        if (!j) return 'Shift 1';
        if (!j.jam_pelaksanaan) return j.shift || 'Shift 1';
        const parts = j.jam_pelaksanaan.split(':');
        const h = parseInt(parts[0], 10);
        if (isNaN(h)) return j.shift || 'Shift 1';
        // Shift 1: 05:00 - 16:59, Shift 2: 17:00 - 04:59
        return (h >= 5 && h < 17) ? 'Shift 1' : 'Shift 2';
    }

    function formatLocalTimestamp(isoString) {
        if (!isoString) return '-';
        let d = new Date(isoString);
        if (isNaN(d)) {
            try { return isoString.split('T')[0] + ' ' + isoString.split('T')[1].substring(0,5); } 
            catch(e) { return isoString; }
        }
        let date = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        let time = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
        return `${date} ${time}`;
    }

    function generatePaginationButtons(currentPage, totalPages) {
        let html = '';
        const maxButtons = 5;
        let start = Math.max(1, currentPage - Math.floor(maxButtons / 2));
        let end = Math.min(totalPages, start + maxButtons - 1);
        if (end - start + 1 < maxButtons) {
            start = Math.max(1, end - maxButtons + 1);
        }

        if (start > 1) {
            html += `<button type="button" onclick="goToOrderPage(1)" class="w-6 h-6 rounded text-[10px] font-bold border border-slate-300 bg-white text-slate-700 hover:bg-cyan-50 hover:text-cyan-700 shadow-2xs cursor-pointer">1</button>`;
            if (start > 2) {
                html += `<span class="text-slate-400 text-[10px] px-0.5 font-bold select-none">...</span>`;
            }
        }

        for (let i = start; i <= end; i++) {
            const active = (i === currentPage);
            html += `
                <button type="button" onclick="goToOrderPage(${i})" class="w-6 h-6 rounded text-[10px] font-bold border transition-all cursor-pointer ${active ? 'bg-[#0891b2] text-white border-cyan-600 shadow-sm' : 'bg-white text-slate-700 border-slate-300 hover:bg-cyan-50 hover:text-cyan-700 shadow-2xs'}">
                    ${i}
                </button>
            `;
        }

        if (end < totalPages) {
            if (end < totalPages - 1) {
                html += `<span class="text-slate-400 text-[10px] px-0.5 font-bold select-none">...</span>`;
            }
            html += `<button type="button" onclick="goToOrderPage(${totalPages})" class="w-6 h-6 rounded text-[10px] font-bold border border-slate-300 bg-white text-slate-700 hover:bg-cyan-50 hover:text-cyan-700 shadow-2xs cursor-pointer">${totalPages}</button>`;
        }
        return html;
    }

    function getNotificationPrefs() {
        const user = JSON.parse(localStorage.getItem('lifting_user')) || {};
        const nrp = user.nrp ? String(user.nrp).toUpperCase().trim() : 'DEFAULT';
        const storageKey = `lifting_notif_prefs_${nrp}`;
        try {
            const saved = JSON.parse(localStorage.getItem(storageKey));
            if (saved && typeof saved === 'object') {
                return {
                    order_masuk: saved.order_masuk !== false,
                    tindakan_validasi: saved.tindakan_validasi !== false,
                    status_order: saved.status_order !== false,
                    notif_umum: saved.notif_umum !== false
                };
            }
        } catch(e) {}
        return { order_masuk: true, tindakan_validasi: true, status_order: true, notif_umum: true };
    }

    function saveNotificationPref(prefKey, value) {
        const user = JSON.parse(localStorage.getItem('lifting_user')) || {};
        const nrp = user.nrp ? String(user.nrp).toUpperCase().trim() : 'DEFAULT';
        const storageKey = `lifting_notif_prefs_${nrp}`;
        let prefs = getNotificationPrefs();
        prefs[prefKey] = Boolean(value);
        if (prefKey === 'status_order') {
            prefs['notif_umum'] = Boolean(value);

    // Membuka kunci AudioContext pada interaksi pertama agar suara notifikasi dapat berbunyi otomatis di HP
    function unlockAudioContext() {
        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
                const ctx = new AudioCtx();
                if (ctx.state === 'suspended') ctx.resume();
            }
        } catch(e) {}
        document.removeEventListener('click', unlockAudioContext);
        document.removeEventListener('touchstart', unlockAudioContext);
    }
    document.addEventListener('click', unlockAudioContext);
    document.addEventListener('touchstart', unlockAudioContext);

    /* ========================================================
       SISTEM ANTI-INTERRUPT MODAL & PENUNDAAN RENDER REALTIME
       ======================================================== */
    window._pendingReRender = false;
    let reRenderTimer = null;

    function scheduleReRender(isSilentSync = true) {
        if (reRenderTimer) clearTimeout(reRenderTimer);
        // Tunda render jika pengguna sedang aktif menggeser layar / scroll agar tidak meloncat
        const delay = (Date.now() - lastUserScrollTime < 1200) ? 1200 : 50;
        reRenderTimer = setTimeout(() => {
            reRenderTimer = null;
            if (currentTab !== 'order' && !isAnyModalOpen()) {
                renderApp(isSilentSync);
            } else {
                window._pendingReRender = true;
            }
        }, delay);
    }

    function isAnyModalOpen() {
        const modalIds = [
            'mpActionModal', 'kendalaModal', 'cancelPromptModal', 
            'editJobModal', 'detailJobModal', 'unitStatusModal', 
            'assignedJobModal', 'dayJobsModal', 'globalConfirmModal', 
            'resetPwdModal', 'profileBiodataModal', 'profileSettingsModal', 
            'createUserModal', 'imageViewerModal', 'successModal'
        ];
        for (let i = 0; i < modalIds.length; i++) {
            const el = document.getElementById(modalIds[i]);
            if (el && !el.classList.contains('hidden')) {
                return true;
            }
        }
        // Hanya cegah render jika user sedang mengetik di formulir Buat Order
        const active = document.activeElement;
        if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA') && currentTab === 'order') {
            return true;
        }
        return false;
    }

    // Deteksi interaksi klik untuk mengeksekusi render yang tertunda setelah semua modal ditutup
    document.addEventListener('click', function() {
        if (window._pendingReRender) {
            setTimeout(function() {
                if (!isAnyModalOpen() && currentTab !== 'order') {
                    window._pendingReRender = false;
                    scheduleReRender(true);
                }
            }, 120);
        }
    });

    /* Logika Notifikasi Terpadu Real-time untuk Semua Role (Admin, GL, MP, dan User) */
    function notifyRolesOnOrderChange(newRecord, oldRecord, eventType = 'UPDATE') {
        const currentUser = JSON.parse(localStorage.getItem('lifting_user'));
        if (!currentUser || !newRecord || !newRecord.no_wo) return;

        const curRole = String(currentUser.role || '').toUpperCase().trim();
        const curName = normalizeName(currentUser.nama_lengkap);
        const curNrp = String(currentUser.nrp || '').toUpperCase().trim();

        const orderNrp = String(newRecord.nrp_pemohon || '').toUpperCase().trim();
        const orderName = normalizeName(newRecord.nama_pemohon);

        const isGlOrAdmin = (curRole === 'ADMIN' || curRole === 'GL');
        const isMP = (curRole === 'MANPOWER' || curRole === 'MP');
        const isOrderOwner = (orderNrp && orderNrp === curNrp) || (orderName && orderName === curName);

        const newOp = normalizeName(newRecord.operator);
        const newRig1 = normalizeName(newRecord.rigger);
        const newRig2 = normalizeName(newRecord.rigger2);

        const oldOp = oldRecord ? normalizeName(oldRecord.operator) : '';
        const oldRig1 = oldRecord ? normalizeName(oldRecord.rigger) : '';
        const oldRig2 = oldRecord ? normalizeName(oldRecord.rigger2) : '';

        const isAssignedToMe = (newOp === curName || newRig1 === curName || newRig2 === curName);
        const newlyAssigned = (newOp === curName && newOp !== oldOp) ||
                              (newRig1 === curName && newRig1 !== oldRig1) ||
                              (newRig2 === curName && newRig2 !== oldRig2);

        const statusChanged = oldRecord ? (oldRecord.status !== newRecord.status) : true;

        // Baca preferensi notifikasi pengguna yang tersimpan
        const prefs = getNotificationPrefs();

        // 1. NOTIFIKASI UNTUK ADMIN & GROUP LEADER (GL)
        if (isGlOrAdmin) {
            if (eventType === 'INSERT') {
                if (!prefs.order_masuk) return;
                triggerAppNotification(
                    "Ada Orderan Masuk!",
                    `Order ${newRecord.no_wo} dari ${newRecord.nama_pemohon || 'User'} (${newRecord.kategori || 'Armada'}) siap divalidasi.`,
                    'gl',
                    newRecord
                );
            } else if (statusChanged) {
                if (!prefs.tindakan_validasi) return;
                if (newRecord.status === 'COMPLETED') {
                    triggerAppNotification(
                        "Job Selesai Dikerjakan!",
                        `Job ${newRecord.no_wo} (${newRecord.unit || '-'}) telah diselesaikan oleh ${newRecord.operator || 'MP'}.`,
                        'gl',
                        newRecord
                    );
                } else if (newRecord.status === 'PENDING') {
                    triggerAppNotification(
                        "Job Dipending di Lapangan!",
                        `Job ${newRecord.no_wo} dipending. Memerlukan penanganan atau validasi shift berikutnya.`,
                        'gl',
                        newRecord
                    );
                } else if (newRecord.status === 'CANCELED') {
                    triggerAppNotification(
                        "Job Dibatalkan!",
                        `Job ${newRecord.no_wo} telah dibatalkan oleh lapangan.`,
                        'gl',
                        newRecord
                    );
                } else if (['SCHEDULED', 'UNSCHEDULED'].includes(newRecord.status)) {
                    triggerAppNotification(
                        "Order Butuh Validasi!",
                        `Order ${newRecord.no_wo} memerlukan penugasan unit atau approval GL.`,
                        'gl',
                        newRecord
                    );
                }
            }
        }

        // 2. NOTIFIKASI UNTUK MANPOWER (OPERATOR & RIGGER)
        if (isMP && isAssignedToMe) {
            if (!prefs.notif_umum) return;

            // Pekerjaan bertanggal masa depan (besok/lusa) tidak memicu notifikasi sampai harinya tiba
            const opDate = getJobOperationalDate(newRecord);
            const todayShift = getShiftDateString();
            if (opDate && opDate > todayShift) {
                return;
            }

            const isActiveState = ['ON PROGRESS', 'SCHEDULED'].includes(newRecord.status);
            if ((eventType === 'INSERT' || newlyAssigned || (statusChanged && isActiveState)) && isActiveState) {
                triggerAppNotification(
                    "Penugasan Job Baru!",
                    `Job ${newRecord.no_wo} (${newRecord.kategori || 'Armada'}) ditugaskan kepada Anda (Unit: ${newRecord.unit || '-'}). Segera laksanakan.`,
                    'mp',
                    newRecord
                );
                // Hanya buka modal alert jika MP sedang tidak membuka modal lain
                if (!isAnyModalOpen()) {
                    openAssignedJobAlert(newRecord);
                }
            } else if (statusChanged && newRecord.status === 'CANCELED') {
                triggerAppNotification(
                    "Job Dibatalkan",
                    `Job ${newRecord.no_wo} yang ditugaskan kepada Anda telah dibatalkan.`,
                    'gl',
                    newRecord
                );
            } else if (statusChanged && newRecord.status === 'PENDING') {
                triggerAppNotification(
                    "Job Dipending",
                    `Job ${newRecord.no_wo} telah ditandai pending. Menunggu validasi GL.`,
                    'gl',
                    newRecord
                );
            }
        }

        // 3. NOTIFIKASI UNTUK USER (PEMOHON)
        if (isOrderOwner) {
            if (prefs.status_order === false || prefs.notif_umum === false) return;
            if (eventType === 'INSERT' && newRecord.no_wo && newRecord.no_wo.includes('-L')) {
                triggerAppNotification(
                    "Order Lanjutan Diterbitkan!",
                    `Order ${newRecord.no_wo} otomatis dibuat untuk melanjutkan pekerjaan sebelumnya.`,
                    'gl',
                    newRecord
                );
            } else if (statusChanged) {
                let userMsg = '';
                if (newRecord.status === 'ON PROGRESS') {
                    userMsg = `Order ${newRecord.no_wo} sedang dikerjakan oleh unit ${newRecord.unit || '-'} (${newRecord.operator || 'Operator'}).`;
                } else if (newRecord.status === 'COMPLETED') {
                    userMsg = `Order ${newRecord.no_wo} telah selesai dikerjakan (COMPLETED). Terima kasih.`;
                } else if (newRecord.status === 'PENDING') {
                    userMsg = `Order ${newRecord.no_wo} dipending. Menunggu penanganan shift berikutnya.`;
                } else if (newRecord.status === 'CANCELED') {
                    userMsg = `Order ${newRecord.no_wo} telah dibatalkan: ${cleanKendalaText(newRecord.alasan_telat || '') || 'Dibatalkan'}.`;
                } else if (newRecord.status === 'SCHEDULED' && oldRecord && oldRecord.status === 'UNSCHEDULED') {
                    userMsg = `Order ${newRecord.no_wo} telah dijadwalkan untuk ${newRecord.tgl_pelaksanaan}.`;
                }

                if (userMsg) {
                    triggerAppNotification(
                        `Update Order: ${newRecord.status}`,
                        userMsg,
                        newRecord.status === 'COMPLETED' || newRecord.status === 'ON PROGRESS' ? 'mp' : 'gl',
                        newRecord
                    );
                }
            }
        }
    }

    // Handler Realtime Presisi: Memperbarui data lokal secara instan dari payload tanpa re-query PostgREST
    function handleRealtimeOrderChange(payload) {
        try {
            let orders = getOrders();
            const { eventType, new: newRecord, old: oldRecord } = payload;
            let changed = false;

            if (eventType === 'INSERT' && newRecord && newRecord.no_wo) {
                const existingIdx = orders.findIndex(o => o.no_wo === newRecord.no_wo);
                if (existingIdx === -1) {
                    orders.unshift(newRecord);
                    changed = true;
                    notifyRolesOnOrderChange(newRecord, null, 'INSERT');
                } else {
                    const prev = orders[existingIdx];
                    orders[existingIdx] = newRecord;
                    changed = true;
                    notifyRolesOnOrderChange(newRecord, prev, 'UPDATE');
                }
            } else if (eventType === 'UPDATE' && newRecord && newRecord.no_wo) {
                const idx = orders.findIndex(o => o.no_wo === newRecord.no_wo);
                const prev = idx !== -1 ? orders[idx] : oldRecord;
                if (idx !== -1) {
                    orders[idx] = newRecord;
                } else {
                    orders.unshift(newRecord);
                }
                changed = true;
                notifyRolesOnOrderChange(newRecord, prev, 'UPDATE');
            } else if (eventType === 'DELETE' && oldRecord) {
                const targetWo = oldRecord.no_wo;
                const prevLen = orders.length;
                orders = orders.filter(o => o.no_wo !== targetWo);
                if (orders.length !== prevLen) {
                    changed = true;
                }
            }

            if (changed) {
                window.globalOrdersCache = orders;
                localStorage.setItem('lifting_orders', JSON.stringify(orders));
                updateNotificationBadge();
                
                // JANGAN re-render jika user sedang membuka modal / mengetik laporan
                if (currentTab !== 'order' && !isAnyModalOpen()) {
                    scheduleReRender(true);
                } else {
                    window._pendingReRender = true;
                }
            }
        } catch (err) {
            console.warn("Gagal memproses realtime order:", err);
        }
    }

    function handleRealtimeSettingsChange(payload) {
        try {
            if (payload.new && payload.new.id === 1) {
                localStorage.setItem('lifting_settings', JSON.stringify(payload.new));
                if (currentTab !== 'order' && !isAnyModalOpen()) renderApp(true);
                else window._pendingReRender = true;
            }
        } catch (e) {}
    }

    function handleRealtimeUsersChange(payload) {
        try {
            let users = getUsers();
            if (payload.eventType === 'INSERT' && payload.new) {
                if (!users.some(u => u.nrp === payload.new.nrp)) {
                    users.push(payload.new);
                    localStorage.setItem('lifting_users', JSON.stringify(users));
                }
            } else if (payload.eventType === 'UPDATE' && payload.new) {
                const idx = users.findIndex(u => u.nrp === payload.new.nrp);
                if (idx !== -1) {
                    users[idx] = payload.new;
                    localStorage.setItem('lifting_users', JSON.stringify(users));
                }
            } else if (payload.eventType === 'DELETE' && payload.old) {
                users = users.filter(u => u.nrp !== payload.old.nrp);
                localStorage.setItem('lifting_users', JSON.stringify(users));
            }
            if (currentTab === 'master' && !isAnyModalOpen()) renderApp(true);
            else if (currentTab === 'master') window._pendingReRender = true;
        } catch (e) {}
    }

    function handleRealtimeMasterChange(payload) {
        try {
            if (payload.new && payload.new.id === 1) {
                localStorage.setItem('lifting_master_data', JSON.stringify(payload.new));
                if (currentTab === 'master' && !isAnyModalOpen()) renderApp(true);
                else if (currentTab === 'master') window._pendingReRender = true;
            }
        } catch (e) {}
    }

    function handleRealtimeUnitStatusChange(payload) {
        try {
            const u = payload.new;
            if (u) {
                const uName = u.unit_code || u.unit_name || u.nama_unit || u.name;
                if (uName) {
                    const rawIsActive = u.is_active;
                    const isActive = (rawIsActive === true || rawIsActive === 'true' || rawIsActive === 1 || rawIsActive === '1');
                    const reason = isActive ? '' : (u.alasan_off || u.alasan || u.reason || 'Non-Aktif');
                    
                    let unitStatusMap = getUnitStatusMap();
                    unitStatusMap[uName] = {
                        status: isActive ? 'ACTIVE' : 'INACTIVE',
                        reason: reason,
                        updated_at: u.updated_at || new Date().toISOString()
                    };
                    const norm = normalizeUnitKey(uName);
                    unitStatusMap[norm] = unitStatusMap[uName];
                    localStorage.setItem('lifting_unit_status', JSON.stringify(unitStatusMap));

                    const m = getMasterData();
                    if (!m.unit_status_map) m.unit_status_map = {};
                    m.unit_status_map[uName] = unitStatusMap[uName];
                    m.unit_status_map[norm] = unitStatusMap[uName];
                    localStorage.setItem('lifting_master_data', JSON.stringify(m));

                    // Update juga rawSupabaseUnits
                    let rawUnits = [];
                    try { rawUnits = JSON.parse(localStorage.getItem('lifting_raw_unit_status')) || []; } catch(e) {}
                    const idx = rawUnits.findIndex(r => normalizeUnitKey(r.unit_code || r.unit_name || r.name) === norm);
                    if (idx !== -1) rawUnits[idx] = u; else rawUnits.push(u);
                    localStorage.setItem('lifting_raw_unit_status', JSON.stringify(rawUnits));

                    if (currentTab !== 'order' && !isAnyModalOpen()) {
                        renderApp(true);
                    } else {
                        window._pendingReRender = true;
                    }
                }
            }
        } catch (e) {}
    }

    let realtimeChannel = null;
    let realtimeReconnectTimer = null;

    function initSupabaseRealtime() {
        if (!supabaseClient) return;
        try {
            // Hindari inisialisasi ganda jika channel sudah aktif terhubung
            if (realtimeChannel && (realtimeChannel.state === 'joined' || realtimeChannel.state === 'joining')) {
                return;
            }
            if (realtimeChannel) {
                supabaseClient.removeChannel(realtimeChannel);
                realtimeChannel = null;
            }
            realtimeChannel = supabaseClient.channel('portal-lifting-realtime-all')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, handleRealtimeOrderChange)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'settings' }, handleRealtimeSettingsChange)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'users' }, handleRealtimeUsersChange)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'master_data' }, handleRealtimeMasterChange)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'unit_status' }, handleRealtimeUnitStatusChange)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'company_status' }, (payload) => {
                    try {
                        const rec = payload.new;
                        if (rec && rec.nama_perusahaan) {
                            const norm = normalizeName(rec.nama_perusahaan);
                            const col = (rec.warna_wo || 'BLUE').toUpperCase() === 'RED' ? 'merah' : 'biru';
                            if (!window.companyColorMap) window.companyColorMap = {};
                            window.companyColorMap[norm] = col;
                            let m = getMasterData();
                            if (!m.perusahaan_colors) m.perusahaan_colors = {};
                            m.perusahaan_colors[rec.nama_perusahaan] = col;
                            m.perusahaan_colors[norm] = col;
                            localStorage.setItem('lifting_master_data', JSON.stringify(m));
                            if (currentTab !== 'order' && !isAnyModalOpen()) {
                                renderApp(true);
                            } else {
                                window._pendingReRender = true;
                            }
                        }
                    } catch(e) {}
                })
                .subscribe((status, err) => {
                    console.log("Supabase Realtime Status:", status);
                    // HANYA rekoneksi saat terjadi error nyata atau timeout jaringan.
                    // Jangan rekoneksi saat 'CLOSED' karena 'CLOSED' adalah pemutusan normal saat removeChannel
                    if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                        realtimeChannel = null;
                        if (!realtimeReconnectTimer) {
                            realtimeReconnectTimer = setTimeout(() => {
                                realtimeReconnectTimer = null;
                                initSupabaseRealtime();
                            }, 4000);
                        }
                    }
                });
        } catch(e) {
            console.warn("Koneksi realtime Supabase:", e);
            if (!realtimeReconnectTimer) {
                realtimeReconnectTimer = setTimeout(() => {

    async function fetchFromSupabase(isManual = false) {
        if (!SUPABASE_KEY || SUPABASE_KEY.includes('PASTE_KUNCI')) return;
        lastFetchTimestamp = Date.now();
        try {
            const [resOrders, resSettings, resUsers, resMaster, resUnitStatus, resCompanyStatus] = await Promise.all([
                fetch(`${SUPABASE_URL}/rest/v1/orders?select=*&order=timestamp.desc&limit=1000`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }).catch(() => null),
                fetch(`${SUPABASE_URL}/rest/v1/settings?id=eq.1`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }).catch(() => null),
                fetch(`${SUPABASE_URL}/rest/v1/users?select=*`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }).catch(() => null),
                fetch(`${SUPABASE_URL}/rest/v1/master_data?id=eq.1`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }).catch(() => null),
                fetch(`${SUPABASE_URL}/rest/v1/unit_status?select=*`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }).catch(() => null),
                fetch(`${SUPABASE_URL}/rest/v1/company_status?select=*`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }).catch(() => null)
            ]);

            let shouldRender = false;
            
            // 1. Sinkronisasi Data Order: Supabase sebagai SINGLE SOURCE OF TRUTH
            if (resOrders && resOrders.ok) { 
                const data = await resOrders.json(); 
                if(Array.isArray(data)) { 
                    data.forEach(item => { if (item.foto_evidence) delete item.foto_evidence; });
                    
                    // Filter pembersihan permanen job TOHA agar tidak pernah muncul lagi
                    const cleanServerOrders = data.filter(item => {
                        const wo = String(item.no_wo || '').toUpperCase();
                        const pemohon = String(item.nama_pemohon || '').toUpperCase();
                        return !(wo === 'CT-20260917-18' || pemohon.includes('TOHA'));
                    });

                    // Cek perubahan data nyata: hanya render jika data berbeda dengan cache lokal
                    const currentStoredOrders = localStorage.getItem('lifting_orders') || '[]';
                    const newOrdersSerialized = JSON.stringify(cleanServerOrders);

                    if (currentStoredOrders !== newOrdersSerialized) {
                        // Deteksi pekerjaan baru / perubahan penugasan yang masuk saat HP sedang di-background / sleep
                        const prevOrders = window.globalOrdersCache || [];
                        if (prevOrders.length > 0 && cleanServerOrders.length > 0) {
                            const prevMap = new Map(prevOrders.map(o => [String(o.no_wo || '').trim(), o]));
                            cleanServerOrders.forEach(newRec => {
                                const targetWo = String(newRec.no_wo || '').trim();
                                if (!targetWo) return;
                                const oldRec = prevMap.get(targetWo);
                                if (!oldRec) {
                                    notifyRolesOnOrderChange(newRec, null, 'INSERT');
                                } else if (oldRec.status !== newRec.status || oldRec.unit !== newRec.unit || oldRec.operator !== newRec.operator || oldRec.rigger !== newRec.rigger || oldRec.rigger2 !== newRec.rigger2) {
                                    notifyRolesOnOrderChange(newRec, oldRec, 'UPDATE');
                                }
                            });
                        }

                        // Update memory cache langsung dari Supabase
                        window.globalOrdersCache = cleanServerOrders;
                        localStorage.setItem('lifting_orders', newOrdersSerialized); 
                        updateNotificationBadge();
                        shouldRender = true; 
                    } else if (!window.globalOrdersCache || window.globalOrdersCache.length === 0) {
                        window.globalOrdersCache = cleanServerOrders;
                    }
                } 
            }

            // 2. Sinkronisasi Warna Perusahaan dari tabel company_status
            if (resCompanyStatus && resCompanyStatus.ok) {
                const compData = await resCompanyStatus.json();
                if (Array.isArray(compData) && compData.length > 0) {
                    const currentCompStr = localStorage.getItem('lifting_raw_comp_status') || '[]';
                    const newCompStr = JSON.stringify(compData);
                    if (currentCompStr !== newCompStr) {
                        localStorage.setItem('lifting_raw_comp_status', newCompStr);
                        let m = getMasterData();
                        if (!m.perusahaan_colors) m.perusahaan_colors = {};
                        if (!window.companyColorMap) window.companyColorMap = {};

                        compData.forEach(row => {
                            const cName = row.nama_perusahaan || row.name;
                            const cColor = (row.warna_wo || 'BLUE').toUpperCase() === 'RED' ? 'merah' : 'biru';
                            if (cName) {
                                const norm = normalizeName(cName);
                                window.companyColorMap[norm] = cColor;
                                m.perusahaan_colors[cName] = cColor;
                                m.perusahaan_colors[norm] = cColor;
                            }
                        });
                        localStorage.setItem('lifting_master_data', JSON.stringify(m));
                        shouldRender = true;
                    }
                }
            }

            if (resSettings && resSettings.ok) { const data = await resSettings.json(); if(data && data.length > 0) { let ds = JSON.stringify(data[0]); if(localStorage.getItem('lifting_settings') !== ds) { localStorage.setItem('lifting_settings', ds); shouldRender = true; } } }
            if (resUsers && resUsers.ok) { const data = await resUsers.json(); if(Array.isArray(data) && data.length > 0) { let ds = JSON.stringify(data); if(localStorage.getItem('lifting_users') !== ds) { localStorage.setItem('lifting_users', ds); shouldRender = true; } } }
            if (resMaster && resMaster.ok) { const data = await resMaster.json(); if(data && data.length > 0) { let ds = JSON.stringify(data[0]); if(localStorage.getItem('lifting_master_data') !== ds) { localStorage.setItem('lifting_master_data', ds); shouldRender = true; } } }
            
            // Sinkronisasi Tabel unit_status
            if (resUnitStatus && resUnitStatus.ok) {
                const unitsData = await resUnitStatus.json();
                if (Array.isArray(unitsData) && unitsData.length > 0) {
                    const currentUnitsStr = localStorage.getItem('lifting_raw_unit_status') || '[]';
                    const newUnitsStr = JSON.stringify(unitsData);
                    if (currentUnitsStr !== newUnitsStr) {
                        localStorage.setItem('lifting_raw_unit_status', newUnitsStr);
                        window._rawSupabaseUnits = unitsData;
                        
                        let unitStatusMap = {};
                        try {
                            unitStatusMap = JSON.parse(localStorage.getItem('lifting_unit_status')) || {};
                        } catch(e) { unitStatusMap = {}; }

                        unitsData.forEach(u => {
                            const uName = u.unit_code || u.unit_name || u.nama_unit || u.name;
                            if (uName) {
                                const rawIsActive = u.is_active;
                                const isActive = (rawIsActive === true || rawIsActive === 'true' || rawIsActive === 1 || rawIsActive === '1');
                                const reason = isActive ? '' : (u.alasan_off || u.alasan || u.reason || 'Non-Aktif');
                                unitStatusMap[uName] = {
                                    status: isActive ? 'ACTIVE' : 'INACTIVE',
                                    reason: reason,
                                    updated_at: u.updated_at || new Date().toISOString()
                                };
                                const norm = normalizeUnitKey(uName);
                                unitStatusMap[norm] = unitStatusMap[uName];
                            }
                        });
                        localStorage.setItem('lifting_unit_status', JSON.stringify(unitStatusMap));
                        
                        const m = getMasterData();
                        m.unit_status_map = unitStatusMap;
                        localStorage.setItem('lifting_master_data', JSON.stringify(m));
                        shouldRender = true;
                    }
                }
            }

            if(isManual) { 
                showToast("Data berhasil disinkronkan!", "success"); 
                scheduleReRender(false); 
            } else if(shouldRender) { 
                if (currentTab !== 'order' && !isAnyModalOpen()) {
                    scheduleReRender(true); 
                } else {
                    window._pendingReRender = true;
                }
            }
        } catch(e) { console.warn("Gagal mengambil data:", e); }
    }
