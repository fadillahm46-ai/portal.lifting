    function getShiftDateString() {
        const d = new Date();
        if (d.getHours() < 5) d.setDate(d.getDate() - 1);

    function formatDurationHM(minutes) {
        minutes = Math.round(minutes);
        if (isNaN(minutes) || minutes <= 0) return '0 Menit';
        const h = Math.floor(minutes / 60);
        const m = minutes % 60;
        if (h > 0 && m > 0) return `${h} Jam ${m} Menit`;
        if (h > 0) return `${h} Jam`;
        return `${m} Menit`;
    }

function getJobOperationalDate(j) {
    if (!j || !j.tgl_pelaksanaan) return '';
    // Murni membaca tanggal pelaksanaan sesuai yang diinput tanpa dimundurkan
    return j.tgl_pelaksanaan;
}

function getJobOperationalShift(j) {
    if (!j) return 'Shift 1';
    if (!j.jam_pelaksanaan) return j.shift || 'Shift 1';
    const parts = j.jam_pelaksanaan.split(':');
    const h = parseInt(parts[0], 10);
    if (isNaN(h)) return j.shift || 'Shift 1';
    // Shift 1: 05:00 - 16:59, Shift 2: 17:00 - 04:59 (termasuk jam 02:00 dini hari)
    return (h >= 5 && h < 17) ? 'Shift 1' : 'Shift 2';
}

    function formatLocalTimestamp(isoString) {
        if (!isoString) return '-';
        let d = new Date(isoString);
        if (isNaN(d)) {
            try { return isoString.split('T')[0] + ' ' + isoString.split('T')[1].substring(0,5); } 
            catch(e) { return isoString; }
        }
        let date = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        let time = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
        return `${date} ${time}`;
    }

            .on('postgres_changes', { event: '*', schema: 'public', table: 'users' }, payload => { if (currentTab !== 'order') fetchFromSupabase(false); })

    async function fetchFromSupabase(isManual = false) {
        if (!SUPABASE_KEY || SUPABASE_KEY.includes('PASTE_KUNCI')) return;
        try {
            const [resOrders, resSettings, resUsers, resMaster] = await Promise.all([
                fetch(`${SUPABASE_URL}/rest/v1/orders?select=*&order=timestamp.desc&limit=200`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }),
                fetch(`${SUPABASE_URL}/rest/v1/settings?id=eq.1`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }),
                fetch(`${SUPABASE_URL}/rest/v1/users?select=*`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }),
                fetch(`${SUPABASE_URL}/rest/v1/master_data?id=eq.1`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } })
            ]);

            let shouldRender = false;
            
            if (resOrders.ok) { const data = await resOrders.json(); if(Array.isArray(data)) { let ds = JSON.stringify(data); if(localStorage.getItem('lifting_orders') !== ds) { localStorage.setItem('lifting_orders', ds); shouldRender = true; } } }
            if (resSettings.ok) { const data = await resSettings.json(); if(data && data.length > 0) { let ds = JSON.stringify(data[0]); if(localStorage.getItem('lifting_settings') !== ds) { localStorage.setItem('lifting_settings', ds); shouldRender = true; } } }
            if (resUsers.ok) { const data = await resUsers.json(); if(Array.isArray(data) && data.length > 0) { let ds = JSON.stringify(data); if(localStorage.getItem('lifting_users') !== ds) { localStorage.setItem('lifting_users', ds); shouldRender = true; } } }
            if (resMaster.ok) { const data = await resMaster.json(); if(data && data.length > 0) { let ds = JSON.stringify(data[0]); if(localStorage.getItem('lifting_master_data') !== ds) { localStorage.setItem('lifting_master_data', ds); shouldRender = true; } } }
            
            if(isManual) { showToast("Data berhasil disinkronkan!", "success"); renderApp(false); }
            else if(shouldRender) { 
                // Jangan me-render ulang saat pengguna sedang mengisi form order agar input tidak ter-reset
                if (currentTab !== 'order') {
                    renderApp(true); 
                }
            }
        } catch(e) { console.warn("Gagal mengambil data:", e); }
    }

    function copyText(text, label) {

    function copyJobToWA(wo) {
        let job = getOrders().find(j => j.no_wo === wo);
        if(!job) return;
        
        let currentUser = JSON.parse(localStorage.getItem('lifting_user'));
        let waText = '';
        
        let statusEmoji = job.status;
        if (job.status === 'COMPLETED') statusEmoji += ' ✅';
        else if (job.status === 'PENDING') statusEmoji += ' ⏸️';
        else if (job.status === 'CANCELED') statusEmoji += ' ❌';
        
        let userFormat = `*DETAIL JOB LIFTING*\n- *NO WO :* ${job.no_wo}\n- *ORDER UNIT :* ${job.kategori} ${job.unit ? '('+job.unit+')' : ''}\n- *STATUS :* ${statusEmoji}\n- *PEMOHON :* ${job.nama_pemohon}\n- *PERUSAHAAN :* ${job.perusahaan}\n- *DEPARTEMEN :* ${job.departemen}\n- *SECTION :* ${job.section}\n- *KONTAK WA :* ${job.no_wa}\n- *TANGGAL :* ${job.tgl_pelaksanaan} ${job.jam_pelaksanaan ? '| Jam : '+job.jam_pelaksanaan : ''}\n- *LOKASI :* ${job.lokasi_angkat || '-'} ➔ ${job.lokasi_tujuan || '-'}\n- *DESKRIPSI :* ${job.deskripsi}`;

        let mpFormat = `*PELAPORAN PROGRES JOB LIFTING*\n- *NO WO :* ${job.no_wo}\n- *STATUS :* ${statusEmoji}\n- *NAMA JOB :* ${job.deskripsi}\n- *JAM START :* ${job.jam_start_aktual || '-'}\n- *JAM FINISH :* ${job.jam_end_aktual || '-'}\n- *NO. UNIT :* ${job.unit || '-'}\n- *NAMA OPERATOR :* ${job.operator || '-'}\n- *NAMA RIGGER :* ${job.rigger || '-'}${job.rigger2 ? ', ' + job.rigger2 : ''}\n- *FINAL INSPEKSI :* ${job.final_inspeksi || '-'}\n- *KENDALA :* ${job.alasan_telat ? 'Telat : ' + job.alasan_telat + ' ' : ''}${job.alasan_overtime ? 'Over : ' + job.alasan_overtime : ''}${(!job.alasan_telat && !job.alasan_overtime) ? '-' : ''}`;

        if (currentUser && currentUser.role === 'USER') {
            waText = userFormat;
        } else {
            if (job.status === 'SCHEDULED' || job.status === 'UNSCHEDULED') {
                waText = userFormat;
            } else {
                waText = mpFormat; 
            }
        }
        copyText(waText, 'Job WA');
    }

    function generateWO(kategori) {
        const date = new Date();
        const yyyy = date.getFullYear(); const mm = String(date.getMonth() + 1).padStart(2, '0'); const dd = String(date.getDate()).padStart(2, '0');
        let prefix = kategori === 'Big Crane' ? 'BC-' : (kategori === 'Lowboy' ? 'LB-' : 'CT-');
        const datePrefix = `${prefix}${yyyy}${mm}${dd}-`;
        
        let maxNumber = 0;
        getOrders().forEach(job => {
            if (job.no_wo && job.no_wo.startsWith(datePrefix)) {
                const parts = job.no_wo.split('-');
                if (parts.length >= 3) {
                    const num = parseInt(parts[2].split('-P')[0], 10);
                    if (!isNaN(num) && num > maxNumber) maxNumber = num;
                }
            }
        });
        return `${datePrefix}${maxNumber + 1}`;
    }

        if (currentTab === 'dashboard' && (user.role === 'ADMIN' || user.role === 'GL')) {
            setTimeout(initDashboardCharts, 100);
        }
        
        if (currentTab === 'jadwal' || (currentTab === 'order' && userOrderFleetMode === 'Big Crane' && user.role === 'USER')) {
            setTimeout(initBcCalendar, 100);
        }
    }

                userOrderFleetMode = null;
            }
        } 
        if(tab === 'monitoring') mpFleetMode = null;
        currentTab = tab;
        window.location.hash = tab;
        renderApp(false); 
    }

    function toggleAuthMode(targetId) { 
        document.getElementById('authForm').classList.add('hidden'); 
        document.getElementById('signupForm').classList.add('hidden'); 
        document.getElementById('forgotPwdForm').classList.add('hidden'); 
        
        document.getElementById(targetId).classList.remove('hidden'); 

        if(targetId === 'forgotPwdForm') {
            document.getElementById('step1Forgot').classList.remove('hidden');
            document.getElementById('step2Forgot').classList.add('hidden');
            document.getElementById('forgotNrp').value = '';
        }
    }

    function handleLogin(e) {
        e.preventDefault();
        const nrp = document.getElementById('loginNrp').value.trim().toUpperCase(); const pwd = document.getElementById('loginPwd').value;
        const users = getUsers(); const user = users.find(u => (u.nrp || '').toUpperCase() === nrp && u.password_hash === pwd && u.status_akun === 'ACTIVE');
        const errorMsg = document.getElementById('loginErrorMsg');
        
        if (user) {
            localStorage.setItem('lifting_user', JSON.stringify(user));
            // Bersihkan draf umum legacy jika pernah ada
            localStorage.removeItem('lifting_order_draft');
            const homeTab = (user.role === 'ADMIN' || user.role === 'GL') ? 'dashboard' : (user.role === 'USER' ? 'order' : 'monitoring');
            currentTab = homeTab;
            window.location.hash = homeTab;
            
            // Muat armada dari draf khusus milik NRP ini jika ada
            const userDraftKey = `lifting_order_draft_${user.nrp.toUpperCase()}`;
            try {
                const savedDraft = JSON.parse(localStorage.getItem(userDraftKey));
                userOrderFleetMode = (savedDraft && savedDraft.fleetMode) ? savedDraft.fleetMode : null;
            } catch(err) {
                userOrderFleetMode = null;
            }
            mpFleetMode = null; 
            renderApp(false);
        } else {
            errorMsg.innerHTML = '<i class="fa-solid fa-circle-exclamation mr-1"></i>NRP atau Password salah!'; errorMsg.classList.remove('hidden');
        }
    }

    function handleLogout() { 
        userOrderFleetMode = null;
        mpFleetMode = null;
        localStorage.removeItem('lifting_user'); 
        window.location.hash = ''; 
        renderApp(false); 
    }

    function handleSignup(e) {
        e.preventDefault();
        const users = getUsers(); const nrp = document.getElementById('regNrp').value.trim().toUpperCase();
        if (users.find(u => (u.nrp || '').toUpperCase() === nrp)) return showToast('NRP terdaftar!', 'error');

        const newUser = {
            nrp: nrp, 
            nama_lengkap: document.getElementById('regName').value.trim().toUpperCase(), 
            jabatan: document.getElementById('regJabatan').value.trim().toUpperCase(),
            perusahaan: document.getElementById('regPerusahaan').value, 
            departemen: document.getElementById('regDepartemen').value,
            section: document.getElementById('regSection').value, 
            no_wa: document.getElementById('regWa').value,
            password_hash: document.getElementById('regPwd').value, 
            role: 'USER', 
            status_akun: 'ACTIVE'
        };
        users.push(newUser); saveUsers(users); 
        
        document.getElementById('successRegMsg').innerText = "Silakan masuk dengan akun Anda.";
        const m = document.getElementById('successRegModal');
        m.classList.remove('hidden');
        
        setTimeout(() => {
            m.classList.add('hidden');
            toggleAuthMode('authForm');
            document.getElementById('loginNrp').value = nrp;
            document.getElementById('loginPwd').value = '';
        }, 1500);
    }

    function checkForgotNrp(e) {
        e.preventDefault();
        const nrp = document.getElementById('forgotNrp').value.trim().toUpperCase();
        const users = getUsers();
        const user = users.find(u => (u.nrp || '').toUpperCase() === nrp);
        if(user) {
            document.getElementById('step1Forgot').classList.add('hidden');
            document.getElementById('step2Forgot').classList.remove('hidden');
            document.getElementById('forgotTargetNrp').value = nrp;
        } else {
            showToast('NRP tidak ditemukan!', 'error');
        }
    }

    function submitNewPassword(e) {
        e.preventDefault();
        const nrp = document.getElementById('forgotTargetNrp').value;
        const p1 = document.getElementById('forgotPwd1').value;
        const p2 = document.getElementById('forgotPwd2').value;
        if(p1 !== p2) return showToast('Password tidak cocok!', 'error');

        let users = getUsers();
        let idx = users.findIndex(u => (u.nrp || '').toUpperCase() === nrp);
        if(idx !== -1) {
            users[idx].password_hash = p1;
            saveUsers(users); 
            
            if (SUPABASE_KEY && !SUPABASE_KEY.includes('PASTE_KUNCI')) {
                fetch(`${SUPABASE_URL}/rest/v1/users?nrp=eq.${nrp}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
                    body: JSON.stringify({ password_hash: p1 })

    function saveProfile(e) { 
        e.preventDefault(); 
        let user = JSON.parse(localStorage.getItem('lifting_user')); 
        let users = getUsers(); 
        let idx = users.findIndex(u => (u.nrp || '').toUpperCase() === (user.nrp || '').toUpperCase()); 
        
        user.nama_lengkap = document.getElementById('profName').value.trim().toUpperCase(); 
        user.jabatan = document.getElementById('profJabatan').value.trim().toUpperCase(); 
        user.perusahaan = document.getElementById('profPerusahaan').value; 
        user.departemen = document.getElementById('profDepartemen').value; 
        user.section = document.getElementById('profSection').value; 
        user.no_wa = document.getElementById('profWa').value.trim(); 
        
        if(idx !== -1) {
            users[idx] = user; 
            saveUsers(users); 
            localStorage.setItem('lifting_user', JSON.stringify(user)); 
            
            if (SUPABASE_KEY && !SUPABASE_KEY.includes('PASTE_KUNCI')) {
                fetch(`${SUPABASE_URL}/rest/v1/users?nrp=eq.${user.nrp}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
                    body: JSON.stringify({
                        nama_lengkap: user.nama_lengkap,
                        jabatan: user.jabatan,
                        perusahaan: user.perusahaan,
                        departemen: user.departemen,
                        section: user.section,
                        no_wa: user.no_wa
                    })
                }).catch(err => console.warn(err));
            }

            showToast('Profil berhasil diperbarui!'); 
            document.getElementById('profileBiodataModal').classList.add('hidden');
            renderApp(true); 
        }
    }

        if (pwd1 !== pwd2) return showToast('Password tidak cocok!', 'error'); 
        
        let user = JSON.parse(localStorage.getItem('lifting_user')); 
        let users = getUsers(); 
        let idx = users.findIndex(u => (u.nrp || '').toUpperCase() === (user.nrp || '').toUpperCase());

    function addMasterDataItem(e, key) {
        e.preventDefault();
        const input = document.getElementById('newMasterItemInput');
        const val = input.value.trim().toUpperCase();
        if (!val) return;
        const m = getMasterData();
        if (!m[key]) m[key] = [];
        if (!m[key].includes(val)) {
            m[key].push(val);
            saveMasterData(m);
            showToast('Item berhasil ditambahkan');
            renderApp(true);
        } else {
            showToast('Item sudah ada!', 'error');
        }
    }

    function deleteMasterDataItem(key, idx) {
        const m = getMasterData();

    function getDashboardView() {
        let jobs = getOrders();
        
        let tglMulai = document.getElementById('dash_tgl_mulai') ? document.getElementById('dash_tgl_mulai').value : getShiftDateString();
        let tglSelesai = document.getElementById('dash_tgl_selesai') ? document.getElementById('dash_tgl_selesai').value : getShiftDateString();
        
        let dashShift = document.getElementById('dash_shift') ? document.getElementById('dash_shift').value : 'ALL';
        let dashUnit = document.getElementById('dash_unit') ? document.getElementById('dash_unit').value : 'ALL';

        let filteredJobs = jobs.filter(j => {
            const opDate = getJobOperationalDate(j);
            return opDate >= tglMulai && opDate <= tglSelesai;
        });
        if (dashShift !== 'ALL') filteredJobs = filteredJobs.filter(j => getJobOperationalShift(j) === dashShift);
        if (dashUnit !== 'ALL') filteredJobs = filteredJobs.filter(j => j.kategori === dashUnit);

        let cntOrder = filteredJobs.length;
        let cntProg = filteredJobs.filter(j => j.status === 'ON PROGRESS').length;
        let cntPend = filteredJobs.filter(j => j.status === 'PENDING').length; 
        let cntDone = filteredJobs.filter(j => j.status === 'COMPLETED').length;
        let cntCancel = filteredJobs.filter(j => j.status === 'CANCELED').length;

        let cntCT = filteredJobs.filter(j => j.kategori === 'Crane Truck').length; 
        let cntBC = filteredJobs.filter(j => j.kategori === 'Big Crane').length; 
        let cntLB = filteredJobs.filter(j => j.kategori === 'Lowboy').length;
        let totalUnits = cntCT + cntBC + cntLB || 1; 

        let pctCT = Math.round((cntCT / totalUnits) * 100) || 0; 
        let pctBC = Math.round((cntBC / totalUnits) * 100) || 0; 
        let pctLB = Math.round((cntLB / totalUnits) * 100) || 0;
        let degCT = (pctCT / 100) * 360; let degBC = degCT + ((pctBC / 100) * 360);
        
        let pieStyle = `background: conic-gradient(#0d9488 0deg ${degCT}deg, #4ade80 ${degCT}deg ${degBC}deg, #a7f3d0 ${degBC}deg 360deg);`;

        return `
        <div class="max-w-6xl w-full mx-auto space-y-3 relative z-10">
            <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-2">

                </div>
                
                <div class="flex items-center text-[10px] w-full lg:w-auto bg-white border border-slate-200 rounded-md p-1 shadow-sm flex-wrap gap-y-1 relative z-20">
                    <div class="flex items-center shrink-0 pr-1">
                        <i class="fa-regular fa-calendar mx-1 text-slate-400"></i>
                        <input type="date" id="dash_tgl_mulai" class="bg-transparent px-1 py-0.5 text-slate-700 focus:outline-none" value="${tglMulai}" onchange="renderApp(true)">
                        <span class="text-slate-400 mx-0.5">-</span>
                        <input type="date" id="dash_tgl_selesai" class="bg-transparent px-1 py-0.5 text-slate-700 focus:outline-none" value="${tglSelesai}" onchange="renderApp(true)">
                    </div>
                    
                    <div class="flex items-center border-l border-slate-200 pl-1">
                        <select id="dash_shift" class="bg-transparent text-slate-700 focus:outline-none cursor-pointer" onchange="renderApp(true)">
                            <option value="ALL" ${dashShift==='ALL'?'selected':''}>All Shift</option>
                            <option value="Shift 1" ${dashShift==='Shift 1'?'selected':''}>Shift 1</option>
                            <option value="Shift 2" ${dashShift==='Shift 2'?'selected':''}>Shift 2</option>
                        </select>
                    </div>
                    
                    <div class="flex items-center border-l border-slate-200 pl-1">
                        <select id="dash_unit" class="bg-transparent text-slate-700 focus:outline-none cursor-pointer" onchange="renderApp(true)">
                            <option value="ALL" ${dashUnit==='ALL'?'selected':''}>Semua Armada</option>
                            <option value="Crane Truck" ${dashUnit==='Crane Truck'?'selected':''}>Crane Truck</option>
                            <option value="Big Crane" ${dashUnit==='Big Crane'?'selected':''}>Big Crane</option>
                            <option value="Lowboy" ${dashUnit==='Lowboy'?'selected':''}>Lowboy</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 relative z-0">
                <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 shadow-sm relative overflow-hidden flex flex-col justify-start">
                    <div class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1 relative z-10">Total Order</div>
                    <div class="text-3xl font-black text-slate-700 relative z-10 leading-none">${cntOrder}</div>
                    <i class="fa-solid fa-file-invoice absolute -bottom-3 -right-2 text-6xl text-slate-300 opacity-20 rotate-[-10deg]"></i>
                </div>
                <div class="bg-blue-50 border border-blue-100 rounded-xl p-4 shadow-sm relative overflow-hidden flex flex-col justify-start">
                    <div class="text-[9px] font-black text-blue-600 uppercase tracking-widest mb-1 relative z-10">ON PROGRESS</div>
                    <div class="text-3xl font-black text-blue-700 relative z-10 leading-none">${cntProg}</div>
                    <i class="fa-solid fa-arrows-rotate absolute -bottom-3 -right-2 text-6xl text-blue-500 opacity-10"></i>
                </div>
                <div class="bg-orange-50 border border-orange-100 rounded-xl p-4 shadow-sm relative overflow-hidden flex flex-col justify-start">
                    <div class="text-[9px] font-black text-orange-600 uppercase tracking-widest mb-1 relative z-10">PENDING</div>
                    <div class="text-3xl font-black text-orange-700 relative z-10 leading-none">${cntPend}</div>
                    <i class="fa-solid fa-clock absolute -bottom-3 -right-2 text-6xl text-orange-500 opacity-10"></i>
                </div>
                <div class="bg-emerald-50 border border-emerald-100 rounded-xl p-4 shadow-sm relative overflow-hidden flex flex-col justify-start">
                    <div class="text-[9px] font-black text-emerald-600 uppercase tracking-widest mb-1 relative z-10">COMPLETED</div>
                    <div class="text-3xl font-black text-emerald-700 relative z-10 leading-none">${cntDone}</div>
                    <i class="fa-solid fa-circle-check absolute -bottom-3 -right-2 text-6xl text-emerald-500 opacity-10"></i>
                </div>
                <div class="bg-red-50 border border-red-100 rounded-xl p-4 shadow-sm relative overflow-hidden flex flex-col justify-start col-span-2 sm:col-span-1">
                    <div class="text-[9px] font-black text-red-600 uppercase tracking-widest mb-1 relative z-10">CANCELED</div>
                    <div class="text-3xl font-black text-red-700 relative z-10 leading-none">${cntCancel}</div>
                    <i class="fa-solid fa-xmark absolute -bottom-3 -right-2 text-6xl text-red-500 opacity-10"></i>
                </div>
            </div>

            <div class="bg-white border border-slate-200 rounded-md p-3 shadow-sm mt-3 flex flex-col lg:flex-row gap-6 items-start">
                <div class="w-full lg:w-1/4 flex flex-col items-center justify-center">
                    <h3 class="text-[10px] font-bold text-slate-600 mb-2 w-full text-left">Data Perusahaan</h3>
                    <div class="relative h-40 w-40"><canvas id="companyDonutChart"></canvas></div>
                </div>
                
                <div class="w-full lg:w-3/4 flex flex-col sm:flex-row gap-6 lg:pl-4 w-full">
                    <div class="w-full sm:w-1/2 sm:border-r border-slate-100 sm:pr-6">
                        <div class="flex justify-between mb-2 text-[8px] font-bold text-slate-400 uppercase border-b border-slate-100 pb-1">
                            <div class="w-1/2 text-left">Perusahaan</div><div class="w-1/4 text-center">Persentase</div><div class="w-1/4 text-right">T. Jam / Job</div>
                        </div>
                        <div class="flex flex-col gap-1 hide-scrollbar overflow-y-auto max-h-40" id="legendCompanyContainer"></div>
                    </div>
                    
                    <div class="w-full sm:w-1/2">
                        <h4 class="text-[10px] font-bold text-blue-600 border-b border-slate-100 pb-1 mb-2 uppercase tracking-wider flex justify-between"><span>Dept Plant</span><span class="text-slate-400 text-[8px]">Total Jam | Job</span></h4>
                        <div class="flex flex-col gap-1 hide-scrollbar overflow-y-auto max-h-40">
                            ${(() => {
                                let plantStats = {};
                                filteredJobs.forEach(j => {
                                    if((j.departemen || '').toUpperCase() === 'PLANT') {
                                        let sec = j.section || 'N/A';
                                        if(!plantStats[sec]) plantStats[sec] = { count: 0, hours: 0 };
                                        plantStats[sec].count++;
                                        if(j.status === 'COMPLETED' && j.durasi_aktual) plantStats[sec].hours += parseFloat(j.durasi_aktual);
                                    }
                                });
                                let plantArray = Object.entries(plantStats).sort((a,b) => b[1].count - a[1].count);
                                if(plantArray.length === 0) return '<div class="text-[9px] text-slate-400 italic">Tidak ada order dari Dept Plant pada rentang ini.</div>';
                                return plantArray.map(item => `<div class="flex justify-between text-[10px] text-slate-500 mb-1 border-b border-slate-50 pb-1 items-center"><span class="truncate w-1/2 font-medium">${item[0]}</span><span class="w-1/4 text-center">${item[1].hours.toFixed(1)}J</span><span class="w-1/4 text-right">${item[1].count} Job</span></div>`).join('');
                            })()}
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 mt-3">
                <div class="bg-white border border-slate-200 rounded-md p-3 shadow-sm flex flex-col">
                    <h3 class="text-[10px] font-bold text-slate-600 mb-2">Weekly Trend Order (vs Minggu Lalu)</h3>
                    <div class="relative h-48 w-full"><canvas id="lineChart"></canvas></div>
                </div>
                <div class="bg-white border border-slate-200 rounded-md p-3 shadow-sm flex flex-col">
                    <h3 class="text-[10px] font-bold text-slate-600 mb-2 uppercase">Departement order</h3>
                    <div class="relative h-48 w-full"><canvas id="deptOrderChart"></canvas></div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 mt-3">
                <div class="bg-white border border-slate-200 rounded-md p-4 shadow-sm flex flex-col sm:flex-row items-center justify-center gap-6">
                    <div class="w-full sm:w-auto">
                        <h3 class="text-[10px] font-bold text-slate-600 mb-3 text-center sm:text-left uppercase">Distribusi & Total Unit</h3>
                        ${totalUnits > 1 ? `
                        <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-full shadow-inner mx-auto sm:mx-0" style="${pieStyle}"></div>
                    </div>
                    <div class="w-full sm:w-auto flex-1 space-y-2 text-[10px] font-semibold text-slate-600">
                        <div class="flex justify-between items-center bg-slate-50 p-1.5 rounded-sm border border-slate-100"><div class="flex items-center gap-2"><div class="w-3 h-3 rounded-sm bg-[#0d9488]"></div>Crane Truck</div><span class="text-slate-800">${pctCT}% <span class="text-slate-400 font-normal">(${cntCT} Order)</span></span></div>
                        <div class="flex justify-between items-center bg-slate-50 p-1.5 rounded-sm border border-slate-100"><div class="flex items-center gap-2"><div class="w-3 h-3 rounded-sm bg-[#4ade80]"></div>Big Crane</div><span class="text-slate-800">${pctBC}% <span class="text-slate-400 font-normal">(${cntBC} Order)</span></span></div>
                        <div class="flex justify-between items-center bg-slate-50 p-1.5 rounded-sm border border-slate-100"><div class="flex items-center gap-2"><div class="w-3 h-3 rounded-sm bg-[#a7f3d0]"></div>Lowboy</div><span class="text-slate-800">${pctLB}% <span class="text-slate-400 font-normal">(${cntLB} Order)</span></span></div>
                    </div>
                    ` : `<div class="text-[9px] text-slate-400 italic my-auto mx-auto">Data kosong</div></div>`}
                </div>
                
                <div class="bg-white border border-slate-200 rounded-md p-3 shadow-sm flex flex-col">
                    <h3 class="text-[10px] font-bold text-slate-600 mb-2 uppercase">Scheduled vs Unscheduled</h3>
                    <div class="relative h-36 w-full"><canvas id="schedChart"></canvas></div>
                </div>
            </div>

            <div class="bg-white border border-slate-200 rounded-md p-3 shadow-sm mt-3 flex flex-col w-full">
                <h3 class="text-[10px] font-bold text-slate-600 mb-2 uppercase">Performa Rigger (Total Jam Kerja)</h3>
                <div class="relative h-60 w-full"><canvas id="riggerChart"></canvas></div>
            </div>
            
        </div>`;
    }

    function initDashboardCharts() {
        if(!document.getElementById('lineChart') || !document.getElementById('deptOrderChart') || typeof Chart === 'undefined') return;
        
        let allJobs = getOrders();
        let dashTglMulai = document.getElementById('dash_tgl_mulai').value || getShiftDateString();
        let dashTglSelesai = document.getElementById('dash_tgl_selesai').value || getShiftDateString();
        let dashShift = document.getElementById('dash_shift').value;
        let dashUnit = document.getElementById('dash_unit').value;

        if (dashShift !== 'ALL') allJobs = allJobs.filter(j => j.shift === dashShift);
        if (dashUnit !== 'ALL') allJobs = allJobs.filter(j => j.kategori === dashUnit);

        let filteredJobsRange = allJobs.filter(j => j.tgl_pelaksanaan >= dashTglMulai && j.tgl_pelaksanaan <= dashTglSelesai);

        let refDate = new Date(dashTglMulai);
        let mtdStartStr = refDate.getFullYear() + '-' + String(refDate.getMonth()+1).padStart(2,'0') + '-01';
        let mtdJobs = allJobs.filter(j => j.tgl_pelaksanaan >= mtdStartStr && j.tgl_pelaksanaan <= dashTglSelesai);
        
        let sundayThisWeek = new Date(refDate); sundayThisWeek.setDate(refDate.getDate() - refDate.getDay());
        let lastWeekSun = new Date(sundayThisWeek); lastWeekSun.setDate(lastWeekSun.getDate() - 7);
        let lastWeekSat = new Date(sundayThisWeek); lastWeekSat.setDate(lastWeekSat.getDate() - 1);
        
        let lwStartStr = lastWeekSun.getFullYear() + '-' + String(lastWeekSun.getMonth()+1).padStart(2,'0') + '-' + String(lastWeekSun.getDate()).padStart(2,'0');
        let lwEndStr = lastWeekSat.getFullYear() + '-' + String(lastWeekSat.getMonth()+1).padStart(2,'0') + '-' + String(lastWeekSat.getDate()).padStart(2,'0');
        let lwJobs = allJobs.filter(j => j.tgl_pelaksanaan >= lwStartStr && j.tgl_pelaksanaan <= lwEndStr);

        function calcDeptCats(jobArray) {
            let ppaPlant=0, ppaNonPlant=0, nonPpa=0;
            jobArray.forEach(j => {
                let p = (j.perusahaan||'').toUpperCase(); let d = (j.departemen||'').toUpperCase();
                if(p.includes('PPA')) { if(d === 'PLANT') ppaPlant++; else ppaNonPlant++; } 
                else { nonPpa++; }
            });
            let total = ppaPlant + ppaNonPlant + nonPpa;
            if(total === 0) return [0,0,0];
            return [ (ppaPlant/total*100).toFixed(1), (ppaNonPlant/total*100).toFixed(1), (nonPpa/total*100).toFixed(1) ];
        }

        let mtdData = calcDeptCats(mtdJobs);
        let lwData = calcDeptCats(lwJobs);

        if(window.dashDeptChart) window.dashDeptChart.destroy();
        const ctxDept = document.getElementById('deptOrderChart').getContext('2d');
        window.dashDeptChart = new Chart(ctxDept, {
            type: 'bar',
            data: {
                labels: ['MTD', 'Last Week'],
                datasets: [
                    { label: 'Plant PPA', data: [mtdData[0], lwData[0]], backgroundColor: '#3b82f6', borderRadius: 4 }, 
                    { label: 'Non Plant PPA', data: [mtdData[1], lwData[1]], backgroundColor: '#93c5fd', borderRadius: 4 },
                    { label: 'Non PPA', data: [mtdData[2], lwData[2]], backgroundColor: '#fb923c', borderRadius: 4 }
                ]
            },
            options: {
                indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom', labels: { font: { size: 9, family: "'Inter', sans-serif" }, usePointStyle: true, boxWidth: 8 } }, tooltip: { callbacks: { label: function(context) { return context.dataset.label + ': ' + context.parsed.x + '%'; } } } },
                scales: { x: { stacked: true, max: 100, ticks: { font: { size: 9 }, callback: function(value){return value+"%"} }, grid: { color: '#f1f5f9' } }, y: { stacked: true, ticks: { font: { size: 10, weight: 'bold' } }, grid: { display: false } } }
            }
        });

        let dataThisWeek = []; let dataLastWeek = []; let labels = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        for(let i=0; i<7; i++) {
            let dThis = new Date(sundayThisWeek); dThis.setDate(dThis.getDate() + i); let strThis = dThis.getFullYear() + '-' + String(dThis.getMonth()+1).padStart(2,'0') + '-' + String(dThis.getDate()).padStart(2,'0');
            let dLast = new Date(sundayThisWeek); dLast.setDate(dLast.getDate() - 7 + i); let strLast = dLast.getFullYear() + '-' + String(dLast.getMonth()+1).padStart(2,'0') + '-' + String(dLast.getDate()).padStart(2,'0');
            dataThisWeek.push(allJobs.filter(j => j.tgl_pelaksanaan === strThis).length); dataLastWeek.push(allJobs.filter(j => j.tgl_pelaksanaan === strLast).length);
        }

        if(window.dashLineChart) window.dashLineChart.destroy();
        const ctxLine = document.getElementById('lineChart').getContext('2d');
        window.dashLineChart = new Chart(ctxLine, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    { label: 'Minggu Ini', data: dataThisWeek, borderColor: '#0891b2', backgroundColor: 'rgba(8, 145, 178, 0.1)', tension: 0.4, fill: true, borderWidth: 2, pointBackgroundColor: '#fff', pointBorderColor: '#0891b2', pointBorderWidth: 2 },
                    { label: 'Minggu Lalu', data: dataLastWeek, borderColor: '#94a3b8', borderDash: [5, 5], tension: 0.4, fill: false, borderWidth: 2, pointRadius: 0 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
                plugins: { legend: { labels: { font: { size: 10, family: "'Inter', sans-serif" }, usePointStyle: true, boxWidth: 8 } } },
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 9 } }, grid: { color: '#f1f5f9' } }, x: { ticks: { font: { size: 9 } }, grid: { display: false } } }
            }
        });
        
        if(document.getElementById('schedChart')) {
            let schedCount = 0; let unschedCount = 0;
            filteredJobsRange.forEach(j => {
                let isUnscheduled = false;
                let reqDate = new Date(j.tgl_pelaksanaan + 'T00:00:00'); let createDate = new Date(j.timestamp); createDate.setHours(0,0,0,0);
                if (j.kategori === 'Big Crane') { if ((reqDate - createDate) / 86400000 < 3) isUnscheduled = true; } else {
                    if (j.jam_pelaksanaan) { let reqTime = new Date(j.tgl_pelaksanaan + 'T' + j.jam_pelaksanaan + ':00'); let createTime = new Date(j.timestamp); if ((reqTime - createTime) / 3600000 < 6) isUnscheduled = true; } 
                    else { if ((reqDate - createDate) / 86400000 < 1) isUnscheduled = true; }
                }
                if (j.status === 'UNSCHEDULED') isUnscheduled = true; else if (j.status === 'SCHEDULED') isUnscheduled = false;
                if (isUnscheduled) unschedCount++; else schedCount++;
            });

            if(window.dashSchedChart) window.dashSchedChart.destroy();
            const ctxSched = document.getElementById('schedChart').getContext('2d');
            window.dashSchedChart = new Chart(ctxSched, {
                type: 'bar',
                data: { labels: ['SCH', 'UNSCH'], datasets: [{ data: [schedCount, unschedCount], backgroundColor: ['#10b981', '#f43f5e'], borderRadius: 4 }] },
                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 9 } }, grid: { color: '#f1f5f9' } }, y: { ticks: { font: { size: 9, weight: 'bold' } }, grid: { display: false } } } }
            });
        }

        if(document.getElementById('riggerChart')) {
            let riggerStats = {};
            filteredJobsRange.forEach(j => {
                if (j.status !== 'COMPLETED' || !j.durasi_aktual) return;
                let hrs = parseFloat(j.durasi_aktual);
                [j.rigger, j.rigger2].forEach(r => {
                    if (!r || r === '-' || r === 'N/A') return;
                    if (!riggerStats[r]) riggerStats[r] = { total: 0, CT: 0, BC: 0, LB: 0 };
                    riggerStats[r].total += hrs;
                    if (j.kategori === 'Crane Truck') riggerStats[r].CT += hrs; else if (j.kategori === 'Big Crane') riggerStats[r].BC += hrs; else if (j.kategori === 'Lowboy') riggerStats[r].LB += hrs;
                });
            });

            let sortedRiggers = Object.entries(riggerStats).sort((a, b) => b[1].total - a[1].total);
            let rLabels = sortedRiggers.map(r => r[0]); let rDataCT = sortedRiggers.map(r => r[1].CT); let rDataBC = sortedRiggers.map(r => r[1].BC); let rDataLB = sortedRiggers.map(r => r[1].LB);

            if(window.dashRiggerChart) window.dashRiggerChart.destroy();
            const ctxRigger = document.getElementById('riggerChart').getContext('2d');
            window.dashRiggerChart = new Chart(ctxRigger, {
                type: 'bar',
                data: { labels: rLabels, datasets: [{ label: 'Crane Truck', data: rDataCT, backgroundColor: '#0d9488' }, { label: 'Big Crane', data: rDataBC, backgroundColor: '#4ade80' }, { label: 'Lowboy', data: rDataLB, backgroundColor: '#a7f3d0' }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 9, family: "'Inter', sans-serif" }, usePointStyle: true, boxWidth: 8 } } }, scales: { x: { stacked: true, ticks: { font: { size: 9 } }, grid: { display: false } }, y: { stacked: true, ticks: { font: { size: 9 } }, grid: { color: '#f1f5f9' } } } }
            });
        }

        if(document.getElementById('companyDonutChart')) {
            let companyStats = {};
            filteredJobsRange.forEach(j => { 
                let p = (j.perusahaan || 'N/A').toUpperCase(); 
                if(!companyStats[p]) companyStats[p] = { count: 0, hours: 0 };
                companyStats[p].count += 1;
                if (j.status === 'COMPLETED' && j.durasi_aktual) companyStats[p].hours += parseFloat(j.durasi_aktual);
            });
            
            let cLabels = []; let cDataCount = []; let cBgColors = [];
            const cColors = { 'PPA': '#3b82f6', 'BIB': '#111827', 'UT': '#eab308', 'KME': '#f97316' };
            const fallbackColors = ['#10b981', '#8b5cf6', '#ec4899', '#06b6d4', '#64748b'];
            
            let idxColor = 0; let companyArray = Object.entries(companyStats).sort((a,b)=>b[1].count - a[1].count); let totalCompanyJobs = companyArray.reduce((sum, item) => sum + item[1].count, 0) || 1;
            let companyLegendHtml = '';
            companyArray.forEach((item) => {
                let cName = item[0]; let cObj = item[1]; let pct = Math.round((cObj.count / totalCompanyJobs) * 100); let color = cColors[cName] || fallbackColors[idxColor % fallbackColors.length];
                cLabels.push(cName); cDataCount.push(cObj.count); cBgColors.push(color);
                if(!cColors[cName]) idxColor++;
                companyLegendHtml += `<div class="flex items-center justify-between text-[10px] mb-1.5"><div class="flex items-center gap-2 w-1/2 truncate"><div class="w-2.5 h-2.5 rounded-sm shrink-0" style="background-color: ${color}"></div><span class="font-semibold text-slate-700 truncate" title="${cName}">${cName}</span></div><div class="w-1/4 text-slate-500 text-center">${pct}%</div><div class="w-1/4 font-semibold text-slate-600 text-right whitespace-nowrap">${cObj.hours.toFixed(1)}J | ${cObj.count}</div></div>`;
            });
            if(!companyLegendHtml) companyLegendHtml = '<div class="text-[9px] text-slate-400 italic">Data kosong</div>';
            document.getElementById('legendCompanyContainer').innerHTML = companyLegendHtml;

            if(window.dashCompanyDonut) window.dashCompanyDonut.destroy();
            const ctxDonut = document.getElementById('companyDonutChart').getContext('2d');

    function downloadCSVBlob() {
        const currentUser = JSON.parse(localStorage.getItem('lifting_user'));
        let jobs = getOrders();

        if (currentUser && (currentUser.role === 'ADMIN' || currentUser.role === 'GL')) {
            const tglMulai = document.getElementById('filter_tgl_mulai') ? document.getElementById('filter_tgl_mulai').value : '';
            const tglSelesai = document.getElementById('filter_tgl_selesai') ? document.getElementById('filter_tgl_selesai').value : '';
            const filterShift = document.getElementById('filter_shift') ? document.getElementById('filter_shift').value : 'ALL';
            const filterKategori = document.getElementById('filter_admin_kategori') ? document.getElementById('filter_admin_kategori').value : 'ALL';

            if (tglMulai && tglSelesai) {
                jobs = jobs.filter(j => {
                    const opDate = getJobOperationalDate(j);
                    return opDate >= tglMulai && opDate <= tglSelesai;
                });
            } else if (tglMulai) {
                jobs = jobs.filter(j => getJobOperationalDate(j) >= tglMulai);
            } else if (tglSelesai) {
                jobs = jobs.filter(j => getJobOperationalDate(j) <= tglSelesai);
            }

            if (filterShift !== 'ALL') {
                jobs = jobs.filter(j => getJobOperationalShift(j) === filterShift);
            }
            if (filterKategori !== 'ALL') {
                jobs = jobs.filter(j => j.kategori === filterKategori);
            }

            if (orderSearchQuery) {
                const q = orderSearchQuery.toLowerCase();
                jobs = jobs.filter(j => {
                    return (
                        (j.no_wo && j.no_wo.toLowerCase().includes(q)) ||
                        (j.nama_pemohon && j.nama_pemohon.toLowerCase().includes(q)) ||
                        (j.nrp_pemohon && j.nrp_pemohon.toLowerCase().includes(q)) ||
                        (j.perusahaan && j.perusahaan.toLowerCase().includes(q)) ||
                        (j.departemen && j.departemen.toLowerCase().includes(q)) ||
                        (j.section && j.section.toLowerCase().includes(q)) ||
                        (j.kategori && j.kategori.toLowerCase().includes(q)) ||
                        (j.unit && j.unit.toLowerCase().includes(q)) ||
                        (j.gl && j.gl.toLowerCase().includes(q)) ||
                        (j.operator && j.operator.toLowerCase().includes(q)) ||
                        (j.rigger && j.rigger.toLowerCase().includes(q)) ||
                        (j.rigger2 && j.rigger2.toLowerCase().includes(q)) ||
                        (j.lokasi_angkat && j.lokasi_angkat.toLowerCase().includes(q)) ||
                        (j.lokasi_tujuan && j.lokasi_tujuan.toLowerCase().includes(q)) ||
                        (j.deskripsi && j.deskripsi.toLowerCase().includes(q)) ||
                        (j.status && j.status.toLowerCase().includes(q))
                    );
                });
            }

            // Urutkan data sesuai kolom dan arah sort aktif di tabel
            jobs.sort((a, b) => {
                let valA = (a[sortColumn] || '').toString().toLowerCase(); 
                let valB = (b[sortColumn] || '').toString().toLowerCase();
                let comparison = valA.localeCompare(valB, undefined, {numeric: true});
                if (comparison < 0) return sortDirection === 'asc' ? -1 : 1; 
                if (comparison > 0) return sortDirection === 'asc' ? 1 : -1; 
                return 0;
            });
        } else if (currentUser && currentUser.role === 'USER') {
            jobs = jobs.filter(j => j.nrp_pemohon === currentUser.nrp);
            const filterCat = document.getElementById('filter_kategori') ? document.getElementById('filter_kategori').value : 'ALL';
            if (filterCat !== 'ALL') {
                jobs = jobs.filter(j => j.kategori === filterCat);
            }
        }

        if (jobs.length === 0) {
            return showToast('Tidak ada data sesuai filter untuk diexport!', 'error');
        }

        const tglMulaiVal = document.getElementById('filter_tgl_mulai')?.value;
        const tglSelesaiVal = document.getElementById('filter_tgl_selesai')?.value;
        const dateRangeLabel = (tglMulaiVal && tglSelesaiVal) ? `${tglMulaiVal}_sd_${tglSelesaiVal}` : getShiftDateString();
        const fileName = `Order_Lifting_${dateRangeLabel}.xlsx`;

        // Definisi Header Kolom Excel
        const headers = [
            'No WO', 'Waktu Pengajuan', 'Kategori Unit', 'Nama Pemohon', 'Perusahaan', 
            'Departemen', 'Section', 'No WhatsApp', 'Tgl Pelaksanaan', 'Shift', 
            'Durasi Request', 'Lokasi Muat (Asal)', 'Lokasi Bongkar (Tujuan)', 'Deskripsi Tugas / Muatan', 
            'Status', 'Group Leader', 'Unit Ditugaskan', 'Operator', 'Rigger 1', 'Rigger 2', 
            'Start Aktual', 'End Aktual', 'Durasi Aktual (Jam)', 'Final Inspeksi', 
            'Alasan Telat', 'Alasan Overtime'
        ];

        // Format Baris Data
        const rows = jobs.map(j => [
            j.no_wo || '',
            formatLocalTimestamp(j.timestamp) || '',
            j.kategori || '',
            j.nama_pemohon || '',
            j.perusahaan || '',
            j.departemen || '',
            j.section || '',
            j.no_wa ? String(j.no_wa) : '',
            j.tgl_pelaksanaan || '',
            j.shift || '',
            j.durasi_request || '',
            j.lokasi_angkat || '',
            j.lokasi_tujuan || '',
            j.deskripsi || '',
            j.status || '',
            j.gl || '',
            j.unit || '',
            j.operator || '',
            j.rigger || '',
            j.rigger2 || '',
            j.jam_start_aktual || '',
            j.jam_end_aktual || '',
            j.durasi_aktual ? (Number(j.durasi_aktual) || j.durasi_aktual) : '',
            j.final_inspeksi || '',
            j.alasan_telat || '',
            j.alasan_overtime || ''
        ]);

        if (typeof XLSX !== 'undefined') {
            const worksheetData = [headers, ...rows];
            const ws = XLSX.utils.aoa_to_sheet(worksheetData);

            // Pengaturan otomatis lebar kolom agar pas dan rapi
            const colWidths = headers.map((h, i) => {
                let maxLen = h.length;
                rows.forEach(r => {
                    const cellVal = r[i] ? String(r[i]) : '';
                    if (cellVal.length > maxLen) maxLen = cellVal.length;
                });
                return { wch: Math.min(Math.max(maxLen + 3, 12), 50) };
            });
            ws['!cols'] = colWidths;

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Data Order");
            XLSX.writeFile(wb, fileName);
            showToast(`${jobs.length} data berhasil diexport ke Excel (.xlsx)!`);
        } else {
            // Fallback CSV dengan UTF-8 BOM dan penegasan separator titik koma agar Excel langsung membagi kolom
            let csvRows = [headers.join(';')];
            rows.forEach(r => {
                csvRows.push(r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';'));
            });
            const blob = new Blob(['\uFEFF' + csvRows.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `Order_Lifting_${dateRangeLabel}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast(`${jobs.length} data diexport!`);
        }
    }

                                    <td class="px-2 py-1.5 align-top hidden md:table-cell"><div class="font-bold text-slate-700 text-[10px]">${job.tgl_pelaksanaan}</div><div class="text-[9px] text-slate-500">${job.shift} | Req: ${job.jam_pelaksanaan || '-'} (${job.durasi_request})</div></td>
                                    <td class="px-2 py-1.5 align-top max-w-[180px] md:max-w-[320px]">${job.kategori !== 'Big Crane' ? `<div class="text-[9px] md:text-[10px] text-orange-600 font-semibold flex items-start gap-1 mb-0.5 leading-tight"><i class="fa-solid fa-location-dot mt-0.5 shrink-0"></i> <span class="truncate">${job.lokasi_angkat || '-'} <i class="fa-solid fa-arrow-right text-[7px] mx-0.5 text-slate-400"></i> ${job.lokasi_tujuan || '-'}</span></div>` : ''}<div class="text-[9px] text-emerald-700 flex items-start gap-1 min-w-0"><i class="fa-solid fa-flag-checkered mt-0.5 shrink-0"></i> <span class="leading-tight line-clamp-2 break-words min-w-0 flex-1" title="${job.deskripsi}">${job.deskripsi}</span></div></td>
                                    <td class="px-2 py-1.5 text-center align-top hidden md:table-cell"><span class="${statusColor} border text-[9px] px-1.5 py-0.5 rounded-sm font-semibold whitespace-nowrap inline-block">${job.status}</span></td>
                                    <td class="px-2 py-1.5 text-[9px] align-top text-slate-600 leading-tight hidden md:table-cell"><div class="flex flex-col gap-0.5"><div><span class="text-slate-400">GL:</span> <span class="font-semibold text-slate-800">${job.gl || '-'}</span></div><div><span class="text-slate-400">Unit:</span> <span class="font-semibold text-slate-800">${job.unit || '-'}</span></div><div><span class="text-slate-400">OP:</span> <span class="font-semibold text-slate-800">${job.operator || '-'}</span></div><div><span class="text-slate-400">Rg:</span> <span class="font-semibold text-slate-800">${job.rigger || '-'}${job.rigger2 ? ', ' + job.rigger2 : ''}</span></div></div></td>
                                    <td class="px-2 py-1.5 text-[9px] align-top text-slate-600 font-mono tracking-tighter hidden md:table-cell whitespace-nowrap">${job.jam_start_aktual || '--:--'} s/d ${job.jam_end_aktual || '--:--'}</td>
                                    <td class="px-2 py-1.5 text-center text-[10px] font-semibold text-slate-800 align-top hidden md:table-cell whitespace-nowrap">${job.durasi_aktual ? formatDurationHM(parseFloat(job.durasi_aktual) * 60) : '-'}</td>
                                    <td class="px-2 py-1.5 align-top hidden md:table-cell"><div class="flex flex-col">${kendalaHtml}</div></td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            </div>`;
        }

        jobs = jobs.filter(j => j.nrp_pemohon === currentUser.nrp);
        let filterCat = document.getElementById('filter_kategori') ? document.getElementById('filter_kategori').value : 'ALL';
        if (filterCat !== 'ALL') jobs = jobs.filter(j => j.kategori === filterCat);
        
        let html = `<h2 class="text-sm font-bold text-slate-800 mb-2"><i class="fa-solid fa-list-check mr-1.5 text-cyan-600"></i>Data Order Pekerjaan Saya</h2>`;

        if (jobs.length === 0) {
            html += `<div class="bg-white rounded-md p-6 text-center border border-slate-200 shadow-sm"><i class="fa-solid fa-folder-open text-3xl text-slate-300 mb-2"></i><p class="text-slate-400 text-xs">Belum ada order pekerjaan yang diajukan.</p></div>`;
            return html;
        }

        jobs.forEach(job => {
            let statusColor = job.status === 'COMPLETED' ? 'bg-emerald-50 text-emerald-600 border-emerald-200' :
                              (job.status === 'ON PROGRESS' ? 'bg-blue-50 text-blue-600 border-blue-200' :
                              (job.status === 'PENDING' ? 'bg-orange-50 text-orange-600 border-orange-200' :
                              (job.status === 'CANCELED' ? 'bg-red-50 text-red-600 border-red-200' : 'bg-slate-50 text-slate-600 border-slate-200')));

            html += `
            <div class="bg-white rounded-md p-2.5 mb-2 border border-slate-200 shadow-sm relative text-[11px] cursor-pointer hover:shadow-md transition-shadow relative z-10" onclick="viewJobDetail('${job.no_wo}')">
                <div class="absolute top-2 right-2 ${statusColor} border px-1.5 py-0.5 rounded-sm text-[8px] font-bold tracking-wider">${job.status}</div>
                <div class="text-[9px] text-cyan-600 font-mono font-bold mb-1 hover:underline">${job.no_wo}</div>
                <div class="flex items-center gap-1.5 mb-1.5"><span class="font-bold text-slate-800 text-xs">${job.kategori}</span><span class="text-slate-300">|</span><span class="text-slate-500 text-[10px]">${job.tgl_pelaksanaan} ${job.jam_pelaksanaan || ''}</span></div>
                <div class="bg-slate-50 rounded-sm border border-slate-100 p-1.5 grid grid-cols-3 gap-1.5 mb-1.5 text-[10px]">
                    <div><div class="text-slate-400 text-[9px]">Durasi Req</div><div class="font-bold text-slate-700">${job.durasi_request}</div></div>
                    <div><div class="text-slate-400 text-[9px]">Lokasi</div><div class="font-medium text-slate-600 truncate">${job.lokasi_angkat || '-'} <i class="fa-solid fa-arrow-right text-[8px] text-slate-400 mx-0.5"></i> ${job.lokasi_tujuan || '-'}</div></div>
                    <div><div class="text-slate-400 text-[9px]">Unit</div><div class="font-bold text-cyan-600">${job.unit || 'Belum ada'}</div></div>
                </div>
                <div class="text-[10px] text-slate-500 mb-2 pl-1 border-l-2 border-slate-300 truncate">${job.deskripsi}</div>
                <div class="pt-1.5 border-t border-slate-100 flex items-center justify-between"><div class="text-[9px] text-slate-400"><i class="fa-solid fa-user-circle mr-1"></i>${job.nama_pemohon}</div><div class="text-cyan-600 text-[9px] font-semibold">Klik untuk Detail</div></div>
            </div>`;
        });
        return html;
    }

    function getManpowerWorkflow() {
        const settings = getSettings() || {};
        
        const getUnitCard = (type, modeVar, iconUrl, iconClass, label) => {
            const bgStyle = iconUrl ? `style="background-image: url('${iconUrl}'); background-size: cover; background-position: center;"` : '';
            const content = iconUrl 
                ? `<div class="absolute inset-0 bg-slate-900/40 group-hover:bg-slate-900/20 transition-colors"></div><span class="font-bold text-white text-sm sm:text-base uppercase relative z-10 tracking-widest drop-shadow-lg text-center leading-tight px-2">${label}</span>`
                : `<div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-slate-50 group-hover:bg-cyan-50 flex items-center justify-center transition-colors"><i class="fa-solid ${iconClass} text-2xl sm:text-3xl text-slate-400 group-hover:text-cyan-600"></i></div><span class="font-bold text-slate-700 text-[11px] sm:text-xs uppercase tracking-wide text-center leading-tight mt-2 px-2">${label}</span>`;
            return `<button onclick="${modeVar}='${type}'; renderApp(false);" class="relative bg-white border border-slate-200 hover:border-cyan-500 hover:shadow-md rounded-xl flex flex-col items-center justify-center shadow-sm transition-all group aspect-square sm:aspect-[4/3] w-full sm:w-44 overflow-hidden" ${bgStyle}>${content}</button>`;
        };

        const btnCT = getUnitCard('Crane Truck', 'mpFleetMode', settings.icon_ct_url, 'fa-truck-moving', 'Crane Truck');
        const btnBC = getUnitCard('Big Crane', 'mpFleetMode', settings.icon_bc_url, 'fa-truck-ramp-box', 'Big Crane');
        const btnLB = getUnitCard('Lowboy', 'mpFleetMode', settings.icon_lb_url, 'fa-trailer', 'Lowboy');

        if (!mpFleetMode) return `<div class="min-h-[70vh] flex flex-col items-center justify-center max-w-[900px] mx-auto w-full px-4 py-8"><h2 class="text-sm sm:text-base font-bold text-slate-800 mb-6 text-center"><i class="fa-solid fa-list-check mr-1.5 text-cyan-600"></i>Pilih Unit Armada</h2><div class="grid grid-cols-2 sm:flex sm:flex-row sm:justify-center gap-4 sm:gap-6 w-full max-w-2xl mx-auto">${btnCT}${btnBC}${btnLB}</div></div>`;

        const m = getMasterData(); let unitOptions = [];
        if (mpFleetMode === 'Crane Truck') unitOptions = m.unit_ct || []; 
        let filterUnit = document.getElementById('mp_filter_unit') ? document.getElementById('mp_filter_unit').value : 'ALL';
        
        let tglMulai = document.getElementById('mp_filter_mulai') ? document.getElementById('mp_filter_mulai').value : getShiftDateString();
        let tglSelesai = document.getElementById('mp_filter_selesai') ? document.getElementById('mp_filter_selesai').value : getShiftDateString();

        let jobs = getOrders().filter(j => j.kategori === mpFleetMode);
        jobs = jobs.filter(j => {
            const opDate = getJobOperationalDate(j);
            return opDate >= tglMulai && opDate <= tglSelesai;
        });
        
        if (currentMpPanel === 'PENDING') jobs = jobs.filter(j => j.status === 'PENDING'); else jobs = jobs.filter(j => j.status === currentMpPanel);
        if (mpFleetMode === 'Crane Truck' && filterUnit !== 'ALL') jobs = jobs.filter(j => j.unit === filterUnit);

        let unitFilterHtml = mpFleetMode === 'Crane Truck' ? `<select id="mp_filter_unit" onchange="renderApp(true)" class="text-[9px] font-bold bg-white border border-slate-300 text-slate-700 rounded-full px-2 py-1 outline-none shadow-sm focus:border-cyan-500 cursor-pointer ml-auto"><option value="ALL">Semua Unit</option>${unitOptions.map(u => `<option value="${u}" ${filterUnit === u ? 'selected' : ''}>${u}</option>`).join('')}</select>` : '';

        let html = `
        <div class="flex items-center gap-2 mb-2 mt-2"><button onclick="mpFleetMode=null; renderApp(false);" class="w-6 h-6 rounded-sm border border-slate-200 flex items-center justify-center text-slate-500 hover:bg-slate-50 bg-white shadow-sm"><i class="fa-solid fa-arrow-left text-[10px]"></i></button><h2 class="text-xs font-bold text-slate-800">Tugas: <span class="text-cyan-600">${mpFleetMode}</span></h2></div>
        
        <div class="flex items-center border border-slate-200 bg-white rounded-md p-1 shadow-sm mb-2 w-full sm:w-auto mx-auto justify-center text-[10px] text-slate-600">
            <i class="fa-regular fa-calendar ml-1 mr-2 text-slate-400"></i>
            <input type="date" id="mp_filter_mulai" class="bg-transparent focus:outline-none" value="${tglMulai}" onchange="renderApp(true)">
            <span class="mx-1 font-semibold text-slate-400">s/d</span>
            <input type="date" id="mp_filter_selesai" class="bg-transparent focus:outline-none" value="${tglSelesai}" onchange="renderApp(true)">
        </div>

        <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
            <div class="flex gap-1 overflow-x-auto hide-scrollbar bg-white p-0.5 rounded-full shadow-sm border border-slate-200">${['ON PROGRESS', 'PENDING', 'COMPLETED', 'CANCELED'].map(panel => `<button onclick="currentMpPanel='${panel}'; renderApp(true)" class="px-2.5 py-1 rounded-full text-[9px] font-bold whitespace-nowrap transition-colors ${currentMpPanel === panel ? 'bg-[#0891b2] text-white shadow-sm' : 'text-slate-500 hover:bg-slate-100'}">${panel}</button>`).join('')}</div>
            ${unitFilterHtml}
        </div>
        <div class="space-y-2 pb-4">`;

        if (jobs.length === 0) html += `<div class="bg-white rounded-md p-4 text-center border shadow-sm"><p class="text-slate-400 text-[11px]">Tidak ada tugas pada kategori ini.</p></div>`;

        jobs.forEach(job => {
            html += `
            <div class="bg-white rounded-md p-3 border border-slate-200 shadow-sm relative text-[11px]">
                <div class="flex justify-between items-center mb-2 pb-1.5 border-b border-slate-100">
                    <div class="text-xs sm:text-sm font-mono font-black text-cyan-700 cursor-pointer hover:underline tracking-tight flex items-center gap-1.5" onclick="viewJobDetail('${job.no_wo}')" title="Buka Detail">
                        <i class="fa-solid fa-file-lines text-cyan-500 text-[11px]"></i>
                        <span>${job.no_wo}</span>
                    </div>
                    <div class="text-[13px] sm:text-sm bg-cyan-50 text-cyan-700 border border-cyan-200 px-2.5 py-1 rounded-md font-extrabold shadow-xs">
                        Unit: ${job.unit || '-'}
                    </div>
                </div>
                <div class="font-bold text-slate-800 text-xs mb-1">Req: ${job.tgl_pelaksanaan} ${job.jam_pelaksanaan || ''}</div>
                ${job.kategori !== 'Big Crane' ? `<div class="text-[11px] text-slate-500 mb-3 truncate">Lokasi: ${job.lokasi_angkat||'-'} ➔ ${job.lokasi_tujuan||'-'}</div>` : `<div class="text-[11px] text-slate-500 mb-3 truncate border-l-2 border-slate-300 pl-1">${job.deskripsi}</div>`}
                <div class="flex gap-1.5">
                    ${job.status === 'ON PROGRESS' ? `
                        <button onclick="openManpowerAction('${job.no_wo}', 'COMPLETED')" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-1.5 rounded-sm text-[11px] shadow-sm"><i class="fa-solid fa-check"></i> Close Job</button>
                        <button onclick="openManpowerAction('${job.no_wo}', 'PENDING')" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-bold py-1.5 rounded-sm text-[11px] shadow-sm"><i class="fa-solid fa-pause"></i> Pending</button>
                        <button onclick="initiateCancelJob('${job.no_wo}')" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-1.5 rounded-sm text-[11px] shadow-sm"><i class="fa-solid fa-xmark"></i> Cancel</button>
                    ` : ''}
                    ${job.status === 'PENDING' ? `
                        <div class="text-[10px] text-orange-600 font-bold w-full text-center bg-orange-50 py-1.5 rounded-sm border border-orange-200 shadow-sm"><i class="fa-solid fa-clock mr-1"></i> Job Pending - Menunggu Validasi Lanjutan dari GL</div>
                    ` : ''}
                </div>
            </div>`;
        });

        html += `</div>`;
        return html;
    }

    function openManpowerAction(wo, status) {
        currentActionWo = wo;
        currentActionStatus = status;
        const job = getOrders().find(j => j.no_wo === wo);
        if (!job) return;
        
        const m = getMasterData();
        const now = new Date();
        const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        
        const mTitle = document.getElementById('mpActionTitle');
        if (mTitle) {
            mTitle.innerText = status === 'COMPLETED' ? 'Selesaikan Pekerjaan (Close Job)' : 'Tunda Pekerjaan (Pending)';
        }

        // Daftar unit armada sesuai kategori pekerjaan
        let unitList = [];
        if (job.kategori === 'Crane Truck') unitList = m.unit_ct || [];
        else if (job.kategori === 'Big Crane') unitList = m.unit_big_crane || [];
        else if (job.kategori === 'Lowboy') unitList = m.unit_lowboy || [];
        const unitOptions = unitList.map(u => `<option value="${u}" ${job.unit === u ? 'selected' : ''}>${u}</option>`).join('');
        
        const opOptions = (m.operator || []).map(o => `<option value="${o}" ${job.operator === o ? 'selected' : ''}>${o}</option>`).join('');
        const rigOptions1 = (m.rigger || []).map(r => `<option value="${r}" ${job.rigger === r ? 'selected' : ''}>${r}</option>`).join('');
        const rigOptions2 = (m.rigger || []).map(r => `<option value="${r}" ${job.rigger2 === r ? 'selected' : ''}>${r}</option>`).join('');

        const targetLabel = job.jam_pelaksanaan ? `Jam ${job.jam_pelaksanaan}` : (job.tgl_pelaksanaan || '-');
        const durasiReqLabel = job.durasi_request || '-';

        const content = document.getElementById('mpActionContent');
        if (content) {
            content.innerHTML = `
                <!-- Ringkasan Informasi Job Lapangan -->
                <div class="bg-cyan-50/70 border border-cyan-200 rounded-lg p-2.5 mb-3 text-left space-y-1 shadow-2xs">
                    <div class="flex justify-between items-center border-b border-cyan-100 pb-1">
                        <span class="font-mono font-black text-cyan-800 text-xs sm:text-sm tracking-tight">${job.no_wo}</span>
                        <span class="text-[9px] font-bold text-cyan-700 bg-white px-2 py-0.5 rounded border border-cyan-200">${job.kategori}</span>
                    </div>
                    <div class="text-[10px] text-slate-700">
                        <span class="text-slate-400 font-normal">Pemohon:</span> <strong class="text-slate-800 uppercase">${job.nama_pemohon || '-'}</strong> <span class="text-slate-500 font-semibold">(${job.departemen || '-'}${job.perusahaan ? ' &bull; ' + job.perusahaan : ''})</span>
                    </div>
                    ${job.kategori !== 'Big Crane' ? `
                    <div class="text-[10px] text-slate-700">
                        <span class="text-slate-400 font-normal">Rute:</span> <span class="text-orange-600 font-bold">${job.lokasi_angkat || '-'}</span> <i class="fa-solid fa-arrow-right text-[8px] text-slate-400 mx-0.5"></i> <span class="text-emerald-600 font-bold">${job.lokasi_tujuan || '-'}</span>
                    </div>` : ''}
                    <div class="text-[10px] text-slate-700 bg-white/90 p-1.5 rounded border border-cyan-100 mt-1">
                        <span class="text-slate-400 font-semibold block text-[8px] uppercase tracking-wider">Deskripsi Pekerjaan:</span>
                        <span class="font-medium text-slate-800 leading-snug">${job.deskripsi || '-'}</span>
                    </div>
                    <div class="text-[9px] text-blue-700 font-bold pt-1 flex items-center justify-between border-t border-cyan-100/60 mt-1">
                        <span><i class="fa-regular fa-clock mr-0.5"></i> Target: ${targetLabel}</span>
                        <span><i class="fa-solid fa-hourglass-half mr-0.5"></i> Durasi: ${durasiReqLabel}</span>
                    </div>
                </div>

                <form onsubmit="submitManpowerAction(event)" class="space-y-2.5 text-left">
                    <!-- Unit Armada (Dapat ditukar/disesuaikan oleh MP di lapangan) -->
                    <div>
                        <div class="flex items-center justify-between mb-0.5">
                            <label class="block text-[10px] font-bold text-slate-700">Unit Armada (${job.kategori}) *</label>
                            <span class="text-[8px] font-bold text-cyan-600 italic"><i class="fa-solid fa-arrows-rotate mr-0.5"></i>Bisa ubah jika tukar unit</span>
                        </div>
                        <select id="mp_unit" class="w-full border-2 border-cyan-400 bg-cyan-50/40 rounded-md px-2.5 py-1.5 text-xs focus:border-cyan-600 outline-none font-extrabold text-cyan-950 cursor-pointer shadow-2xs" required>
                            <option value="" disabled ${!job.unit ? 'selected' : ''}>-- Pilih Unit --</option>
                            ${unitOptions}
                        </select>
                    </div>

                    <!-- Operator & Rigger 1 (Bisa disesuaikan MP jika ada rolling) -->
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-600 mb-0.5">Operator *</label>
                            <select id="mp_operator" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-xs focus:border-cyan-500 outline-none bg-white font-semibold cursor-pointer" required>
                                <option value="" disabled ${!job.operator ? 'selected' : ''}>-- Operator --</option>
                                ${opOptions}
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-600 mb-0.5">Rigger 1 *</label>
                            <select id="mp_rigger" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-xs focus:border-cyan-500 outline-none bg-white font-semibold cursor-pointer" required>
                                <option value="" disabled ${!job.rigger ? 'selected' : ''}>-- Rigger --</option>
                                ${rigOptions1}
                            </select>
                        </div>
                    </div>

                    ${job.kategori === 'Big Crane' ? `
                    <div>
                        <label class="block text-[10px] font-semibold text-slate-500 mb-0.5">Rigger 2 (Opsional)</label>
                        <select id="mp_rigger2" class="w-full border border-slate-300 rounded-md px-2.5 py-1.5 text-xs focus:border-cyan-500 outline-none bg-white font-medium cursor-pointer">
                            <option value="">-- Pilih --</option>
                            ${rigOptions2}
                        </select>
                    </div>` : ''}

                    <!-- Mulai dan Selesai Aktual -->
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-600 mb-0.5">Mulai Aktual *</label>
                            <input type="time" id="mp_start_time" value="${job.jam_start_aktual || job.jam_pelaksanaan || timeStr}" class="w-full border border-slate-300 rounded-md px-2 py-1 text-xs focus:border-cyan-500 outline-none text-slate-700 font-bold" required>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-600 mb-0.5">Selesai Aktual *</label>
                            <input type="time" id="mp_end_time" value="${job.jam_end_aktual || timeStr}" class="w-full border border-slate-300 rounded-md px-2 py-1 text-xs focus:border-cyan-500 outline-none text-slate-700 font-bold" required>
                        </div>
                    </div>

                    <!-- Final Inspeksi -->
                    <div>
                        <label class="block text-[10px] font-bold text-emerald-600 mb-0.5 flex items-center gap-1">
                            <i class="fa-solid fa-check text-[10px]"></i> Final Inspeksi *
                        </label>
                        <input type="time" id="mp_final_insp" value="${job.final_inspeksi || timeStr}" class="w-full border border-emerald-400 bg-emerald-50/20 rounded-md px-2 py-1 text-xs focus:border-emerald-600 outline-none text-emerald-800 font-semibold" required>
                    </div>

                    ${status === 'PENDING' ? `
                    <!-- Alasan Pending -->
                    <div>
                        <label class="block text-[10px] font-bold text-orange-500 mb-0.5 flex items-center gap-1">
                            <i class="fa-solid fa-rotate-left text-[10px]"></i> Alasan Pending *
                        </label>
                        <textarea id="mp_pending_reason" class="w-full border border-orange-300 bg-orange-50/20 rounded-md px-2 py-1.5 text-xs focus:border-orange-500 outline-none h-14" placeholder="Ketik alasan pending..." required></textarea>
                    </div>` : ''}

                    <!-- Tombol Aksi -->
                    <div class="pt-2">
                        ${status === 'COMPLETED' ? `

    function submitManpowerAction(e) {
        e.preventDefault();
        if (!currentActionWo) return;
        let job = getOrders().find(j => j.no_wo === currentActionWo);
        if (!job) return;

        let unitVal = document.getElementById('mp_unit')?.value || job.unit || '';
        let startTime = document.getElementById('mp_start_time').value;
        let endTime = document.getElementById('mp_end_time').value;
        let finalInsp = document.getElementById('mp_final_insp')?.value || '';
        let operatorVal = document.getElementById('mp_operator')?.value || '';
        let riggerVal = document.getElementById('mp_rigger')?.value || '';
        let rigger2Val = document.getElementById('mp_rigger2')?.value || '';
        let pendingReason = document.getElementById('mp_pending_reason')?.value.trim() || '';

        // Hitung durasi kerja aktual
        let [h1, m1] = startTime.split(':').map(Number);
        let [h2, m2] = endTime.split(':').map(Number);
        let actualMin = (h2 * 60 + m2) - (h1 * 60 + m1);
        if (actualMin < 0) actualMin += 1440; // Lintas tengah malam

        // Evaluasi toleransi waktu keterlambatan datang (> 15 menit)
        let telatMinutes = 0;
        if (job.jam_pelaksanaan && startTime) {
            let [th, tm] = job.jam_pelaksanaan.split(':').map(Number);
            let targetMin = th * 60 + tm;
            let startMin = h1 * 60 + m1;
            let diff = startMin - targetMin;
            if (diff < -720) diff += 1440;
            if (diff > 720) diff -= 1440;
            if (diff > 15) telatMinutes = diff;
        }

        // Evaluasi toleransi durasi pekerjaan overtime (> 15 menit)
        let overMinutes = 0;
        if (job.durasi_request) {
            let reqMin = 0;
            if (job.durasi_request.includes('HARI')) {
                let days = parseFloat(job.durasi_request) || 0;
                reqMin = days * 24 * 60;
            } else {
                let hours = parseFloat(job.durasi_request) || 0;
                reqMin = hours * 60;
            }
            if (reqMin > 0 && (actualMin - reqMin) > 15) {
                overMinutes = actualMin - reqMin;
            }
        }

        pendingActionData = {
            wo: currentActionWo,
            status: currentActionStatus,
            unit: unitVal,
            startTime: startTime,
            endTime: endTime,
            finalInsp: finalInsp,
            operator: operatorVal,
            rigger: riggerVal,
            rigger2: rigger2Val,
            pendingReason: pendingReason,
            actualMinutes: actualMin,
            telatMinutes: telatMinutes,
            overMinutes: overMinutes
        };

        // Jika terdapat toleransi waktu yang terlanggar, buka modal kendala
        if (telatMinutes > 0 || overMinutes > 0) {
            showKendalaModal(telatMinutes, overMinutes);
        } else {
            finalizeJobAction('', '');
        }
    }

    function showKendalaModal(telatMin, overMin) {

    function submitKendalaAction(e) {
        e.preventDefault();
        const telatEl = document.getElementById('kendala_telat_text');
        const overEl = document.getElementById('kendala_over_text');

        let telatReason = telatEl ? telatEl.value.trim() : '';
        let overReason = overEl ? overEl.value.trim() : '';

        if (pendingActionData.telatMinutes > 0 && !telatReason) {
            return showToast('Mohon isi alasan telat datang!', 'error');
        }
        if (pendingActionData.overMinutes > 0 && !overReason) {
            return showToast('Mohon isi alasan over job!', 'error');
        }

        document.getElementById('kendalaModal').classList.add('hidden');
        finalizeJobAction(telatReason, overReason);
    }

    function finalizeJobAction(telatReason, overReason) {
        if (!pendingActionData) return;
        let jobs = getOrders();
        let idx = jobs.findIndex(j => j.no_wo === pendingActionData.wo);
        if (idx === -1) return;

        const durasiHours = (pendingActionData.actualMinutes / 60).toFixed(2);

        if (pendingActionData.unit) jobs[idx].unit = pendingActionData.unit;
        jobs[idx].jam_start_aktual = pendingActionData.startTime;
        jobs[idx].jam_end_aktual = pendingActionData.endTime;
        jobs[idx].durasi_aktual = durasiHours;
        jobs[idx].final_inspeksi = pendingActionData.finalInsp;
        jobs[idx].operator = pendingActionData.operator || jobs[idx].operator;
        jobs[idx].rigger = pendingActionData.rigger || jobs[idx].rigger;
        if (pendingActionData.rigger2) jobs[idx].rigger2 = pendingActionData.rigger2;
        jobs[idx].status = pendingActionData.status;

        if (telatReason) {
            const formattedTelat = formatDurationHM(pendingActionData.telatMinutes);
            jobs[idx].alasan_telat = `Telat (+${formattedTelat}): ${telatReason}`;
        }
        if (overReason) {
            const formattedOver = formatDurationHM(pendingActionData.overMinutes);
            jobs[idx].alasan_overtime = `Over (+${formattedOver}): ${overReason}`;
        }
        if (pendingActionData.status === 'PENDING' && pendingActionData.pendingReason) {
            jobs[idx].alasan_telat = (jobs[idx].alasan_telat ? jobs[idx].alasan_telat + ' | ' : '') + 'Pending: ' + pendingActionData.pendingReason;
        }

        saveOrders(jobs);
        showToast(pendingActionData.status === 'COMPLETED' ? 'Pekerjaan berhasil diselesaikan!' : 'Pekerjaan berhasil dipending.');
        document.getElementById('mpActionModal').classList.add('hidden');
        pendingActionData = null;
        renderApp(true);
    }
