<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PPA Support Equipment</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        
        .sidebar { transition: transform 0.3s ease-in-out; }
        .sidebar-overlay { 
            background: rgba(0,0,0,0.5); backdrop-filter: blur(2px);
            transition: opacity 0.3s ease; opacity: 0; pointer-events: none;
        }
        .sidebar-overlay.active { opacity: 1; pointer-events: auto; }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.active { transform: translateX(0); }
        }

        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        
        /* Modal Transitions */
        .modal-bg { transition: opacity 0.2s ease-in-out; opacity: 0; pointer-events: none; }
        .modal-bg.active { opacity: 1; pointer-events: auto; }
        .modal-panel { transition: transform 0.2s ease-in-out; transform: scale(0.95); }
        .modal-bg.active .modal-panel { transform: scale(1); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Image Viewer */
        #imgViewerModal { z-index: 9999; }
        .zoom-img { transition: transform 0.2s ease; cursor: grab; }
        .zoom-img:active { cursor: grabbing; }

        input[type="time"]::-webkit-calendar-picker-indicator { cursor: pointer; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 bg-slate-800 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
            <div class="text-center mb-8">
                <div class="bg-teal-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner">
                    <i class="fas fa-truck-monster text-3xl text-teal-600"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800">Support Equipment</h1>
                <p class="text-slate-500 text-sm mt-1">PT Putra Perkasa Abadi</p>
            </div>
            
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">NRP / NIK</label>
                    <div class="relative">
                        <span class="absolute left-3 top-2.5 text-slate-400"><i class="fas fa-id-badge"></i></span>
                        <input type="text" id="loginNrp" class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition" placeholder="Masukkan NRP" required>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                    <div class="relative">
                        <span class="absolute left-3 top-2.5 text-slate-400"><i class="fas fa-lock"></i></span>
                        <input type="password" id="loginPass" class="w-full pl-10 pr-10 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition" placeholder="••••••••" required>
                        <button type="button" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600" onclick="togglePass('loginPass', this)"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-2.5 rounded-lg shadow-md transition transform active:scale-95 flex justify-center items-center gap-2">
                    <i class="fas fa-sign-in-alt"></i> MASUK
                </button>
            </form>
            <p id="loginError" class="text-red-500 text-sm text-center mt-4 hidden font-medium"></p>
        </div>
    </div>

    <!-- MAIN APP LAYOUT -->
    <div id="appLayout" class="hidden h-screen flex overflow-hidden">
        
        <!-- SIDEBAR OVERLAY -->
        <div id="sidebarOverlay" class="fixed inset-0 sidebar-overlay md:hidden z-30" onclick="toggleSidebar()"></div>
        
        <!-- SIDEBAR -->
        <aside id="sidebar" class="sidebar fixed md:static w-64 h-full bg-white border-r border-slate-200 flex flex-col z-40 shadow-xl md:shadow-none">
            <div class="p-5 flex items-center justify-between border-b border-slate-100">
                <div class="flex items-center gap-3">
                    <div class="bg-teal-600 text-white w-8 h-8 rounded flex items-center justify-center font-bold">
                        <i class="fas fa-truck-monster text-sm"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-sm leading-tight text-slate-800">SUPPORT EQUIPMENT</h1>
                        <p class="text-[10px] text-teal-600 font-semibold">PT Putra Perkasa Abadi</p>
                    </div>
                </div>
                <button class="md:hidden text-slate-400 hover:text-red-500" onclick="toggleSidebar()"><i class="fas fa-times text-xl"></i></button>
            </div>
            
            <div class="p-4 flex-1 overflow-y-auto">
                <p class="text-xs font-bold text-slate-400 mb-3 tracking-wider">MENU UTAMA</p>
                <nav id="navMenu" class="space-y-1"></nav>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 flex flex-col h-full bg-slate-50 relative overflow-hidden">
            <!-- HEADER -->
            <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-4 shadow-sm z-10 shrink-0">
                <div class="flex items-center gap-3">
                    <button class="md:hidden w-10 h-10 rounded hover:bg-slate-100 flex items-center justify-center text-slate-600" onclick="toggleSidebar()">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h2 id="pageTitle" class="font-bold text-lg text-slate-800 hidden md:block">Dashboard</h2>
                </div>
                
                <div class="flex items-center gap-3">
                    <div class="text-right hidden sm:block">
                        <p id="headUserName" class="text-sm font-bold text-slate-800 leading-none">Nama</p>
                        <p id="headUserRole" class="text-xs text-slate-500">Role</p>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-slate-200 border-2 border-white shadow-sm overflow-hidden flex items-center justify-center text-slate-500 cursor-pointer hover:bg-slate-300" onclick="loadPage('profil')">
                        <i class="fas fa-user"></i>
                    </div>
                </div>
            </header>

            <!-- PAGE CONTENT AREA -->
            <div id="mainContent" class="flex-1 overflow-y-auto p-4 md:p-6 pb-20 md:pb-6 relative">
                <!-- Content injected via JS -->
            </div>
        </main>
    </div>

    <!-- ALL GLOBAL MODALS -->

    <!-- Image Viewer Modal -->
    <div id="imgViewerModal" class="fixed inset-0 bg-black bg-opacity-95 hidden items-center justify-center">
        <button class="absolute top-4 right-4 text-white hover:text-red-500 bg-gray-800 bg-opacity-50 w-10 h-10 rounded-full flex items-center justify-center z-50 transition" onclick="closeImgViewer()">
            <i class="fas fa-times text-xl"></i>
        </button>
        <div class="w-full h-full flex items-center justify-center overflow-hidden" id="imgViewerContainer">
            <img id="viewerImage" src="" class="zoom-img max-w-full max-h-full object-contain" alt="Fullscreen Image">
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full text-white font-semibold text-sm shadow-xl transition-all duration-300 z-[9999] opacity-0 translate-y-[-20px] pointer-events-none"></div>

    <!-- Generic Modal for Forms (Admin/GL Edit/Validate) -->
    <div id="formModal" class="fixed inset-0 bg-slate-900 bg-opacity-50 modal-bg flex items-center justify-center p-4 z-[100]">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col modal-panel relative overflow-hidden">
            <div id="formModalHeader" class="bg-teal-600 text-white p-4 font-bold flex justify-between items-center shrink-0">
                <span id="formModalTitle">Form</span>
                <button class="hover:text-red-200 transition text-lg w-8 h-8 flex items-center justify-center rounded-full hover:bg-teal-700" onclick="closeModal('formModal')"><i class="fas fa-times"></i></button>
            </div>
            <div id="formModalBody" class="p-4 md:p-6 overflow-y-auto flex-1"></div>
        </div>
    </div>

    <!-- Detail Job Modal -->
    <div id="detailModal" class="fixed inset-0 bg-slate-900 bg-opacity-50 modal-bg flex items-center justify-center p-4 z-[90]">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg max-h-[90vh] flex flex-col modal-panel">
            <div class="border-b border-slate-100 p-4 font-bold text-slate-800 flex justify-between items-center shrink-0">
                <span>Detail Pekerjaan</span>
                <button class="text-slate-400 hover:text-red-500 transition text-lg w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100" onclick="closeModal('detailModal')"><i class="fas fa-times"></i></button>
            </div>
            <div id="detailModalBody" class="p-0 overflow-y-auto flex-1 text-sm bg-slate-50"></div>
        </div>
    </div>

    <script>
        // --- 1. SUPABASE INITIALIZATION ---
        // GANTI DENGAN KREDENSIAL SUPABASE ANDA
        const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- 2. GLOBAL STATE ---
        let currentUser = null;
        let DB = {
            users: [],
            master: { dept: [], section: [], unit: [], perusahaan: [], gl: [], operator: [], rigger: [] },
            orders: [],
            settings: {}
        };
        let syncInterval = null;
        let chartInstance = null;
        let performaChartInstance = null;
        let dashboardData = { orders: [] }; 
        let isSyncing = false;

        // --- 3. AUTH & INIT ---
        window.onload = async () => {
            const savedUser = localStorage.getItem('ppa_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                await initApp();
            }
        };

        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const nrp = document.getElementById('loginNrp').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            const btn = e.target.querySelector('button');
            const err = document.getElementById('loginError');
            
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Memeriksa...';
            btn.disabled = true;
            err.classList.add('hidden');

            try {
                const { data, error } = await supabase
                    .from('users')
                    .select('*')
                    .eq('nrp', nrp)
                    .eq('password_hash', pass)
                    .single();

                if (error || !data) throw new Error('NRP atau Password salah!');
                if (data.status_akun === 'INACTIVE') throw new Error('Akun dinonaktifkan.');

                currentUser = data;
                localStorage.setItem('ppa_user', JSON.stringify(data));
                await initApp();
                
            } catch (error) {
                err.textContent = error.message;
                err.classList.remove('hidden');
            } finally {
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> MASUK';
                btn.disabled = false;
            }
        };

        function logout() {
            localStorage.removeItem('ppa_user');
            currentUser = null;
            if(syncInterval) clearInterval(syncInterval);
            document.getElementById('appLayout').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        }

        async function initApp() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appLayout').classList.remove('hidden');
            
            document.getElementById('headUserName').textContent = currentUser.nama_lengkap;
            document.getElementById('headUserRole').textContent = `${currentUser.role} ${currentUser.departemen ? `| ${currentUser.departemen}` : ''}`;
            
            buildMenu();
            showToast(`Selamat datang, ${currentUser.nama_lengkap}!`, 'success');
            
            await fetchFromSupabase(true);
            
            // Sync Rate set to 15 seconds to save Egress
            if(syncInterval) clearInterval(syncInterval);
            syncInterval = setInterval(() => fetchFromSupabase(false), 15000); 
        }

        // --- 4. DATA SYNC (SUPABASE) ---
        async function fetchFromSupabase(showLoading = false) {
            if (isSyncing) return;
            isSyncing = true;
            try {
                if(showLoading) showToast("Menyinkronkan data...", "info");
                
                // Fetch Master Data
                const { data: mData } = await supabase.from('master_data').select('*');
                if(mData) {
                    DB.master = { dept: [], section: [], unit: [], perusahaan: [], gl: [], operator: [], rigger: [] };
                    mData.forEach(m => {
                        if(DB.master[m.kategori]) DB.master[m.kategori].push(m.nilai);
                    });
                }
                
                // Fetch Users with Fallback
                const { data: uData } = await supabase.from('users').select('*').order('nama_lengkap');
                if(uData) {
                    DB.users = uData.filter(u => u.nama_lengkap && u.nrp); // Filter data kosong
                }

                // Populate GL, OP, Rig
                DB.master.gl = DB.users.filter(u => u.role === 'GL').map(u => u.nama_lengkap);
                DB.master.operator = DB.users.filter(u => u.role === 'MANPOWER').map(u => u.nama_lengkap);
                DB.master.rigger = DB.users.filter(u => u.role === 'MANPOWER').map(u => u.nama_lengkap);

                // Fetch Orders
                const { data: oData } = await supabase.from('orders').select('*').order('created_at', { ascending: false });
                if(oData) {
                    DB.orders = oData.map(o => {
                        if(typeof o.kru === 'string') {
                            try { o.kru = JSON.parse(o.kru); } catch(e) { o.kru = {}; }
                        }
                        return o;
                    });
                }
                
                if(showLoading) showToast("Data berhasil ditarik!", "success");
                refreshCurrentView();
            } catch (error) {
                console.error("Sync Error:", error);
                if(showLoading) showToast("Gagal sinkronisasi data.", "error");
            } finally {
                isSyncing = false;
            }
        }

        // TIME FORMATTER WITH TIMEZONE FIX
        function formatDate(dateString) {
            if (!dateString) return '-';
            let safeString = dateString;
            // Force UTC detection if 'Z' or 'T' is missing from string
            if (typeof dateString === 'string' && !dateString.includes('T') && !dateString.includes('Z')) {
                safeString = dateString.replace(' ', 'T') + 'Z'; 
            }
            
            const date = new Date(safeString);
            if (isNaN(date.getTime())) return dateString; 
            
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            const hh = String(date.getHours()).padStart(2, '0');
            const mm = String(date.getMinutes()).padStart(2, '0');
            
            return `${y}-${m}-${d} ${hh}:${mm}`;
        }

        // --- 5. UI CORE & NAVIGATION ---
        const menuConfig = [
            { id: 'dashboard', icon: 'fa-chart-pie', label: 'Dashboard', roles: ['ADMIN', 'GL'] },
            { id: 'data_order', icon: 'fa-list-alt', label: 'Data Order', roles: ['ADMIN', 'GL'] },
            { id: 'tugas_mp', icon: 'fa-hard-hat', label: 'Tugas Saya', roles: ['MANPOWER'] },
            { id: 'buat_order', icon: 'fa-plus-square', label: 'Buat Order', roles: ['USER', 'ADMIN', 'GL'] },
            { id: 'riwayat_user', icon: 'fa-history', label: 'Riwayat Order', roles: ['USER'] },
            { id: 'master', icon: 'fa-database', label: 'Master Data', roles: ['ADMIN'] }
        ];

        let currentPage = '';

        function buildMenu() {
            const nav = document.getElementById('navMenu');
            nav.innerHTML = '';
            let firstPage = null;

            menuConfig.forEach(m => {
                if (m.roles.includes(currentUser.role)) {
                    if (!firstPage) firstPage = m.id;
                    const btn = document.createElement('button');
                    btn.className = `w-full text-left px-4 py-3 rounded-xl mb-1 flex items-center gap-3 transition font-medium text-sm text-slate-600 hover:bg-slate-100 hover:text-teal-600`;
                    btn.id = `menu-${m.id}`;
                    btn.innerHTML = `<i class="fas ${m.icon} w-5 text-center"></i> ${m.label}`;
                    btn.onclick = () => { loadPage(m.id); toggleSidebar(false); };
                    nav.appendChild(btn);
                }
            });
            
            // Add Profile Menu manually
            const profBtn = document.createElement('button');
            profBtn.className = `w-full text-left px-4 py-3 rounded-xl mt-4 flex items-center gap-3 transition font-medium text-sm text-slate-600 hover:bg-slate-100 hover:text-teal-600`;
            profBtn.id = `menu-profil`;
            profBtn.innerHTML = `<i class="fas fa-user-circle w-5 text-center"></i> Profil Saya`;
            profBtn.onclick = () => { loadPage('profil'); toggleSidebar(false); };
            nav.appendChild(profBtn);

            if (firstPage) loadPage(firstPage);
        }

        function loadPage(pageId) {
            currentPage = pageId;
            document.querySelectorAll('#navMenu button').forEach(b => {
                b.classList.remove('bg-teal-50', 'text-teal-700', 'font-bold');
                b.classList.add('text-slate-600');
            });
            
            const activeBtn = document.getElementById(`menu-${pageId}`);
            if (activeBtn) {
                activeBtn.classList.add('bg-teal-50', 'text-teal-700', 'font-bold');
                activeBtn.classList.remove('text-slate-600');
            }

            const titleMap = {
                dashboard: 'Dashboard', data_order: 'Manajemen Data Order', 
                buat_order: 'Buat Order Baru', master: 'Pengaturan Master Data',
                tugas_mp: 'Daftar Tugas (Manpower)', riwayat_user: 'Riwayat Pesanan Saya',
                profil: 'Profil Saya'
            };
            document.getElementById('pageTitle').textContent = titleMap[pageId] || '';

            refreshCurrentView();
        }

        function refreshCurrentView() {
            const mc = document.getElementById('mainContent');
            if(currentPage === 'dashboard') mc.innerHTML = getDashboardView();
            else if(currentPage === 'data_order') mc.innerHTML = getDataOrderView();
            else if(currentPage === 'buat_order') mc.innerHTML = getBuatOrderView();
            else if(currentPage === 'master') mc.innerHTML = getMasterView();
            else if(currentPage === 'tugas_mp') mc.innerHTML = getTugasMPView();
            else if(currentPage === 'riwayat_user') mc.innerHTML = getRiwayatUserView();
            else if(currentPage === 'profil') mc.innerHTML = getProfileView();
            
            if(currentPage === 'dashboard') initDashboardCharts();
        }

        function toggleSidebar(force) {
            const side = document.getElementById('sidebar');
            const over = document.getElementById('sidebarOverlay');
            if(force === false) { side.classList.remove('active'); over.classList.remove('active'); return; }
            side.classList.toggle('active');
            over.classList.toggle('active');
        }

        function togglePass(inputId, btn) {
            const inp = document.getElementById(inputId);
            if(inp.type === 'password') { inp.type = 'text'; btn.innerHTML = '<i class="fas fa-eye-slash"></i>'; }
            else { inp.type = 'password'; btn.innerHTML = '<i class="fas fa-eye"></i>'; }
        }

        function showToast(msg, type='info') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `fixed top-5 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full text-white font-semibold text-sm shadow-xl transition-all duration-300 z-[9999] ${type==='error'?'bg-red-500':type==='success'?'bg-teal-500':'bg-slate-800'}`;
            t.style.opacity = '1';
            t.style.transform = 'translate(-50%, 0)';
            setTimeout(() => {
                t.style.opacity = '0';
                t.style.transform = 'translate(-50%, -20px)';
            }, 3000);
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        // --- DASHBOARD (Fix Date & Sync Button) ---
        function getDashboardView() {
            const today = new Date();
            const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
            
            const formatDateForInput = (d) => {
                return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            };
            
            const defStart = formatDateForInput(firstDay);
            const defEnd = formatDateForInput(today);

            return `
            <div class="space-y-4">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                    <h3 class="font-bold text-slate-700 flex items-center gap-2">
                        <i class="fas fa-chart-pie text-teal-600"></i> Dashboard Analytics
                        <button onclick="fetchFromSupabase(true)" class="ml-2 text-xs bg-indigo-50 text-indigo-600 border border-indigo-200 px-2 py-1 rounded hover:bg-indigo-100 transition"><i class="fas fa-sync-alt mr-1"></i> Refresh Sync</button>
                    </h3>
                    <div class="flex flex-wrap gap-2 w-full md:w-auto">
                        <input type="date" id="dashStartDate" class="border border-slate-300 p-1.5 rounded text-sm flex-1 md:w-auto" value="${defStart}" onchange="initDashboardCharts()">
                        <span class="py-1 text-slate-400">-</span>
                        <input type="date" id="dashEndDate" class="border border-slate-300 p-1.5 rounded text-sm flex-1 md:w-auto" value="${defEnd}" onchange="initDashboardCharts()">
                        <select id="dashShift" class="border border-slate-300 p-1.5 rounded text-sm" onchange="initDashboardCharts()">
                            <option value="ALL">All Shift</option>
                            <option value="1">Shift 1</option>
                            <option value="2">Shift 2</option>
                        </select>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 text-center"><p class="text-xs font-bold text-slate-500 mb-1">TOTAL ORDER</p><h4 class="text-3xl font-black text-slate-800" id="vTotal">0</h4></div>
                    <div class="bg-blue-50 p-4 rounded-xl shadow-sm border border-blue-100 text-center"><p class="text-xs font-bold text-blue-500 mb-1">PROGRES</p><h4 class="text-3xl font-black text-blue-700" id="vProg">0</h4></div>
                    <div class="bg-orange-50 p-4 rounded-xl shadow-sm border border-orange-100 text-center"><p class="text-xs font-bold text-orange-500 mb-1">PENDING</p><h4 class="text-3xl font-black text-orange-700" id="vPend">0</h4></div>
                    <div class="bg-emerald-50 p-4 rounded-xl shadow-sm border border-emerald-100 text-center"><p class="text-xs font-bold text-emerald-500 mb-1">SELESAI</p><h4 class="text-3xl font-black text-emerald-700" id="vComp">0</h4></div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                     <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                        <p class="text-xs font-bold text-slate-500 mb-4">DATA PERUSAHAAN (SELESAI)</p>

        function initDashboardCharts() {
            const start = document.getElementById('dashStartDate').value;
            const end = document.getElementById('dashEndDate').value;
            const shift = document.getElementById('dashShift').value;

            const sd = new Date(start + 'T00:00:00');
            const ed = new Date(end + 'T23:59:59');

            let filtered = DB.orders.filter(o => {
                const od = new Date(o.created_at);
                let validDate = od >= sd && od <= ed;
                let validShift = shift === 'ALL' || String(o.shift) === shift;
                return validDate && validShift;
            });

            document.getElementById('vTotal').textContent = filtered.length;
            document.getElementById('vProg').textContent = filtered.filter(o=>o.status==='ON PROGRESS').length;
            document.getElementById('vPend').textContent = filtered.filter(o=>o.status==='PENDING').length;
            
            const completed = filtered.filter(o=>o.status==='COMPLETED');
            document.getElementById('vComp').textContent = completed.length;

            // Unit Chart
            let unitStats = { 'Crane Truck':0, 'Big Crane':0, 'Lowboy':0 };
            completed.forEach(o => { if(unitStats[o.jenis_unit]!==undefined) unitStats[o.jenis_unit]++; });
            
            if(chartInstance) chartInstance.destroy();
            const ctxUnit = document.getElementById('chartUnit');
            if(ctxUnit && Object.values(unitStats).reduce((a,b)=>a+b,0) > 0) {
                chartInstance = new Chart(ctxUnit, {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(unitStats),
                        datasets: [{ data: Object.values(unitStats), backgroundColor: ['#ef4444','#f97316','#92400e'], borderWidth:0 }]
                    },
                    options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{position:'bottom'} }, cutout:'70%' }
                });
            }

            // Rigger Chart
            let rigStats = {};
            completed.forEach(o => {
                if(o.kru && o.kru.rigger1 && o.durasi_aktual) {
                    if(!rigStats[o.kru.rigger1]) rigStats[o.kru.rigger1] = {CT:0, BC:0, LB:0};
                    if(o.jenis_unit==='Crane Truck') rigStats[o.kru.rigger1].CT += parseFloat(o.durasi_aktual);
                    else if(o.jenis_unit==='Big Crane') rigStats[o.kru.rigger1].BC += parseFloat(o.durasi_aktual);
                    else rigStats[o.kru.rigger1].LB += parseFloat(o.durasi_aktual);
                }
                if(o.kru && o.kru.rigger2 && o.durasi_aktual) {
                    if(!rigStats[o.kru.rigger2]) rigStats[o.kru.rigger2] = {CT:0, BC:0, LB:0};
                    if(o.jenis_unit==='Crane Truck') rigStats[o.kru.rigger2].CT += parseFloat(o.durasi_aktual);
                    else if(o.jenis_unit==='Big Crane') rigStats[o.kru.rigger2].BC += parseFloat(o.durasi_aktual);
                    else rigStats[o.kru.rigger2].LB += parseFloat(o.durasi_aktual);
                }
            });

            if(performaChartInstance) performaChartInstance.destroy();
            const ctxRig = document.getElementById('chartRigger');
            const rigNames = Object.keys(rigStats);
            if(ctxRig && rigNames.length > 0) {
                performaChartInstance = new Chart(ctxRig, {
                    type: 'bar',
                    data: {
                        labels: rigNames,
                        datasets: [
                            { label: 'Crane Truck', data: rigNames.map(n=>rigStats[n].CT), backgroundColor: '#ef4444' },
                            { label: 'Big Crane', data: rigNames.map(n=>rigStats[n].BC), backgroundColor: '#f97316' },
                            { label: 'Lowboy', data: rigNames.map(n=>rigStats[n].LB), backgroundColor: '#92400e' }
                        ]
                    },
                    options: { responsive:true, maintainAspectRatio:false, scales:{ x:{stacked:true}, y:{stacked:true} }, plugins:{ legend:{position:'bottom'} } }
                });
            }

            // Tables
            let perStats = {};
            let totalJam = 0;
            completed.forEach(o => {
                const j = parseFloat(o.durasi_aktual||0);
                totalJam+=j;
                if(!perStats[o.perusahaan]) perStats[o.perusahaan] = {jam:0, job:0};
                perStats[o.perusahaan].jam += j;
                perStats[o.perusahaan].job += 1;
            });
            document.getElementById('tblPerusahaan').innerHTML = Object.keys(perStats).map(k => `
                <tr class="hover:bg-slate-50"><td class="py-2 px-2 font-semibold text-slate-700">${k}</td>
                <td class="py-2 px-2 text-center text-xs bg-slate-100 rounded">${totalJam>0?((perStats[k].jam/totalJam)*100).toFixed(1):0}%</td>
                <td class="py-2 px-2 text-right font-mono text-sm">${perStats[k].jam.toFixed(1)}J | ${perStats[k].job}</td></tr>
            `).join('');
            
            let depStats = {};
            completed.forEach(o => {
                const d = o.departemen || 'N/A';
                if(!depStats[d]) depStats[d] = {jam:0, job:0};
                depStats[d].jam += parseFloat(o.durasi_aktual||0);
                depStats[d].job += 1;
            });
            document.getElementById('tblDept').innerHTML = Object.keys(depStats).map(k => `
                <tr class="hover:bg-slate-50"><td class="py-2 px-2 font-semibold text-slate-700">${k}</td>
                <td class="py-2 px-2 text-right font-mono text-sm">${depStats[k].jam.toFixed(1)}J | ${depStats[k].job}</td></tr>
            `).join('');
        }

        function exportCSV() {
            if(DB.orders.length === 0) return showToast("Tidak ada data untuk diexport", "error");
            let csv = 'NO WO,LIFT,TANGGAL,JAM REQ,SHIFT,USER,PERUSAHAAN,DEPARTEMEN,STATUS,UNIT,GL,OPERATOR,RIGGER1,RIGGER2,JAM MULAI,JAM SELESAI,DURASI(JAM),LOKASI AWAL,LOKASI AKHIR,KENDALA\n';
            
            DB.orders.forEach(o => {
                let r1 = (o.kru&&o.kru.rigger1)?o.kru.rigger1:'';
                let r2 = (o.kru&&o.kru.rigger2)?o.kru.rigger2:'';
                let start = (o.kru&&o.kru.jam_mulai)?o.kru.jam_mulai:'';
                let end = (o.kru&&o.kru.jam_selesai)?o.kru.jam_selesai:'';
                let op = (o.kru&&o.kru.operator)?o.kru.operator:'';
                let gl = (o.kru&&o.kru.gl)?o.kru.gl:'';
                let u = (o.kru&&o.kru.unit)?o.kru.unit:'';
                let w = formatDate(o.created_at).split(' ');
                
                let row = [
                    o.no_wo, o.no_lift, w[0], w[1], o.shift, o.nama_pemohon, o.perusahaan, o.departemen,
                    o.status, u, gl, op, r1, r2, start, end, o.durasi_aktual||'',
                    o.lokasi_awal, o.lokasi_akhir, (o.keterangan_kendala||'').replace(/,/g,';')
                ].map(v => `"${(v||'').toString().replace(/"/g, '""')}"`).join(',');
                csv += row + '\n';
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Export_Order_${new Date().getTime()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function continuePendingJob(id) {
            const old = DB.orders.find(x => x.id === id);
            if(!confirm("Job ini akan dikloning dan dikembalikan ke GL untuk validasi ulang kru. Lanjutkan?")) return;
            
            // Generate -P1, -P2 logic
            let newWo = old.no_wo;
            if(newWo.includes('-P')) {
                let parts = newWo.split('-P');
                let num = parseInt(parts[1]) + 1;
                newWo = `${parts[0]}-P${num}`;
            } else {
                newWo = `${newWo}-P1`;
            }

            const newOrder = {
                ...old,
                id: undefined,
                no_wo: newWo,
                status: 'PENDING',
                kru: {}, // Kosongkan kru agar minta validasi
                keterangan_kendala: old.keterangan_kendala ? old.keterangan_kendala + ' | Dilanjutkan shift berikut' : 'Dilanjutkan shift berikut'
            };

            closeModal('formModal');
            showToast("Memproses duplikasi order...", "info");
            
            // Hapus yang lama, insert yang baru
            const { error: delErr } = await supabase.from('orders').delete().eq('id', id);
            if(!delErr) {
                await supabase.from('orders').insert([newOrder]);
                fetchFromSupabase(true);
            }
        }

        function checkTelat() {
            const wrap = document.getElementById('kendalaFormWrapper');
            const reqStr = wrap.getAttribute('data-req');
            const inMulai = document.getElementById('inpMulai').value;
            if(!inMulai) return;

            let reqDate = new Date(reqStr);
            let actDate = new Date(reqStr); // Same day assumption
            let [h, m] = inMulai.split(':');
            actDate.setHours(h, m, 0, 0);

            // Jika input jam lebih kecil dari req (misal nyebrang hari)
            if(actDate < reqDate && reqDate.getHours() > 12 && parseInt(h) < 12) {
                actDate.setDate(actDate.getDate() + 1);
            }

            let diffMins = Math.floor((actDate - reqDate) / 60000);
            
            if(diffMins > 30) {
                let j = Math.floor(diffMins/60);
                let mm = diffMins%60;
                let txt = j>0 ? `${j} Jam ${mm} Menit` : `${mm} Menit`;
                document.getElementById('telatBox').classList.remove('hidden');
                document.getElementById('telatBox').querySelector('label').innerHTML = `<i class="fas fa-clock"></i> Telat (${txt}). Alasan *`;
            } else {
                document.getElementById('telatBox').classList.add('hidden');
            }
        }

        async function submitCancel(id) {
            const al = document.getElementById('inpAlasan').value.trim();
            if(!al) return alert("Alasan wajib diisi!");
            closeModal('formModal');
            showToast("Menyimpan...", "info");
            await supabase.from('orders').update({ status: 'CANCELED', keterangan_kendala: "CANCEL: "+al }).eq('id', id);
            fetchFromSupabase(true);
        }

        async function submitClosePending(id, type) {
            const o = DB.orders.find(x => x.id === id);
            const m = document.getElementById('inpMulai').value;
            const s = document.getElementById('inpSelesai').value;
            const op = document.getElementById('inpOp').value;
            const r1 = document.getElementById('inpRg1').value;
            const r2 = document.getElementById('inpRg2').value;
            
            if(!m || !s || !op || !r1) return alert("Jam, Operator, dan Rigger 1 wajib diisi!");

            let ket = o.keterangan_kendala || '';
            const telatBox = document.getElementById('telatBox');
            if(!telatBox.classList.contains('hidden')) {
                let alas = document.getElementById('inpAlasanTelat').value.trim();
                if(!alas) return alert("Alasan telat wajib diisi karena melebihi 30 menit!");
                ket = ket ? ket + ' | TELAT: ' + alas : 'TELAT: ' + alas;
            }

            let st = type === 'Pending' ? 'PENDING' : 'COMPLETED';
            if(type === 'Pending') {
                let ap = document.getElementById('inpAlasanPend').value.trim();
                if(!ap) return alert("Alasan pending wajib diisi!");
                ket = ket ? ket + ' | PENDING: ' + ap : 'PENDING: ' + ap;
            }

            // Hitung durasi
            let dm = new Date(`2000-01-01T${m}:00`);
            let ds = new Date(`2000-01-01T${s}:00`);
            if(ds < dm) ds.setDate(ds.getDate() + 1);
            let durasi = ((ds - dm) / 3600000).toFixed(2);

            let newKru = { ...o.kru, jam_mulai: m, jam_selesai: s, operator: op, rigger1: r1, rigger2: r2 };

            closeModal('formModal');
            showToast("Menyimpan...", "info");
            await supabase.from('orders').update({
                status: st,
                kru: newKru,
                durasi_aktual: parseFloat(durasi),
                keterangan_kendala: ket
            }).eq('id', id);
            
            fetchFromSupabase(true);
        }

        function openImgViewer(src) {

        function closeImgViewer() {

            document.getElementById('viewerImage').src = '';
        }

        // Basic Pinch/Drag Zoom functionality
        let scale = 1, panning = false, pointX = 0, pointY = 0, start = { x: 0, y: 0 }, zoomImg = document.getElementById('viewerImage');
        function setTransform() { zoomImg.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`; }
        function resetZoom() { scale = 1; pointX = 0; pointY = 0; setTransform(); }
        
        document.getElementById('imgViewerContainer').onmousedown = function (e) {
            e.preventDefault(); start = { x: e.clientX - pointX, y: e.clientY - pointY }; panning = true;
        }
        document.getElementById('imgViewerContainer').onmouseup = function (e) { panning = false; }
        document.getElementById('imgViewerContainer').onmousemove = function (e) {
            e.preventDefault(); if (!panning) return; pointX = (e.clientX - start.x); pointY = (e.clientY - start.y); setTransform();
        }
        document.getElementById('imgViewerContainer').onwheel = function (e) {
            e.preventDefault(); let xs = (e.clientX - pointX) / scale, ys = (e.clientY - pointY) / scale, delta = (e.wheelDelta ? e.wheelDelta : -e.deltaY);
            (delta > 0) ? (scale *= 1.2) : (scale /= 1.2);
            pointX = e.clientX - xs * scale; pointY = e.clientY - ys * scale; setTransform();
        }

        function renderDataOrderTable() {
            let sd = document.getElementById('doStart').value;

            let sDate = sd ? new Date(sd + 'T00:00:00') : null;
            let eDate = ed ? new Date(ed + 'T23:59:59') : null;

            let filtered = DB.orders.filter(o => {
                let od = new Date(o.created_at);
                let vD = (!sDate || od >= sDate) && (!eDate || od <= eDate);
                let vS = sh === 'ALL' || String(o.shift) === sh;
                let vU = un === 'ALL' || o.jenis_unit === un;

        async function saveAdminEdit(e, id) {
            e.preventDefault();
            const o = DB.orders.find(x => x.id === id);
            
            let st = document.getElementById('ae_status').value;
            let nk = { ...o.kru };
            nk.gl = document.getElementById('ae_gl').value;
            nk.unit = document.getElementById('ae_unit').value;
            nk.operator = document.getElementById('ae_op').value;
            nk.rigger1 = document.getElementById('ae_rg1').value;
            nk.rigger2 = document.getElementById('ae_rg2').value;

            if(st === 'UNSCHEDULED' && nk.unit) st = 'ON PROGRESS';

            closeModal('formModal');
            showToast("Menyimpan perubahan...", "info");
            await supabase.from('orders').update({ status: st, kru: nk }).eq('id', id);
            fetchFromSupabase(true);
        }

                        <label class="border rounded-lg p-3 cursor-pointer hover:bg-slate-50 transition has-[:checked]:bg-teal-50 has-[:checked]:border-teal-500 has-[:checked]:text-teal-700">
                            <input type="radio" name="boArmada" value="Big Crane" class="hidden"> Big Crane
                        </label>
                        <label class="border rounded-lg p-3 cursor-pointer hover:bg-slate-50 transition has-[:checked]:bg-teal-50 has-[:checked]:border-teal-500 has-[:checked]:text-teal-700">
                            <input type="radio" name="boArmada" value="Lowboy" class="hidden"> Lowboy
                        </label>
                    </div></div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label class="block text-sm font-bold text-slate-700 mb-1">Lokasi Standby / Awal *</label>
                        <input type="text" id="boAwal" class="w-full border border-slate-300 p-2.5 rounded-lg uppercase" placeholder="Cth: PIT TTM" required></div>
                        <div><label class="block text-sm font-bold text-slate-700 mb-1">Lokasi Tujuan (Opsional)</label>
                        <input type="text" id="boAkhir" class="w-full border border-slate-300 p-2.5 rounded-lg uppercase" placeholder="Kosongkan jika di tempat"></div>
                    </div>

                    <div><label class="block text-sm font-bold text-slate-700 mb-1">Deskripsi Pekerjaan *</label>
                    <textarea id="boDesc" class="w-full border border-slate-300 p-2.5 rounded-lg" rows="3" placeholder="Jelaskan barang yang diangkat atau rincian tugas..." required></textarea></div>

                    <div><label class="block text-sm font-bold text-slate-700 mb-1">Foto Kondisi / Barang (Opsional)</label>
                    <input type="file" id="boFoto" accept="image/*" class="w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200">
                    <p class="text-[10px] text-slate-400 mt-1">Maks. 2MB</p></div>

                    <button type="submit" id="btnSubmitOrder" class="w-full bg-teal-600 text-white font-bold py-3.5 rounded-lg shadow-lg hover:bg-teal-700 transition transform active:scale-[0.98] mt-6">
                        <i class="fas fa-paper-plane mr-2"></i> KIRIM PERMINTAAN ORDER
                    </button>
                </form>
            </div>`;
        }

        async function submitOrder(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitOrder');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> MENGIRIM...';
            btn.disabled = true;

            try {
                let foto_url = '';
                const file = document.getElementById('boFoto').files[0];
                if (file) {
                    if (file.size > 2000000) throw new Error("Ukuran foto maksimal 2MB");
                    const path = `orders/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g,'')}`;
                    const { data, error: uploadErr } = await supabase.storage.from('images').upload(path, file);
                    if (uploadErr) throw new Error("Gagal upload foto");
                    foto_url = supabase.storage.from('images').getPublicUrl(path).data.publicUrl;
                }

                const prefix = document.querySelector('input[name="boArmada"]:checked').value.split(' ').map(w=>w[0]).join('');
                const dateCode = document.getElementById('boTgl').value.replace(/-/g, '');
                
                const { data: countData } = await supabase.from('orders').select('id').like('no_lift', `${prefix}-${dateCode}-%`);
                const urut = (countData?.length || 0) + 1;
                const noLift = `${prefix}-${dateCode}-${urut}`;
                const noWo = `${prefix}-${dateCode}-${urut}`; // Default WO sama dengan LIFT

                const newOrder = {
                    no_wo: noWo, no_lift: noLift,
                    pemohon_id: currentUser.id, nama_pemohon: currentUser.nama_lengkap, no_wa: currentUser.no_wa, perusahaan: currentUser.perusahaan, departemen: currentUser.departemen, section: currentUser.section,
                    tanggal_pakai: document.getElementById('boTgl').value,
                    jam_pakai: document.getElementById('boJam').value,
                    shift: parseInt(document.getElementById('boShift').value),
                    estimasi_jam: parseFloat(document.getElementById('boEstimasi').value),
                    jenis_unit: document.querySelector('input[name="boArmada"]:checked').value,
                    lokasi_awal: document.getElementById('boAwal').value.toUpperCase(),
                    lokasi_akhir: document.getElementById('boAkhir').value.toUpperCase() || document.getElementById('boAwal').value.toUpperCase(),
                    deskripsi: document.getElementById('boDesc').value,
                    foto_url: foto_url,
                    status: 'UNSCHEDULED',
                    kru: {}
                };

                const { error } = await supabase.from('orders').insert([newOrder]);
                if (error) throw error;

                showToast("Order Berhasil Dibuat!", "success");
                await fetchFromSupabase(false);
                loadPage(currentUser.role === 'USER' ? 'riwayat_user' : 'data_order');

            } catch (error) {
                alert("Gagal: " + error.message);
                btn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i> KIRIM PERMINTAAN ORDER';
                btn.disabled = false;
            }
        }

        // --- RIWAYAT USER ---
        function getRiwayatUserView() {
            let userOrders = DB.orders.filter(o => o.pemohon_id === currentUser.id);
            if(userOrders.length === 0) return `<div class="text-center p-10 text-slate-400"><i class="fas fa-box-open text-5xl mb-3"></i><p>Belum ada riwayat pesanan.</p></div>`;

            let html = '<div class="space-y-4">';
            userOrders.forEach(o => {
                let bCls = o.status==='ON PROGRESS'?'bg-blue-100 text-blue-700':o.status==='COMPLETED'?'bg-emerald-100 text-emerald-700':o.status==='CANCELED'?'bg-red-100 text-red-700':o.status==='PENDING'?'bg-orange-100 text-orange-700':'bg-slate-100 text-slate-700';
                html += `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md cursor-pointer transition" onclick="viewJobDetail('${o.no_wo}')">
                    <div class="p-3 border-b border-slate-50 flex justify-between items-center bg-slate-50">
                        <span class="font-bold text-teal-700 text-sm">${o.no_lift}</span>
                        <span class="px-2 py-1 rounded text-[10px] font-bold ${bCls}">${o.status}</span>
                    </div>
                    <div class="p-3 text-sm grid grid-cols-2 gap-2">
                        <div class="col-span-2 text-slate-700 font-medium truncate"><i class="fas fa-map-marker-alt text-red-500 w-4"></i> ${o.lokasi_awal} &rarr; ${o.lokasi_akhir}</div>
                        <div class="text-slate-500 text-xs"><i class="fas fa-calendar-alt w-4"></i> ${o.tanggal_pakai}</div>
                        <div class="text-slate-500 text-xs"><i class="fas fa-truck w-4"></i> ${o.jenis_unit}</div>
                    </div>
                </div>`;
            });
            return html + '</div>';
        }

        // --- MASTER DATA (Fix Nulls & Search Fallback) ---
        function getMasterView() {
            return `
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 min-h-[80vh] flex flex-col">
                <div class="flex overflow-x-auto border-b border-slate-100 p-2 gap-2 shrink-0 hide-scroll">
                    <button class="px-4 py-2 rounded font-bold text-sm bg-teal-600 text-white" id="tab-users">Pengguna</button>
                    <!-- Tambah tab master lain jika perlu, untuk sekarang difokuskan ke Pengguna -->
                </div>
                <div class="p-4 bg-slate-50 shrink-0 border-b">
                    <div class="flex gap-2 mb-4">
                        <input type="text" id="msNrp" placeholder="NRP..." class="border p-2 rounded text-sm w-1/4">
                        <input type="text" id="msNama" placeholder="Nama Lengkap..." class="border p-2 rounded text-sm flex-1">
                        <select id="msRole" class="border p-2 rounded text-sm"><option value="">-- Role --</option><option>ADMIN</option><option>GL</option><option>MANPOWER</option><option>USER</option></select>
                        <input type="text" id="msPass" placeholder="Password..." class="border p-2 rounded text-sm w-1/4">
                        <button onclick="saveUserMaster()" class="bg-teal-600 text-white px-4 py-2 rounded text-sm font-bold hover:bg-teal-700 whitespace-nowrap"><i class="fas fa-plus"></i> Tambah</button>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="searchUser" placeholder="Cari NRP / Nama..." class="border p-2 rounded text-sm flex-1" onkeyup="renderUsersMaster()">
                        <select id="filterRole" class="border p-2 rounded text-sm" onchange="renderUsersMaster()"><option value="ALL">Semua Role</option><option>ADMIN</option><option>GL</option><option>MANPOWER</option><option>USER</option></select>
                    </div>
                </div>
                <div class="flex-1 table-container p-0">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-slate-500 bg-white uppercase sticky top-0 border-b">
                            <tr><th class="py-3 px-4">NRP</th><th class="py-3 px-4">NAMA LENGKAP</th><th class="py-3 px-4">ROLE</th><th class="py-3 px-4 text-center">AKSI</th></tr>
                        </thead>
                        <tbody id="tblUsersMaster" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>`;
        }

        async function renderUsersMaster() {
            const tbody = document.getElementById('tblUsersMaster');
            let q = document.getElementById('searchUser') ? document.getElementById('searchUser').value.toLowerCase() : '';
            let r = document.getElementById('filterRole') ? document.getElementById('filterRole').value : 'ALL';
            
            // Benteng pelindung: Pastikan DB.users terisi, minimal array kosong
            let userList = DB.users || [];
            
            let filtered = userList.filter(u => {
                // Benteng pelindung: Skip jika u null atau nama/nrp undefined
                if (!u || !u.nama_lengkap || !u.nrp) return false;
                
                let matchQ = u.nama_lengkap.toLowerCase().includes(q) || u.nrp.toLowerCase().includes(q);
                let matchR = (r === 'ALL') || (u.role === r);
                return matchQ && matchR;
            });
            
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-slate-400 italic">Tidak ada data pengguna ditemukan. Pastikan data di Supabase tidak kosong.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(u => `
            <tr class="hover:bg-slate-50 transition">
                <td class="py-2 px-4 font-bold text-slate-700">${u.nrp}</td>
                <td class="py-2 px-4">${u.nama_lengkap} <br><span class="text-[10px] text-slate-400">${u.perusahaan||'-'} | ${u.departemen||'-'}</span></td>
                <td class="py-2 px-4"><span class="px-2 py-1 bg-slate-100 rounded text-xs font-bold text-slate-600">${u.role}</span></td>
                <td class="py-2 px-4 text-center">
                    <button onclick="deleteUserMaster('${u.id}')" class="text-red-500 hover:bg-red-50 px-2 py-1 rounded"><i class="fas fa-trash"></i></button>
                </td>
            </tr>`).join('');
        }

        async function saveUserMaster() {
            const nrp = document.getElementById('msNrp').value.trim();
            const nama = document.getElementById('msNama').value.trim().toUpperCase();
            const role = document.getElementById('msRole').value;
            const pass = document.getElementById('msPass').value.trim();
            if(!nrp || !nama || !role || !pass) return alert("Semua field wajib diisi!");
            
            showToast("Menyimpan user...", "info");
            const { error } = await supabase.from('users').insert([{
                nrp, nama_lengkap: nama, role, password_hash: pass,
                perusahaan: 'PPA', status_akun: 'ACTIVE'
            }]);
            if(error) alert(error.message);
            else {
                document.getElementById('msNrp').value = ''; document.getElementById('msNama').value = ''; document.getElementById('msPass').value = '';
                await fetchFromSupabase(true);
            }
        }

        async function deleteUserMaster(id) {
            if(!confirm("Hapus pengguna ini?")) return;
            showToast("Menghapus user...", "info");
            await supabase.from('users').delete().eq('id', id);
            await fetchFromSupabase(true);
        }
    </script>
</body>
</html>
